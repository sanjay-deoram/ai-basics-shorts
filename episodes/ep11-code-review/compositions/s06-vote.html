<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <!-- Sound cues (seconds from scene start). Run node tools/build-sfx.mjs after editing. -->
    <script type="application/json" class="sfx-cues">[
      {"t":0.1,"sfx":"whoosh-short","vol":0.14},
      {"t":0.55,"sfx":"click","vol":0.16},
      {"t":0.85,"sfx":"click","vol":0.16},
      {"t":1.15,"sfx":"click","vol":0.16},
      {"t":1.7,"sfx":"click-soft","vol":0.2},
      {"t":2.2,"sfx":"whoosh-short","vol":0.12},
      {"t":3.1,"sfx":"click-soft","vol":0.2},
      {"t":3.5,"sfx":"whoosh-short","vol":0.12},
      {"t":4.25,"sfx":"chime","vol":0.14,"dur":0.6}
    ]</script>
  </head>
  <body>
    <template>
      <!-- s06 · 2 · The vote. Opens on s05's last frame (PR header, diff, four flags). Each flag lifts out into a candidate
           card; a row of three verifier logos votes on each (✓ / ✕ land in turn) and a tally shows how many agree:
           "Off by one: items[n] is undefined" 3/3 · "getItems() errors aren't caught" 3/3 · "items might be null" 1/3,
           not enough agree, falls away · "Style: use for…of" is dropped as style only. On "it's real" the camera pulls
           back and the two survivors are stamped POSTED. Avatar: out. Voice: "Other agents vote, and a finding only gets
           posted if enough of them agree it's real." (Example findings.) -->
      <style>
        #root { position: absolute; inset: 0; }
        .s06 .cam { position: absolute; inset: 0; }
        .s06 .head { position: absolute; left: 90px; top: 344px; display: flex; align-items: center; gap: 18px; padding: 18px 30px; border: 2px solid var(--stone); border-radius: 9999px; background: var(--eggshell); font: 400 30px/1.2 var(--f-mono); color: var(--ink); white-space: nowrap; }
        .s06 .diff { position: absolute; left: 90px; top: 450px; width: 860px; }
        .s06 .diff .hl-code { border-radius: 6px; }
        .s06 .flag { position: absolute; width: 34px; height: 40px; fill: none; stroke: #fdfcfc; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
        .s06 .flag .fl { fill: #fdfcfc; }
        .s06 .fly { position: absolute; left: 0; top: 0; width: 34px; height: 40px; fill: none; stroke: var(--ink); stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
        .s06 .fly .fl { fill: var(--eggshell); }
        .s06 .cand { position: absolute; left: 90px; width: 860px; height: 150px; padding: 0 30px; flex-direction: row; align-items: center; gap: 22px; border-radius: 34px; }
        .s06 .cand .ic { flex: none; width: 34px; height: 40px; fill: none; stroke: var(--ink); stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
        .s06 .cand .ic .fl { fill: var(--eggshell); }
        .s06 .cand .t { position: relative; flex: 1; font: 400 34px/1.3 var(--f-body); color: var(--ink); }
        .s06 .cand .t .k { display: block; margin-top: 8px; opacity: 0; }
        .s06 .cand .t s { text-decoration: none; position: relative; }
        .s06 .cand .t .strike { position: absolute; left: -4px; right: -4px; top: 21px; height: 4px; border-radius: 2px; background: var(--ink); transform-origin: 0 50%; }
        .s06 .votes { flex: none; display: flex; gap: 12px; align-items: center; }
        .s06 .vt { position: relative; width: 46px; height: 46px; }
        .s06 .vt img { width: 46px; height: 46px; }
        .s06 .vt b { position: absolute; right: -8px; bottom: -8px; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; opacity: 0; }
        .s06 .vt b.y { background: var(--ink); }
        .s06 .vt b.n { background: var(--eggshell); border: 2.5px solid var(--ink); }
        .s06 .vt b svg { width: 16px; height: 16px; fill: none; stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; }
        .s06 .vt b.y svg { stroke: var(--eggshell); }
        .s06 .vt b.n svg { stroke: var(--ink); width: 12px; height: 12px; }
        .s06 .posted { position: absolute; right: 30px; top: 46px; color: var(--ink); background: var(--eggshell); border-color: var(--ink); font-size: 24px; padding: 12px 20px; opacity: 0; }
        .s06 .tally { flex: none; width: 70px; text-align: right; font: 400 28px/1 var(--f-mono); color: var(--ink); opacity: 0; }
        .s06 .ctag { display: inline-flex; align-items: center; height: 52px; padding: 0 22px; border: 2px solid var(--ink); border-radius: 9999px; font: 400 26px/1 var(--f-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink); background: var(--eggshell); }
      </style>
      <div id="root" data-composition-id="s06-vote" data-width="1080" data-height="1920">
        <div class="egg-scene s06">
          <div class="cam">
            <div class="head">#4187 · Send every item in the list</div>
            <div class="egg-code diff"></div>
            <svg class="flag f0" viewBox="0 0 34 40" style="left:893px;top:519px" aria-hidden="true"><path d="M7 37 V4" /><path class="fl" d="M7 5 H28 L23 12.5 L28 20 H7 Z" /></svg>
            <svg class="flag f1" viewBox="0 0 34 40" style="left:893px;top:569px" aria-hidden="true"><path d="M7 37 V4" /><path class="fl" d="M7 5 H28 L23 12.5 L28 20 H7 Z" /></svg>
            <svg class="flag f2" viewBox="0 0 34 40" style="left:845px;top:619px" aria-hidden="true"><path d="M7 37 V4" /><path class="fl" d="M7 5 H28 L23 12.5 L28 20 H7 Z" /></svg>
            <svg class="flag f3" viewBox="0 0 34 40" style="left:893px;top:619px" aria-hidden="true"><path d="M7 37 V4" /><path class="fl" d="M7 5 H28 L23 12.5 L28 20 H7 Z" /></svg>
            <div class="cands"></div>
            <svg class="fly y0" viewBox="0 0 34 40" aria-hidden="true"><path d="M7 37 V4" /><path class="fl" d="M7 5 H28 L23 12.5 L28 20 H7 Z" /></svg>
            <svg class="fly y1" viewBox="0 0 34 40" aria-hidden="true"><path d="M7 37 V4" /><path class="fl" d="M7 5 H28 L23 12.5 L28 20 H7 Z" /></svg>
            <svg class="fly y2" viewBox="0 0 34 40" aria-hidden="true"><path d="M7 37 V4" /><path class="fl" d="M7 5 H28 L23 12.5 L28 20 H7 Z" /></svg>
            <svg class="fly y3" viewBox="0 0 34 40" aria-hidden="true"><path d="M7 37 V4" /><path class="fl" d="M7 5 H28 L23 12.5 L28 20 H7 Z" /></svg>
          </div>
        </div>
      </div>
      <script>
        (() => {
          const DUR = 5.1;
          const root = document.querySelector('[data-composition-id="s06-vote"] .s06');
          const q = (s) => root.querySelector(s);
          const all = (s) => [...root.querySelectorAll(s)];
          const card = q(".diff");
          Egg.codeCard(card, `
 const items = await getItems(url);
+const n = items.length;
+for (let i = 0; i <= n; i++) {
+  send(items[i]);
+}`, { lang: "js", diff: true, file: "sync.js", tag: "+4 −0" });
          const le = [...card.querySelectorAll(".ln")[2].querySelectorAll(".t-p")].find((s) => s.textContent === "<=");
          le.classList.add("hl-code");

          // candidate findings: text, the diff flag it came from (x, y), votes, tally
          const FLAG = '<path d="M7 37 V4" /><path class="fl" d="M7 5 H28 L23 12.5 L28 20 H7 Z" />';
          const TICK = '<svg viewBox="0 0 24 24"><path d="M5 12.5 L10 17.5 L19 7" /></svg>';
          const CROSS = '<svg viewBox="0 0 24 24"><path d="M5 5 L19 19 M19 5 L5 19" /></svg>';
          const C = [
            { t: "Off by one: items[n] is undefined", from: [845, 619], v: "yyy", tally: "3/3" },
            { t: "getItems() errors aren't caught", from: [893, 519], v: "yyy", tally: "3/3" },
            { t: "items might be null", from: [893, 569], v: "ynn", tally: "1/3", k: "Not enough agree" },
            { t: "Style: use for…of", from: [893, 619], v: "", k: "Style only · dropped" },
          ];
          const Y0 = 820, H = 150, GAP = 20;
          q(".cands").innerHTML = C.map((c, i) => `<div class="egg-card cand c${i}" style="top:${Y0 + i * (H + GAP)}px">` +
            `<svg class="ic" viewBox="0 0 34 40" aria-hidden="true">${FLAG}</svg>` +
            (c.v === "yyy" ? `<span class="egg-stamp posted">Posted</span>` : "") +
            `<span class="t"><s>${c.t}${c.v ? "" : '<i class="strike"></i>'}</s>${c.k ? `<span class="egg-card-kicker k">${c.k}</span>` : ""}</span>` +
            (c.v ? `<span class="tally">${c.tally}</span><span class="votes">${[...c.v].map((x) => `<span class="vt"><img src="assets/claude-logo.svg" alt=""><b class="${x}">${x === "y" ? TICK : CROSS}</b></span>`).join("")}</span>` : "") +
            `</div>`).join("");
          const cands = all(".cand");
          const tl = gsap.timeline({ paused: true });
          const cam = q(".cam");

          // the four flags lift out of the diff into candidate cards
          C.forEach((c, i) => {
            const fly = q(".y" + i), t = 0.08 + i * 0.1;
            Egg.fadeUp(tl, cands[i], t, { y: 30, dur: 0.45 });
            tl.fromTo(fly, { x: c.from[0], y: c.from[1], opacity: 1 }, { x: 120, y: Y0 + i * (H + GAP) + 55, duration: 0.42, ease: Egg.EASE.move, immediateRender: false }, t);
            tl.set(fly, { opacity: 0 }, t + 0.42);
            gsap.set(cands[i].querySelector(".ic"), { opacity: 0 });
            tl.set(cands[i].querySelector(".ic"), { opacity: 1 }, t + 0.41);
          });
          // "Other agents vote,": the camera leans in on the votes
          tl.to(cam, { scale: 1.04, transformOrigin: "520px 800px", duration: 0.7, ease: Egg.EASE.move }, 0.5);
          [0.55, 0.85, 1.15].forEach((t, i) => {
            const marks = [...cands[i].querySelectorAll(".vt b")];
            tl.fromTo(marks, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: Egg.EASE.pop, stagger: 0.08 }, t);
          });
          tl.fromTo(all(".tally"), { opacity: 0, x: 12 }, { opacity: 1, x: 0, duration: 0.3, ease: Egg.EASE.enter, stagger: 0.12 }, 1.45);
          // the style-only finding is filtered out
          tl.fromTo(cands[3].querySelector(".strike"), { scaleX: 0 }, { scaleX: 1, duration: 0.32, ease: Egg.EASE.draw }, 1.7);
          Egg.fadeUp(tl, cands[3].querySelector(".k"), 1.75, { y: 8 });
          tl.to(cands[3], { y: 70, rotation: 3, opacity: 0, duration: 0.42, ease: Egg.EASE.exit }, 2.2);
          tl.to(q(".f3"), { opacity: 0, scale: 0.5, duration: 0.3, ease: Egg.EASE.exit }, 2.2);
          // "…only gets posted if enough of them agree": 1 of 3 isn't enough
          Egg.fadeUp(tl, cands[2].querySelector(".k"), 3.1, { y: 8 });
          tl.to(cands[2], { y: 70, rotation: -3, opacity: 0, duration: 0.42, ease: Egg.EASE.exit }, 3.5);
          tl.to(q(".f1"), { opacity: 0, scale: 0.5, duration: 0.3, ease: Egg.EASE.exit }, 3.5);
          // "…it's real.": pull back; the two survivors are posted
          tl.to(cam, { scale: 1, duration: 0.55, ease: Egg.EASE.move }, 3.6);
          tl.to(cands.slice(0, 2).flatMap((c) => [c.querySelector(".tally"), c.querySelector(".votes")]), { opacity: 0, duration: 0.2, ease: "none" }, 4.05);
          Egg.stamp(tl, cands[0].querySelector(".posted"), 4.25, cands[0]);
          Egg.stamp(tl, cands[1].querySelector(".posted"), 4.4, cands[1]);
          Egg.fadeOut(tl, cam, DUR - 0.25, { dur: 0.23 });
          window.__timelines["s06-vote"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
