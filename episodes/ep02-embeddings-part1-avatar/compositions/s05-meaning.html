<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <!-- Sound cues (seconds from scene start). Run node tools/build-sfx.mjs after editing. -->
    <script type="application/json" class="sfx-cues">[
      {"t":0.3,"sfx":"pop","vol":0.18},
      {"t":0.6,"sfx":"typing","vol":0.18,"dur":0.5},
      {"t":2.4,"sfx":"pop","vol":0.22},
      {"t":4.5,"sfx":"pop","vol":0.24},
      {"t":6.4,"sfx":"pop","vol":0.24},
      {"t":8.15,"sfx":"key-press","vol":0.22},
      {"t":8.3,"sfx":"pop","vol":0.2},
      {"t":8.35,"sfx":"key-press","vol":0.22},
      {"t":9.4,"sfx":"whoosh-short","vol":0.14},
      {"t":13.4,"sfx":"whoosh","vol":0.22},
      {"t":13.5,"sfx":"typing","vol":0.2,"dur":1.1},
      {"t":14.6,"sfx":"sparkle","vol":0.2,"dur":1.2}
    ]</script>
  </head>
  <body>
    <template>
      <!-- s05 · What the numbers mean. Opens on puppy's real numbers (as printed in s04). The narrator avatar (top
           right) points: each number is a score. Then we imagine names for the first two (Is it an animal? 0.9, Is it food? 0.1, chip IMAGINE);
           then the names become ??? and the real numbers return: nobody picked the qualities, the model learned
           them. Last, all 384 real numbers are drawn as one strip, a fingerprint for meaning (bar height = value).
           Voiceover: 0.3 "So what do the numbers mean?" 2.1 "Each one is a score for some quality. Like: is
           it an animal? Is it food?" 8.1 "But nobody picked these. The model learned them, so we can't read
           them one by one." 13.4 "Together, they're a fingerprint for meaning." Rows: 616 + 64·i. -->
      <style>
        #root { position: absolute; inset: 0; }
        .s05 .egg-safe { justify-content: space-between; }
        .s05 .card { position: absolute; left: 90px; right: 130px; top: 520px; height: 556px; padding: 30px 44px; }
        .s05 .card .word { font: 400 34px/1 var(--f-mono); color: var(--ink); }
        .s05 .tag { position: absolute; left: 134px; top: 1012px; padding: 10px 18px; font-size: 24px; white-space: nowrap; }
        .s05 .ix, .s05 .qm, .s05 .val { position: absolute; font: 400 36px/64px var(--f-mono); color: var(--ink); white-space: pre; }
        .s05 .ix { left: 134px; color: var(--graphite); }
        .s05 .qm { left: 250px; color: var(--graphite); }
        .s05 .val { right: 174px; text-align: right; }
        .s05 .ask { position: absolute; left: 250px; font: 400 38px/64px var(--f-body); color: var(--ink); white-space: nowrap; }
        .s05 .more { color: var(--smoke); }
        .s05 .fpk { position: absolute; left: 90px; top: 1110px; }
        .s05 .ptr { position: absolute; inset: 0; }
      </style>
      <div id="root" data-composition-id="s05-meaning" data-width="1080" data-height="1920">
        <div class="egg-scene s05">
          <div class="egg-card card"><span class="word">puppy</span></div>
          <div class="rows" data-layout-allow-overlap="">
            <span class="ix" style="top:616px">#1</span><span class="qm" style="top:616px">???</span><span class="val rv" style="top:616px">-0.080</span>
            <span class="ix" style="top:680px">#2</span><span class="qm" style="top:680px">???</span><span class="val rv" style="top:680px"> 0.035</span>
            <span class="ix" style="top:744px">#3</span><span class="qm" style="top:744px">???</span><span class="val rv" style="top:744px"> 0.000</span>
            <span class="ix" style="top:808px">#4</span><span class="qm" style="top:808px">???</span><span class="val rv" style="top:808px"> 0.031</span>
            <span class="ix more" style="top:872px">⋮</span><span class="val rv more" style="top:872px">⋮</span>
            <span class="ix" style="top:936px">#384</span><span class="qm" style="top:936px">???</span><span class="val rv" style="top:936px"> 0.098</span>
            <span class="ask a1" style="top:616px">Is it an animal?</span><span class="val iv a1" style="top:616px">0.9</span>
            <span class="ask a2" style="top:680px">Is it food?</span><span class="val iv a2" style="top:680px">0.1</span>
          </div>
          <span class="egg-chip tag t1">Imagine</span>
          <span class="egg-chip tag t2">Real numbers</span>
          <span class="fpk egg-card-kicker">puppy · all 384 numbers</span>
          <svg class="egg-svg fp" viewBox="0 0 1080 1920" aria-hidden="true">
            <defs><clipPath id="s05-fp-clip"><rect class="fp-win" x="156" y="1130" width="0" height="200" /></clipPath></defs>
            <path class="fp-base" d="M156 1230 L924 1230" />
            <path class="fp-bars" clip-path="url(#s05-fp-clip)" d="" />
          </svg>
          <div class="ptr"></div>
          <div class="egg-safe">
            <span class="egg-eyebrow">What the numbers mean</span>
            <p class="egg-label">Together: a fingerprint for meaning.</p>
          </div>
        </div>
      </div>
      <script>
        (() => {
          const X0 = 156, STEP = 2, CY = 1230, K = 440; // strip: 384 bars, 2 px apart, height = value × 440
          const root = document.querySelector('[data-composition-id="s05-meaning"] .s05');
          const q = (s) => root.querySelector(s);
          const all = (s) => [...root.querySelectorAll(s)];
          q(".fp-bars").setAttribute("d", Fingerprints.puppy.map((v, i) => `M${X0 + i * STEP} ${CY} L${X0 + i * STEP} ${(CY - v * K).toFixed(1)}`).join(""));
          q(".fp-bars").style.cssText = "fill:none;stroke:#000;stroke-width:1.6";
          q(".fp-base").style.cssText = "fill:none;stroke:#ebe8e4;stroke-width:2";
          // leader starts beside the narrator avatar's chin (corner place in narrator.html)
          const P = Egg.pointer(q(".ptr"), ["1 number = 1 score", "imagine: very animal-like", "learned, not labelled"], { origin: { x: 912, y: 352 } });
          const rv = all(".rv"), ix = all(".ix"), qm = all(".qm");
          gsap.set([...rv, ...ix, ...qm, ...all(".a1, .a2"), q(".t1"), q(".t2"), q(".fpk"), q(".fp-base")], { opacity: 0 });

          const tl = gsap.timeline({ paused: true });
          Egg.fadeUp(tl, q(".egg-eyebrow"), 0.05);
          Egg.fadeUp(tl, q(".card"), 0.3);
          Egg.fadeUp(tl, ix.map((el, i) => [el, rv[i]]).flat(), 0.6, { y: 14, stagger: 0.04, dur: 0.45 });

          // each number is a score for some quality…
          Egg.pointTo(tl, P, { x: 870, y: 624 }, 0, 2.4, { label: { x: 872, y: 400, side: "left" } });
          // …imagine they had names
          Egg.pop(tl, q(".t1"), 4.5);
          tl.to(rv[0], { opacity: 0, duration: 0.2, ease: "none" }, 4.5);
          Egg.fadeUp(tl, all(".a1"), 4.55, { y: 16 });
          Egg.count(tl, q(".iv.a1"), 0, 0.9, 4.6, { dur: 0.6, fmt: (v) => v.toFixed(1) });
          Egg.pointTo(tl, P, { x: 870, y: 624 }, 1, 4.6, { label: { x: 872, y: 400, side: "left" } });
          tl.to(rv[1], { opacity: 0, duration: 0.2, ease: "none" }, 6.4);
          Egg.fadeUp(tl, all(".a2"), 6.45, { y: 16 });
          Egg.count(tl, q(".iv.a2"), 0, 0.1, 6.5, { dur: 0.5, fmt: (v) => v.toFixed(1) });

          // …but nobody named them: the real numbers have no labels
          tl.to([...all(".a1, .a2"), q(".t1")], { opacity: 0, duration: 0.2, ease: "none" }, 8.15);
          tl.to([rv[0], rv[1]], { opacity: 1, duration: 0.3, ease: "none" }, 8.25);
          Egg.pop(tl, q(".t2"), 8.3);
          Egg.fadeUp(tl, qm, 8.35, { y: 12, stagger: 0.06, dur: 0.4 });
          Egg.pointTo(tl, P, { x: 300, y: 624 }, 2, 9.4, { label: { x: 240, y: 404 } });
          Egg.pointerHide(tl, P, 13.0);

          // together: a fingerprint
          Egg.fadeUp(tl, q(".fpk"), 13.3, { y: 12 });
          tl.to(q(".fp-base"), { opacity: 1, duration: 0.3, ease: "none" }, 13.35);
          tl.fromTo(q(".fp-win"), { attr: { width: 0 } }, { attr: { width: 384 * STEP + 4 }, duration: 1.2, ease: "power1.inOut" }, 13.4);
          Egg.fadeUp(tl, q(".egg-label"), 14.3);

          Egg.fadeOut(tl, [q(".card"), q(".rows"), q(".t2"), q(".fpk"), q(".fp"), q(".egg-safe")], 16.15);
          window.__timelines["s05-meaning"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
