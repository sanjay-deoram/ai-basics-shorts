<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <!-- Sound cues (seconds from this overlay's start = s04's start). Run node tools/build-sfx.mjs after editing. -->
    <script type="application/json" class="sfx-cues">[
      {"t":1.0,"sfx":"pop","vol":0.2},
      {"t":2.25,"sfx":"pop","vol":0.2},
      {"t":17.05,"sfx":"pop","vol":0.2},
      {"t":17.25,"sfx":"pop","vol":0.2},
      {"t":18.05,"sfx":"click-soft","vol":0.16},
      {"t":18.2,"sfx":"click-soft","vol":0.16},
      {"t":18.35,"sfx":"click-soft","vol":0.16},
      {"t":18.5,"sfx":"click-soft","vol":0.16},
      {"t":20.45,"sfx":"whoosh-short","vol":0.16}
    ]</script>
  </head>
  <body>
    <template>
      <!-- Prompt panel overlay, s04 → s08: what Claude reads, growing in the lower half while each scene shows the Python
           that puts it there. s04 (the request): 1 System · tool list (on tools=[tool]) and 2 User (on messages=…), then
           both light ("Claude sees both"). s07 (add the result): 3 Assistant · tool_use and 4 User · tool_result land as
           the run bar hits them; on "sends everything back" every block lights in turn and stays lit until s08, where a
           living dot carries it up to the answer. Times are scene-local (T(scene, t)), so retiming index.html keeps
           them in sync. -->
      <style>
        #root { position: absolute; inset: 0; pointer-events: none; }
        .pp .head { position: absolute; left: 90px; top: 912px; width: 860px; height: 56px; display: flex; align-items: center; justify-content: space-between; }
        .pp .head .egg-card-kicker { font-size: 26px; color: var(--graphite); }
        .pp .head img { width: 56px; height: 56px; }
        .pp .rule { position: absolute; left: 90px; top: 966px; width: 860px; height: 2px; background: var(--stone); transform-origin: 0 50%; }
        .pp .blk { position: absolute; left: 90px; width: 860px; height: 108px; padding: 14px 26px; border: 2px solid var(--stone); border-radius: 24px; background: var(--eggshell); display: flex; flex-direction: column; gap: 6px; }
        .pp .blk .egg-card-kicker { color: var(--graphite); }
        .pp .blk .egg-mono { margin: 0; font-size: 34px; line-height: 1.3; white-space: nowrap; }
        .pp .blk .q { color: var(--graphite); }
        .pp .dot { position: absolute; left: 0; top: 0; width: 30px; height: 30px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ffffff 0, #f1e8ff 18%, #9d86ff 55%, #ff7ac0 82%, #ff4704 100%); }
      </style>
      <div data-hf-id="hf-r2p1" id="root" data-composition-id="prompt" data-width="1080" data-height="1920">
        <div data-hf-id="hf-v75s" class="egg-layer pp" data-layout-allow-overflow="">
          <div data-hf-id="hf-z992" class="head">
            <span data-hf-id="hf-0x1c" class="egg-card-kicker">The prompt · what Claude reads</span>
            <img data-hf-id="hf-op34" src="assets/claude-logo.svg" alt="Claude">
          </div>
          <div data-hf-id="hf-a46i" class="rule"></div>
          <div data-hf-id="hf-hw14" class="blk b1" style="top:982px"><span data-hf-id="hf-873x" class="egg-card-kicker">System · tool list</span><p data-hf-id="hf-n41w" class="egg-mono">tools: get_weather(location)</p></div>
          <div data-hf-id="hf-lexk" class="blk b2" style="top:1102px"><span data-hf-id="hf-ui60" class="egg-card-kicker">User</span><p data-hf-id="hf-tfeb" class="egg-mono">"What's the weather in Tokyo?"</p></div>
          <div data-hf-id="hf-zxxa" class="blk b3" style="top:1222px"><span data-hf-id="hf-jdo6" class="egg-card-kicker">Assistant · Claude's tool_use</span><p data-hf-id="hf-rsbu" class="egg-mono">get_weather(<span data-hf-id="hf-l540" class="q">{"location": "Tokyo"}</span>)</p></div>
          <div data-hf-id="hf-ef0w" class="blk b4" style="top:1342px"><span data-hf-id="hf-dkjv" class="egg-card-kicker">User · tool_result from your app</span><p data-hf-id="hf-917e" class="egg-mono">"<span data-hf-id="hf-3f8v" class="egg-hl h1">22°C</span>, <span data-hf-id="hf-fv9f" class="egg-hl h2">light rain</span>"</p></div>
          <div data-hf-id="hf-wb8g" class="dot" data-layout-allow-overflow=""></div>
        </div>
      </div>
      <script>
        (() => {
          const root = document.querySelector('[data-composition-id="prompt"] .pp');
          const q = (s) => root.querySelector(s);
          const T0 = Egg.sceneStart("prompt");
          // a scene-local time → this overlay's time (falls back to the episode's slots when previewed alone)
          const FALLBACK = { "s04-request": 16.0, "s07-inject": 31.4, "s08-answer": 35.0 };
          const T = (id, t) => (T0 ? Egg.sceneStart(id) - T0 : FALLBACK[id] - 16.0) + t;
          const tl = gsap.timeline({ paused: true });
          const land = (el, at) => tl.fromTo(el, { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.45, ease: Egg.EASE.rise }, at);
          const light = (els, at, back) => {
            tl.to(els, { borderColor: "#000000", duration: 0.15, ease: "none" }, at);
            if (back) tl.to(els, { borderColor: "#ebe8e4", duration: 0.3, ease: "none" }, back);
          };
          const pulse = (at) => tl.fromTo(q(".head img"), { scale: 1, rotation: 0 }, { scale: 1.15, rotation: 30, duration: 0.2, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, at);
          const blocks = [".b1", ".b2", ".b3", ".b4"].map(q);

          // s04: the request puts the tool list and the question into the prompt; "Claude sees both"
          Egg.fadeUp(tl, q(".head"), T("s04-request", 0.05), { y: 16 });
          tl.fromTo(q(".rule"), { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: Egg.EASE.move }, T("s04-request", 0.1));
          land(blocks[0], T("s04-request", 1.0));
          land(blocks[1], T("s04-request", 2.25));
          pulse(T("s04-request", 3.1));
          light(blocks.slice(0, 2), T("s04-request", 3.1), T("s04-request", 4.2));
          // s07: Claude's tool_use and the tool_result are appended; "sends everything back"
          land(blocks[2], T("s07-inject", 1.65));
          land(blocks[3], T("s07-inject", 1.85));
          Egg.highlight(tl, q(".h1"), T("s07-inject", 2.05));
          Egg.highlight(tl, q(".h2"), T("s07-inject", 2.2));
          blocks.forEach((b, i) => light(b, T("s07-inject", 2.65 + i * 0.15)));
          pulse(T("s07-inject", 3.0));
          // s08: Claude reads it all; a dot carries it up to the answer
          tl.fromTo(q(".dot"), { x: 907, y: 925, scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.2, ease: Egg.EASE.pop }, T("s08-answer", 1.45));
          tl.to(q(".dot"), { x: 520, y: 640, duration: 0.4, ease: Egg.EASE.move }, T("s08-answer", 1.55));
          tl.to(q(".dot"), { scale: 0, opacity: 0, duration: 0.15 }, T("s08-answer", 1.95));
          tl.to(blocks, { borderColor: "#ebe8e4", duration: 0.3, ease: "none" }, T("s08-answer", 2.0));
          // out with s08
          Egg.fadeOut(tl, [q(".head"), q(".rule"), ...blocks], T("s08-answer", 5.2), { dur: 0.3 });
          window.__timelines["prompt"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
