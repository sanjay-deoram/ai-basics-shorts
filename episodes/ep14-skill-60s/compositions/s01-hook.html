<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <!-- Sound cues (seconds from scene start). Run node tools/build-sfx.mjs after editing. -->
    <script type="application/json" class="sfx-cues">[
      {"t":0.0,"sfx":"impact-bass-1","vol":0.22},
      {"t":0.02,"sfx":"air","vol":0.2},
      {"t":1.25,"sfx":"marker","vol":0.2},
      {"t":2.55,"sfx":"tick","vol":0.22},
      {"t":2.7,"sfx":"pop","vol":0.18},
      {"t":3.45,"sfx":"whoosh-short","vol":0.14},
      {"t":3.7,"sfx":"paper","vol":0.18},
      {"t":4.2,"sfx":"typing","vol":0.18,"dur":1.4},
      {"t":5.45,"sfx":"claude","vol":0.2},
      {"t":7.15,"sfx":"pop","vol":0.18},
      {"t":7.6,"sfx":"pen","vol":0.12,"dur":0.4},
      {"t":8.0,"sfx":"sparkle","vol":0.16,"dur":0.9},
      {"t":8.85,"sfx":"pop","vol":0.2},
      {"t":9.2,"sfx":"pop","vol":0.2},
      {"t":9.55,"sfx":"pop","vol":0.2}
    ]</script>
  </head>
  <body>
    <template>
      <!-- s01 · Cold open (no title card, nothing waits): frame 0 already reads "Create a Claude skill" and a huge
           "60" ("under … seconds") that settles in with a thump. On "sixty" the 60 pulses; then it shrinks into the
           "Under 60 seconds" chip. "A skill is a set of instructions": a SKILL.md page drops in and its template types
           in (frontmatter: name, description; then the first instruction); the Claude logo lands on it on "Claude". "When your request needs it": a request bubble arrives, a
           dotted line runs from it to the page and the page lights up on its own. "Step by step": the three steps pop in.
           Everything stays above y 800: the avatar peeks in large below (narrator.html "title").
           Voiceover: 0.05 "Here's how to create a Claude skill, in under sixty seconds." 3.55 "A skill is a set of
           instructions Claude picks up on its own, when your request needs it." 8.7 "Let's build one, step by step." -->
      <style>
        #root { position: absolute; inset: 0; }
        .s01 .hook { position: absolute; left: 90px; top: 236px; width: 860px; }
        .s01 .hook .w { display: inline-block; }
        .s01 .egg-chip { position: absolute; left: 90px; top: 492px; color: var(--ink); }
        .s01 .page { position: absolute; left: 90px; top: 566px; width: 450px; height: 306px; padding: 26px 30px; background: #fff; border: 2px solid var(--stone); border-radius: 24px; box-shadow: var(--shadow); }
        .s01 .page .top { display: flex; align-items: center; gap: 14px; font: 400 30px/1 var(--f-mono); color: var(--ink); }
        .s01 .page .cc-spark { width: 44px; height: 44px; }
        .s01 .page .md { margin: 14px 0 0; }
        .s01 .page .md p { margin: 0; font: 400 28px/38px var(--f-mono); color: var(--ink); white-space: pre; }
        .s01 .page .md .p { color: var(--smoke); }
        .s01 .page .md .k { color: var(--cc-clay); }
        .s01 .big { position: absolute; left: 90px; top: 478px; width: 860px; height: 300px; transform-origin: 0 50%; }
        .s01 .big .n { position: absolute; left: -12px; top: 0; font: 300 300px/1 var(--f-display); letter-spacing: -0.05em; color: var(--ink); }
        .s01 .big .u { position: absolute; left: 380px; top: 70px; font: 400 40px/1 var(--f-mono); letter-spacing: 0.1em; color: var(--smoke); }
        .s01 .big .sec { position: absolute; left: 376px; top: 120px; font: 300 112px/1 var(--f-display); letter-spacing: -0.02em; color: var(--ink); }
        .s01 .big .egg-hl { display: inline-block; }
        .s01 .glow { position: absolute; left: 78px; top: 554px; width: 474px; height: 330px; border-radius: 34px; border: 4px solid var(--cc-clay); box-shadow: 0 0 40px rgba(217, 119, 87, 0.45); }
        .s01 .cc-bubble { position: absolute; left: 584px; top: 600px; width: 340px; white-space: normal; }
        .s01 .steps { position: absolute; left: 90px; top: 640px; display: flex; gap: 16px; }
        .s01 .steps .egg-chip { position: static; }
      </style>
      <div id="root" data-composition-id="s01-hook" data-width="1080" data-height="1920">
        <div class="egg-scene s01">
          <h1 class="egg-display hook"><span class="w">Create</span> <span class="w">a</span> <span class="w">Claude</span> <span class="w"><span class="egg-hl">skill</span></span></h1>
          <span class="egg-chip c60">Under 60 seconds</span>
          <div class="big"><span class="n">60</span><span class="u">UNDER</span><span class="sec"><span class="egg-hl">seconds</span></span></div>
          <div class="glow"></div>
          <div class="page">
            <div class="top"><div class="cc-spark"></div><span>SKILL.md</span></div>
            <div class="md">
              <p><span class="p">---</span></p>
              <p><span class="k">name</span>: pr-description</p>
              <p><span class="k">description</span>: Use when…</p>
              <p><span class="p">---</span></p>
              <p>1. Run git diff…</p>
            </div>
          </div>
          <div class="cc-bubble">Write a PR description</div>
          <svg class="egg-svg" viewBox="0 0 1080 1920" aria-hidden="true">
            <path class="link" d="M580 668 C 566 668, 560 700, 544 700" fill="none" stroke="#000" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 12" />
          </svg>
          <div class="steps">
            <span class="egg-chip"><b>1</b> Folder</span>
            <span class="egg-chip"><b>2</b> SKILL.md</span>
            <span class="egg-chip"><b>3</b> Ask</span>
          </div>
        </div>
      </div>
      <script>
        (() => {
          const DUR = 10.9;
          const root = document.querySelector('[data-composition-id="s01-hook"] .s01');
          const q = (s) => root.querySelector(s);
          const all = (s) => [...root.querySelectorAll(s)];
          const spark = q(".page .cc-spark"), link = q(".link");
          gsap.set([q(".page"), q(".glow"), q(".cc-bubble"), link, ...all(".steps .egg-chip")], { opacity: 0 });

          const tl = gsap.timeline({ paused: true });
          // frame 0: the title is already there; the big 60 settles in with a thump
          tl.fromTo(q(".big"), { scale: 1.1 }, { scale: 1, duration: 0.35, ease: Egg.EASE.stamp }, 0);
          tl.fromTo(q(".hook"), { y: -18 }, { y: 0, duration: 0.35, ease: Egg.EASE.stamp }, 0);
          // "create a Claude skill"
          Egg.highlight(tl, q(".hook .egg-hl"), 1.25);
          // "in under sixty seconds": the 60 pulses, then shrinks into the chip
          Egg.highlight(tl, q(".big .egg-hl"), 2.55);
          tl.to(q(".big .n"), { scale: 1.08, duration: 0.15, ease: "power2.out", yoyo: true, repeat: 1, transformOrigin: "30% 60%" }, 2.6);
          tl.to(q(".big"), { scale: 0.2, y: -80, opacity: 0, duration: 0.4, ease: Egg.EASE.move }, 3.4);
          Egg.pop(tl, q(".c60"), 3.55);
          // "A skill is a set of instructions": the page drops in and its lines write themselves
          tl.fromTo(q(".page"), { opacity: 0, y: -40, rotation: -3 }, { opacity: 1, y: 0, rotation: 0, duration: 0.5, ease: Egg.EASE.enter }, 3.65);
          all(".page .md p").reduce((t, p) => Egg.typeOn(tl, p, t, { cps: 55 }) + 0.05, 4.2);
          // "Claude": the logo lands on the page
          Egg.pop(tl, spark, 5.45);
          tl.fromTo(spark, { rotation: -90 }, { rotation: 0, duration: 0.8, ease: "power3.out", immediateRender: false }, 5.45);
          // "when your request needs it": a request arrives and the page lights up on its own
          Egg.fadeUp(tl, q(".cc-bubble"), 7.1, { y: 20, dur: 0.4 });
          tl.to(link, { opacity: 1, duration: 0.3, ease: "none" }, 7.55);
          tl.to(q(".glow"), { opacity: 1, duration: 0.35, ease: "power2.out" }, 7.95);
          tl.to(q(".page"), { scale: 1.04, duration: 0.2, ease: "power2.out", yoyo: true, repeat: 1 }, 7.95);
          tl.to(spark, { rotation: 180, duration: 0.8, ease: "power2.inOut" }, 7.95);
          // "Let's build one, step by step": the three steps
          tl.to([q(".page"), q(".glow"), q(".cc-bubble"), link], { opacity: 0, y: -20, duration: 0.3, ease: Egg.EASE.exit }, 8.55);
          Egg.pop(tl, all(".steps .egg-chip"), 8.85, { stagger: 0.35 });

          Egg.fadeOut(tl, [q(".hook"), q(".c60"), q(".steps")], DUR - 0.35);
          window.__timelines["s01-hook"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
