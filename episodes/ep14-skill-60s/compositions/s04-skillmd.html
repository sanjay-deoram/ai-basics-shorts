<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <!-- Sound cues (seconds from scene start). Run node tools/build-sfx.mjs after editing. -->
    <script type="application/json" class="sfx-cues">[
      {"t":0.25,"sfx":"air","vol":0.14},
      {"t":0.5,"sfx":"tap","vol":0.18},
      {"t":2.35,"sfx":"paper","vol":0.2},
      {"t":3.8,"sfx":"pop","vol":0.2},
      {"t":4.2,"sfx":"marker","vol":0.16},
      {"t":5.45,"sfx":"whoosh-short","vol":0.16},
      {"t":5.85,"sfx":"key","vol":0.16},
      {"t":6.65,"sfx":"typing","vol":0.2,"dur":0.6},
      {"t":7.5,"sfx":"typing","vol":0.2,"dur":1.3},
      {"t":7.6,"sfx":"pop","vol":0.16},
      {"t":10.2,"sfx":"pop","vol":0.16},
      {"t":12.25,"sfx":"typing","vol":0.2,"dur":0.8},
      {"t":13.4,"sfx":"typing","vol":0.2,"dur":0.7},
      {"t":14.77,"sfx":"tick","vol":0.2},
      {"t":15.24,"sfx":"tick","vol":0.2},
      {"t":15.82,"sfx":"tick","vol":0.2}
    ]</script>
  </head>
  <body>
    <template>
      <!-- s04 · Step 2 · SKILL.md. The folder chip, then one file drops into it and is named SKILL.md ("exactly
           that name"). The file opens into an editor card: the frontmatter fences, the name and the description type in
           with the run bar on each ("Name + when to use it"), then the instructions below: git diff, then the three
           sections What / Why / Changes, each typed as it's said. The skill text follows the Claude Academy lesson.
           Avatar: small top right ("corner"); content above y 485 stays left of x 830.
           Voiceover: 0.2 "Step two: inside it, add one file: skill dot M D." 5.75 "At the top, a name, and a description
           of when to use it." 9.2 "Below that, the instructions, in plain English: run git diff, then write three
           sections. What, why, and changes." -->
      <style>
        #root { position: absolute; inset: 0; }
        .s04 .egg-eyebrow { position: absolute; left: 90px; top: 232px; }
        .s04 .path { position: absolute; left: 90px; top: 300px; color: var(--ink); text-transform: none; }
        .s04 .file { position: absolute; left: 390px; top: 520px; width: 300px; height: 380px; }
        .s04 .file svg { width: 100%; height: 100%; fill: #fff; stroke: var(--ink); stroke-width: 5; stroke-linejoin: round; }
        .s04 .file .cc-spark { position: absolute; left: 110px; top: 150px; width: 80px; height: 80px; }
        .s04 .fname { position: absolute; left: 90px; width: 900px; top: 940px; text-align: center; font: 400 64px/1.2 var(--f-mono); color: var(--ink); }
        .s04 .fname .egg-hl { display: inline-block; }
        .s04 .ffoot { position: absolute; left: 90px; width: 900px; top: 1040px; text-align: center; font-size: 30px; }
        .s04 .egg-code { position: absolute; left: 90px; top: 520px; width: 860px; }
        .s04 .egg-code-top { text-transform: none; letter-spacing: 0.02em; }
        .s04 .egg-code-body { white-space: normal; }
        .s04 .egg-code-body .tx { white-space: pre; }
        .s04 .egg-label { position: absolute; left: 90px; width: 860px; top: 1220px; }
      </style>
      <div id="root" data-composition-id="s04-skillmd" data-width="1080" data-height="1920">
        <div class="egg-scene s04">
          <span class="egg-eyebrow">Step 2 · SKILL.md</span>
          <span class="egg-chip path">~/.claude/skills/pr-description/</span>
          <div class="file">
            <svg viewBox="0 0 300 380"><path d="M10 10 H 210 L 290 90 V 370 H 10 Z M210 10 V 90 H 290" /></svg>
            <div class="cc-spark"></div>
          </div>
          <p class="fname"><span class="egg-hl">SKILL.md</span></p>
          <span class="egg-foot ffoot">Exactly that name, in capitals</span>
          <div class="egg-code card" data-layout-allow-overlap="">
            <div class="egg-code-top"><i></i><i></i><i></i>SKILL.md</div>
            <div class="egg-code-body"><div class="egg-code-bar"></div>
              <div class="ln"><span class="no">1</span><span class="tx"><span class="t-p">---</span></span></div>
              <div class="ln"><span class="no">2</span><span class="tx"><span class="t-k">name</span><span class="t-p">:</span> <span class="t-s">pr-description</span></span></div>
              <div class="ln"><span class="no">3</span><span class="tx"><span class="t-k">description</span><span class="t-p">:</span> <span class="t-s">Writes PR descriptions.</span></span></div>
              <div class="ln"><span class="no">4</span><span class="tx"><span class="t-s">  Use when the user asks for a PR.</span></span></div>
              <div class="ln"><span class="no">5</span><span class="tx"><span class="t-p">---</span></span></div>
              <div class="ln"><span class="no">6</span><span class="tx"><span class="t-kw">1.</span> Run <span class="t-fn">git diff main...HEAD</span></span></div>
              <div class="ln"><span class="no">7</span><span class="tx"><span class="t-kw">2.</span> Write three sections:</span></div>
              <div class="ln"><span class="no">8</span><span class="tx">   <span class="t-k">## What</span><span class="t-c">: one sentence</span></span></div>
              <div class="ln"><span class="no">9</span><span class="tx">   <span class="t-k">## Why</span><span class="t-c">: brief context</span></span></div>
              <div class="ln"><span class="no">10</span><span class="tx">   <span class="t-k">## Changes</span><span class="t-c">: bullets</span></span></div>
            </div>
          </div>
          <p class="egg-label l1">Name + when to use it</p>
          <p class="egg-label l2">Instructions, in plain English</p>
        </div>
      </div>
      <script>
        (() => {
          const DUR = 16.8;
          const root = document.querySelector('[data-composition-id="s04-skillmd"] .s04');
          const q = (s) => root.querySelector(s);
          const all = (s) => [...root.querySelectorAll(s)];
          const card = q(".card"), lns = all(".card .ln");
          const type = (i, at, cps = 40) => {
            tl.fromTo(lns[i].querySelector(".no"), { opacity: 0 }, { opacity: 1, duration: 0.001 }, at);
            return Egg.typeOn(tl, lns[i].querySelector(".tx"), at, { cps });
          };
          gsap.set([card, q(".l1"), q(".l2"), q(".ffoot")], { opacity: 0 });

          const tl = gsap.timeline({ paused: true });
          // "Step two: inside it"
          Egg.fadeUp(tl, q(".egg-eyebrow"), 0.2, { y: 16 });
          Egg.pop(tl, q(".path"), 0.5);
          // "add one file": it drops into the folder
          tl.fromTo(q(".file"), { opacity: 0, y: -120, rotation: -6 }, { opacity: 1, y: 0, rotation: 0, duration: 0.55, ease: Egg.EASE.enter }, 2.3);
          Egg.pop(tl, q(".file .cc-spark"), 2.75);
          // "skill dot M D"
          Egg.fadeUp(tl, q(".fname"), 3.8, { y: 24, dur: 0.4 });
          Egg.highlight(tl, q(".fname .egg-hl"), 4.2);
          Egg.fadeUp(tl, q(".ffoot"), 4.5, { y: 10 });

          // the file opens into the editor
          tl.to([q(".file"), q(".fname"), q(".ffoot")], { opacity: 0, scale: 0.9, duration: 0.3, ease: Egg.EASE.exit }, 5.4);
          tl.fromTo(card, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.45, ease: Egg.EASE.enter }, 5.5);
          // "At the top": the frontmatter fences
          type(0, 5.85, 30); type(4, 5.95, 30);
          // "a name"
          type(1, 6.65, 36);
          Egg.codeRun(tl, card, 1, 6.7);
          // "and a description of when to use it"
          type(2, 7.5, 40); type(3, 8.15, 48);
          Egg.codeRun(tl, card, [2, 3], 7.6);
          Egg.fadeUp(tl, q(".l1"), 7.6, { y: 20, dur: 0.4 });

          // "Below that, the instructions, in plain English"
          Egg.codeRun(tl, card, -1, 9.3);
          tl.to(q(".l1"), { opacity: 0, duration: 0.25, ease: "none" }, 10.0);
          Egg.fadeUp(tl, q(".l2"), 10.2, { y: 20, dur: 0.4 });
          // "run git diff"
          type(5, 12.25, 30);
          Egg.codeRun(tl, card, 5, 12.3);
          // "then write three sections"
          type(6, 13.4, 34);
          Egg.codeRun(tl, card, 6, 13.45);
          // "What, why, and changes"
          [[7, 14.77], [8, 15.24], [9, 15.82]].forEach(([i, t]) => { type(i, t, 60); Egg.codeRun(tl, card, i, t); });
          Egg.codeRun(tl, card, -1, 16.3);

          Egg.fadeOut(tl, [q(".egg-eyebrow"), q(".path"), card, q(".l2")], DUR - 0.3, { dur: 0.3 });
          window.__timelines["s04-skillmd"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
