      <script>
        (() => {

          const root = document.querySelector('[data-composition-id="s01-hook"] .s01');
          const q = (s) => root.querySelector(s);
          const all = (s) => [...root.querySelectorAll(s)];
          const tl = gsap.timeline({ paused: true });

          Egg.fadeUp(tl, q(".egg-eyebrow"), 0.05);
          // "This pilot approves code from his phone."
          Egg.draw(tl, q(".wings"), 0.3, { gap: 0.1, dur: 0.45 });
          Egg.fadeUp(tl, q(".pilot"), 0.55, { y: 12 });
          tl.fromTo(q(".phone"), { y: 140, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: Egg.EASE.enter }, 0.1);
          tl.fromTo(q(".note"), { y: -40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: Egg.EASE.rise }, 0.95);
          Egg.fadeUp(tl, [q(".m1"), q(".m2")], 1.25, { y: 16, stagger: 0.12 });
          tl.set([q(".b2"), q(".merged")], { opacity: 0 }, 0);
          // the tap
          tl.fromTo(q(".tap"), { scale: 1.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.18, ease: "power2.out" }, 1.62);
          tl.to(q(".btn"), { scale: 0.95, duration: 0.1, ease: "power2.out", yoyo: true, repeat: 1 }, 1.75);
          tl.to(q(".tap"), { scale: 2.1, opacity: 0, duration: 0.45, ease: "power2.out" }, 1.82);
          tl.to(q(".b1"), { opacity: 0, duration: 0.15, ease: "none" }, 1.85);
          tl.to(q(".b2"), { opacity: 1, duration: 0.15, ease: "none" }, 1.9);
          Egg.stamp(tl, q(".merged"), 2.05, q(".phone"));

          // "His dev team? All AI agents." The camera pulls back and the team pops in around the phone.
          tl.to(q(".story"), { scale: 0.6, transformOrigin: "540px 880px", duration: 0.8, ease: Egg.EASE.move }, 2.6);
          Egg.pop(tl, [q(".a1"), q(".a2"), q(".a3"), q(".a4")], 3.0, { stagger: 0.12 });
          all(".team .dots").forEach((d, k) => {
            tl.fromTo(d.querySelectorAll("i"), { opacity: 0.15 }, { opacity: 1, duration: 0.16, ease: "none", stagger: 0.16, repeat: 2, repeatDelay: 0.1 }, 3.4 + k * 0.08);

          tl.to([q(".egg-eyebrow"), q(".story"), ...all(".team"), q(".team-label")], { opacity: 0, y: -24, duration: 0.35, ease: Egg.EASE.exit }, 4.7);

          // "Five things to know. The last one matters most."
          tl.fromTo(q(".big5"), { scale: 2.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(1.6)" }, 5.1);

          Egg.fadeUp(tl, q(".about"), 5.75);

          Egg.fadeOut(tl, [q(".big5"), q(".tl1"), q(".tl2"), q(".about"), q(".last")], DUR - 0.35);
