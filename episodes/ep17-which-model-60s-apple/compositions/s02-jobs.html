<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <!-- Sound cues (seconds from scene start). Run node tools/build-sfx.mjs after editing. -->
    <script type="application/json" class="sfx-cues">[
      {"t":0.15,"sfx":"air","vol":0.14},
      {"t":0.3,"sfx":"tap","vol":0.16},
      {"t":1.3,"sfx":"marker","vol":0.14},
      {"t":2.07,"sfx":"pop","vol":0.16},
      {"t":2.3,"sfx":"stream","vol":0.12,"dur":0.9},
      {"t":3.99,"sfx":"pop","vol":0.16},
      {"t":5.92,"sfx":"pop","vol":0.16},
      {"t":6.89,"sfx":"pop","vol":0.18},
      {"t":2.52,"sfx":"tick","vol":0.14},
      {"t":4.44,"sfx":"tick","vol":0.14},
      {"t":6.37,"sfx":"tick","vol":0.14},
      {"t":7.34,"sfx":"tick","vol":0.16}
    ]</script>
  </head>
  <body>
    <template>
      <!-- s02 · The example: your app's four jobs, the through-line of the episode. Each job card lands as it is said
           (the ticket count runs to 10,000); each with a gray "Model?" tag: which one should do it? s03–s05 hand
           every job to a model. Narrator: small tile bottom right (x > 750, y > 1300 stays empty).
           Voiceover: 0.17 "Say your app has four jobs: tagging ten thousand tickets, a chat reply a customer waits on,
           a tricky bug, and a big migration." -->
      <style>
        #root { position: absolute; inset: 0; }
        .s02 .hd { top: 316px; }
        .s02 .hd .l { display: block; white-space: nowrap; }
        .s02 .job { top: 0; }
      </style>
      <div id="root" data-composition-id="s02-jobs" data-width="1080" data-height="1920">
        <div class="a-scene s02">
          <p class="a-eyebrow">The example</p>
          <h2 class="a-h2 hd"><span class="l">Your app has</span><span class="l"><span class="a-tint" data-layout-allow-overlap=""><span data-layout-allow-overlap="">four jobs</span><span class="on" data-layout-allow-overlap="">four jobs</span></span></span></h2>
          <div class="a-card a-job job" style="top:570px"><i class="ic" data-ic="tag"></i><span class="n">Tag <span class="cnt">10,000</span> tickets</span><span class="s">sort each one by topic</span><div class="end"><span class="a-tag gray">Model?</span></div></div>
          <div class="a-card a-job job" style="top:714px"><i class="ic" data-ic="chat"></i><span class="n">Reply in chat</span><span class="s">a customer is waiting</span><div class="end"><span class="a-tag gray">Model?</span></div></div>
          <div class="a-card a-job job" style="top:858px"><i class="ic" data-ic="bug"></i><span class="n">Fix a tricky bug</span><span class="s">somewhere in the codebase</span><div class="end"><span class="a-tag gray">Model?</span></div></div>
          <div class="a-card a-job job" style="top:1002px"><i class="ic" data-ic="db"></i><span class="n">Migrate the database</span><span class="s">big, with many steps</span><div class="end"><span class="a-tag gray">Model?</span></div></div>
        </div>
      </div>
      <script>
        (() => {
          const DUR = 8.18;
          const root = document.querySelector('[data-composition-id="s02-jobs"] .s02');
          const q = (s) => root.querySelector(s);
          const all = (s) => [...root.querySelectorAll(s)];
          Apple.icons(root);
          const jobs = all(".job"), tags = all(".job .a-tag");
          gsap.set([...jobs, ...tags], { opacity: 0 });
          const tl = gsap.timeline({ paused: true });

          // "Say your app has four jobs"
          Apple.rise(tl, q(".a-eyebrow"), 0.15, { y: 16 });
          Apple.rise(tl, q(".hd"), 0.3, { y: 24, dur: 0.8 });
          Apple.tint(tl, q(".hd .a-tint"), 1.3, { dur: 0.5 });
          // each job as it is said
          [2.07, 3.99, 5.92, 6.89].forEach((at, i) => { Apple.rise(tl, jobs[i], at, { y: 40, dur: 0.7 }); Apple.zoom(tl, tags[i], at + 0.45, { from: 0.8, dur: 0.45 }); });
          Egg.count(tl, q(".cnt"), 0, 10000, 2.2, { dur: 1.1, fmt: (v) => (Math.round(v / 50) * 50).toLocaleString("en-US") });

          Apple.out(tl, [q(".a-eyebrow"), q(".hd"), ...jobs], DUR - 0.3, { dur: 0.3 });
          window.__timelines["s02-jobs"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
