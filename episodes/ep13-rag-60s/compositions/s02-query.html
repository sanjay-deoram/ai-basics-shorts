<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <!-- Sound cues (seconds from scene start). Run node tools/build-sfx.mjs after editing. -->
    <script type="application/json" class="sfx-cues">[
      {"t":0.12,"sfx":"air","vol":0.12},
      {"t":0.45,"sfx":"typing","vol":0.2,"dur":0.95},
      {"t":1.42,"sfx":"tick","vol":0.16},
      {"t":1.85,"sfx":"marker","vol":0.2},
      {"t":2.0,"sfx":"tap","vol":0.18},
      {"t":2.75,"sfx":"air","vol":0.1},
      {"t":3.05,"sfx":"drop","vol":0.16},
      {"t":3.25,"sfx":"drop","vol":0.14},
      {"t":3.45,"sfx":"drop","vol":0.16},
      {"t":3.65,"sfx":"drop","vol":0.14},
      {"t":3.85,"sfx":"drop","vol":0.16},
      {"t":4.05,"sfx":"drop","vol":0.18},
      {"t":4.5,"sfx":"pop","vol":0.2}
    ]</script>
  </head>
  <body>
    <template>
      <!-- s02 · The query, in Claude's chat UI (assets/claude-chat.css). The claude.ai home screen: the spark and
           "Good afternoon, Sanjay", the composer with its placeholder; the question types in ("Can I expense a home
           office chair?", example), the send button wakes up, and the typed text is highlighted on "query". Then a
           pile of six documents (file tiles, as Claude shows attachments) drops in under it: the answer is in there
           somewhere. Avatar: small top right (narrator.html "corner"); everything above y 485 stays left of x 830.
           Voiceover: 0.2 "Say you have a question. That's your query." 2.65 "And the answer is buried somewhere in
           a pile of documents." -->
      <style>
        #root { position: absolute; inset: 0; }
        .s02 .egg-eyebrow { position: absolute; left: 90px; top: 232px; }
        .s02 .cc-greet { position: absolute; left: 90px; top: 300px; }
        .s02 .cc-greet span { font-size: 56px; }
        .s02 .cc-greet .cc-spark { width: 68px; height: 68px; }
        .s02 .cc-box { position: absolute; left: 90px; top: 410px; width: 740px; height: 236px; }
        .s02 .cc-input { position: absolute; left: 126px; top: 448px; }
        .s02 .b1 { position: absolute; left: 120px; top: 558px; }
        .s02 .b2 { position: absolute; left: 194px; top: 558px; }
        .s02 .cc-model { position: absolute; right: 346px; top: 575px; }
        .s02 .cc-send { position: absolute; left: 744px; top: 556px; }
        .s02 .qchip { position: absolute; left: 90px; top: 680px; }
        .s02 .doc { position: absolute; width: 250px; height: 310px; gap: 14px; justify-content: flex-start; }
        .s02 .doc i { display: block; height: 10px; border-radius: 5px; background: var(--cc-line); }
        .s02 .doc .cc-badge { margin-top: auto; }
        .s02 .egg-label { position: absolute; left: 90px; width: 860px; top: 1320px; }
      </style>
      <div id="root" data-composition-id="s02-query" data-width="1080" data-height="1920">
        <div class="egg-scene s02">
          <span class="egg-eyebrow">Example</span>
          <div class="cc-greet"><div class="cc-spark"></div><span>Good afternoon, Sanjay</span></div>
          <div class="cc-box"></div>
          <p class="cc-input ph">How can I help you today?</p>
          <p class="cc-input qt"><span class="egg-hl">Can I expense a home office chair?</span></p>
          <div class="cc-btn b1"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg></div>
          <div class="cc-btn b2"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8" /><circle cx="16" cy="7" r="2" /><circle cx="10" cy="17" r="2" /></svg></div>
          <span class="cc-model">Opus 5.5<svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" /></svg></span>
          <div class="cc-send"><svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6" /></svg></div>
          <span class="egg-chip qchip">Your query</span>
          <div class="docs" data-layout-allow-overlap=""></div>
          <p class="egg-label">The answer is in there somewhere.</p>
        </div>
      </div>
      <script>
        (() => {
          const DUR = 6.0;
          // [file, left, top, resting rotation]: a loose pile around x 540, y 960
          const DOCS = [
            ["Handbook", 250, 770, -9],
            ["Travel", 560, 760, 8],
            ["IT policy", 300, 930, 5],
            ["Expenses", 420, 830, -3],
            ["Benefits", 600, 950, -7],
            ["Onboarding", 430, 970, 4],
          ];
          const W = [100, 86, 92, 64, 96, 78];
          const root = document.querySelector('[data-composition-id="s02-query"] .s02');
          const q = (s) => root.querySelector(s);
          q(".docs").innerHTML = DOCS.map(([t, x, y], i) =>
            `<div class="cc-tile doc" style="left:${x}px;top:${y}px" data-layout-allow-overlap=""><p class="nm">${t}</p>${W.map((w, j) => `<i style="width:${(w + i * 7 + j * 13) % 40 + 60}%"></i>`).join("")}<span class="cc-badge">PDF</span></div>`).join("");
          const docs = [...root.querySelectorAll(".doc")];
          const chrome = [q(".cc-box"), q(".b1"), q(".b2"), q(".cc-model"), q(".cc-send")];

          const tl = gsap.timeline({ paused: true });
          Egg.fadeUp(tl, q(".egg-eyebrow"), 0.05);
          // Claude's home screen
          Egg.fadeUp(tl, [q(".cc-greet"), ...chrome.slice(0, 4)], 0.1, { y: 24, stagger: 0.03 });
          tl.fromTo(q(".ph"), { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "none" }, 0.15);
          tl.fromTo(q(".cc-send"), { opacity: 0, y: 24 }, { opacity: 0.45, y: 0, duration: 0.55, ease: Egg.EASE.enter }, 0.22);   // dimmed until there is something to send
          tl.fromTo(q(".cc-greet .cc-spark"), { rotation: -60 }, { rotation: 0, duration: 0.8, ease: "power3.out" }, 0.1);
          // "Say you have a question.": it types into the composer, the send button wakes up
          tl.set(q(".ph"), { opacity: 0 }, 0.45);
          const typed = Egg.typeOn(tl, q(".qt"), 0.45, { cps: 36 });
          tl.to(q(".cc-send"), { opacity: 1, duration: 0.15, ease: "none" }, typed);
          tl.fromTo(q(".cc-send"), { scale: 1 }, { scale: 1.12, duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, typed);
          // "That's your query."
          Egg.highlight(tl, q(".qt .egg-hl"), 1.85);
          Egg.pop(tl, q(".qchip"), 2.0, { dur: 0.45 });
          // "And the answer is buried somewhere in a pile of documents."
          docs.forEach((d, i) => tl.fromTo(d, { opacity: 0, y: -160, rotation: DOCS[i][3] * 3 }, { opacity: 1, y: 0, rotation: DOCS[i][3], duration: 0.5, ease: Egg.EASE.enter }, 2.75 + i * 0.2));
          Egg.fadeUp(tl, q(".egg-label"), 4.5);

          Egg.fadeOut(tl, [q(".egg-eyebrow"), q(".cc-greet"), ...chrome, q(".qt"), q(".qchip"), ...docs, q(".egg-label")], DUR - 0.35);
          window.__timelines["s02-query"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
