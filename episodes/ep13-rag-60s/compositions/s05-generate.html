<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <!-- Sound cues (seconds from scene start). Run node tools/build-sfx.mjs after editing. -->
    <script type="application/json" class="sfx-cues">[
      {"t":0.6,"sfx":"whoosh","vol":0.2},
      {"t":3.0,"sfx":"pop","vol":0.26},
      {"t":3.8,"sfx":"whoosh-short","vol":0.18},
      {"t":6.1,"sfx":"click","vol":0.22},
      {"t":7.8,"sfx":"pop","vol":0.2},
      {"t":9.5,"sfx":"pop","vol":0.2},
      {"t":9.65,"sfx":"sparkle","vol":0.16,"dur":0.9},
      {"t":11.5,"sfx":"click","vol":0.22},
      {"t":11.9,"sfx":"whoosh-short","vol":0.18},
      {"t":12.8,"sfx":"typing","vol":0.22,"dur":2.0},
      {"t":14.95,"sfx":"pop","vol":0.2},
      {"t":15.3,"sfx":"sparkle","vol":0.16,"dur":0.9},
      {"t":15.3,"sfx":"chime","vol":0.24,"dur":1.8}
    ]</script>
  </head>
  <body>
    <template>
      <!-- s05 · A · Augmented, then G · Generation. Opens on s04's two retrieved cards, which rise into a prompt card
           ("Sent to the model"); the Claude logo pops on "like Claude" and the query card drops in under the
           documents ("together with your question"). Augmented: the prompt punches, "Context" and "Question" label
           its two parts as the voice names them. Generation: the prompt pulses toward Claude, the logo turns and the
           answer types out with its source (labelled "Example answer"); "Grounded in your docs." Hard stop: no end
           card, the last frame holds. Avatar: small top right (narrator.html "corner"); the prompt card stays left
           of x 830. Voiceover: 0.2 "Next, those documents go to a large language model, like Claude, together with
           your question." 5.75 "That's the augmented part: the model now has the context it needs, and the question
           it has to answer." 11.35 "And that's generation: it writes a reply grounded in your documents, so it's far
           less likely to make things up." -->
      <style>
        #root { position: absolute; inset: 0; }
        .s05 .egg-eyebrow { position: absolute; left: 90px; top: 232px; }
        .s05 .bundle { position: absolute; left: 90px; width: 740px; top: 290px; height: 450px; padding: 0; border-radius: 32px; transform-origin: 50% 50%; }
        .s05 .pk { position: absolute; left: 124px; top: 312px; }
        .s05 .ck { position: absolute; left: 124px; top: 352px; color: var(--ink); }
        .s05 .qk { position: absolute; left: 124px; top: 574px; color: var(--ink); }
        .s05 .res { position: absolute; left: 90px; width: 700px; padding: 20px 30px; border-radius: 24px; }
        .s05 .res p { margin: 0; font: 400 34px/1.2 var(--f-body); color: var(--ink); white-space: nowrap; }
        .s05 .res .egg-hl.on { background-size: 100% 100%; }
        .s05 .qc { position: absolute; left: 110px; width: 700px; top: 606px; padding: 20px 30px; border-radius: 24px; }
        .s05 .qc p { margin: 0; font: 400 30px/1.3 var(--f-mono); color: var(--ink); white-space: nowrap; }
        .s05 .arrow { fill: none; stroke: var(--ink); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
        .s05 .logo { position: absolute; left: 400px; top: 822px; width: 120px; height: 120px; background: url("assets/claude-logo.svg") center / contain no-repeat; }
        .s05 .ans { position: absolute; left: 90px; width: 860px; top: 984px; padding: 28px 36px; gap: 14px; border-radius: 32px; }
        .s05 .ans .txt { margin: 0; font: 400 36px/1.36 var(--f-body); color: var(--ink); text-wrap: balance; }
        .s05 .src { align-self: flex-start; font: 400 24px/1 var(--f-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--graphite); border: 2px solid var(--btn-border); border-radius: 9999px; padding: 10px 16px; }
        .s05 .egg-label { position: absolute; left: 90px; width: 860px; top: 1300px; }
        .s05 .foot { position: absolute; left: 90px; width: 860px; top: 1410px; text-align: center; text-wrap: balance; }
      </style>
      <div id="root" data-composition-id="s05-generate" data-width="1080" data-height="1920">
        <div class="egg-scene s05">
          <span class="egg-eyebrow e1">A · Augmented</span>
          <span class="egg-eyebrow e2">G · Generation</span>
          <div class="egg-card bundle"></div>
          <span class="egg-card-kicker pk">Prompt · sent to the model</span>
          <span class="egg-card-kicker ck">Context</span>
          <span class="egg-card-kicker qk">Question</span>
          <div class="egg-card res r1" style="top:1070px" data-layout-allow-overlap=""><p><span class="egg-hl on">Home office gear: up to $300 a year.</span></p></div>
          <div class="egg-card res r2" style="top:1170px" data-layout-allow-overlap=""><p><span class="egg-hl on">Submit expense receipts in 30 days.</span></p></div>
          <div class="egg-card qc"><p><span class="egg-hl">Can I expense a home office chair?</span></p></div>
          <svg class="egg-svg" viewBox="0 0 1080 1920" aria-hidden="true">
            <path class="arrow" d="M460 752 L460 806 M444 790 L460 806 L476 790" />
          </svg>
          <div class="logo"></div>
          <div class="egg-card ans">
            <span class="egg-card-kicker">Example answer</span>
            <p class="txt">Yes. Home office gear is covered up to <span class="egg-hl">$300 a year</span>. Submit the receipt within 30 days.</p>
            <span class="src">From 2 of your documents</span>
          </div>
          <p class="egg-label">Grounded in your docs.</p>
          <span class="foot egg-foot">Far less likely to make things up, not never.</span>
        </div>
      </div>
      <script>
        (() => {
          const DUR = 19.0;
          const root = document.querySelector('[data-composition-id="s05-generate"] .s05');
          const q = (s) => root.querySelector(s);
          const r1 = q(".r1"), r2 = q(".r2"), arrow = q(".arrow");
          arrow.setAttribute("pathLength", "1");
          arrow.style.strokeDasharray = "1 1.1";
          gsap.set(arrow, { strokeDashoffset: 1.02 });
          gsap.set([q(".e2"), q(".ck"), q(".qk"), q(".src")], { opacity: 0 });

          const tl = gsap.timeline({ paused: true });
          // "Next, those documents go to a large language model": the two cards rise into the prompt
          Egg.fadeUp(tl, [q(".bundle"), q(".pk")], 0.5, { y: 24 });
          tl.to(r1, { x: 20, y: 380 - 1070, duration: 0.7, ease: Egg.EASE.move }, 0.6);
          tl.to(r2, { x: 20, y: 470 - 1170, duration: 0.7, ease: Egg.EASE.move }, 0.72);
          // "like Claude"
          tl.to(arrow, { strokeDashoffset: 0, duration: 0.4, ease: Egg.EASE.draw }, 2.8);
          tl.fromTo(q(".logo"), { scale: 0, opacity: 0, rotation: -40 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.55, ease: Egg.EASE.pop }, 3.0);
          // "together with your question"
          tl.fromTo(q(".qc"), { opacity: 0, y: -140 }, { opacity: 1, y: 0, duration: 0.5, ease: Egg.EASE.move }, 3.8);

          // "That's the augmented part"
          Egg.fadeUp(tl, q(".e1"), 5.9, { y: 16 });
          tl.to(q(".bundle"), { scale: 1.03, duration: 0.25, ease: "power2.out", yoyo: true, repeat: 1 }, 6.1);
          // "the context it needs"
          Egg.pop(tl, q(".ck"), 7.8, { dur: 0.4 });
          tl.to([r1, r2], { scale: 1.03, duration: 0.18, ease: "power2.out", yoyo: true, repeat: 1, stagger: 0.12 }, 7.9);
          // "and the question it has to answer"
          Egg.pop(tl, q(".qk"), 9.5, { dur: 0.4 });
          Egg.highlight(tl, q(".qc .egg-hl"), 9.65);

          // "And that's generation"
          Egg.fadeOut(tl, q(".e1"), 11.4, { dur: 0.25 });
          Egg.fadeUp(tl, q(".e2"), 11.55, { y: 16 });
          // the prompt goes to Claude: it pulses down the arrow, Claude takes it and turns while it writes
          tl.to(q(".bundle"), { y: 24, scale: 0.98, duration: 0.25, ease: "power2.in", yoyo: true, repeat: 1 }, 11.9);
          tl.fromTo(q(".logo"), { scale: 1 }, { scale: 1.18, duration: 0.18, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, 12.2);
          tl.to(q(".logo"), { rotation: 120, duration: 5.4, ease: "power1.inOut" }, 12.4);
          // "it writes a reply grounded in your documents"
          Egg.fadeUp(tl, q(".ans"), 12.55);
          Egg.typeOn(tl, q(".ans .txt"), 12.8, { cps: 40 });
          Egg.pop(tl, q(".src"), 14.95, { dur: 0.45 });
          Egg.highlight(tl, q(".ans .egg-hl"), 15.3);
          Egg.fadeUp(tl, q(".egg-label"), 15.3);
          // "so it's far less likely to make things up"
          Egg.fadeUp(tl, q(".foot"), 15.8, { y: 10 });

          // hard stop: the last frame holds, no exit
          window.__timelines["s05-generate"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
