<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <!-- Sound cues (seconds from scene start). Run node tools/build-sfx.mjs after editing. -->
    <script type="application/json" class="sfx-cues">[
      {"t":0.2,"sfx":"air","vol":0.2},
      {"t":0.75,"sfx":"marker","vol":0.2},
      {"t":1.7,"sfx":"tap","vol":0.24},
      {"t":2.95,"sfx":"pop","vol":0.2},
      {"t":3.15,"sfx":"pop","vol":0.2},
      {"t":3.35,"sfx":"pop","vol":0.2},
      {"t":3.85,"sfx":"paper","vol":0.14},
      {"t":4.65,"sfx":"paper","vol":0.14},
      {"t":5.4,"sfx":"paper","vol":0.14},
      {"t":7.6,"sfx":"pen","vol":0.16,"dur":0.5},
      {"t":7.65,"sfx":"pop","vol":0.2}
    ]</script>
  </head>
  <body>
    <template>
      <!-- s01 · Cold open (no title card). "How RAG works" lands as the voice says it, "in 60 seconds" pops in; then
           the three letters R · A · G drop in a column and each grows into its word as the voice says it
           (Retrieval · Augmented · Generation). On "one word at a time" the words dim back and an ink tick marks R:
           we start there. Everything stays above y 800: the avatar peeks in large below (narrator.html "title").
           Voiceover: 0.15 "Here's how rag works, in sixty seconds." 2.95 "Rag stands for retrieval-augmented
           generation." 6.7 "Let's take it one word at a time, by watching it work." -->
      <style>
        #root { position: absolute; inset: 0; }
        .s01 .hook { position: absolute; left: 90px; top: 250px; width: 860px; }
        .s01 .hook .w { display: inline-block; }
        .s01 .egg-chip { position: absolute; left: 90px; top: 392px; color: var(--ink); }
        .s01 .ac { position: absolute; left: 90px; height: 110px; display: flex; align-items: baseline; white-space: nowrap; }
        .s01 .ac .l { font: 300 112px/1 var(--f-display); letter-spacing: -0.02em; color: var(--ink); }
        .s01 .ac .r { font: 300 84px/1 var(--f-display); letter-spacing: -0.02em; color: var(--ink); display: inline-block; }
        .s01 .tick { position: absolute; left: 90px; top: 0; }
      </style>
      <div id="root" data-composition-id="s01-hook" data-width="1080" data-height="1920">
        <div class="egg-scene s01">
          <h1 class="egg-display hook"><span class="w">How</span> <span class="w"><span class="egg-hl">RAG</span></span> <span class="w">works</span></h1>
          <span class="egg-chip">In 60 seconds</span>
          <div class="ac" style="top:500px"><span class="l">R</span><span class="r">etrieval</span></div>
          <div class="ac" style="top:610px"><span class="l">A</span><span class="r">ugmented</span></div>
          <div class="ac" style="top:720px"><span class="l">G</span><span class="r">eneration</span></div>
          <svg class="egg-svg" viewBox="0 0 1080 1920" aria-hidden="true">
            <path class="ink thin under" d="M92 604 L176 604" />
          </svg>
        </div>
      </div>
      <script>
        (() => {
          const DUR = 9.5;
          const root = document.querySelector('[data-composition-id="s01-hook"] .s01');
          const q = (s) => root.querySelector(s);
          const all = (s) => [...root.querySelectorAll(s)];
          const ls = all(".ac .l"), rs = all(".ac .r"), under = q(".under");
          under.setAttribute("pathLength", "1");
          under.style.strokeDasharray = "1 1.1";
          gsap.set(under, { strokeDashoffset: 1.02 });

          const tl = gsap.timeline({ paused: true });
          // "Here's how rag works"
          Egg.fadeUp(tl, all(".hook .w"), 0.2, { y: 60, stagger: 0.12, dur: 0.6 });
          Egg.highlight(tl, q(".hook .egg-hl"), 0.75);
          // "in sixty seconds"
          Egg.pop(tl, q(".egg-chip"), 1.7);
          // "Rag stands for": the three letters drop in a column
          tl.fromTo(ls, { opacity: 0, y: -50 }, { opacity: 1, y: 0, duration: 0.45, ease: Egg.EASE.enter, stagger: 0.2 }, 2.95);
          // "retrieval-augmented generation": each letter grows into its word as it's said
          [3.85, 4.65, 5.4].forEach((t, i) => tl.fromTo(rs[i], { opacity: 0, x: -36 }, { opacity: 1, x: 0, duration: 0.45, ease: Egg.EASE.enter }, t));
          // "one word at a time": the words dim back, R is marked: we start there
          tl.to(rs, { color: "#777169", duration: 0.4, ease: "none" }, 7.3);
          tl.to(rs[0], { color: "#000000", duration: 0.4, ease: "none" }, 7.6);
          tl.to(under, { strokeDashoffset: 0, duration: 0.5, ease: Egg.EASE.draw }, 7.6);

          Egg.fadeOut(tl, [q(".hook"), q(".egg-chip"), ...all(".ac"), under], DUR - 0.35);
          window.__timelines["s01-hook"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
