  </head>
  <body>
    <template>
      <!-- s05 · Layer 2 · AI review. The fix chip gets a blue "In review" tag and its pull request window opens below (the
           diff as bars). Four Claude marks appear above it ("several agents") and on "hunt for bugs at once" each probes
           its own band of the diff in parallel; four numbered findings pin to lines. "Another group votes": the window
           folds away and the pins fly into a vote table under three voter marks; each finding gets three ballots (blue ✓ /
           gray ✕). Only the ones enough voters agree on are posted (blue ring) and tagged Important / Pre-existing; the
           style nit and the false alarm are struck and dropped. A legend shows the three tags. Agent and voter counts are
           illustrative (the article doesn't give them). Narrator: small tile bottom right (x > 750, y > 1300 stays empty).
           Voiceover: 0.18 "Layer two, in review: several agents hunt for bugs at once." 4.59 "Another group votes on each
           finding, and it's only posted if enough agree it's real." -->
      <style>
        #root { position: absolute; inset: 0; }
        .s05 .hd { top: 300px; white-space: nowrap; }
        .s05 .inr { position: absolute; left: 566px; top: 437px; }
        .s05 .agk { position: absolute; left: 90px; top: 516px; margin: 0; font: 600 28px/1.1 var(--f-t); color: var(--faint); white-space: nowrap; }
        .s05 .ag { position: absolute; top: 562px; width: 80px; height: 80px; }
        .s05 .prw { left: 90px; top: 690px; width: 860px; height: 600px; }
        .s05 .prw .bar .ttl { justify-content: flex-start; left: 214px; }
        .s05 .band { position: absolute; left: 112px; width: 816px; border-radius: 14px; background: rgba(0, 113, 227, 0.07); }
        .s05 .dl { position: absolute; left: 0; top: 0; height: 40px; display: flex; align-items: center; gap: 14px; }
        .s05 .dl b { width: 22px; font: 400 28px/1 var(--f-m); color: var(--faint); text-align: center; }
        .s05 .dl i { display: block; height: 14px; border-radius: 7px; background: var(--line); transform-origin: 0 50%; }
        .s05 .dl.del i { background: #d2d2d7; }
        .s05 .dl.add i { background: rgba(0, 113, 227, 0.35); }
        .s05 .probe { fill: none; stroke: var(--blue); stroke-width: 4; stroke-linecap: round; stroke-dasharray: 2 12; }
        .s05 .pd { fill: var(--blue); }
        .s05 .pin { position: absolute; left: 0; top: 0; width: 46px; height: 46px; border-radius: 50%; background: var(--blue); color: #fff;
          font: 700 24px/46px var(--f-d); text-align: center; box-shadow: 0 6px 16px rgba(0, 113, 227, 0.3); }
        .s05 .vk { position: absolute; left: 680px; width: 160px; top: 500px; margin: 0; text-align: center; font: 600 28px/1.1 var(--f-t); color: var(--faint); }
        .s05 .vt { position: absolute; top: 540px; width: 52px; height: 52px; }
        .s05 .fk { position: absolute; left: 90px; top: 560px; margin: 0; font: 600 28px/1.1 var(--f-t); color: var(--faint); }
        .s05 .row { left: 90px; width: 860px; height: 124px; }
        .s05 .row .rg { position: absolute; inset: 0; border-radius: 32px; box-shadow: 0 0 0 4px var(--blue), 0 0 0 12px rgba(0, 113, 227, 0.12); opacity: 0; }
        .s05 .row .tx { position: absolute; left: 88px; top: 20px; font: 600 34px/1.2 var(--f-t); letter-spacing: -0.01em; color: var(--ink); white-space: nowrap; }
        .s05 .row .sub { position: absolute; left: 88px; top: 66px; display: flex; gap: 12px; align-items: center; }
        .s05 .row .drop { font: 500 28px/1 var(--f-t); color: var(--faint); white-space: nowrap; }
        .s05 .row .st { position: absolute; left: 84px; top: 41px; height: 4px; border-radius: 2px; background: var(--ink); transform-origin: 0 50%; }
        .s05 .leg { position: absolute; left: 90px; top: 1176px; display: flex; flex-direction: column; gap: 14px; }
        .s05 .leg p { margin: 0; font: 600 28px/1.1 var(--f-t); color: var(--faint); }
        .s05 .leg div { display: flex; gap: 12px; }
      </style>
      <div id="root" data-composition-id="s05-review" data-width="1080" data-height="1920">
        <div class="a-scene s05">
          <p class="a-eyebrow">Layer 2 of 4</p>
          <span class="a-trk"><i class="on"></i><i class="on"></i><i></i><i></i></span>
          <h2 class="a-h2 hd">AI <span class="a-tint" data-layout-allow-overlap=""><span data-layout-allow-overlap="">review</span><span class="on" data-layout-allow-overlap="">review</span></span></h2>
          <span class="a-tag blue inr">In review</span>
          <div class="a-win prw">
            <div class="bar"><i></i><i></i><i></i><span class="ttl">Pull request</span></div>
          </div>
          <div class="bands"></div>
          <div class="dls"></div>
          <p class="agk">Several agents, at the same time</p>
          <span class="cc-spark ag" style="left:160px"></span>
          <span class="cc-spark ag" style="left:360px"></span>
          <span class="cc-spark ag" style="left:560px"></span>
          <span class="cc-spark ag" style="left:760px"></span>
          <svg class="a-svg probes" viewBox="0 0 1080 1920" aria-hidden="true"></svg>
          <p class="fk">Finding</p>
          <p class="vk">Votes</p>
          <span class="cc-spark vt" style="left:654px"></span>
          <span class="cc-spark vt" style="left:734px"></span>
          <span class="cc-spark vt" style="left:814px"></span>
          <div class="rows"></div>
          <div class="leg"><p>Every posted finding gets a tag</p><div><span class="a-sev imp">Important</span><span class="a-sev nit">Nit</span><span class="a-sev pre">Pre-existing</span></div></div>
          <div class="pins"></div>
          <div class="a-fix"><i class="ic" data-ic="bug" data-stroke="#fff"></i>Fix: empty config crash</div>
        </div>
      </div>
      <script>
        (() => {
          const DUR = 9.52;
          const root = document.querySelector('[data-composition-id="s05-review"] .s05');
          const q = (s) => root.querySelector(s);
          const all = (s) => [...root.querySelectorAll(s)];
          const NS = "http://www.w3.org/2000/svg";
          Apple.icons(root);
          // the diff: nine lines on a 52 px pitch from y 780, [mark, bar width]
          const DL = [["", 520], ["−", 430], ["+", 560], ["", 380], ["", 610], ["+", 470], ["", 300], ["−", 540], ["", 420]];
          const rowY = (r) => 780 + r * 52;
          q(".dls").innerHTML = DL.map(([m, w]) => `<div class="dl${m === "+" ? " add" : m ? " del" : ""}"><b>${m}</b><i style="width:${w}px"></i></div>`).join("");
          const dls = all(".dl");
          dls.forEach((d, r) => gsap.set(d, { x: 124, y: rowY(r) }));
          // each agent probes its own band of lines: agent centre x, first row, rows
          const BAND = [[200, 0, 2], [400, 2, 2], [600, 4, 2], [800, 6, 3]];
          q(".bands").innerHTML = BAND.map(([, r, n]) => `<i class="band" style="top:${rowY(r) - 6}px;height:${n * 52}px"></i>`).join("");
          BAND.forEach(([x, r, n]) => {
            const y = rowY(r) + (n * 52) / 2 - 6;
            const p = document.createElementNS(NS, "path"); p.setAttribute("class", "probe"); p.setAttribute("d", `M${x} 650 V${y}`);
            const c = document.createElementNS(NS, "circle"); c.setAttribute("class", "pd"); c.setAttribute("cx", x); c.setAttribute("cy", y); c.setAttribute("r", 9);
            q(".probes").append(p, c);
          });
          // findings: [diff row it pins to, text, votes, posted tag or drop reason]
          const F = [
            [1, "Same crash, another file", "yyy", ["imp", "Important"]],
            [3, "Rename a variable", "nyn", "dropped · style"],
            [5, "Cache never clears", "yyy", ["pre", "Pre-existing"]],
            [7, "Maybe a race condition?", "ynn", "dropped · not real"],
          ];
          const TOP = [610, 748, 886, 1024];
          const ICON = { y: '<path d="M5 12.5 L10 17.5 L19 7" />', n: '<path d="M7 7 L17 17 M17 7 L7 17" />' };
          q(".rows").innerHTML = F.map(([, t, v, s], k) => `<div class="a-card row" style="top:${TOP[k]}px"><i class="rg"></i><span class="tx">${t}</span>` +
            (typeof s === "string" ? `<i class="st" style="width:${Math.round(t.length * 17.6) + 8}px"></i><span class="sub"><span class="drop">${s}</span></span>` : `<span class="sub"><span class="a-sev ${s[0]}">${s[1]}</span></span>`) +
            [...v].map((c, j) => `<span class="a-vote ${c}" style="left:${565 + j * 80}px;top:37px"><svg viewBox="0 0 24 24">${ICON[c]}</svg></span>`).join("") + `</div>`).join("");
          q(".pins").innerHTML = F.map((_, k) => `<span class="pin">${k + 1}</span>`).join("");
          const pins = all(".pin"), rows = all(".row"), fix = q(".a-fix");
          gsap.set(fix, { x: 90, y: 430 });   // carried from s04, same frame
          gsap.set([q(".a-eyebrow"), q(".a-trk"), q(".hd"), q(".inr"), q(".prw"), q(".agk"), q(".fk"), q(".vk"), ...all(".vt"), ...rows, q(".leg"), q(".bands"), ...all(".row .a-vote, .row .sub, .row .st")], { opacity: 0 });

          const tl = gsap.timeline({ paused: true });
          Apple.rise(tl, [q(".a-eyebrow"), q(".a-trk")], 0.05, { y: 16 });
          Apple.rise(tl, q(".hd"), 0.1, { y: 24, dur: 0.8 });
          // "in review": the fix goes up as a pull request
          Apple.zoom(tl, q(".inr"), 1.08, { from: 0.7, dur: 0.5 });
          Apple.tint(tl, q(".hd .a-tint"), 1.08, { dur: 0.5 });
          Apple.rise(tl, q(".prw"), 1.1, { y: 30, dur: 0.7 });
          tl.fromTo(all(".dl i"), { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "expo.out", stagger: 0.04 }, 1.35);
          tl.fromTo(all(".dl b"), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "none" }, 1.35);
          // "several agents"
          Apple.zoom(tl, all(".ag"), 2.2, { from: 0.6, dur: 0.6, stagger: 0.12 });
          all(".ag").forEach((a, i) => tl.fromTo(a, { rotation: 0 }, { rotation: 100 + i * 15, duration: 2.3, ease: "none" }, 2.2));
          Apple.rise(tl, q(".agk"), 2.5, { y: 10, dur: 0.5 });
          // "hunt for bugs at once": every agent probes its band in parallel, findings pin to lines
          Apple.fade(tl, q(".bands"), 3.13, { dur: 0.3 });
          all(".probe").forEach((p, i) => tl.fromTo(p, { opacity: 0, attr: { d: `M${BAND[i][0]} 650 V650` } }, { opacity: 1, attr: { d: p.getAttribute("d") }, duration: 0.4, ease: "power2.inOut" }, 3.13));
          tl.fromTo(all(".pd"), { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "none" }, 3.5);
          tl.to(q(".bands"), { keyframes: { opacity: [1, 0.5, 1, 0.5, 1] }, duration: 1.0, ease: "none" }, 3.45);
          pins.forEach((p, k) => {
            gsap.set(p, { x: 858, y: rowY(F[k][0]) - 3 });
            tl.fromTo(p, { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "expo.out" }, 3.5 + k * 0.15);
          });

          // "Another group votes on each finding": the review folds away and the pins fly into a vote table
          Apple.out(tl, [...all(".ag"), q(".agk"), q(".probes"), q(".bands"), q(".dls"), q(".prw")], 4.45, { dur: 0.3 });
          Apple.rise(tl, [q(".fk"), q(".vk")], 4.65, { y: 10, dur: 0.5 });
          Apple.zoom(tl, all(".vt"), 4.7, { from: 0.6, dur: 0.5, stagger: 0.12 });
          Apple.rise(tl, rows, 4.75, { y: 24, dur: 0.6, stagger: 0.1 });
          pins.forEach((p, k) => tl.to(p, { x: 112, y: TOP[k] + 39, duration: 0.55, ease: "power3.inOut" }, 4.6 + k * 0.08));
          F.forEach((_, k) => Apple.zoom(tl, rows[k].querySelectorAll(".a-vote"), 5.3 + k * 0.3, { from: 0.5, dur: 0.4, stagger: 0.08 }));
          // "and it's only posted": the agreed ones are posted
          [0, 2].forEach((k) => Apple.fade(tl, rows[k].querySelector(".rg"), 6.68, { dur: 0.3 }));
          // "if enough agree": the others are struck and dropped
          [1, 3].forEach((k) => {
            tl.fromTo(rows[k].querySelector(".st"), { scaleX: 0, opacity: 1 }, { scaleX: 1, opacity: 1, duration: 0.35, ease: "power2.inOut" }, 7.3);
            tl.to([rows[k], pins[k]], { opacity: 0.4, duration: 0.3, ease: "none" }, 7.45);
            Apple.fade(tl, rows[k].querySelector(".sub"), 7.45, { dur: 0.3 });
          });
          // "it's real": the posted ones get their tags
          [0, 2].forEach((k, i) => Apple.zoom(tl, rows[k].querySelector(".sub"), 7.89 + i * 0.16, { from: 0.8, dur: 0.45 }));
          Apple.rise(tl, q(".leg"), 8.2, { y: 16, dur: 0.6 });

          Apple.out(tl, [q(".a-eyebrow"), q(".a-trk"), q(".hd"), q(".inr"), q(".fk"), q(".vk"), ...all(".vt"), ...rows, q(".leg")], DUR - 0.35, { dur: 0.35 });
          tl.to([...pins, fix], { opacity: 0, duration: 0.35, ease: "power2.in" }, DUR - 0.35);
          window.__timelines["s05-review"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
