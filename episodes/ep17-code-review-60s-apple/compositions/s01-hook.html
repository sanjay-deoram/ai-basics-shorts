<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <!-- Sound cues (seconds from scene start). Run node tools/build-sfx.mjs after editing. -->
    <script type="application/json" class="sfx-cues">[
      {"t":0.0,"sfx":"impact-bass-1","vol":0.2},
      {"t":0.02,"sfx":"air","vol":0.16},
      {"t":0.62,"sfx":"tap","vol":0.16},
      {"t":1.85,"sfx":"marker","vol":0.16},
      {"t":2.0,"sfx":"whoosh-short","vol":0.12},
      {"t":2.64,"sfx":"pop","vol":0.18},
      {"t":2.75,"sfx":"tick","vol":0.14},
      {"t":3.1,"sfx":"tick","vol":0.14},
      {"t":3.45,"sfx":"tick","vol":0.14},
      {"t":3.5,"sfx":"claude","vol":0.14}
    ]</script>
  </head>
  <body>
    <template>
      <!-- s01 · Cold open, keynote style. Frame 0 already reads "How the Claude Code team does code review" with the
           Claude mark after it (the thumbnail); the mark pulses on "Claude Code", "code review" tints blue as it is said.
           "In under sixty seconds": the frosted "Under 60 seconds" pill, its stopwatch hand sweeping. Under the title a
           pull request window: its diff fills in, a blue read-line moves down it, and a Claude comment pops off it.
           Everything stays above y 1000: the narrator tile sits large and centred below ("hero").
           Voiceover: 0.15 "Here's how the Claude Code team does code review, in under sixty seconds." -->
      <style>
        #root { position: absolute; inset: 0; }
        .s01 .c60 { position: absolute; left: 90px; top: 244px; }
        .s01 .c60 svg { width: 34px; height: 34px; fill: none; stroke: var(--ink); stroke-width: 3.2; stroke-linecap: round; }
        .s01 .hook { top: 330px; }
        .s01 .hook .l { display: block; white-space: nowrap; }
        .s01 .mk { display: inline-block; width: 92px; height: 92px; margin-left: 22px; vertical-align: -6px; }
        .s01 .pr { left: 90px; top: 716px; width: 860px; height: 272px; }
        .s01 .pr .bar .ttl b { font-weight: 600; color: var(--faint); }
        .s01 .rows { position: absolute; left: 0; right: 0; top: 88px; }
        .s01 .row { position: absolute; left: 0; right: 0; height: 40px; display: flex; align-items: center; gap: 22px; padding-left: 36px; }
        .s01 .row b { width: 22px; font: 400 28px/1 var(--f-m); color: var(--faint); text-align: center; }
        .s01 .row i { display: block; height: 14px; border-radius: 7px; background: var(--line); transform-origin: 0 50%; }
        .s01 .row.del i { background: #d2d2d7; }
        .s01 .row.add i { background: rgba(0, 113, 227, 0.35); }
        .s01 .scan { position: absolute; left: 0; right: 0; top: 0; height: 44px; background: rgba(0, 113, 227, 0.08); }
        .s01 .scan::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--blue); }
        .s01 .cmt { position: absolute; left: 548px; top: 868px; display: flex; align-items: center; gap: 14px; padding: 16px 22px; border-radius: 26px;
          background: var(--white); box-shadow: var(--shadow-lg); transform-origin: 0 100%; }
        .s01 .cmt .cc-spark { width: 44px; height: 44px; }
        .s01 .cmt .ln2 { display: flex; flex-direction: column; gap: 10px; }
        .s01 .cmt .ln2 i { display: block; height: 12px; border-radius: 6px; background: #c7c7cc; }
      </style>
      <div id="root" data-composition-id="s01-hook" data-width="1080" data-height="1920">
        <div class="a-scene white s01">
          <span class="a-pill a-glass c60"><svg viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="19" r="12.5" /><path class="hand" d="M17 19 V11" /><path d="M13 3.5 H21" /></svg>Under 60 seconds</span>
          <h1 class="a-h hook"><span class="l">How the Claude</span><span class="l">Code team does</span><span class="l"><span class="a-tint" data-layout-allow-overlap=""><span data-layout-allow-overlap="">code review</span><span class="on" data-layout-allow-overlap="">code review</span></span><span class="cc-spark mk"></span></span></h1>
          <div class="a-win pr">
            <div class="bar"><i></i><i></i><i></i><span class="ttl">Pull request <b>· +12 −3</b></span></div>
            <div class="rows"><span class="scan"></span></div>
          </div>
          <div class="cmt"><span class="cc-spark"></span><span class="ln2"><i style="width:170px"></i><i style="width:110px"></i></span></div>
        </div>
      </div>
      <script>
        (() => {
          const DUR = 4.3;
          const root = document.querySelector('[data-composition-id="s01-hook"] .s01');
          const q = (s) => root.querySelector(s);
          const all = (s) => [...root.querySelectorAll(s)];
          // a small diff: [gutter mark, bar width]
          const ROWS = [["", 520], ["−", 380], ["+", 610], ["+", 300]];
          q(".rows").insertAdjacentHTML("beforeend", ROWS.map(([m, w], i) => `<div class="row${m === "+" ? " add" : m ? " del" : ""}" style="top:${i * 46}px"><b>${m}</b><i style="width:${w}px"></i></div>`).join(""));
          const scan = q(".scan"), mk = q(".mk");
          gsap.set([q(".c60"), q(".pr"), q(".cmt"), scan], { opacity: 0 });

          const tl = gsap.timeline({ paused: true });
          // frame 0: the title is already there (it is the thumbnail); the Claude mark turns slowly
          tl.fromTo(q(".hook"), { y: 14 }, { y: 0, duration: 1.0, ease: "expo.out" }, 0);
          tl.fromTo(mk, { rotation: 0 }, { rotation: 60, duration: DUR, ease: "none" }, 0);
          // "the Claude Code team"
          tl.to(mk, { scale: 1.12, duration: 0.22, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0.62);
          // "does code review"
          Apple.tint(tl, q(".hook .a-tint"), 1.85, { dur: 0.5 });
          // a pull request is read, and a review comment pops off it
          Apple.rise(tl, q(".pr"), 2.0, { y: 30, dur: 0.7 });
          tl.fromTo(all(".row i"), { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "expo.out", stagger: 0.06 }, 2.15);
          tl.fromTo(scan, { y: -2, opacity: 0 }, { y: -2, opacity: 1, duration: 0.2, ease: "none" }, 2.55);
          tl.to(scan, { keyframes: [{ y: 44, duration: 0.35 }, { y: 90, duration: 0.35 }, { y: 136, duration: 0.35 }], ease: "power1.inOut" }, 2.75);
          Apple.zoom(tl, q(".cmt"), 3.5, { from: 0.6, dur: 0.5 });
          // "in under sixty seconds": the pill, its stopwatch hand sweeping
          Apple.rise(tl, q(".c60"), 2.64, { y: 16, dur: 0.6 });
          tl.fromTo(q(".c60 .hand"), { rotation: 0 }, { rotation: 360, svgOrigin: "17 19", duration: 1.5, ease: "none" }, 2.75);

          Apple.out(tl, [q(".hook"), q(".c60"), q(".pr"), q(".cmt")], DUR - 0.35, { dur: 0.35 });
          window.__timelines["s01-hook"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
