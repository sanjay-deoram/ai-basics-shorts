<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <script type="application/json" class="sfx-cues">[
      {"t":0.42,"sfx":"pop","vol":0.2},
      {"t":0.62,"sfx":"pop","vol":0.2},
      {"t":0.82,"sfx":"pop","vol":0.2},
      {"t":2.05,"sfx":"tick","vol":0.16},
      {"t":2.6,"sfx":"pop","vol":0.2},
      {"t":3.55,"sfx":"zoom","vol":0.26},
      {"t":3.95,"sfx":"click","vol":0.3},
      {"t":4.25,"sfx":"success","vol":0.2},
      {"t":4.53,"sfx":"whip","vol":0.32}
    ]</script>
  </head>
  <body>
    <template>
      <!-- s04 · The example. Peach: three pull request descriptions land in a messy pile ("fixed stuff", a wall of
           text, loose bullets); on "the same way" they snap into a straight column, each the same What / Why /
           Changes shape. Headline: "PR descriptions, the same way, every time." -->
      <style>
        #s04-root .bg { background-color: #ffe2cc; }
        #s04-root .rl-hd { --acc: #d9480f; }
        #s04-root .pr { position: absolute; left: 90px; top: 0; width: 860px; height: 186px; border-radius: 28px; background: #fff; padding: 20px 28px; box-shadow: 0 16px 30px -16px rgba(0, 0, 0, 0.35); }
        #s04-root .pr .hd { display: flex; gap: 16px; align-items: baseline; white-space: nowrap; }
        #s04-root .pr .no { font: 400 28px/1 var(--f-mono); color: #a39e95; }
        #s04-root .pr .nm { font: 600 34px/1 var(--f-display); letter-spacing: -0.02em; color: #0d0d0c; }
        #s04-root .pr .lay { position: absolute; left: 28px; right: 28px; top: 70px; bottom: 18px; }
        #s04-root .pr .messy { font: 400 28px/36px var(--f-body); color: #44403b; }
        #s04-root .pr .messy p { margin: 0; }
        #s04-root .pr .neat { display: flex; gap: 24px; opacity: 0; }
        #s04-root .pr .neat div { flex: 1; }
        #s04-root .pr .neat b { display: block; font: 400 28px/34px var(--f-mono); color: #d9480f; font-weight: 400; margin-bottom: 12px; }
        #s04-root .pr .neat i { display: block; height: 12px; border-radius: 6px; background: #0d0d0c22; margin-bottom: 12px; }
      </style>
      <div id="s04-root" data-composition-id="s04-example" data-width="1080" data-height="1920">
        <div class="rl">
          <div class="rl-cam">
            <div class="rl-bg grid bg"></div>
            <div class="rl-eye">// the example</div>
            <div class="rl-hd">
              <span class="ln"><span class="w">PR </span><span class="w">descriptions,</span></span>
              <span class="ln"><span class="w">the </span><span class="w">same </span><span class="w">way,</span></span>
              <span class="ln"><span class="w">every </span><em class="w">time.</em></span>
            </div>
            <div class="pr p1" data-layout-allow-overlap="">
              <div class="hd"><span class="no">#412</span><span class="nm">Password reset expiry</span></div>
              <div class="lay messy"><p>fixed stuff</p></div>
              <div class="lay neat"><div><b>WHAT</b><i style="width:90%"></i><i style="width:60%"></i></div><div><b>WHY</b><i style="width:80%"></i><i style="width:70%"></i></div><div><b>CHANGES</b><i style="width:95%"></i><i style="width:50%"></i></div></div>
            </div>
            <div class="pr p2" data-layout-allow-overlap="">
              <div class="hd"><span class="no">#413</span><span class="nm">New invoice page</span></div>
              <div class="lay messy"><p>So this PR is about the invoice page which I changed because the old one was confusing and also I moved some…</p></div>
              <div class="lay neat"><div><b>WHAT</b><i style="width:70%"></i><i style="width:85%"></i></div><div><b>WHY</b><i style="width:95%"></i><i style="width:55%"></i></div><div><b>CHANGES</b><i style="width:75%"></i><i style="width:65%"></i></div></div>
            </div>
            <div class="pr p3" data-layout-allow-overlap="">
              <div class="hd"><span class="no">#414</span><span class="nm">Faster search</span></div>
              <div class="lay messy"><p>- search</p><p>- misc</p></div>
              <div class="lay neat"><div><b>WHAT</b><i style="width:65%"></i><i style="width:90%"></i></div><div><b>WHY</b><i style="width:75%"></i><i style="width:60%"></i></div><div><b>CHANGES</b><i style="width:85%"></i><i style="width:70%"></i></div></div>
            </div>
          </div>
        </div>
      </div>
      <script>
        (() => {
          const root = document.getElementById("s04-root");
          const cam = root.querySelector(".rl-cam");
          const tl = gsap.timeline({ paused: true });
          const blur = Reel.blurFor(cam, "s04-mb");
          Reel.whip(tl, cam, blur, 0, "in");

          // "Say you want Claude to write …": three descriptions land in a pile, each written a different way
          const prs = [...root.querySelectorAll(".pr")];
          const PILE = [[-24, 700, -6], [36, 790, 5], [-8, 900, -3]], COL = [640, 842, 1044];
          prs.forEach((c, i) => tl.fromTo(c, { opacity: 0, x: PILE[i][0], y: PILE[i][1] + 160, rotation: 0, scale: 0.8 },
            { opacity: 1, x: PILE[i][0], y: PILE[i][1], rotation: PILE[i][2], scale: 1, duration: 0.45, ease: "back.out(1.6)" }, 0.42 + i * 0.2));
          // "your pull request descriptions, the same way every time"
          Reel.words(tl, root.querySelector(".rl-hd"), [2.05, 2.6, 3.39, 3.55, 3.8, 4.0, 4.25]);
          // "the same way": they straighten into a column and take the same shape
          prs.forEach((c, i) => {
            tl.to(c, { x: 0, y: COL[i], rotation: 0, duration: 0.45, ease: "power3.inOut" }, 3.55 + i * 0.06);
            tl.to(c.querySelector(".messy"), { opacity: 0, duration: 0.15, ease: "none" }, 3.75 + i * 0.06);
            tl.fromTo(c.querySelector(".neat"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out" }, 3.9 + i * 0.06);
          });
          tl.to(prs, { scale: 1.03, duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1, stagger: 0.06 }, 4.25);
          Reel.whip(tl, cam, blur, 4.55, "out");

          window.__timelines["s04-example"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
