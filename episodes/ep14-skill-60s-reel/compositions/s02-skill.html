<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <script type="application/json" class="sfx-cues">[
      {"t":0.4,"sfx":"tick","vol":0.16},
      {"t":0.9,"sfx":"pop","vol":0.22},
      {"t":1.2,"sfx":"pop","vol":0.2},
      {"t":1.3,"sfx":"typing","vol":0.22,"dur":1.0},
      {"t":2.02,"sfx":"pop","vol":0.22},
      {"t":3.72,"sfx":"pop","vol":0.22},
      {"t":4.55,"sfx":"chime","vol":0.16},
      {"t":5.03,"sfx":"whip","vol":0.32}
    ]</script>
  </head>
  <body>
    <template>
      <!-- s02 · What a skill is. Full blue: "A skill is a set of instructions." word by word; a SKILL.md card drops in
           and its template types itself (frontmatter, then an instruction); the Claude logo lands on it on "Claude";
           on "when your request needs it" a request pill arrives, a dotted line joins it to the card, the card lights. -->
      <style>
        #s02-root .bg { background: #2d4bff; }
        #s02-root .rl-eye { color: #dfe5ff; }
        #s02-root .rl-hd { --acc: #ffd84d; color: #fff; }
        #s02-root .card { position: absolute; left: 90px; top: 660px; width: 860px; height: 420px; border-radius: 34px; background: #fdfcfc; box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.4); }
        #s02-root .card .top { position: absolute; left: 34px; right: 34px; top: 26px; height: 60px; display: flex; align-items: center; font: 400 30px/1 var(--f-mono); color: #5f5b55; }
        #s02-root .card .top img { position: absolute; right: 0; top: 2px; width: 58px; height: 58px; }
        #s02-root .card .md { position: absolute; left: 34px; right: 34px; top: 112px; font: 400 32px/52px var(--f-mono); color: #0d0d0c; }
        #s02-root .card .md p { white-space: pre; margin: 0; }
        #s02-root .card .md .k { color: #2d4bff; }
        #s02-root .card .md .d { color: #a39e95; }
        #s02-root .glow { position: absolute; left: 78px; top: 648px; width: 884px; height: 444px; border-radius: 44px; border: 8px solid #ffd84d; }
        #s02-root .req { position: absolute; right: 130px; top: 1170px; height: 92px; padding: 0 34px; border-radius: 46px; background: #0d0d0c; display: flex; align-items: center; gap: 16px;
          font: 400 32px/1 var(--f-mono); color: #fdfcfc; white-space: nowrap; }
        #s02-root .req b { color: #d97757; font-weight: 400; }
        #s02-root .link { position: absolute; left: 760px; top: 1084px; width: 0; height: 84px; border-left: 6px dotted #ffd84d; }
      </style>
      <div id="s02-root" data-composition-id="s02-skill" data-width="1080" data-height="1920">
        <div class="rl">
          <div class="rl-cam">
            <div class="rl-bg bg"></div>
            <div class="rl-eye">// what's a skill?</div>
            <div class="rl-hd">
              <span class="ln"><span class="w">A </span><span class="w">skill </span><span class="w">is </span><span class="w">a </span><span class="w">set </span><span class="w">of</span></span>
              <span class="ln"><em class="w">instructions.</em></span>
            </div>
            <div class="glow"></div>
            <div class="card">
              <div class="top">SKILL.md<img src="assets/claude-logo.svg" alt=""></div>
              <div class="md">
                <p class="d">---</p>
                <p><span class="k">name:</span> pr-description</p>
                <p><span class="k">description:</span> Use when…</p>
                <p class="d">---</p>
                <p>1. Run git diff…</p>
              </div>
            </div>
            <div class="link"></div>
            <div class="req"><b>&gt;</b>Write a PR description</div>
          </div>
        </div>
      </div>
      <script>
        (() => {
          const root = document.getElementById("s02-root");
          const cam = root.querySelector(".rl-cam");
          const q = (s) => root.querySelector(s);
          const tl = gsap.timeline({ paused: true });
          const blur = Reel.blurFor(cam, "s02-mb");
          Reel.whip(tl, cam, blur, 0, "in");

          // "A skill is a set of instructions"
          Reel.words(tl, q(".rl-hd"), [0.4, 0.5, 0.65, 0.8, 0.9, 1.05, 1.2]);
          const card = q(".card"), logo = q(".card .top img");
          tl.fromTo(card, { opacity: 0, y: 90, rotation: -3 }, { opacity: 1, y: 0, rotation: 0, duration: 0.5, ease: "back.out(1.6)" }, 0.9);
          [...root.querySelectorAll(".md p")].reduce((t, p) => Egg.typeOn(tl, p, t, { cps: 70 }) + 0.04, 1.3);
          // "Claude": the logo lands on the card
          tl.fromTo(logo, { opacity: 0, scale: 0.3, rotation: -120 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.6, ease: "back.out(1.8)" }, 2.02);
          // "picks up on its own": the card breathes
          tl.to(card, { y: -10, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 1 }, 2.4);
          // "when your request needs it": a request arrives, joins the card, the card lights up
          tl.fromTo(q(".req"), { opacity: 0, x: 120 }, { opacity: 1, x: 0, duration: 0.4, ease: "back.out(1.8)" }, 3.72);
          tl.fromTo(q(".link"), { opacity: 0, scaleY: 0 }, { opacity: 1, scaleY: 1, transformOrigin: "50% 100%", duration: 0.3, ease: "power2.out" }, 4.2);
          tl.fromTo(q(".glow"), { opacity: 0, scale: 0.97 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out" }, 4.55);
          tl.to(card, { scale: 1.03, duration: 0.18, ease: "power2.out", yoyo: true, repeat: 1 }, 4.55);
          tl.to(logo, { rotation: 180, duration: 0.8, ease: "power2.inOut" }, 4.55);
          Reel.whip(tl, cam, blur, 5.05, "out");

          window.__timelines["s02-skill"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
