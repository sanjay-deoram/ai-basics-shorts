      <script>
        (() => {
          const root = document.getElementById("s06-root");
          const cam = root.querySelector(".rl-cam");
          const q = (s) => root.querySelector(s);
          const tl = gsap.timeline({ paused: true });
          const blur = Reel.blurFor(cam, "s06-mb");
          Reel.whip(tl, cam, blur, 0, "in");

          // "Step two: inside it, add one file"
          Reel.words(tl, q(".rl-hd"), [0.46, 0.79, 2.54, 2.8, 3.17]);
          tl.fromTo(q(".path"), { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.35, ease: "back.out(2)" }, 1.6);

          tl.fromTo(q(".file"), { opacity: 0, y: -160, rotation: -8 }, { opacity: 1, y: 0, rotation: 0, duration: 0.45, ease: "back.out(1.4)" }, 2.95);
          // "skill dot M D": the name, as it's spelled
          [[".n1", 3.95], [".n2", 4.15], [".n3", 4.63], [".n4", 4.97]].forEach(([s, t]) =>
            tl.fromTo(q(s), { opacity: 0, y: 30, scale: 1.4 }, { opacity: 1, y: 0, scale: 1, duration: 0.3, ease: "back.out(2.4)" }, t));
          tl.fromTo(q(".bars"), { opacity: 0 }, { opacity: 1, duration: 0.3 }, 3.3);
          tl.fromTo(q(".note"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 5.25);
          Reel.whip(tl, cam, blur, 5.65, "out");

          window.__timelines["s06-file"] = tl;
