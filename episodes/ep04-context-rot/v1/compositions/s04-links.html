<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <!-- Sound cues (seconds from scene start). Run node tools/build-sfx.mjs after editing. -->
    <script type="application/json" class="sfx-cues">[
      {"t":0.1,"sfx":"click","vol":0.24},
      {"t":3.0,"sfx":"pop","vol":0.2},
      {"t":3.5,"sfx":"click-soft","vol":0.18},
      {"t":4.3,"sfx":"pop","vol":0.2},
      {"t":4.6,"sfx":"click-soft","vol":0.18},
      {"t":7.7,"sfx":"whoosh","vol":0.22},
      {"t":8.7,"sfx":"pop","vol":0.26}
    ]</script>
  </head>
  <body>
    <template>
      <!-- s04 · Why, step 1: each token looks back at every token before it. Dots are tokens; every pair gets a link: 4 tokens →
           6 links, 8 → 28 (n(n−1)/2). Then a dense ring of 40 dots (780 links) stands for a long context, and the counter
           reads 1,000,000 tokens → ≈ 500 billion links (499,999,500,000). Source: Anthropic Engineering, Effective context
           engineering (29 Sep 2025): the transformer "enables every token to attend to every other token across the entire
           context. This results in n² pairwise relationships for n tokens." The avatar sits in the small top-right corner. -->
      <style>
        #root { position: absolute; inset: 0; }
        .s04 .trk { position: absolute; left: 90px; top: 228px; display: flex; align-items: center; gap: 14px; }
        .s04 .trk .egg-eyebrow { margin-right: 10px; }
        .s04 .trk i { width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid var(--ink); }
        .s04 .trk i.on { background: var(--ink); }
        .s04 .ttl { position: absolute; left: 90px; right: 240px; top: 290px; margin: 0; font: 300 64px/1.1 var(--f-display); letter-spacing: -0.02em; color: var(--ink); text-wrap: balance; }
        .s04 .net { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
        .s04 .net circle { fill: var(--eggshell); stroke: var(--ink); stroke-width: 5; }
        .s04 .net .ln { fill: none; stroke: var(--ink); stroke-width: 3.5; stroke-linecap: round; }
        .s04 .net .dense .ln { stroke-width: 1.3; stroke-opacity: 0.55; }
        .s04 .net .dense circle { stroke-width: 3; }
        .s04 .lab { position: absolute; top: 880px; width: 320px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
        .s04 .lab b { font: 300 56px/1 var(--f-display); letter-spacing: -0.02em; color: var(--ink); }
        .s04 .lab span { font: 400 26px/1 var(--f-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--graphite); }
        .s04 .big { position: absolute; left: 90px; right: 130px; top: 990px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
        .s04 .big .a { font: 300 56px/1.1 var(--f-display); letter-spacing: -0.02em; color: var(--graphite); }
        .s04 .big .b { font: 300 84px/1.05 var(--f-display); letter-spacing: -0.02em; color: var(--ink); }
      </style>
      <div id="root" data-composition-id="s04-links" data-width="1080" data-height="1920">
        <div class="egg-scene s04">
          <div class="trk"><span class="egg-eyebrow">Why it happens</span><i class="on"></i><i></i><i></i><i></i></div>
          <h2 class="ttl">Each token looks back at every token before it</h2>
          <svg class="net" viewBox="0 0 1080 1920" aria-hidden="true"><g class="ga"></g><g class="gb"></g><g class="dense"></g></svg>
          <div class="lab la" style="left:140px"><b>6 links</b><span>4 tokens</span></div>
          <div class="lab lb" style="left:600px"><b>28 links</b><span>8 tokens</span></div>
          <div class="big"><span class="a">1,000,000 tokens</span><span class="b">≈ 500 billion links</span></div>
        </div>
      </div>
      <script>
        (() => {
          const DUR = 11.0;
          const root = document.querySelector('[data-composition-id="s04-links"] .s04');
          const q = (s) => root.querySelector(s);
          const NS = "http://www.w3.org/2000/svg";
          // a ring of n dots with a link between every pair; links first so the dots sit on top
          const ring = (g, n, cx, cy, r, dotR) => {
            const pts = [...Array(n)].map((_, i) => { const a = -Math.PI / 2 + (i * 2 * Math.PI) / n; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; });
            const lines = [];
            for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) {
              const p = document.createElementNS(NS, "path");
              p.setAttribute("class", "ln");
              p.setAttribute("d", `M${pts[i][0].toFixed(1)} ${pts[i][1].toFixed(1)} L${pts[j][0].toFixed(1)} ${pts[j][1].toFixed(1)}`);
              p.setAttribute("pathLength", "1");
              p.style.strokeDasharray = "1 1.1";
              g.appendChild(p); lines.push(p);
            }
            const dots = pts.map(([x, y]) => { const c = document.createElementNS(NS, "circle"); c.setAttribute("cx", x.toFixed(1)); c.setAttribute("cy", y.toFixed(1)); c.setAttribute("r", dotR); g.appendChild(c); return c; });
            return { lines, dots };
          };
          const A = ring(q(".ga"), 4, 300, 700, 130, 18);
          const B = ring(q(".gb"), 8, 760, 700, 150, 16);
          const D = ring(q(".dense"), 40, 540, 690, 250, 9);
          [...A.dots, ...B.dots, ...D.dots].forEach((c) => gsap.set(c, { transformOrigin: "50% 50%" }));

          const tl = gsap.timeline({ paused: true });
          Egg.fadeUp(tl, q(".trk"), 0.05);
          Egg.fadeUp(tl, q(".ttl"), 2.8);
          const links = (L, at, gap) => tl.fromTo(L, { strokeDashoffset: 1.02 }, { strokeDashoffset: 0, duration: 0.35, ease: Egg.EASE.draw, stagger: gap }, at);
          // 4 tokens, 6 links
          Egg.pop(tl, A.dots, 3.0, { stagger: 0.08, dur: 0.4 });
          links(A.lines, 3.5, 0.12);
          // 8 tokens, 28 links
          Egg.pop(tl, B.dots, 4.3, { stagger: 0.05, dur: 0.4 });
          links(B.lines, 4.6, 0.035);
          Egg.fadeUp(tl, q(".la").children, 5.8, { y: 14, stagger: 0.1 });
          Egg.fadeUp(tl, q(".lb").children, 6.6, { y: 14, stagger: 0.1 });

          // a long context: the links explode
          Egg.fadeOut(tl, [q(".ga"), q(".gb"), q(".la"), q(".lb")], 7.4);
          Egg.pop(tl, D.dots, 7.7, { stagger: 0.012, dur: 0.35 });
          links(D.lines, 7.9, 0.0016);
          Egg.fadeUp(tl, q(".big .a"), 7.9, { y: 16 });
          Egg.pop(tl, q(".big .b"), 8.7);

          Egg.fadeOut(tl, [q(".net"), q(".big"), q(".ttl"), q(".trk")], DUR - 0.35);
          window.__timelines["s04-links"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
