<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <!-- Sound cues (seconds from scene start). Run node tools/build-sfx.mjs after editing. -->
    <script type="application/json" class="sfx-cues">[
      {"t":0.2,"sfx":"swell","vol":0.08},
      {"t":0.4,"sfx":"n1","vol":0.18},
      {"t":2.35,"sfx":"n3","vol":0.18},
      {"t":3.8,"sfx":"n4","vol":0.18},
      {"t":4.5,"sfx":"glass","vol":0.1},
      {"t":5.35,"sfx":"swell","vol":0.1},
      {"t":5.85,"sfx":"key","vol":0.14},
      {"t":6.65,"sfx":"keys","vol":0.14,"dur":0.5},
      {"t":7.5,"sfx":"keys","vol":0.14,"dur":1.3},
      {"t":7.6,"sfx":"n3","vol":0.16},
      {"t":10.2,"sfx":"n4","vol":0.16},
      {"t":12.25,"sfx":"keys","vol":0.14,"dur":0.8},
      {"t":13.4,"sfx":"keys","vol":0.14,"dur":0.7},
      {"t":14.77,"sfx":"n3","vol":0.18},
      {"t":15.24,"sfx":"n4","vol":0.18},
      {"t":15.82,"sfx":"n6","vol":0.18}
    ]</script>
  </head>
  <body>
    <template>
      <!-- s04 · Step 2 · SKILL.md. The folder path as a pill, then one file tile comes into focus under it and is
           named SKILL.md ("exactly that name"). The tile grows into a light editor card: the frontmatter fences, the
           name and the description type in with a lilac band on each ("Name + when to use it"), then the instructions
           below with a mint band: git diff, then the three sections What / Why / Changes, each typed as it's said.
           The skill text follows the Claude Academy lesson. Avatar: small tile, bottom centre.
           Voiceover: 0.2 "Step two: inside it, add one file: skill dot M D." 5.75 "At the top, a name, and a description
           of when to use it." 9.2 "Below that, the instructions, in plain English: run git diff, then write three
           sections. What, why, and changes." -->
      <style>
        #root { position: absolute; inset: 0; }
        .s04 .lbl { top: 216px; }
        .s04 .ttl { top: 296px; }
        .s04 .path { top: 424px; }
        .s04 .path .pill { font: 400 28px/1 var(--f-mono); color: var(--s-ink); }
        .s04 .file { left: 410px; top: 560px; width: 260px; height: 320px; border-radius: 36px; display: flex; align-items: center; justify-content: center; }
        .s04 .file .logo { width: 96px; height: 96px; }
        .s04 .fname { top: 926px; font: 400 64px/1.1 var(--f-mono); letter-spacing: -0.02em; }
        .s04 .ffoot { top: 1022px; }
        .s04 .ed { left: 110px; top: 520px; width: 860px; height: 620px; }
        .s04 .ed .bar .logo { width: 30px; height: 30px; margin-left: 10px; }
        .s04 .ed .bar .ttl-t { font: 400 28px/1 var(--f-mono); color: var(--s-ink); }
        .s04 .body { position: relative; padding: 24px 0; }
        .s04 .ln { position: relative; height: 50px; display: flex; padding: 0 34px 0 0; }
        .s04 .ln .band { position: absolute; left: 14px; right: 14px; top: 0; bottom: 0; }
        .s04 .ln.fm .band { background: rgba(200, 175, 255, 0.34); }
        .s04 .ln.ins .band { background: rgba(150, 230, 200, 0.42); }
        .s04 .ln .no { position: relative; width: 84px; padding-right: 26px; text-align: right; color: var(--s-faint); }
        .s04 .ln .tx { position: relative; }
        .s04 .l1, .s04 .l2 { top: 1178px; }
      </style>
      <div id="root" data-composition-id="s04-skillmd" data-width="1080" data-height="1920">
        <div class="soft s04">
          <div class="stage">
            <div class="pill-row lbl"><span class="pill">Step 2</span></div>
            <h2 class="h ttl">Add one file</h2>
            <div class="pill-row path"><span class="pill">~/.claude/skills/pr-description/</span></div>
            <div class="glass file"><div class="logo"></div></div>
            <p class="cap fname">SKILL.md</p>
            <p class="note ffoot">Exactly that name, in capitals</p>
            <div class="glass ed">
              <div class="bar"><i></i><i></i><i></i><div class="logo"></div><span class="ttl-t">SKILL.md</span></div>
              <div class="body code">
                <div class="ln fm"><div class="band"></div><span class="no">1</span><span class="tx"><span class="t-p">---</span></span></div>
                <div class="ln fm"><div class="band"></div><span class="no">2</span><span class="tx"><span class="t-k">name</span><span class="t-p">:</span> <span class="t-s">pr-description</span></span></div>
                <div class="ln fm"><div class="band"></div><span class="no">3</span><span class="tx"><span class="t-k">description</span><span class="t-p">:</span> <span class="t-s">Writes PR descriptions.</span></span></div>
                <div class="ln fm"><div class="band"></div><span class="no">4</span><span class="tx"><span class="t-s">  Use when the user asks for a PR.</span></span></div>
                <div class="ln fm"><div class="band"></div><span class="no">5</span><span class="tx"><span class="t-p">---</span></span></div>
                <div class="ln ins"><div class="band"></div><span class="no">6</span><span class="tx"><span class="t-p">1.</span> Run <span class="t-fn">git diff main...HEAD</span></span></div>
                <div class="ln ins"><div class="band"></div><span class="no">7</span><span class="tx"><span class="t-p">2.</span> Write three sections:</span></div>
                <div class="ln ins"><div class="band"></div><span class="no">8</span><span class="tx">   <span class="t-h">## What</span><span class="t-c">: one sentence</span></span></div>
                <div class="ln ins"><div class="band"></div><span class="no">9</span><span class="tx">   <span class="t-h">## Why</span><span class="t-c">: brief context</span></span></div>
                <div class="ln ins"><div class="band"></div><span class="no">10</span><span class="tx">   <span class="t-h">## Changes</span><span class="t-c">: bullets</span></span></div>
              </div>
            </div>
            <p class="cap l1">Name + when to use it</p>
            <p class="cap l2">Instructions, in plain English</p>
          </div>
        </div>
      </div>
      <script>
        (() => {
          const DUR = 16.8;
          const root = document.querySelector('[data-composition-id="s04-skillmd"] .s04');
          const q = (s) => root.querySelector(s);
          const all = (s) => [...root.querySelectorAll(s)];
          const ed = q(".ed"), file = q(".file"), lns = all(".ed .ln"), bands = all(".ed .band");
          gsap.set([...bands, ...all(".ed .no")], { opacity: 0 });

          const tl = gsap.timeline({ paused: true });
          const type = (i, at, cps = 40) => {
            tl.to(lns[i].querySelector(".no"), { opacity: 1, duration: 0.2, ease: "none" }, at);
            return Egg.typeOn(tl, lns[i].querySelector(".tx"), at, { cps });
          };
          // the soft band sits on the lines being talked about; [] clears it
          const band = (on, at) => bands.forEach((b, i) => tl.to(b, { opacity: on.includes(i) ? 1 : 0, duration: 0.35, ease: "sine.inOut" }, at));

          Soft.push(tl, q(".stage"), DUR);
          // "Step two: inside it"
          Soft.rise(tl, q(".lbl"), 0.15, { y: 14, dur: 0.6 });
          Soft.words(tl, q(".ttl"), 0.3);
          Soft.rise(tl, q(".path"), 0.6, { y: 14, dur: 0.7 });
          // "add one file"
          Soft.rise(tl, file, 2.3, { y: -40, scale: 0.9, dur: 0.9 });
          // "skill dot M D"
          Soft.rise(tl, q(".fname"), 3.8, { y: 20, dur: 0.7 });
          Soft.rise(tl, q(".ffoot"), 4.15, { y: 12, dur: 0.6 });

          // the file grows into the editor (same centre line, one dissolving into the other)
          Soft.melt(tl, [q(".fname"), q(".ffoot")], 5.3, { dur: 0.35 });
          tl.to(file, { scale: 2.6, y: 110, opacity: 0, filter: "blur(10px)", duration: 0.7, ease: Soft.INOUT }, 5.35);
          tl.fromTo(ed, { opacity: 0, scale: 0.4, y: -110, filter: "blur(10px)" }, { opacity: 1, scale: 1, y: 0, filter: "blur(0px)", duration: 0.7, ease: Soft.INOUT }, 5.35);
          // "At the top": the frontmatter fences
          type(0, 5.95, 30); type(4, 6.05, 30);
          // "a name"
          type(1, 6.65, 36);
          band([1], 6.7);
          // "and a description of when to use it"
          type(2, 7.5, 40); type(3, 8.15, 48);
          band([2, 3], 7.6);
          Soft.rise(tl, q(".l1"), 7.6, { y: 14, dur: 0.6 });

          // "Below that, the instructions, in plain English"
          band([], 9.3);
          Soft.melt(tl, q(".l1"), 9.9, { dur: 0.3, scale: 1 });
          Soft.rise(tl, q(".l2"), 10.2, { y: 14, dur: 0.6 });
          // "run git diff"
          type(5, 12.25, 30);
          band([5], 12.3);
          // "then write three sections"
          type(6, 13.4, 34);
          band([6], 13.45);
          // "What, why, and changes"
          [[7, 14.77], [8, 15.24], [9, 15.82]].forEach(([i, t]) => { type(i, t, 60); band([i], t); });
          band([], 16.25);

          Soft.melt(tl, [q(".lbl"), q(".ttl"), q(".path"), ed, q(".l2")], DUR - 0.3, { dur: 0.3 });
          window.__timelines["s04-skillmd"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
