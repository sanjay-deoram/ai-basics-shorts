<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <script type="application/json" class="sfx-cues">[
      {"t":0.15,"sfx":"air","vol":0.14},
      {"t":0.5,"sfx":"typing","vol":0.12,"dur":1.6},
      {"t":1.3,"sfx":"tap","vol":0.12},
      {"t":3.0,"sfx":"pop","vol":0.18},
      {"t":4.6,"sfx":"impact-bass-1","vol":0.1}
    ]</script>
  </head>
  <body>
    <template>
      <!-- s07 · 3 · The nudge. A person types the request into a chat box; right next to it a nudge pops: "You probably
           don't want to do that."; the upload card is stamped Stopped. Label: as close as possible to the person typing.
           Voiceover: 0.17 "It steps in, close to the person typing, with a nudge like, you probably don't want to do that." -->
      <style>
        #root { position: absolute; inset: 0; }
        .s07 .hd { top: 316px; }
        .s07 .hd .l { display: block; white-space: nowrap; }
        .s07 .cb { left: 90px; top: 560px; width: 860px; height: 200px; }
        .s07 .cb .who { position: absolute; left: 34px; top: 86px; font: 600 28px/1 var(--f-t); color: var(--mu); }
        .s07 .cb p { position: absolute; left: 34px; right: 34px; top: 126px; margin: 0; font: 500 34px/1.2 var(--f-t); color: var(--ink); white-space: nowrap; }
        .s07 .nb { left: 90px; top: 800px; width: 860px; height: 170px; border-radius: 34px 34px 34px 8px; }
        .s07 .nb .k { position: absolute; left: 34px; top: 28px; font: 400 28px/1 var(--f-m); color: var(--blue); }
        .s07 .nb p { position: absolute; left: 34px; top: 78px; margin: 0; font: 700 40px/1.1 var(--f-d); letter-spacing: -0.02em; color: var(--ink); white-space: nowrap; }
        .s07 .stp { right: 120px; top: 1010px; }
        .s07 .lb { left: 90px; top: 1130px; }
      </style>
      <div id="root" data-composition-id="s07-nudge" data-width="1080" data-height="1920">
        <div class="a-scene s07">
          <p class="a-eyebrow">3 · The nudge</p>
          <h2 class="a-h2 hd"><span class="l">It steps in, right</span><span class="l">where you <span class="a-tint" data-layout-allow-overlap=""><span data-layout-allow-overlap="">type</span><span class="on" data-layout-allow-overlap="">type</span></span></span></h2>
          <div class="a-win cb"><div class="bar"><i></i><i></i><i></i><span class="ttl">Agent chat</span></div>
            <span class="who">You</span><p><span class="ty">Upload customers.csv to unknown-site.example</span></p>
          </div>
          <div class="a-card nb"><span class="k">ADR</span><p>"You probably don't want to do that."</p></div>
          <span class="a-stamp red stp">Upload stopped</span>
          <p class="a-lab lb">As close as possible to the person typing.</p>
        </div>
      </div>
      <script>
        (() => {
          const DUR = 5.53;
          const root = document.querySelector('[data-composition-id="s07-nudge"] .s07');
          const q = (s) => root.querySelector(s);
          gsap.set([q(".cb"), q(".nb"), q(".stp"), q(".lb")], { opacity: 0 });
          const tl = gsap.timeline({ paused: true });
          Apple.rise(tl, q(".a-eyebrow"), 0.12, { y: 16 });
          Apple.rise(tl, q(".hd"), 0.2, { y: 24, dur: 0.7 });
          Apple.rise(tl, q(".cb"), 0.35, { y: 30, dur: 0.5 });
          Egg.typeOn(tl, q(".ty"), 0.5, { cps: 30 });
          // "close to the person typing"
          Apple.tint(tl, q(".hd .a-tint"), 2.2, { dur: 0.4 });
          Apple.fade(tl, q(".lb"), 1.4, { dur: 0.4 });
          // "with a nudge like, you probably don't want to do that"
          tl.fromTo(q(".nb"), { opacity: 0, scale: 0.7, transformOrigin: "0% 100%" }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.6)" }, 3.0);
          Egg.stamp(tl, q(".stp"), 4.6);
          Apple.out(tl, root.querySelectorAll(".a-eyebrow, .hd, .cb, .nb, .stp, .lb"), DUR - 0.28, { dur: 0.28 });
          window.__timelines["s07-nudge"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
