<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <script type="application/json" class="sfx-cues">[
      {"t":0.0,"sfx":"impact-bass-1","vol":0.2},
      {"t":0.02,"sfx":"air","vol":0.18},
      {"t":1.3,"sfx":"marker","vol":0.16},
      {"t":1.6,"sfx":"whoosh-short","vol":0.1},
      {"t":2.75,"sfx":"tick","vol":0.2},
      {"t":3.1,"sfx":"claude","vol":0.12}
    ]</script>
  </head>
  <body>
    <template>
      <!-- s01 · Cold open. Frame 0 is the whole title, "How Claude Code runs in the cloud", and big under it "in under 60
           seconds" (nothing builds in). "cloud" tints; three job cards float from a laptop up into a cloud with the Claude
           mark. All above y 1100 (hero avatar below).
           Voiceover: 0.10 "Here's how Claude Code runs in the cloud, in under sixty seconds." -->
      <style>
        #root { position: absolute; inset: 0; }
        .s01 .hook { top: 236px; font-size: 104px; }
        .s01 .hook .l { display: block; white-space: nowrap; }
        .s01 .c60 { position: absolute; left: 90px; top: 580px; margin: 0; }
        .s01 .c60 .k { display: flex; align-items: center; gap: 12px; margin: 0; font: 600 44px/1 var(--f-t); letter-spacing: -0.01em; color: var(--mu); }
        .s01 .c60 svg { width: 44px; height: 44px; fill: none; stroke: var(--blue); stroke-width: 3.2; stroke-linecap: round; }
        .s01 .c60 .big { display: flex; align-items: baseline; gap: 36px; margin: 4px 0 0; white-space: nowrap; }
        .s01 .c60 .num { display: inline-block; font: 800 240px/0.86 var(--f-d); letter-spacing: -0.06em; color: var(--blue); }
        .s01 .c60 .u { font: 700 104px/1 var(--f-d); letter-spacing: -0.045em; color: var(--ink); }
        .s01 .cd { position: absolute; width: 150px; height: 70px; border-radius: 16px; background: var(--white); box-shadow: var(--shadow); display: flex; align-items: center; justify-content: center; font: 400 28px/1 var(--f-m); color: var(--ink); }
        .s01 .cl .cc-spark { position: absolute; left: 768px; top: 880px; width: 64px; height: 64px; }
      </style>
      <div id="root" data-composition-id="s01-hook" data-width="1080" data-height="1920">
        <div class="a-scene white s01">
          <h1 class="a-h hook"><span class="l">How Claude Code</span><span class="l">runs in the</span><span class="l"><span class="a-tint" data-layout-allow-overlap=""><span data-layout-allow-overlap="">cloud</span><span class="on" data-layout-allow-overlap="">cloud</span></span></span></h1>
          <div class="c60" data-layout-allow-overlap=""><p class="k" data-layout-allow-overlap=""><svg viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="19" r="12.5" /><path class="hand" d="M17 19 V11" /><path d="M13 3.5 H21" /></svg>in under</p><p class="big"><span class="num" data-layout-allow-overlap="">60</span><span class="u">seconds</span></p></div>
          <svg class="a-svg art" viewBox="0 0 1080 1920" aria-hidden="true">
            <path class="a-ink" d="M140 1060 H420 M170 1060 V960 H390 V1060" />
            <path class="a-ink blue" d="M680 960 C640 960 640 900 690 900 C700 850 790 850 805 895 C860 880 890 930 860 960 Z" />
          </svg>
          <div class="cl"><span class="cc-spark"></span></div>
          <div class="cd c1" style="left:205px;top:975px">test</div>
          <div class="cd c2" style="left:205px;top:975px">docs</div>
          <div class="cd c3" style="left:205px;top:975px">logger</div>
        </div>
      </div>
      <script>
        (() => {
          const DUR = 3.88;
          const root = document.querySelector('[data-composition-id="s01-hook"] .s01');
          const q = (s) => root.querySelector(s);
          const cds = [...root.querySelectorAll(".cd")];
          const tl = gsap.timeline({ paused: true });
          gsap.set([q(".art"), q(".cl"), ...cds], { opacity: 0 });
          Apple.fade(tl, [q(".art"), q(".cl")], 0.3, { dur: 0.5 });
          // three job cards float up from the laptop into the cloud
          cds.forEach((c, i) => {
            tl.fromTo(c, { opacity: 0, x: 0, y: 0, scale: 1 }, { opacity: 1, duration: 0.2 }, 0.6 + i * 0.35);
            tl.to(c, { x: 470 + i * 10, y: -90 - i * 8, scale: 0.55, duration: 1.0, ease: "power2.inOut" }, 0.7 + i * 0.35);
            tl.to(c, { opacity: 0, duration: 0.2 }, 1.55 + i * 0.35);
          });
          Apple.tint(tl, q(".hook .a-tint"), 1.3, { dur: 0.5 });
          tl.to(q(".c60 .num"), { scale: 1.1, duration: 0.2, ease: "power2.out", yoyo: true, repeat: 1, transformOrigin: "0% 80%" }, 2.75);
          tl.fromTo(q(".c60 .hand"), { rotation: 0 }, { rotation: 360, svgOrigin: "17 19", duration: 1.5, ease: "none" }, 2.2);
          tl.fromTo(q(".cl .cc-spark"), { rotation: 0 }, { rotation: 120, duration: 1.2, ease: "power2.out" }, 2.4);
          Apple.out(tl, [q(".hook"), q(".c60"), q(".art"), q(".cl")], DUR - 0.28, { dur: 0.28 });
          window.__timelines["s01-hook"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
