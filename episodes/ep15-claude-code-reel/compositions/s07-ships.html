<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <script type="application/json" class="sfx-cues">[
      {"t":0.8,"sfx":"enter","vol":0.24},
      {"t":1.0,"sfx":"tick","vol":0.2},
      {"t":1.7,"sfx":"tick","vol":0.2},
      {"t":2.1,"sfx":"pop","vol":0.24},
      {"t":2.75,"sfx":"click","vol":0.34},
      {"t":2.85,"sfx":"success","vol":0.26},
      {"t":3.15,"sfx":"tick","vol":0.2},
      {"t":3.3,"sfx":"tick","vol":0.2},
      {"t":4.68,"sfx":"whip","vol":0.32}
    ]</script>
  </head>
  <body>
    <template>
      <!-- s07 · Ships. Mint canvas, "// ships", "Then it commits, and opens the pull request."; git commit lands in the
           terminal, then a pull-request card rises over it: #42 Add daily streaks, the Open pull request button is
           pressed and turns green ("Pull request opened"), the checks tick. -->
      <style>
        #s07-root .bg { background-color: #d5f3e4; }
        #s07-root .rl-hd { --acc: #0f8a4c; }
        #s07-root .term { top: 690px; height: 600px; }
        #s07-root .pr { position: absolute; left: 120px; top: 1000px; width: 800px; height: 270px; border-radius: 28px; background: #fff; padding: 30px 34px;
          box-shadow: 0 24px 50px -16px rgba(0, 0, 0, 0.4); }
        #s07-root .pr .h { display: flex; align-items: center; gap: 16px; font: 600 38px/44px var(--f-display); letter-spacing: -0.02em; color: #0d0d0c; }
        #s07-root .pr .h svg { width: 40px; height: 40px; flex: none; }
        #s07-root .pr .h .num { color: #5f5b55; font-weight: 500; }
        #s07-root .pr .br { margin-top: 10px; font: 400 28px/36px var(--f-mono); color: #5f5b55; }
        #s07-root .pr .cks { position: absolute; left: 34px; bottom: 34px; display: flex; gap: 24px; font: 400 28px/36px var(--f-mono); color: #0d0d0c; }
        #s07-root .pr .cks span b { display: inline-block; color: #12a150; font-weight: 400; }
        #s07-root .btn { position: absolute; right: 30px; bottom: 26px; height: 72px; padding: 0 30px; border-radius: 18px; background: #0d0d0c; color: #fff; font: 600 30px/72px var(--f-body); white-space: nowrap; }
        #s07-root .btn .done { position: absolute; inset: 0; border-radius: 18px; background: #12a150; padding: 0 30px; opacity: 0; }
        #s07-root .pill { position: absolute; right: 34px; top: 34px; height: 46px; padding: 0 18px; border-radius: 23px; background: #12a150; color: #fff; font: 600 28px/46px var(--f-body); opacity: 0; }
      </style>
      <div id="s07-root" data-composition-id="s07-ships" data-width="1080" data-height="1920">
        <div class="rl">
          <div class="rl-cam">
            <div class="rl-bg grid bg"></div>
            <div class="rl-eye">// ships</div>
            <div class="rl-hd">
              <span class="ln"><span class="w">Then </span><span class="w">it </span><span class="w">commits,</span></span>
              <span class="ln"><span class="w">and </span><span class="w">opens </span><span class="w">the</span></span>
              <span class="ln"><em class="w">pull request.</em></span>
            </div>
            <div class="term">
              <div class="tbar"><i></i><i></i><i></i><span>claude · ~/habit-app</span></div>
              <div class="tb">
                <div class="r hdr"><img src="assets/claude-logo.svg" alt=""><span class="t1">Claude Code</span><span class="t2">~/habit-app</span></div>
                <div class="r"><span class="dot">●</span> <span class="tool">Bash</span><span class="arg">(git commit -m "Add streaks")</span></div>
                <div class="r sub">  ⎿ [main 3f2a9c1] 4 files changed</div>
                <div class="r"><span class="dot">●</span> <span class="tool">Bash</span><span class="arg">(gh pr create)</span></div>
              </div>
            </div>
            <div class="pr">
              <div class="h"><svg viewBox="0 0 40 40" fill="none" stroke="#12a150" stroke-width="3.4" stroke-linecap="round"><circle cx="11" cy="9" r="4.5"/><circle cx="11" cy="31" r="4.5"/><circle cx="29" cy="31" r="4.5"/><path d="M11 13.5v13M29 26.5V16a5 5 0 0 0-5-5h-6"/><path d="M21 7l-3 4 3 4"/></svg><span>Add daily streaks <span class="num">#42</span></span></div>
              <div class="br">feature/streaks → main</div>
              <div class="pill">Open</div>
              <div class="cks"><span><b>✓</b> tests</span><span><b>✓</b> build</span></div>
              <div class="btn">Open pull request<span class="done">✓ Opened</span></div>
            </div>
          </div>
        </div>
      </div>
      <script>
        (() => {
          const root = document.getElementById("s07-root");
          const cam = root.querySelector(".rl-cam");
          const tl = gsap.timeline({ paused: true });
          const blur = Reel.blurFor(cam, "s07-mb");
          Reel.whip(tl, cam, blur, 0, "in");

          Reel.words(tl, root.querySelector(".rl-hd"), [0.47, 0.62, 0.78, 1.65, 1.8, 2.05, 2.3]);
          const r = root.querySelectorAll(".tb .r");
          Reel.rows(tl, [r[1], r[2], r[3]], [0.8, 1.0, 1.7]);
          const pr = root.querySelector(".pr");
          tl.fromTo(pr, { opacity: 0, y: 160, scale: 0.92 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.6)" }, 2.1);
          const btn = root.querySelector(".btn");
          tl.to(btn, { scale: 0.92, duration: 0.08, ease: "power2.in", yoyo: true, repeat: 1 }, 2.72);
          tl.fromTo(btn.querySelector(".done"), { opacity: 0 }, { opacity: 1, duration: 0.15 }, 2.85);
          tl.fromTo(root.querySelector(".pill"), { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(3)" }, 2.9);
          tl.fromTo(pr.querySelectorAll(".cks span"), { opacity: 0.25 }, { opacity: 1, duration: 0.12, stagger: 0.15 }, 3.15);
          tl.fromTo(pr.querySelectorAll(".cks b"), { scale: 0 }, { scale: 1, duration: 0.25, ease: "back.out(3)", stagger: 0.15 }, 3.15);
          Reel.whip(tl, cam, blur, 4.7, "out");

          window.__timelines["s07-ships"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
