<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <!-- Sound cues (seconds from scene start). Run node tools/build-sfx.mjs after editing. -->
    <script type="application/json" class="sfx-cues">[
      {"t":0.5,"sfx":"click-soft","vol":0.16},
      {"t":0.8,"sfx":"click-soft","vol":0.16},
      {"t":1.1,"sfx":"click-soft","vol":0.16},
      {"t":2.1,"sfx":"pop","vol":0.18},
      {"t":2.8,"sfx":"click-soft","vol":0.16},
      {"t":4.25,"sfx":"whoosh-short","vol":0.14},
      {"t":5.05,"sfx":"click","vol":0.2},
      {"t":5.8,"sfx":"sparkle","vol":0.14,"dur":0.9}
    ]</script>
  </head>
  <body>
    <template>
      <!-- s03 · How git works. Three ink laptops (every copy); a drum (the whole project) draws inside each screen, then
           its history rings; "Every copy: the whole project + all its history". Then a wifi sign is struck through:
           "Works offline". Label: "For most projects, that's perfect." (the post: every clone is "a complete,
           self-contained repository" that works "fully offline"; "for the vast majority of repositories, this is the
           right design"). Avatar: corner (narrator.html); only the eyebrow and caption are up top, left of x 830.
           Voiceover: V.a "Git gives every copy the whole project and its entire history." V.b "So you can work offline.
           For most projects, that's perfect." -->
      <style>
        #root { position: absolute; inset: 0; }
        .s03 .egg-eyebrow { position: absolute; left: 90px; top: 232px; }
        .s03 .cap { position: absolute; left: 90px; top: 300px; font: 400 40px/1.3 var(--f-body); color: var(--graphite); }
        .s03 .solid { fill: var(--eggshell); }
        .s03 .sub { position: absolute; left: 90px; width: 860px; top: 790px; text-align: center; font: 400 38px/1.3 var(--f-body); color: var(--ink); }
        .s03 .off { position: absolute; left: 470px; top: 966px; font: 300 64px/1 var(--f-display); letter-spacing: -0.02em; color: var(--ink); }
        .s03 .egg-label { position: absolute; left: 90px; width: 860px; top: 1170px; }
      </style>
      <div id="root" data-composition-id="s03-git" data-width="1080" data-height="1920">
        <div class="egg-scene s03">
          <span class="egg-eyebrow">1 · Why they left git</span>
          <span class="cap">How git works</span>
          <svg class="egg-svg" viewBox="0 0 1080 1920" aria-hidden="true">
            <g class="g-laptops"></g>
            <g class="g-drums"></g>
            <g class="g-rings"></g>
            <g class="g-wifi">
              <path class="ink thin" data-draw="0" data-dur="0.3" d="M368 1014 A26 26 0 0 1 404 1014" />
              <path class="ink thin" data-draw="0.5" data-dur="0.3" d="M349 996 A52 52 0 0 1 423 996" />
              <path class="ink thin" data-draw="1" data-dur="0.3" d="M331 977 A78 78 0 0 1 441 977" />
              <circle class="ink thin" data-draw="1.2" data-dur="0.2" cx="386" cy="1034" r="6" />
            </g>
            <g class="g-slash"><path class="ink" data-draw="0" data-dur="0.3" d="M322 952 L452 1056" /></g>
          </svg>
          <p class="sub">Every copy: the whole project + all its history</p>
          <span class="off">Works offline</span>
          <p class="egg-label">For most projects, that's perfect.</p>
        </div>
      </div>
      <script>
        (() => {
          const DUR = 8.6;
          const V = { a: 0.1, b: 4.15 };   // voice line starts (scene seconds)
          const root = document.querySelector('[data-composition-id="s03-git"] .s03');
          const q = (s) => root.querySelector(s);
          const NS = "http://www.w3.org/2000/svg";
          const add = (g, attrs) => { const e = document.createElementNS(NS, "path"); for (const k in attrs) e.setAttribute(k, attrs[k]); g.appendChild(e); };

          // three laptops (screen + base), each holding a drum (the project) with history rings
          [230, 540, 850].forEach((x, i) => {
            add(q(".g-laptops"), { class: "ink thin", "data-draw": i * 0.75, "data-dur": 0.5, d: `M${x - 82} 600 H${x + 82} Q${x + 92} 600 ${x + 92} 610 V720 Q${x + 92} 730 ${x + 82} 730 H${x - 82} Q${x - 92} 730 ${x - 92} 720 V610 Q${x - 92} 600 ${x - 82} 600 Z` });
            add(q(".g-laptops"), { class: "ink thin", "data-draw": i * 0.75 + 0.5, "data-dur": 0.3, d: `M${x - 92} 738 H${x + 92} L${x + 100} 754 H${x - 100} Z` });
            add(q(".g-drums"), { class: "ink thin solid", "data-draw": i * 0.4, "data-dur": 0.4, d: `M${x - 46} 630 A46 11 0 0 1 ${x + 46} 630 V684 A46 11 0 0 1 ${x - 46} 684 Z` });
            add(q(".g-drums"), { class: "ink thin", "data-draw": i * 0.4 + 0.6, "data-dur": 0.25, d: `M${x - 46} 630 A46 11 0 0 0 ${x + 46} 630` });
            add(q(".g-rings"), { class: "ink thin", "data-draw": i * 0.4, "data-dur": 0.35, d: `M${x - 46} 648 A46 11 0 0 0 ${x + 46} 648 M${x - 46} 666 A46 11 0 0 0 ${x + 46} 666` });
          });

          const tl = gsap.timeline({ paused: true });
          Egg.fadeUp(tl, [q(".egg-eyebrow"), q(".cap")], 0.1);

          // "Git gives every copy the whole project and its entire history."
          Egg.draw(tl, q(".g-laptops"), 0.5, { gap: 0.4 });
          Egg.draw(tl, q(".g-drums"), 2.1, { gap: 0.4 });
          Egg.draw(tl, q(".g-rings"), 2.8, { gap: 0.4 });
          Egg.fadeUp(tl, q(".sub"), 3.0, { y: 16 });

          // "So you can work offline. For most projects, that's perfect."
          Egg.draw(tl, q(".g-wifi"), V.b + 0.1, { gap: 0.3 });
          Egg.draw(tl, q(".g-slash"), V.b + 0.85);
          Egg.fadeUp(tl, q(".off"), V.b + 0.9, { y: 16 });
          Egg.fadeUp(tl, q(".egg-label"), V.b + 1.65);

          Egg.fadeOut(tl, [q(".egg-eyebrow"), q(".cap"), q(".egg-svg"), q(".sub"), q(".off"), q(".egg-label")], DUR - 0.35);
          window.__timelines["s03-git"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
