<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <!-- Sound cues (seconds from scene start). Run node tools/build-sfx.mjs after editing. -->
    <script type="application/json" class="sfx-cues">[
      {"t":0.3,"sfx":"click-soft","vol":0.16},
      {"t":0.6,"sfx":"click-soft","vol":0.16},
      {"t":1.6,"sfx":"typing","vol":0.12,"dur":1.0},
      {"t":2.9,"sfx":"error","vol":0.12,"dur":0.6},
      {"t":3.95,"sfx":"click","vol":0.18},
      {"t":4.1,"sfx":"whoosh","vol":0.2},
      {"t":5.2,"sfx":"click-soft","vol":0.16},
      {"t":5.5,"sfx":"click-soft","vol":0.16},
      {"t":7.2,"sfx":"whoosh-short","vol":0.16},
      {"t":7.55,"sfx":"impact-bass-1","vol":0.14,"dur":0.8},
      {"t":8.3,"sfx":"sparkle","vol":0.16,"dur":1.0},
      {"t":9.3,"sfx":"chime","vol":0.18,"dur":1.2}
    ]</script>
  </head>
  <body>
    <template>
      <!-- s13 · How it's used: merging. Changes (small cards) queue at a locked gate onto the main line and pile up: one
           at a time can't keep up. The lock opens, they all land at once, then each gets a test tick (tests run after
           merging). Two changes clash (a spark); the Claude logo pops and they become one clean change. Label: "Land
           first, test after. Claude fixes the clashes." (the post: "We haven't been able to effectively replicate the
           industry standard of a global repository lock on the merge queue, so instead, we've invested in post-merge and
           pre-deploy automated testing. This does mean that concurrent changes can conflict, but Claude can typically fix
           these conflicts faster than humans can even identify them.") Avatar: corner (narrator.html).
           Voiceover: V.a "With so many changes, making each one wait its turn doesn't work." V.b "So changes land first,
           and tests run after." V.c "If two clash, Claude usually fixes it before a human would notice." -->
      <style>
        #root { position: absolute; inset: 0; }
        .s13 .egg-eyebrow { position: absolute; left: 90px; top: 232px; }
        .s13 .cap { position: absolute; left: 90px; top: 300px; font: 400 40px/1.3 var(--f-body); color: var(--graphite); }
        .s13 .main { position: absolute; left: 700px; width: 240px; top: 580px; text-align: right; font: 400 24px/1 var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--graphite); }
        .s13 .chg { position: absolute; left: 0; top: 0; width: 70px; height: 44px; border: 3px solid var(--ink); border-radius: 10px; background: var(--eggshell); }
        .s13 .chg::before, .s13 .chg::after { content: ""; position: absolute; left: 12px; height: 3px; border-radius: 2px; background: var(--ink); }
        .s13 .chg::before { top: 12px; width: 40px; }
        .s13 .chg::after { top: 23px; width: 28px; }
        .s13 .chg .ok { position: absolute; right: -14px; top: -14px; width: 30px; height: 30px; border-radius: 50%; background: var(--ink); display: grid; place-items: center; }
        .s13 .chg .ok svg { width: 18px; height: 18px; fill: none; stroke: var(--eggshell); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
        .s13 .slow { position: absolute; left: 90px; width: 460px; top: 770px; text-align: center; font: 400 26px/1 var(--f-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink); }
        .s13 .after { position: absolute; left: 520px; width: 420px; top: 746px; text-align: center; font: 400 26px/1 var(--f-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink); }
        .s13 .logo { position: absolute; left: 660px; top: 880px; width: 120px; height: 120px; background: url("assets/claude-logo.svg") center / contain no-repeat; }
        .s13 .egg-label { position: absolute; left: 90px; width: 860px; top: 1120px; }
      </style>
      <div id="root" data-composition-id="s13-merge" data-width="1080" data-height="1920">
        <div class="egg-scene s13">
          <span class="egg-eyebrow">4 · How it's used</span>
          <span class="cap">Merging changes</span>
          <svg class="egg-svg" viewBox="0 0 1080 1920" aria-hidden="true">
            <g class="g-main"><path class="ink thin" data-draw="0" data-dur="0.6" d="M150 640 H928 M910 628 L928 640 L910 652" /></g>
            <g class="g-gate">
              <path class="ink" data-draw="0" data-dur="0.25" d="M470 604 V700" />
              <path class="ink thin solid" data-draw="0.6" data-dur="0.3" d="M448 556 H492 V590 H448 Z" />
            </g>
            <g class="g-shackle"><path class="ink thin" data-draw="0" data-dur="0.25" d="M457 556 V544 A13 13 0 0 1 483 544 V556" /></g>
            <g class="g-spark"><path class="ink" data-draw="0" data-dur="0.3" d="M540 784 L552 808 L578 802 L560 822 L576 844 L548 836 L540 862 L532 836 L504 844 L520 822 L502 802 L528 808 Z" /></g>
          </svg>
          <span class="main">Main code</span>
          <div class="cards"></div>
          <span class="slow">One at a time: too slow</span>
          <span class="after">Land first, test after</span>
          <div class="logo"></div>
          <p class="egg-label">Land first, test after. Claude fixes the clashes.</p>
        </div>
      </div>
      <script>
        (() => {
          const DUR = 11.8;
          const V = { a: 0.1, b: 3.85, c: 6.8 };   // voice line starts (scene seconds)
          const root = document.querySelector('[data-composition-id="s13-merge"] .s13');
          const q = (s) => root.querySelector(s);
          const TICK = '<span class="ok"><svg viewBox="0 0 24 24"><path d="M5 12.5 L10 17.5 L19 7"/></svg></span>';

          // eight changes: four at the gate on the main line, four piling up behind them; after the lock opens they land
          // in two rows past the gate. Two more changes below are the pair that clash.
          const QUEUE = [[420, 640], [340, 640], [260, 640], [180, 640], [420, 706], [340, 706], [260, 706], [180, 706]];
          const LAND = [[560, 640], [660, 640], [760, 640], [860, 640], [560, 706], [660, 706], [760, 706], [860, 706]];
          const box = q(".cards");
          const mk = (x, y) => { const c = document.createElement("div"); c.className = "chg"; c.innerHTML = TICK; box.appendChild(c); gsap.set(c, { x: x - 35, y: y - 22 }); return c; };
          const cards = QUEUE.map(([x, y]) => mk(x, y));
          const A = mk(330, 900), B = mk(750, 900);

          const tl = gsap.timeline({ paused: true });
          Egg.fadeUp(tl, [q(".egg-eyebrow"), q(".cap")], 0.1);
          gsap.set(root.querySelectorAll(".chg .ok"), { scale: 0 });

          // "With so many changes, making each one wait its turn doesn't work."
          Egg.draw(tl, q(".g-main"), 0.3);
          Egg.fadeUp(tl, q(".main"), 0.6, { y: 10 });
          Egg.draw(tl, q(".g-gate"), 0.6, { gap: 0.3 });
          Egg.draw(tl, q(".g-shackle"), 0.85);
          tl.fromTo(cards.slice(0, 4), { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.35, ease: Egg.EASE.pop, stagger: 0.18 }, 0.6);
          tl.fromTo(cards.slice(4), { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.35, ease: Egg.EASE.pop, stagger: 0.2 }, 1.6);
          Egg.shake(tl, box, 2.85);
          Egg.fadeUp(tl, q(".slow"), 2.9, { y: 12 });

          // "So changes land first, and tests run after."
          tl.to(q(".g-shackle"), { y: -14, duration: 0.25, ease: "power2.out" }, V.b + 0.05);
          tl.to([q(".g-gate"), q(".g-shackle"), q(".slow")], { opacity: 0, duration: 0.3, ease: Egg.EASE.exit }, V.b + 0.3);
          cards.forEach((c, i) => tl.to(c, { x: LAND[i][0] - 35, y: LAND[i][1] - 22, duration: 0.6, ease: Egg.EASE.move }, V.b + 0.25 + (i % 4) * 0.05));
          tl.to(cards.map((c) => c.querySelector(".ok")), { scale: 1, duration: 0.3, ease: Egg.EASE.pop, stagger: 0.1 }, V.b + 1.35);
          Egg.fadeUp(tl, q(".after"), V.b + 1.3, { y: 12 });

          // "If two clash, Claude usually fixes it before a human would notice."
          tl.fromTo([A, B], { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "none" }, V.c);
          tl.to(A, { x: 505 - 35, duration: 0.45, ease: "power2.in" }, V.c + 0.4);
          tl.to(B, { x: 575 - 35, duration: 0.45, ease: "power2.in" }, V.c + 0.4);
          Egg.draw(tl, q(".g-spark"), V.c + 0.8);
          tl.fromTo(q(".logo"), { scale: 0, opacity: 0, rotation: -40 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.55, ease: Egg.EASE.pop }, V.c + 1.5);
          tl.to(q(".logo"), { rotation: 60, duration: 2.6, ease: "power1.inOut" }, V.c + 2.0);
          tl.to(q(".g-spark"), { opacity: 0, duration: 0.3, ease: Egg.EASE.exit }, V.c + 2.4);
          tl.to(B, { x: 540 - 35, opacity: 0, duration: 0.4, ease: Egg.EASE.move }, V.c + 2.45);
          tl.to(A, { x: 540 - 35, duration: 0.4, ease: Egg.EASE.move }, V.c + 2.45);
          tl.to(A.querySelector(".ok"), { scale: 1, duration: 0.3, ease: Egg.EASE.pop }, V.c + 2.6);
          Egg.fadeUp(tl, q(".egg-label"), V.c + 2.85);

          Egg.fadeOut(tl, [q(".egg-eyebrow"), q(".cap"), q(".egg-svg"), q(".main"), box, q(".after"), q(".logo"), q(".egg-label")], DUR - 0.35);
          window.__timelines["s13-merge"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
