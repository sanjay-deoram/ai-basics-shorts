<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <!-- Sound cues (seconds from scene start). Run node tools/build-sfx.mjs after editing. -->
    <script type="application/json" class="sfx-cues">[
      {"t":0.4,"sfx":"click-soft","vol":0.16},
      {"t":2.0,"sfx":"pop","vol":0.18},
      {"t":3.9,"sfx":"click-soft","vol":0.16},
      {"t":5.5,"sfx":"whoosh-short","vol":0.14},
      {"t":7.25,"sfx":"click-soft","vol":0.14},
      {"t":9.25,"sfx":"whoosh-short","vol":0.14},
      {"t":9.6,"sfx":"click-soft","vol":0.16},
      {"t":11.1,"sfx":"click-soft","vol":0.14},
      {"t":14.4,"sfx":"whoosh-short","vol":0.14},
      {"t":14.7,"sfx":"click-soft","vol":0.16},
      {"t":20.6,"sfx":"pop","vol":0.18},
      {"t":21.2,"sfx":"click","vol":0.18},
      {"t":21.45,"sfx":"click","vol":0.18},
      {"t":21.7,"sfx":"click","vol":0.18},
      {"t":22.4,"sfx":"sparkle","vol":0.14,"dur":1.0}
    ]</script>
  </head>
  <body>
    <template>
      <!-- s10 · Three layers of caches, as a whiteboard drawing in three rows, nearest first, each explained beside it:
           On the same machine (scion-daemon): one ink computer holding three jobs that share one cache drum ("a daemon,
           scion-daemon, that stores objects for the whole node … jobs on the same node reuse most of the same objects").
           In the same region (scion-cache): a building of servers ("cache servers in its region … stream objects directly
           from memory"). The main servers (scion-servers): a rack and a database drum ("the authoritative scion-servers,
           which read from Spanner or cloud storage"). A request (ink dot) goes down only when a layer misses ("if not
           there"); then each row gets "99%+ answered here" ("each tier … a cache hit rate of over 99%") and the dot goes
           back to the machine's cache. Label: "So very few requests reach the main servers." Avatar: corner.
           Voiceover: V.a "When a job needs data, it looks nearest first." V.b "First, scion-daemon: a cache on its own
           machine, shared by every job running there." V.c "Next, scion-cache: servers in the same region that keep data
           ready in memory." V.d "Last, the main scion servers: the source of truth, reading from the database and cloud
           storage." V.e "Each layer answers over 99 percent of requests itself." -->
      <style>
        #root { position: absolute; inset: 0; }
        .s10 .egg-eyebrow { position: absolute; left: 90px; top: 232px; }
        .s10 .cap { position: absolute; left: 90px; top: 300px; font: 400 40px/1.3 var(--f-body); color: var(--graphite); }
        .s10 .solid { fill: var(--eggshell); }
        .s10 .txt { position: absolute; left: 460px; width: 490px; }
        .s10 .ttl { position: absolute; left: 0; top: 0; font: 300 50px/1 var(--f-display); letter-spacing: -0.02em; color: var(--ink); white-space: nowrap; }
        .s10 .nm { position: absolute; left: 0; top: 66px; font: 400 28px/1 var(--f-mono); color: var(--ink); }
        .s10 .ds { position: absolute; left: 0; top: 108px; width: 490px; margin: 0; font: 400 32px/1.3 var(--f-body); color: var(--graphite); }
        .s10 .hit { position: absolute; left: 0; top: 204px; font: 400 24px/1 var(--f-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink); background: var(--eggshell); border: 2px solid var(--ink); border-radius: 9999px; padding: 10px 16px; white-space: nowrap; }
        .s10 .miss { position: absolute; left: 276px; font: 400 24px/1 var(--f-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--smoke); }
        .s10 .dot { position: absolute; left: -13px; top: -13px; width: 26px; height: 26px; border-radius: 50%; background: var(--ink); box-shadow: 0 0 0 6px var(--eggshell); }
        .s10 .egg-label { position: absolute; left: 90px; width: 860px; top: 1356px; font-size: 52px; }
      </style>
      <div id="root" data-composition-id="s10-caches" data-width="1080" data-height="1920">
        <div class="egg-scene s10">
          <span class="egg-eyebrow">3 · How it works</span>
          <span class="cap">Three layers of caches</span>
          <svg class="egg-svg" viewBox="0 0 1080 1920" aria-hidden="true">
            <!-- row 1: one machine, three jobs sharing one cache drum -->
            <g class="g-machine"><path class="ink thin" data-draw="0" data-dur="0.6" d="M142 548 H378 Q400 548 400 570 V718 Q400 740 378 740 H142 Q120 740 120 718 V570 Q120 548 142 548 Z" /></g>
            <g class="g-jobs"></g>
            <g class="g-daemon">
              <path class="ink thin solid" data-draw="0" data-dur="0.45" d="M188 676 A72 14 0 0 1 332 676 V712 A72 14 0 0 1 188 712 Z" />
              <path class="ink thin" data-draw="1" data-dur="0.25" d="M188 676 A72 14 0 0 0 332 676" />
            </g>
            <g class="g-share"><path class="ink thin" data-draw="0" data-dur="0.3" d="M180 624 L214 664 M260 624 V660 M340 624 L306 664" /></g>
            <!-- row 2: a building of servers in the region -->
            <g class="g-arrow1"><path class="ink thin" data-draw="0" data-dur="0.35" d="M260 750 V800 M248 786 L260 800 L272 786" /></g>
            <g class="g-building"><path class="ink thin" data-draw="0" data-dur="0.7" d="M120 1040 V852 L260 812 L400 852 V1040 Z" /></g>
            <g class="g-racks"></g>
            <!-- row 3: the main servers and the database -->
            <g class="g-arrow2"><path class="ink thin" data-draw="0" data-dur="0.3" d="M260 1048 V1094 M248 1080 L260 1094 L272 1080" /></g>
            <g class="g-main">
              <path class="ink thin solid" data-draw="0" data-dur="0.5" d="M138 1104 H230 Q246 1104 246 1120 V1286 Q246 1302 230 1302 H138 Q122 1302 122 1286 V1120 Q122 1104 138 1104 Z" />
              <path class="ink thin" data-draw="1" data-dur="0.3" d="M122 1170 H246 M122 1236 H246 M140 1137 H190 M140 1203 H190 M140 1269 H190" />
              <path class="ink thin solid" data-draw="1.6" data-dur="0.45" d="M278 1140 A58 14 0 0 1 394 1140 V1270 A58 14 0 0 1 278 1270 Z" />
              <path class="ink thin" data-draw="2.4" data-dur="0.3" d="M278 1140 A58 14 0 0 0 394 1140 M278 1184 A58 14 0 0 0 394 1184 M278 1228 A58 14 0 0 0 394 1228" />
            </g>
          </svg>
          <div class="txt r1" style="top: 540px">
            <span class="ttl">On the same machine</span>
            <span class="nm">scion-daemon</span>
            <p class="ds">One cache, shared by every job on that computer</p>
            <span class="hit">99%+ answered here</span>
          </div>
          <span class="miss m1" style="top: 764px">Not there?</span>
          <div class="txt r2" style="top: 810px">
            <span class="ttl">In the same region</span>
            <span class="nm">scion-cache</span>
            <p class="ds">Nearby servers that keep data ready in memory</p>
            <span class="hit">99%+ answered here</span>
          </div>
          <span class="miss m2" style="top: 1060px">Not there?</span>
          <div class="txt r3" style="top: 1080px">
            <span class="ttl">The main servers</span>
            <span class="nm">scion-servers</span>
            <p class="ds">Source of truth: the database and cloud storage</p>
            <span class="hit">99%+ answered here</span>
          </div>
          <div class="dot"></div>
          <p class="egg-label">So very few requests reach the main servers.</p>
        </div>
      </div>
      <script>
        (() => {
          const DUR = 25.3;
          const V = { a: 0.1, b: 3.4, c: 9.15, d: 14.35, e: 20.25 };   // voice line starts (scene seconds)
          const root = document.querySelector('[data-composition-id="s10-caches"] .s10');
          const q = (s) => root.querySelector(s);
          const NS = "http://www.w3.org/2000/svg";
          const add = (g, attrs) => { const e = document.createElementNS(NS, "path"); for (const k in attrs) e.setAttribute(k, attrs[k]); q(g).appendChild(e); };
          // three small jobs inside the machine; three racks inside the building
          [180, 260, 340].forEach((x, i) => {
            add(".g-jobs", { class: "ink thin solid", "data-draw": i * 0.4, "data-dur": 0.3, d: `M${x - 20} 576 H${x + 20} Q${x + 28} 576 ${x + 28} 584 V614 Q${x + 28} 622 ${x + 20} 622 H${x - 20} Q${x - 28} 622 ${x - 28} 614 V584 Q${x - 28} 576 ${x - 20} 576 Z M${x - 10} 592 v6 M${x + 10} 592 v6` });
            add(".g-racks", { class: "ink thin solid", "data-draw": i * 0.4, "data-dur": 0.35, d: `M${x - 28} 916 H${x + 28} V1022 H${x - 28} Z M${x - 18} 946 H${x + 18} M${x - 18} 974 H${x + 18} M${x - 18} 1002 H${x + 18}` });
          });
          const dot = q(".dot");
          gsap.set(dot, { x: 260, y: 600, scale: 0 });

          const tl = gsap.timeline({ paused: true });
          Egg.fadeUp(tl, [q(".egg-eyebrow"), q(".cap")], 0.1);
          gsap.set(root.querySelectorAll(".txt > *"), { opacity: 0 });

          // "When a job needs data, it looks nearest first."
          Egg.draw(tl, q(".g-machine"), 0.4);
          Egg.draw(tl, q(".g-jobs"), 0.9, { gap: 0.4 });
          tl.to(dot, { scale: 1, duration: 0.4, ease: Egg.EASE.pop }, 2.0);
          tl.to(dot, { scale: 1.25, duration: 0.2, ease: "power2.out", yoyo: true, repeat: 3 }, 2.5);

          // "First, scion-daemon: a cache on its own machine, shared by every job running there."
          Egg.fadeUp(tl, q(".r1 .ttl"), V.b + 0.15, { y: 16 });
          Egg.draw(tl, q(".g-daemon"), V.b + 0.5, { gap: 0.4 });
          Egg.fadeUp(tl, q(".r1 .nm"), V.b + 0.7, { y: 10 });
          tl.to(dot, { y: 694, duration: 0.6, ease: Egg.EASE.move }, V.b + 2.1);
          Egg.fadeUp(tl, q(".r1 .ds"), V.b + 2.1, { y: 12 });
          Egg.draw(tl, q(".g-share"), V.b + 3.85);

          // "Next, scion-cache: servers in the same region that keep data ready in memory."
          Egg.draw(tl, q(".g-arrow1"), V.c + 0.1);
          Egg.fadeUp(tl, q(".m1"), V.c + 0.15, { y: 8 });
          Egg.fadeUp(tl, q(".r2 .ttl"), V.c + 0.2, { y: 16 });
          Egg.draw(tl, q(".g-building"), V.c + 0.45);
          tl.to(dot, { y: 878, duration: 0.8, ease: Egg.EASE.move }, V.c + 0.3);
          Egg.fadeUp(tl, q(".r2 .nm"), V.c + 0.75, { y: 10 });
          Egg.fadeUp(tl, q(".r2 .ds"), V.c + 1.95, { y: 12 });
          Egg.draw(tl, q(".g-racks"), V.c + 1.95, { gap: 0.4 });

          // "Last, the main scion servers: the source of truth, reading from the database and cloud storage."
          Egg.draw(tl, q(".g-arrow2"), V.d + 0.05);
          Egg.fadeUp(tl, q(".m2"), V.d + 0.1, { y: 8 });
          Egg.fadeUp(tl, q(".r3 .ttl"), V.d + 0.15, { y: 16 });
          tl.to(dot, { y: 1076, duration: 0.6, ease: Egg.EASE.move }, V.d + 0.25);
          Egg.draw(tl, q(".g-main"), V.d + 0.6, { gap: 0.4 });
          Egg.fadeUp(tl, q(".r3 .nm"), V.d + 0.8, { y: 10 });
          tl.to(dot, { x: 336, y: 1206, duration: 0.6, ease: Egg.EASE.move }, V.d + 2.4);
          Egg.fadeUp(tl, q(".r3 .ds"), V.d + 2.6, { y: 12 });

          // "Each layer answers over 99 percent of requests itself."  The request goes back to the machine's own cache.
          tl.to(dot, { scale: 0, duration: 0.2, ease: Egg.EASE.exit }, V.e + 0.05);
          tl.set(dot, { x: 260, y: 694 }, V.e + 0.26);
          tl.to(dot, { scale: 1, duration: 0.4, ease: Egg.EASE.pop }, V.e + 0.35);
          Egg.pop(tl, [q(".r1 .hit"), q(".r2 .hit"), q(".r3 .hit")], V.e + 0.95, { dur: 0.45, stagger: 0.25 });
          Egg.fadeUp(tl, q(".egg-label"), V.e + 2.15);

          Egg.fadeOut(tl, [q(".egg-eyebrow"), q(".cap"), q(".egg-svg"), ...root.querySelectorAll(".txt, .miss"), q(".egg-label")], DUR - 0.35);
          tl.to(dot, { opacity: 0, duration: 0.35, ease: Egg.EASE.exit }, DUR - 0.35);
          window.__timelines["s10-caches"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
