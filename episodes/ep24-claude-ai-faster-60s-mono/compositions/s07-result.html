      <style>

        <div class="a-scene s07">
          <p class="a-eyebrow">All the fixes together</p>
          <h2 class="a-h2 hd"><span class="l">Time until you <span class="a-tint" data-layout-allow-overlap=""><span data-layout-allow-overlap="">type</span><span class="on" data-layout-allow-overlap="">type</span></span></span></h2>
          <p class="ct">3.1 s</p>
          <p class="a-lab cl">fresh load of claude.ai, until you can type</p>
          <div class="a-win pr"><div class="bar"><i></i><i></i><i></i><span class="ttl l">PR · Static composer</span></div>
            <div class="a-txt"><span class="ln"><span class="g">+ if (flags.staticComposer) {</span></span><span class="ln"><span class="g">+   hydrateFrom("composer-static");</span></span><span class="ln"><span class="g">+ }</span></span></div>

      <script>
        (() => {
          const DUR = 9.16;
          const root = document.querySelector('[data-composition-id="s07-result"] .s07');
          const q = (s) => root.querySelector(s);
          gsap.set([q(".ct"), q(".cl"), q(".pr"), q(".ap"), q(".ro"), q(".gm")], { opacity: 0 });
          const tl = gsap.timeline({ paused: true });
          Apple.rise(tl, q(".a-eyebrow"), 0.12, { y: 16 });
          Apple.rise(tl, q(".hd"), 0.2, { y: 24, dur: 0.8 });
          // "Overall, the wait before you can type"

          Apple.tint(tl, q(".hd .a-tint"), 2.1, { dur: 0.4 });
          // "fell from three point one seconds to about half a second"
          const c = { v: 3.1 };
          const show = () => { q(".ct").textContent = (c.v >= 1 ? c.v.toFixed(1) : c.v.toFixed(2)) + " s"; };
          tl.fromTo(c, { v: 3.1 }, { v: 0.55, duration: 1.8, ease: "power2.inOut", onUpdate: show }, 3.2);
          tl.to(q(".ct"), { scale: 1.06, duration: 0.18, yoyo: true, repeat: 1, transformOrigin: "0% 50%" }, 5.0);

          Apple.rise(tl, q(".pr"), 5.5, { y: 24, dur: 0.5 });
          Apple.zoom(tl, q(".ap"), 6.1, { from: 1.5, dur: 0.3 });
          Apple.rise(tl, q(".ro"), 7.4, { y: 14, dur: 0.4 });
          Apple.rise(tl, q(".gm"), 7.9, { y: 14, dur: 0.4 });
