      <script>
        (() => {
          const root = document.querySelector('[data-composition-id="s05-ask"] .s05');
          const q = (s) => root.querySelector(s);
          const all = (s) => [...root.querySelectorAll(s)];
          const tx = q(".tx"), s1 = q(".s1"), s2 = q(".s2"), s3 = q(".s3");
          const VISIBLE = 11, LH = 42;   // rows that fit the transcript area; banner = rows 0–2, blank = row 3
          const rows = (n) => q(".r" + n);
          gsap.set([...Array.from({ length: 12 }, (_, i) => rows(i + 4)), q(".k1"), q(".k2"), s1, s2, s3, q(".s2 .body"),
            q(".pay"), ...all(".fmt"), q(".weak"), q(".good"), ...all(".egg-stamp")], { opacity: 0 });

          const tl = gsap.timeline({ paused: true });
          // a transcript row appears; the transcript scrolls once it's full
          const show = (n, at) => {
            tl.to(rows(n), { opacity: 1, duration: 0.12, ease: "none" }, at);
            if (n + 1 > VISIBLE) tl.to(tx, { y: -(n + 1 - VISIBLE) * LH, duration: 0.18, ease: "power2.out" }, at);
          };

          // "Step three: just ask."
          Egg.fadeUp(tl, q(".egg-eyebrow"), 0.2, { y: 16 });
          Egg.fadeUp(tl, q(".win"), 0.3, { y: 30 });
          Egg.typeOn(tl, q(".input .it"), 0.9, { cps: 28 });
          // "Claude reads only each skill's name and description up front"
          Egg.fadeUp(tl, [q(".k1"), s1, s2, s3], 2.5, { y: 24, stagger: 0.15 });
          tl.fromTo(all(".sk .nm .egg-hl"), { backgroundSize: "0% 100%" }, { backgroundSize: "100% 100%", duration: 0.4, ease: Egg.EASE.move, stagger: 0.08 }, 4.0);
          tl.fromTo(all(".sk .ds .egg-hl"), { backgroundSize: "0% 100%" }, { backgroundSize: "100% 100%", duration: 0.5, ease: Egg.EASE.move, stagger: 0.08 }, 4.5);
          // "When your request matches": it's sent, and pr-description lights up
          tl.to(q(".input .it"), { opacity: 0, duration: 0.12, ease: "none" }, 6.1);
          show(4, 6.2);
          tl.fromTo(q(".r4 .hl2"), { backgroundSize: "0% 100%" }, { backgroundSize: "100% 100%", duration: 0.4, ease: Egg.EASE.move }, 6.5);
          tl.to(s2, { borderColor: "#d97757", scale: 1.03, duration: 0.25, ease: "power2.out" }, 6.8);
          tl.to([s1, s3], { opacity: 0.35, duration: 0.3, ease: "none" }, 6.8);
          // "it loads the full file": its card opens to the instructions
          tl.to([s1, s3], { opacity: 0, duration: 0.25, ease: "none" }, 7.5);
          tl.to(q(".k1"), { opacity: 0, duration: 0.2, ease: "none" }, 7.5);
          tl.to(q(".k2"), { opacity: 1, duration: 0.25, ease: "none" }, 7.7);
          tl.to(s2, { y: -130, height: 390, scale: 1, duration: 0.55, ease: Egg.EASE.move }, 7.6);
          tl.to(q(".s2 .body"), { opacity: 1, duration: 0.35, ease: "none" }, 7.95);
          show(5, 7.7);
          show(6, 8.0);
          // "and follows it": git diff, then the three sections
          show(7, 8.9);
          show(8, 9.2);
          [9, 10, 11, 12, 13, 14, 15].forEach((n, i) => show(n, 9.6 + i * 0.2));

          // "Same format, every time."
          tl.to([s2, q(".k2")], { opacity: 0, y: "-=20", duration: 0.3, ease: Egg.EASE.exit }, 9.85);
          Egg.fadeUp(tl, q(".pay"), 10.1, { y: 24 });
          // the three PRs from s02, now all the same shape
          Egg.fadeUp(tl, all(".fmt"), 10.4, { y: 20, stagger: 0.12 });
          tl.to(all(".fmt"), { opacity: 0, y: -12, duration: 0.3, ease: Egg.EASE.exit }, 11.75);
          // the banner and the request have scrolled out of the transcript: drop them
          tl.set([q(".banner"), rows(4)], { opacity: 0 }, 10.85);
          // "Just keep the description specific": a vague one, then a specific one
          Egg.fadeUp(tl, q(".weak"), 12.1, { y: 24, dur: 0.45 });
          Egg.stamp(tl, q(".weak .egg-stamp"), 12.6);
          Egg.fadeUp(tl, q(".good"), 13.0, { y: 24, dur: 0.45 });
          Egg.stamp(tl, q(".good .egg-stamp"), 13.3);
          Egg.highlight(tl, q(".good .egg-hl"), 13.4, { dur: 0.6 });
          // "or Claude won't know when to use it"
          Egg.shake(tl, q(".weak"), 14.1);
          tl.to(q(".weak"), { opacity: 0.45, duration: 0.4, ease: "none" }, 14.6);

          // hard stop: the last frame holds, no exit
          window.__timelines["s05-ask"] = tl;
        })();
      </script>
