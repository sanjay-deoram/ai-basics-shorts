<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <!-- Sound cues (seconds from scene start). Run node tools/build-sfx.mjs after editing. -->
    <script type="application/json" class="sfx-cues">[
      {"t":0.25,"sfx":"air","vol":0.14},
      {"t":1.5,"sfx":"pop","vol":0.18},
      {"t":2.55,"sfx":"pop","vol":0.18},
      {"t":3.0,"sfx":"marker","vol":0.14},
      {"t":3.75,"sfx":"typing","vol":0.2,"dur":1.4},
      {"t":5.95,"sfx":"typing","vol":0.2,"dur":1.0},
      {"t":6.6,"sfx":"pop","vol":0.22},
      {"t":6.75,"sfx":"marker","vol":0.16}
    ]</script>
  </head>
  <body>
    <template>
      <!-- s03 · Step 1 · Folder. A file tree draws the path as it's said: ~/.claude/ then skills/ (highlighted). A
           terminal types `mkdir -p ~/.claude/skills/` on "make a folder" and `pr-description` on "P R description";
           the new folder pops into the tree, highlighted, and "Folder name = skill name" confirms it.
           Avatar: small top right ("corner"); content above y 485 stays left of x 830.
           Voiceover: 0.2 "Step one: in dot claude slash skills, make a folder named after the skill. P R description." -->
      <style>
        #root { position: absolute; inset: 0; }
        .s03 .egg-eyebrow { position: absolute; left: 90px; top: 232px; }
        .s03 .ttl { position: absolute; left: 90px; top: 300px; width: 720px; }
        .s03 .term { position: absolute; left: 90px; top: 520px; width: 860px; height: 196px; background: #1f1e1d; border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; }
        .s03 .term .bar { height: 56px; display: flex; align-items: center; gap: 12px; padding: 0 26px; background: #2b2a27; border-bottom: 2px solid #3a3935; font: 500 26px/1 var(--f-body); color: #b0aea5; }
        .s03 .term .bar i { width: 12px; height: 12px; border-radius: 50%; background: #4a4844; }
        .s03 .term .bar span { margin-left: 10px; }
        .s03 .cmd { position: absolute; left: 30px; top: 96px; margin: 0; font: 400 29px/1.3 var(--f-mono); color: #ebe8e4; white-space: pre; }
        .s03 .cmd .pr { color: #d97757; }
        .s03 .cmd .nw { color: #f0a283; }
        .s03 .row { position: absolute; display: flex; align-items: center; gap: 22px; font: 400 54px/1 var(--f-mono); color: var(--ink); white-space: nowrap; }
        .s03 .row svg { width: 64px; height: 54px; flex: none; fill: #fff; stroke: var(--graphite); stroke-width: 3; stroke-linejoin: round; }
        .s03 .row.new svg { fill: rgba(217, 119, 87, 0.18); stroke: var(--cc-clay); }
        .s03 .egg-svg path { fill: none; stroke: var(--ash); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
        .s03 .egg-label { position: absolute; left: 90px; width: 860px; top: 1260px; }
      </style>
      <div id="root" data-composition-id="s03-folder" data-width="1080" data-height="1920">
        <div class="egg-scene s03">
          <span class="egg-eyebrow">Step 1 · Folder</span>
          <h2 class="egg-title ttl">Make a folder</h2>
          <div class="term">
            <div class="bar"><i></i><i></i><i></i><span>Terminal</span></div>
            <p class="cmd"><span class="pr">$ </span><span class="a">mkdir -p ~/.claude/skills/</span><span class="nw b">pr-description</span></p>
          </div>
          <svg class="egg-svg" viewBox="0 0 1080 1920" aria-hidden="true">
            <path class="ln1" d="M128 872 V 943 H 178" />
            <path class="ln2" d="M218 982 V 1053 H 268" />
          </svg>
          <div class="row r1" style="left:90px;top:800px"><svg viewBox="0 0 64 54"><path d="M3 8a5 5 0 0 1 5-5h16l6 7h26a5 5 0 0 1 5 5v31a5 5 0 0 1-5 5H8a5 5 0 0 1-5-5z" /></svg><span>~/.claude/</span></div>
          <div class="row r2" style="left:180px;top:910px"><svg viewBox="0 0 64 54"><path d="M3 8a5 5 0 0 1 5-5h16l6 7h26a5 5 0 0 1 5 5v31a5 5 0 0 1-5 5H8a5 5 0 0 1-5-5z" /></svg><span class="egg-hl">skills/</span></div>
          <div class="row r3 new" style="left:270px;top:1020px"><svg viewBox="0 0 64 54"><path d="M3 8a5 5 0 0 1 5-5h16l6 7h26a5 5 0 0 1 5 5v31a5 5 0 0 1-5 5H8a5 5 0 0 1-5-5z" /></svg><span class="egg-hl">pr-description/</span></div>
          <p class="egg-label">Folder name = skill name</p>
        </div>
      </div>
      <script>
        (() => {
          const DUR = 7.45;
          const root = document.querySelector('[data-composition-id="s03-folder"] .s03');
          const q = (s) => root.querySelector(s);
          const all = (s) => [...root.querySelectorAll(s)];
          const lines = all(".egg-svg path");
          lines.forEach((p) => { p.setAttribute("pathLength", "1"); p.style.strokeDasharray = "1 1.1"; });
          gsap.set(lines, { strokeDashoffset: 1.02 });

          const tl = gsap.timeline({ paused: true });
          // "Step one"
          Egg.fadeUp(tl, q(".egg-eyebrow"), 0.2, { y: 16 });
          Egg.fadeUp(tl, q(".ttl"), 0.35, { y: 30 });
          Egg.fadeUp(tl, q(".term"), 0.6, { y: 30 });
          // "in dot claude slash skills"
          Egg.pop(tl, q(".r1"), 1.5);
          tl.to(q(".ln1"), { strokeDashoffset: 0, duration: 0.35, ease: Egg.EASE.draw }, 2.25);
          Egg.pop(tl, q(".r2"), 2.55);
          Egg.highlight(tl, q(".r2 .egg-hl"), 3.0);
          // "make a folder named after the skill": the command types in
          Egg.typeOn(tl, q(".cmd .a"), 3.75, { cps: 26 });
          // "P R description": the name, and the new folder pops into the tree
          Egg.typeOn(tl, q(".cmd .b"), 5.95, { cps: 22 });
          tl.to(q(".ln2"), { strokeDashoffset: 0, duration: 0.35, ease: Egg.EASE.draw }, 6.3);
          Egg.pop(tl, q(".r3"), 6.6);
          Egg.highlight(tl, q(".r3 .egg-hl"), 6.75);
          Egg.fadeUp(tl, q(".egg-label"), 6.8, { y: 20, dur: 0.4 });

          Egg.fadeOut(tl, [q(".egg-eyebrow"), q(".ttl"), q(".term"), q(".egg-svg"), ...all(".row"), q(".egg-label")], DUR - 0.3, { dur: 0.3 });
          window.__timelines["s03-folder"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
