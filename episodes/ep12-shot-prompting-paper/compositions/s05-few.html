        (() => {
          const r = document.querySelector('[data-composition-id="s05-few"]');
          const q = (s) => r.querySelector(s), E = (t) => +(t - 36.4).toFixed(3);
          const tl = gsap.timeline({ paused: true });

          FX.words(tl, q(".s05-h .w"), E(36.55), { dur: 0.4 });
          FX.words(tl, q(".s05-sub .w"), E(37.3), { dur: 0.4, y: 20 });
          tl.fromTo(q(".s05-lo"), { opacity: 0, y: 120, rotation: 0 }, { opacity: 1, y: 0, rotation: -2, duration: 0.55, ease: "back.out(1.3)" }, E(38.1));

          tl.to(q(".s05-lo"), { x: 284, y: 20, rotation: 6, duration: 0.55, ease: "power3.inOut" }, E(43.15));
          tl.fromTo(q(".s05-me"), { opacity: 0, y: 160, rotation: 4 }, { opacity: 1, y: -10, rotation: 0, duration: 0.6, ease: "back.out(1.3)" }, E(43.24));
