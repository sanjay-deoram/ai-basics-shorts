          r.querySelectorAll(".s04-dots i").forEach((d, i) => {

          // back to paper: replies copy the format, the scale has one label

          FX.words(tl, r.querySelectorAll(".s04-h2 .w"), [E(31.2), E(31.75), E(32.1)]);

          tl.fromTo(q(".s04-rep2"), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "back.out(1.5)" }, E(31.9));
