  <body>
    <template>
      <!-- s04 · Step 1, upload. Lease.pdf drops in; its five lines peel off into chunk cards ("splits it into chunks");
           each chunk drops through the embedding model and lands as a row of a Postgres table with its vector (real
           first numbers, all-MiniLM-L6-v2) ("turns each chunk into a vector, and saves them as rows"). "Your vector
           database." Then "Postgres + pgvector". The chunks are one short sentence each for legibility (footnote: real
           chunks are about a paragraph). The table (name line y 735, frame y 775–1195) stays on screen at the end:
           s05 opens on the same frame. Avatar: small top right (narrator.html "corner"); everything above y 485 stays
           left of x 830. Voiceover: 0.3 "When you upload a PDF, the app splits it into chunks," 4.1 "turns each chunk
           into a vector," 6.2 "and saves them as rows in a table." 8.35 "That's your vector database. Here, it's
           just Postgres with P G vector." -->
      <style>
        #root { position: absolute; inset: 0; }
        .s04 .egg-eyebrow { position: absolute; left: 90px; top: 232px; }
        .s04 .fname { position: absolute; left: 110px; width: 200px; top: 574px; text-align: center; font: 400 26px/1 var(--f-mono); color: var(--ink); }
        .s04 .ck { position: absolute; left: 360px; height: 46px; padding: 0 12px; display: flex; align-items: center; font: 400 30px/1 var(--f-body); color: var(--ink); background: var(--eggshell); border: 2px solid var(--ink); border-radius: 10px; white-space: nowrap; transform-origin: 0 50%; }
        .s04 .model { position: absolute; left: 340px; width: 400px; top: 638px; text-align: center; font: 300 40px/1 var(--f-display); letter-spacing: -0.02em; color: var(--ink); }
        .s04 .tname { position: absolute; left: 90px; top: 733px; font: 400 28px/1.2 var(--f-mono); color: var(--ink); white-space: nowrap; }
        .s04 .tname i { font-style: normal; color: var(--graphite); }
        .s04 .th { position: absolute; top: 795px; font: 400 24px/1 var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--graphite); }
        .s04 .row { position: absolute; left: 90px; width: 860px; height: 72px; border-radius: 6px; }
        .s04 .row .id { position: absolute; left: 0; width: 60px; top: 21px; text-align: center; font: 400 30px/1 var(--f-mono); color: var(--graphite); }
        .s04 .row .ct { position: absolute; left: 76px; top: 19px; font: 400 30px/1.15 var(--f-body); color: var(--ink); white-space: nowrap; }
        .s04 .row .vc { position: absolute; left: 526px; top: 22px; font: 400 28px/1 var(--f-mono); color: var(--ink); white-space: pre; }
        .s04 .egg-label { position: absolute; left: 90px; width: 860px; top: 1248px; }
        .s04 .pg { position: absolute; left: 0; right: 0; top: 1356px; display: flex; justify-content: center; }
        .s04 .pg .egg-chip { align-self: center; color: var(--ink); }
        .s04 .foot { position: absolute; left: 0; right: 0; top: 1452px; text-align: center; }
      </style>
      <div data-hf-id="hf-bigy" id="root" data-composition-id="s04-upload" data-width="1080" data-height="1920">
        <div data-hf-id="hf-ijpb" class="egg-scene s04">
          <span data-hf-id="hf-7t2z" class="egg-eyebrow">Step 1 · Upload</span>
          <div data-hf-id="hf-hnc7" class="rows"></div>
          <svg data-hf-id="hf-tw6w" class="egg-svg" viewBox="0 0 1080 1920" aria-hidden="true">
            <g data-hf-id="hf-qnzw" class="pdf">
              <path data-hf-id="hf-syi5" class="ink thin" d="M110 300 L270 300 L310 340 L310 560 L110 560 Z M270 300 L270 340 L310 340" />
              <g data-hf-id="hf-ghwr" class="plines" />
            </g>
            <rect data-hf-id="hf-nvij" class="ink thin box" x="340" y="612" width="400" height="92" rx="26" />
            <g data-hf-id="hf-6ruy" class="grid">
              <rect data-hf-id="hf-wzkr" class="ink thin" data-draw="0" data-dur="0.8" x="90" y="775" width="860" height="420" rx="18" />
              <path data-hf-id="hf-57iz" class="ink thin" data-draw="1" data-dur="0.5" d="M90 835 L950 835" />
              <path data-hf-id="hf-47q1" class="ink thin" data-draw="2" data-dur="0.35" d="M150 775 L150 1195" />
              <path data-hf-id="hf-h7c0" class="ink thin" data-draw="2" data-dur="0.35" d="M600 775 L950 775 M600 775 L600 1195" />
            </g>
            <path data-hf-id="hf-8ur0" class="seps" d="M90 907 L950 907 M90 979 L950 979 M90 1051 L950 1051 M90 1123 L950 1123" />
          </svg>
          <span data-hf-id="hf-mfo6" class="fname">Lease.pdf</span>
          <div data-hf-id="hf-26qt" class="cks" data-layout-allow-overlap=""></div>
          <span data-hf-id="hf-7c3c" class="model">Embedding model</span>
          <span data-hf-id="hf-en4f" class="tname">lease_chunks <i data-hf-id="hf-o8q5">· embedding vector(384)</i></span>
          <span data-hf-id="hf-iy8q" class="th" style="left:104px">id</span>
          <span data-hf-id="hf-kr1w" class="th" style="left:166px">content</span>
          <span data-hf-id="hf-q5dy" class="th" style="left:616px">embedding</span>
          <p data-hf-id="hf-3uai" class="egg-label">Your vector database.</p>
          <div data-hf-id="hf-knbj" class="pg"><span data-hf-id="hf-3ry1" class="egg-chip">Postgres + pgvector</span></div>
          <span data-hf-id="hf-vemg" class="foot egg-foot">Example · real chunks are about a paragraph long</span>
        </div>
      </div>
      <script>
        (() => {
          const DUR = 13.8;
          // The lease's chunks and the first two numbers of each one's real vector (all-MiniLM-L6-v2), see STORYBOARD.md
          const CH = [
            ["Rent is due on the 1st.", "[0.001, -0.037, …]"],
            ["Pets are not allowed.", "[0.073, 0.057, …]"],
            ["No smoking indoors.", "[0.135, 0.068, …]"],
            ["Deposit returned in 30 days.", "[0.038, 0.026, …]"],
            ["Quiet hours: 10 pm to 8 am.", "[-0.021, -0.019, …]"],
          ];
          const LINE_Y = [362, 402, 442, 482, 522], CARD_Y = [300, 354, 408, 462, 516], ROW_Y = [835, 907, 979, 1051, 1123];
          const root = document.querySelector('[data-composition-id="s04-upload"] .s04');
          const q = (s) => root.querySelector(s);
          const all = (s) => [...root.querySelectorAll(s)];
          q(".plines").innerHTML = LINE_Y.map((y, i) => `<path class="ink thin pl" d="M136 ${y} L${[284, 262, 276, 284, 250][i]} ${y}" />`).join("");
          q(".cks").innerHTML = CH.map(([t], i) => `<span class="ck" style="top:${CARD_Y[i]}px" data-layout-allow-overlap="">${t}</span>`).join("");
          q(".rows").innerHTML = CH.map(([t, v], i) => `<div class="row" style="top:${ROW_Y[i]}px"><span class="id">${i + 1}</span><span class="ct">${t}</span><span class="vc">${v}</span></div>`).join("");
          q(".seps").style.cssText = "fill:none;stroke:#ebe8e4;stroke-width:2";
          const pls = all(".pl"), cks = all(".ck"), rows = all(".row");
          const box = q(".box");
          [box, ...pls].forEach((p) => { p.setAttribute("pathLength", "1"); p.style.strokeDasharray = "1 1.1"; });
          gsap.set([box, ...pls], { strokeDashoffset: 1.02 });
          gsap.set(q(".seps"), { opacity: 0 });

          const tl = gsap.timeline({ paused: true });
          Egg.fadeUp(tl, q(".egg-eyebrow"), 0.05);

          // a PDF is uploaded
          tl.fromTo(q(".pdf"), { opacity: 0, y: -240, rotation: -12, svgOrigin: "210 430" }, { opacity: 1, y: 0, rotation: -3, svgOrigin: "210 430", duration: 0.6, ease: Egg.EASE.rise }, 0.3);
          tl.fromTo(q(".fname"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, rotation: -3, duration: 0.45, ease: Egg.EASE.enter }, 0.65);
          tl.to(pls, { strokeDashoffset: 0, duration: 0.25, ease: Egg.EASE.draw, stagger: 0.1 }, 0.8);
          // the model and an empty table wait below
          tl.to(box, { strokeDashoffset: 0, duration: 0.7, ease: Egg.EASE.draw }, 1.2);
          Egg.fadeUp(tl, q(".model"), 1.5, { y: 12 });
          Egg.draw(tl, q(".grid"), 1.4, { gap: 0.25 });
          tl.to(q(".seps"), { opacity: 1, duration: 0.3, ease: "none" }, 2.0);
          Egg.fadeUp(tl, [q(".tname"), ...all(".th")], 1.7, { y: 12, stagger: 0.08 });

          // "splits it into chunks": each line of the page peels off into a chunk
          cks.forEach((c, i) => {
            tl.fromTo(c, { opacity: 0, x: 136 - 360, y: LINE_Y[i] - 23 - CARD_Y[i], scaleX: 0.3 }, { opacity: 1, x: 0, y: 0, scaleX: 1, duration: 0.5, ease: Egg.EASE.move }, 2.4 + i * 0.18);
          });
          tl.to(pls, { opacity: 0.3, duration: 0.3, ease: "none" }, 2.6);

          // "turns each chunk into a vector, and saves them as rows": through the model, into the table
          cks.forEach((c, i) => {
            const t = 4.15 + i * 0.35;
            tl.to(c, { x: 130, y: 658 - CARD_Y[i] - 23, scaleX: 0.25, scaleY: 0.6, opacity: 0, duration: 0.3, ease: "power2.in" }, t);
            tl.fromTo(box, { scale: 1 }, { scale: 1.04, svgOrigin: "540 658", duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, t + 0.25);
            tl.fromTo(rows[i].querySelector(".ct"), { opacity: 0, y: -40 }, { opacity: 1, y: 0, duration: 0.35, ease: Egg.EASE.enter }, t + 0.3);
            Egg.pop(tl, rows[i].querySelector(".id"), t + 0.3, { dur: 0.4 });
            Egg.typeOn(tl, rows[i].querySelector(".vc"), t + 0.38, { cps: 44 });
          });
          // the rows are saved
          rows.forEach((r, i) => tl.fromTo(r, { backgroundColor: "rgba(245, 243, 241, 0)" }, { backgroundColor: "rgba(245, 243, 241, 1)", duration: 0.2, ease: "none", yoyo: true, repeat: 1, immediateRender: false }, 7.0 + i * 0.12));

          // that table is the vector database
          Egg.fadeUp(tl, q(".egg-label"), 8.4);
          tl.to([q(".pdf"), q(".fname"), q(".box"), q(".model")], { opacity: 0.25, duration: 0.4, ease: "none" }, 8.4);
          Egg.pop(tl, q(".pg .egg-chip"), 10.3);
          Egg.fadeUp(tl, q(".foot"), 10.9, { y: 10 });

          // leave the table: s05 starts on this frame
          Egg.fadeOut(tl, [q(".egg-eyebrow"), q(".pdf"), q(".fname"), q(".box"), q(".model"), q(".egg-label"), q(".pg"), q(".foot")], DUR - 0.35);
          window.__timelines["s04-upload"] = tl;
        })();
      </script>
    </template>
  </body>
