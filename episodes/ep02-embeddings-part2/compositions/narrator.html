<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <script type="application/json" class="sfx-cues">[
      {"t":0.15,"sfx":"pop","vol":0.28},
      {"t":3.75,"sfx":"whoosh-short","vol":0.18},
      {"t":24.1,"sfx":"pop","vol":0.16},
      {"t":38.2,"sfx":"pop","vol":0.16},
      {"t":72.5,"sfx":"pop","vol":0.16},
      {"t":82.6,"sfx":"pop","vol":0.16},
      {"t":93.9,"sfx":"pop","vol":0.24},
      {"t":97,"sfx":"sparkle","vol":0.2,"dur":1.2},
      {"t":101.1,"sfx":"whoosh-short","vol":0.2}
    ]</script>
  </head>
  <body>
    <template>
      <!-- Narrator · one Spark for the whole episode, mouth driven by the voiceover (assets/lipsync.js).
           States: presenter (pops out large and talks), corner (small, top-right of the social-safe box,
           talks over the visuals), actor (plays a role in a scene), hidden (a scene's own pointer Spark
           is on screen). Corner = x 820–940, y 240–360: below platform top bars, above the right-side
           buttons, clear of every scene's content. Edit PLACES / PATH / MOODS to restage. -->
      <style>
        #root { position: absolute; inset: 0; pointer-events: none; }
        .nar .spark { --s: 280px; position: absolute; left: 0; top: 0; }
      </style>
      <div data-hf-id="hf-mebu" id="root" data-composition-id="narrator" data-width="1080" data-height="1920">
        <div data-hf-id="hf-3ub1" class="egg-layer nar" data-layout-allow-overflow=""><div data-hf-id="hf-pwu6" class="spark" data-mood="talk"></div></div>
      </div>
      <script>
        (() => {
          const BASE = 280;
          const PLACES = {
            title: { x: 540, y: 980, s: 1 },        // s01 presenter under the hook
            corner: { x: 880, y: 300, s: 0.43 },    // background narrator
            actor: { x: 540, y: 860, s: 0.643 },    // s12: Claude, the prompt flies into Spark
            end: { x: 540, y: 470, s: 0.9 },        // s13 presenter above the recap
          };
          // [episode time, place, how]  how: pop (appear) | move | hide. A scene's own pointer Spark takes over
          // while the narrator is hidden.
          const PATH = [
            [0.15, "title", "pop"],
            [3.75, "corner", "move"],
            [19.7, "corner", "hide"],   // s03 pointer
            [24.1, "corner", "pop"],
            [33, "corner", "hide"],   // s04 pointer
            [38.2, "corner", "pop"],
            [65.1, "corner", "hide"],   // s06 pointer
            [72.5, "corner", "pop"],
            [79.5, "corner", "hide"],   // s07 pointer
            [82.6, "corner", "pop"],
            [90.9, "corner", "hide"],   // s08 pointer
            [93.9, "actor", "pop"],   // s09: Claude
            [101.1, "end", "move"],
          ];
          const MOODS = [[97.4, "talkhappy"], [101.1, "talk"], [105.1, "talkhappy"]];

          const root = document.querySelector('[data-composition-id="narrator"] .nar');
          Egg.mountSparks(root);
          const spark = root.querySelector(".spark");
          const at = (p) => ({ x: p.x - BASE / 2, y: p.y - BASE / 2, scale: p.s });

          const tl = gsap.timeline({ paused: true });
          gsap.set(spark, { ...at(PLACES.title), scale: 0, transformOrigin: "50% 50%" });
          PATH.forEach(([t, place, how]) => {
            const p = at(PLACES[place]);
            if (how === "pop") {
              tl.set(spark, { x: p.x, y: p.y }, t);
              tl.fromTo(spark, { scale: 0 }, { scale: p.scale, duration: 0.5, ease: "back.out(2.2)", immediateRender: false }, t);
            } else if (how === "hide") {
              tl.to(spark, { scale: 0, duration: 0.3, ease: "power2.in" }, t);
            } else {
              tl.to(spark, { x: p.x, y: p.y, scale: p.scale, duration: 0.6, ease: "back.out(1.3)" }, t);
            }
          });
          // the answer scene: Spark swells as the prompt lands
          tl.to(spark, { scale: PLACES.actor.s * 1.08, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 3 }, 97);
          MOODS.forEach(([t, mood]) => Egg.sparkMood(tl, spark, mood, t, { hop: false }));
          Egg.sparkIdle(tl, spark, 0, 107.5);
          Egg.lipsync(tl, spark, 0, 0, 107.5);
          window.__timelines["narrator"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
