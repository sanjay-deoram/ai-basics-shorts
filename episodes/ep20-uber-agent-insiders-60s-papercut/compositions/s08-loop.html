<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <script type="application/json" class="sfx-cues">[
      {"t":0.15,"sfx":"air","vol":0.14},
      {"t":0.5,"sfx":"claude","vol":0.12},
      {"t":1.5,"sfx":"key","vol":0.12,"dur":0.8},
      {"t":3.4,"sfx":"whoosh-short","vol":0.12},
      {"t":3.9,"sfx":"drop","vol":0.16},
      {"t":5.4,"sfx":"pop","vol":0.14},
      {"t":6.3,"sfx":"error","vol":0.06},
      {"t":7.8,"sfx":"stream","vol":0.1,"dur":1.0},
      {"t":8.7,"sfx":"chime","vol":0.18,"dur":1.8}
    ]</script>
  </head>
  <body>
    <template>
      <!-- s08 · Payoff · the loop. An analyst (often with an LLM: the Claude mark) spots a new pattern, "agent splits the
           file into small uploads" (illustrative); it drops into the safeguards list as a new rule. Then the loop
           (Detect → Hunt → Safeguard → New behavior) spins: "Constraints create new behaviors." Hard stop.
           Voiceover: 0.17 "Then analysts hunt for behavior nobody expected and feed it back into the safeguards."
           5.26 "But new limits create new behavior, so the loop never ends." -->
      <style>
        #root { position: absolute; inset: 0; }
        .s08 .hd { top: 316px; }
        .s08 .hd .l { display: block; white-space: nowrap; }
        .s08 .an { left: 90px; top: 548px; width: 860px; height: 170px; }
        .s08 .an .who { position: absolute; left: 34px; top: 28px; display: flex; align-items: center; gap: 12px; font: 600 30px/1 var(--f-t); color: var(--mu); }
        .s08 .an .who .cc-spark { width: 34px; height: 34px; }
        .s08 .an p { position: absolute; left: 34px; top: 84px; margin: 0; font: 400 30px/1.3 var(--f-m); color: var(--ink); white-space: nowrap; }
        .s08 .an .ill { position: absolute; right: 30px; top: 22px; }
        .s08 .sg { left: 90px; top: 752px; width: 860px; }
        .s08 .lp { position: absolute; left: 90px; top: 1000px; width: 300px; height: 300px; }
        .s08 .lp .rot { position: absolute; inset: 0; }
        .s08 .lp .c { position: absolute; left: 110px; top: 110px; width: 80px; height: 80px; border-radius: 50%; background: var(--blue); }
        .s08 .fin { left: 430px; top: 1060px; width: 520px; color: var(--ink); font-weight: 700; font-size: 46px; line-height: 1.15; }
      </style>
      <div id="root" data-composition-id="s08-loop" data-width="1080" data-height="1920">
        <div class="a-scene s08">
          <p class="a-eyebrow">The loop</p>
          <h2 class="a-h2 hd"><span class="l">A loop that</span><span class="l"><span class="a-tint" data-layout-allow-overlap=""><span data-layout-allow-overlap="">never ends</span><span class="on" data-layout-allow-overlap="">never ends</span></span></span></h2>
          <div class="a-card an"><span class="who"><span class="cc-spark"></span>Analyst + an LLM · new pattern</span><span class="a-tag gray ill">illustrative</span>
            <p><span class="ty">agent splits the file into small uploads</span></p></div>
          <div class="a-win sg"><div class="bar"><i></i><i></i><i></i><span class="ttl">Safeguards · rules</span></div>
            <div class="a-row done"><span class="id">rule 1</span><span>destination not on the allowed list</span></div>
            <div class="a-row hot nw"><span class="id">rule 2</span><span>many small uploads to one site</span></div>
          </div>
          <div class="lp"><svg class="rot" viewBox="0 0 300 300" aria-hidden="true"><circle class="a-ink blue ring" cx="150" cy="150" r="120" /><path class="a-ink blue" d="M262 128 L272 152 L292 136" /></svg><div class="c"></div></div>
          <p class="a-sub fin">Constraints create <span class="a-tint" data-layout-allow-overlap=""><span data-layout-allow-overlap="">new behaviors.</span><span class="on" data-layout-allow-overlap="">new behaviors.</span></span></p>
        </div>
      </div>
      <script>
        (() => {
          const root = document.querySelector('[data-composition-id="s08-loop"] .s08');
          const q = (s) => root.querySelector(s);
          const ring = q(".ring");
          ring.setAttribute("pathLength", "1"); ring.style.strokeDasharray = "0.85 0.15";
          gsap.set([q(".an"), q(".sg"), q(".nw"), q(".lp"), q(".fin")], { opacity: 0 });
          const tl = gsap.timeline({ paused: true });
          Apple.rise(tl, q(".a-eyebrow"), 0.12, { y: 16 });
          Apple.rise(tl, q(".hd"), 0.2, { y: 24, dur: 0.8 });
          // "Then analysts hunt for behavior nobody expected"
          Apple.rise(tl, q(".an"), 0.45, { y: 30, dur: 0.6 });
          Egg.typeOn(tl, q(".ty"), 1.5, { cps: 36 });
          // "and feed it back into the safeguards"
          Apple.rise(tl, q(".sg"), 3.3, { y: 30, dur: 0.5 });
          tl.fromTo(q(".nw"), { opacity: 0, y: -120 }, { opacity: 1, y: 0, duration: 0.55, ease: "expo.out" }, 3.85);
          // "But new limits create new behavior"
          Apple.zoom(tl, q(".lp"), 5.4, { from: 0.8, dur: 0.5 });
          Apple.rise(tl, q(".fin"), 6.3, { y: 16, dur: 0.6 });
          // "so the loop never ends"
          tl.fromTo(q(".rot"), { rotation: 0 }, { rotation: 540, duration: 4.4, ease: "power1.inOut", transformOrigin: "50% 50%" }, 5.6);
          Apple.tint(tl, q(".hd .a-tint"), 7.9, { dur: 0.4 });
          Apple.tint(tl, q(".fin .a-tint"), 8.3, { dur: 0.5 });
          window.__timelines["s08-loop"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
