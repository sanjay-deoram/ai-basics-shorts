<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <!-- Sound cues (seconds from scene start). Run node tools/build-sfx.mjs after editing. -->
    <script type="application/json" class="sfx-cues">[
      {"t":0.3,"sfx":"pop","vol":0.22},
      {"t":0.8,"sfx":"typing","vol":0.25,"dur":0.6},
      {"t":1.7,"sfx":"click","vol":0.25},
      {"t":2.6,"sfx":"click","vol":0.25},
      {"t":3.5,"sfx":"click","vol":0.25},
      {"t":4.3,"sfx":"sparkle","vol":0.2,"dur":1.2},
      {"t":5.4,"sfx":"pop","vol":0.25}
    ]</script>
  </head>
  <body>
    <template>
      <!-- s06 · Live cost example with a real question and real token counts.
           Question "What does the ChatGPT Plus plan include?" and the 46-word answer below (checked against
           chatgpt.com/pricing and help.openai.com "What is ChatGPT Plus?", 2026-10-06), counted with OpenAI's open
           tokenizer for GPT-4o (o200k_base, gpt-tokenizer 3.4.0): prompt 16 tokens (incl. chat message framing),
           answer 65 tokens. GPT-4o API price (developers.openai.com/api/docs/pricing, 2026-10-06): $2.50 in / $10.00 out per 1M.
           16 × 2.50 / 1M = $0.00004 · 65 × 10 / 1M = $0.00065 · total $0.00069 · × 10,000 = $6.90 -->
      <style>
        #root { position: absolute; inset: 0; }
        .s06 .egg-safe { justify-content: flex-start; }
        .s06 .head { display: flex; flex-direction: column; gap: 18px; }
        .s06 .q { position: absolute; right: 130px; top: 490px; background: var(--taupe); border-radius: 30px; padding: 18px 28px; font: 400 32px/1.3 var(--f-body); color: var(--ink); }
        .s06 .a { position: absolute; left: 90px; right: 170px; top: 588px; background: var(--eggshell); border: 2px solid var(--stone); border-radius: 30px; padding: 20px 28px; font: 400 26px/1.36 var(--f-body); color: var(--ink); }
        .s06 .bill { position: absolute; left: 90px; right: 130px; top: 862px; gap: 20px; padding: 32px 40px; }
        .s06 .line { display: grid; grid-template-columns: 130px minmax(0, 1fr) auto; align-items: baseline; gap: 18px; }
        .s06 .line .k { font: 400 34px/1.2 var(--f-body); color: var(--ink); }
        .s06 .line .f { font: 400 25px/1.3 var(--f-mono); color: var(--smoke); }
        .s06 .line .v { font: 300 46px/1 var(--f-display); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; text-align: right; }
        .s06 .rule { display: block; height: 2px; background: var(--ink); transform-origin: 0 50%; }
        .s06 .line.total .k { font-weight: 500; }
        .s06 .line.total .f { color: var(--ink); font-family: var(--f-body); font-size: 30px; }
        .s06 .scale { position: absolute; left: 90px; right: 130px; top: 1208px; flex-direction: row; align-items: center; justify-content: space-between; gap: 24px; padding: 30px 40px; }
        .s06 .scale .txt { display: flex; flex-direction: column; gap: 10px; }
        .s06 .scale .big { font: 300 88px/1 var(--f-display); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
        .s06 .src { position: absolute; left: 90px; right: 130px; top: 1438px; }
        .s06 .spark { --s: 150px; }
      </style>
      <div id="root" data-composition-id="s06-math" data-width="1080" data-height="1920">
        <div class="egg-scene s06">
          <div class="q">What does the ChatGPT Plus plan include?</div>
          <div class="a">ChatGPT Plus costs $20 a month. You get everything in Go, plus advanced reasoning with GPT-6, more messages and uploads, better image creation, more deep research, memory and context, Projects, scheduled tasks and custom GPTs, more Codex usage, and ChatGPT Work on desktop, web and mobile.</div>
          <div class="egg-card bill">
            <span class="egg-card-kicker">GPT-4o &#183; $2.50 in / $10 out per 1M tokens</span>
            <div class="line l1"><span class="k">Prompt</span><span class="f">16 tokens &#215; $2.50 &#247; 1M</span><span class="v v1">$0</span></div>
            <div class="line l2"><span class="k">Answer</span><span class="f">65 tokens &#215; $10 &#247; 1M</span><span class="v v2">$0</span></div>
            <i class="rule"></i>
            <div class="line total"><span class="k">Total</span><span class="f"><span class="egg-hl">under 1/10 of a cent</span></span><span class="v v3">$0</span></div>
          </div>
          <div class="egg-card taupe scale">
            <div class="txt">
              <span class="egg-card-kicker">Ask it 10,000 times a day</span>
              <span class="big n-day">$0.00</span>
            </div>
            <div class="spark"></div>
          </div>
          <span class="src egg-foot">Counted with OpenAI&#8217;s GPT-4o tokenizer &#183; OpenAI API price, Oct 2026</span>
          <div class="egg-safe">
            <div class="head">
              <span class="egg-eyebrow">Live example</span>
              <h2 class="egg-title">What does one question cost?</h2>
            </div>
          </div>
        </div>
      </div>
      <script>
        (() => {
          const root = document.querySelector('[data-composition-id="s06-math"] .s06');
          Egg.mountSparks(root);
          const q = (s) => root.querySelector(s);
          const spark = q(".spark");
          // counts run in millionths of a dollar: GSAP rounds tiny decimals while tweening
          const usd = (d) => (v) => "$" + (v / 1e6).toFixed(d);

          const tl = gsap.timeline({ paused: true });
          Egg.fadeUp(tl, root.querySelectorAll(".head > *"), 0.05);
          Egg.fadeUp(tl, q(".q"), 0.3, { y: 20 });
          Egg.fadeUp(tl, q(".a"), 0.8, { y: 20 });
          Egg.fadeUp(tl, q(".bill"), 1.4);
          Egg.fadeUp(tl, q(".l1"), 1.6, { y: 16 });
          Egg.count(tl, q(".v1"), 0, 40, 1.7, { dur: 0.6, fmt: usd(5) });
          Egg.fadeUp(tl, q(".l2"), 2.5, { y: 16 });
          Egg.count(tl, q(".v2"), 0, 650, 2.6, { dur: 0.6, fmt: usd(5) });
          tl.fromTo(q(".rule"), { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: Egg.EASE.move }, 3.3);
          Egg.fadeUp(tl, q(".total"), 3.4, { y: 16 });
          Egg.count(tl, q(".v3"), 0, 690, 3.5, { dur: 0.7, fmt: usd(5) });
          Egg.highlight(tl, q(".total .egg-hl"), 4.3);
          Egg.fadeUp(tl, q(".scale"), 5.2);
          Egg.count(tl, q(".n-day"), 0, 6.9, 5.4, { dur: 1.0, fmt: (v) => "$" + v.toFixed(2) });
          Egg.pop(tl, spark, 5.4);
          Egg.sparkIdle(tl, spark, 5.4, 8);
          Egg.sparkMood(tl, spark, "explain", 5.8);
          Egg.fadeUp(tl, q(".src"), 5.9, { y: 10 });
          Egg.fadeOut(tl, [q(".q"), q(".a"), q(".bill"), q(".scale"), q(".src"), q(".egg-safe")], 7.65);
          window.__timelines["s06-math"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
