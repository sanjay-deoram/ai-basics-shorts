<html>
  <head>

    <script type="application/json" class="sfx-cues">[
      {"t":0.3,"sfx":"tick","vol":0.14},
      {"t":0.5,"sfx":"pop","vol":0.2},
      {"t":0.66,"sfx":"zoom","vol":0.14},

      {"t":2.26,"sfx":"success","vol":0.16},
      {"t":2.56,"sfx":"tick","vol":0.18},

      {"t":2.95,"sfx":"tick","vol":0.18},
      {"t":3.08,"sfx":"tick","vol":0.18},
      {"t":3.26,"sfx":"pop","vol":0.16},
      {"t":3.86,"sfx":"error","vol":0.18},

  <body>
    <template>
      <!-- s06 · Layer 3 · Blocking checks. Mint: the fix badge, then the pull request's checks card: security review, lint,
           type checks, tests on every platform, build, "and dozens more", and Claude's review. Each starts as a spinning
           ring; security review passes on its name, the rest tick through on "and checks" ("Checks" lands). Claude's
           review shows "1 open finding" (the Important one from s05). On "blocks the merge" ("block." lands) the Merge
           button's lock snaps shut, it greys out and shakes: blocked until the finding is fixed or answered. Whip out.
           Badge bottom-left (narrator).
           Voiceover (scene-local, +0.36 for the whip): 0.54 "Layer three: security review and checks. Any open finding
           blocks the merge." -->
      <style>
        #s06-root .bg { background-color: #d3f5df; }
        #s06-root .rl-hd { --acc: #12a150; }
        #s06-root .fix { left: 90px; top: 412px; --acc: #0d0d0c; }
        #s06-root .pnl { top: 496px; height: 600px; }
        #s06-root .ck { position: absolute; left: 16px; width: 828px; height: 66px; border-radius: 16px; }
        #s06-root .ck .hl { position: absolute; inset: 0; border-radius: 16px; opacity: 0; }
        #s06-root .ck .nm { position: absolute; left: 16px; top: 13px; display: flex; align-items: center; gap: 14px; font: 500 34px/40px var(--f-display); letter-spacing: -0.02em; color: #0d0d0c; white-space: nowrap; }
        #s06-root .ck .nm.mute { color: #8a857d; }
        #s06-root .ck .nm svg, #s06-root .ck .nm img { width: 36px; height: 36px; }
        #s06-root .ck .nm svg { fill: none; stroke: #0d0d0c; stroke-width: 3; stroke-linejoin: round; }
        #s06-root .ck .sts { position: absolute; left: 764px; top: 10px; width: 46px; height: 46px; }
        #s06-root .ck .sts > * { position: absolute; inset: 0; width: 46px; height: 46px; }
        #s06-root .ring circle { fill: none; stroke: #8a857d; stroke-width: 4; stroke-dasharray: 8 8; }
        #s06-root .pass, #s06-root .open { border-radius: 50%; display: grid; place-items: center; }
        #s06-root .pass { background: #12a150; }
        #s06-root .pass svg, #s06-root .open svg { width: 26px; height: 26px; fill: none; stroke: #fff; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
        #s06-root .open { background: #e11d48; }
        #s06-root .ck .of { position: absolute; right: 90px; top: 19px; font: 400 28px/1 var(--f-mono); color: #e11d48; white-space: nowrap; }
        #s06-root .ln { position: absolute; left: 32px; width: 796px; height: 2px; background: #eeebe6; }
        #s06-root .mg { position: absolute; left: 90px; top: 1134px; display: flex; align-items: center; gap: 16px; height: 80px; padding: 0 36px 0 28px; border-radius: 9999px;
          background: #0d0d0c; color: #fff; font: 600 36px/1 var(--f-display); letter-spacing: -0.02em; box-shadow: 0 16px 32px -16px rgba(0, 0, 0, 0.4); }
        #s06-root .mg svg { width: 34px; height: 34px; fill: none; stroke: currentColor; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; overflow: visible; }
        #s06-root .why { position: absolute; left: 340px; top: 1136px; width: 610px; font: 500 34px/1.25 var(--f-display); letter-spacing: -0.02em; color: #0d0d0c; }
      </style>
      <div id="s06-root" data-composition-id="s06-gates" data-width="1080" data-height="1920">
        <div class="rl">
          <div class="rl-cam">
            <div class="rl-bg grid bg"></div>
            <div class="rl-eye">// layer 3 · blocking checks</div>
            <span class="trk"><i class="on"></i><i class="on"></i><i class="on"></i><i></i></span>
            <div class="rl-hd"><span class="ln"><span class="w">Checks </span><em class="w">block.</em></span></div>
            <div class="rstamp sm fix" data-layout-allow-overlap=""><i><svg class="thin" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="13.8" rx="4.8" ry="6" /><path d="M12 8.4V19.8M9 5.4l1.5 2.7M15 5.4l-1.5 2.7M7.2 11.4H3M7.2 15.6H3M16.8 11.4H21M16.8 15.6H21M8.1 18.6l-3.3 2.7M15.9 18.6l3.3 2.7" /></svg></i>Fix: empty config crash</div>
            <div class="wc pnl"><span class="k">// checks on this pull request</span><div class="cks"></div></div>
            <div class="mg"><svg viewBox="0 0 34 34" aria-hidden="true"><rect x="6" y="15" width="22" height="16" rx="3" /><path class="shk" d="M11 15 V10 A6 6 0 0 1 23 10 V15" /></svg>Merge</div>
            <p class="why">Blocked until it's <span class="egg-hl">fixed or answered</span></p>
          </div>
        </div>
      </div>
      <script>
        (() => {
          const root = document.getElementById("s06-root");
          const q = (s) => root.querySelector(s);
          const all = (s) => [...root.querySelectorAll(s)];
          const cam = q(".rl-cam");
          const tl = gsap.timeline({ paused: true });
          const blur = Reel.blurFor(cam, "s06-mb");
          const SHIELD = '<svg viewBox="0 0 36 36"><path d="M18 3 L31 8 V18 C31 26 25 31 18 34 C11 31 5 26 5 18 V8 Z" /></svg>';
          // [name, icon, when it resolves (s), result]
          const CK = [
            ["Security review", SHIELD, 2.26, "pass"],
            ["Lint", "", 2.56, "pass"],
            ["Type checks", "", 2.69, "pass"],
            ["Tests, every platform", "", 2.82, "pass"],
            ["Build", "", 2.95, "pass"],
            ["…and dozens more", "", 3.08, "pass"],
            ["Claude review", '<img src="assets/claude-logo.svg" alt="">', 3.86, "open"],
          ];
          const TOP = (i) => 62 + i * 76;   // inside the card
          const TICK = '<svg viewBox="0 0 24 24"><path d="M5 12.5 L10 17.5 L19 7" /></svg>';
          const BANG = '<svg viewBox="0 0 24 24"><path d="M12 6v7.5M12 18h.01" /></svg>';
          q(".cks").innerHTML = CK.map(([n, ic, , r], i) => `<div class="ck" style="top:${TOP(i)}px"><i class="hl" style="background:${r === "open" ? "rgba(225,29,72,0.1)" : "rgba(18,161,80,0.12)"}"></i><span class="nm${i === 5 ? " mute" : ""}">${ic}${n}</span>` +
            (r === "open" ? `<span class="of">1 open finding</span>` : "") +
            `<span class="sts"><svg class="ring" viewBox="0 0 46 46"><circle cx="23" cy="23" r="19" /></svg>${r === "pass" ? `<span class="pass">${TICK}</span>` : `<span class="open">${BANG}</span>`}</span></div>` +
            (i < CK.length - 1 ? `<i class="ln" style="top:${TOP(i) + 71}px"></i>` : "")).join("");
          const cks = all(".ck");
          gsap.set([q(".trk"), q(".pnl"), q(".mg"), q(".why"), q(".of")], { opacity: 0 });
          Reel.whip(tl, cam, blur, 0, "in");

          tl.fromTo([q(".rl-eye"), q(".trk")], { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0.3);
          Reel.badge(tl, q(".fix"), 0.5);
          // the checks card, every check pending
          tl.fromTo(q(".pnl"), { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 0.66);
          tl.fromTo([...cks, ...all(".ln")], { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.25, ease: "power3.out", stagger: 0.04 }, 0.76);
          all(".ring").forEach((r) => tl.fromTo(r, { rotation: 0 }, { rotation: 360, transformOrigin: "50% 50%", duration: 4.0, ease: "none" }, 0.76));
          // "security review and checks": each resolves in turn
          tl.to(cks[0].querySelector(".hl"), { opacity: 1, duration: 0.25, ease: "none" }, 1.66);
          tl.to(cks[0].querySelector(".hl"), { opacity: 0, duration: 0.3, ease: "none" }, 2.56);
          Reel.words(tl, q(".rl-hd"), [2.56, 4.83]);
          CK.forEach(([, , t, r], i) => {
            tl.to(cks[i].querySelector(".ring"), { opacity: 0, duration: 0.12, ease: "none" }, t);
            tl.fromTo(cks[i].querySelector(r === "pass" ? ".pass" : ".open"), { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(2.4)" }, t);
          });
          tl.fromTo(q(".mg"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 3.26);
          // "Any open finding": Claude's review is still open
          tl.to(cks[6].querySelector(".hl"), { opacity: 1, duration: 0.25, ease: "none" }, 3.72);
          tl.fromTo(q(".of"), { opacity: 0, x: 20 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, 3.96);
          gsap.set(q(".shk"), { y: -5 });
          // "blocks the merge": the lock snaps shut, the button greys out
          tl.to(q(".shk"), { y: 0, duration: 0.18, ease: "power3.in" }, 4.83);
          tl.to(q(".mg"), { backgroundColor: "#c9c4bd", color: "#5f5b55", duration: 0.2, ease: "none" }, 4.91);
          Egg.shake(tl, q(".mg"), 4.91);
          tl.fromTo(q(".why"), { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, 5.06);
          Egg.highlight(tl, q(".why .egg-hl"), 5.2, { dur: 0.3 });
          Reel.whip(tl, cam, blur, 5.48, "out");

          window.__timelines["s06-gates"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
