      <style>

      <div id="s08-root" data-composition-id="s08-payoff" data-width="1080" data-height="1920">
        <div class="rl">
          <div class="rl-bg bg"></div>
          <div class="rl-eye eA">// results · claude code repo</div>
          <div class="rl-eye eB">// who approves</div>
          <div class="rl-hd hA"><span class="ln"><span class="w">More </span><span class="w">than </span><em class="w">doubled.</em></span></div>
          <div class="beatA">
            <svg class="egg-svg" viewBox="0 0 1080 1920" aria-hidden="true">
              <path class="strip" d="M150 410 H780" />
              <circle class="sd" cx="150" cy="410" r="10" /><circle class="sd" cx="360" cy="410" r="10" /><circle class="sd" cx="570" cy="410" r="10" /><circle class="sd" cx="780" cy="410" r="10" />
            </svg>
            <span class="mo" style="left:90px">jun</span><span class="mo" style="left:300px">jul</span><span class="mo" style="left:510px">aug</span><span class="mo" style="left:720px">sep</span>
            <div class="card dark">
              <div class="k">// merged pull requests</div>
              <span class="rl2" style="top:80px">June</span><i class="bar b1" style="top:86px;width:290px;background:#5f5b55"></i><span class="vl" style="left:470px;top:80px">1×</span>
              <span class="rl2" style="top:140px">Sept</span><i class="bar b2" style="top:146px;width:580px;background:#fdfcfc"></i><span class="vl" style="left:760px;top:140px">2×</span>
              <div class="rstamp sm x1" style="--acc:#12a150"><i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 7 13.5 15.5 8.5 10.5 2 17M16 7h6v6" /></svg></i>More than 2×</div>

              <div class="rstamp sm x2" style="--acc:#12a150"><i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 17 13.5 8.5 8.5 13.5 2 7M16 17h6v-6" /></svg></i>Down over 40%</div>

          <div class="rl-hd hB"><span class="ln"><span class="w">Never </span><em class="w">approves.</em></span></div>
          <div class="rl-hd hC"><span class="ln"><span class="w">Findings,</span></span><span class="ln"><span class="w">not </span><em class="w">approvals.</em></span></div>

          <span class="ap no"><svg viewBox="0 0 30 30"><path d="M6 15.5 L12 21.5 L24 9" /></svg>Approve</span>
          <svg class="egg-svg sv" viewBox="0 0 1080 1920" aria-hidden="true"><path class="stk" d="M186 626 L420 626" /></svg>
          <span class="apn">never</span>
          <div class="cm c1" style="top:680px"><div class="rstamp sm" style="--acc:#e11d48"><i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6.5v7M12 17.5h.01" /></svg></i>Important</div><p>Same crash, another file</p></div>
          <div class="cm c2" style="top:770px"><div class="rstamp sm" style="--acc:#5f5b55"><i><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" /><path d="M12 7.5V12l3 2" /></svg></i>Pre-existing</div><p>Cache never clears</p></div>
          <i class="div"></i>
          <svg class="person pp" viewBox="0 0 84 84" aria-hidden="true"><circle cx="42" cy="27" r="15" /><path d="M13 78 C13 56 26 47 42 47 C58 47 71 56 71 78" /></svg>
          <span class="who wp" style="top:918px">A person</span>
          <span class="ap yes"><svg viewBox="0 0 30 30"><path d="M6 15.5 L12 21.5 L24 9" /></svg>Approve</span>

      <script>
        (() => {
          const root = document.getElementById("s08-root");
          const q = (s) => root.querySelector(s);
          const all = (s) => [...root.querySelectorAll(s)];
          const tl = gsap.timeline({ paused: true });
          const strip = q(".strip"), stk = q(".stk");
          [strip, stk].forEach((p) => { p.setAttribute("pathLength", "1"); p.style.strokeDasharray = "1 1.1"; gsap.set(p, { strokeDashoffset: 1.02 }); });
          const B = [q(".av"), q(".wa"), q(".ap.no"), q(".apn"), q(".c1"), q(".c2"), q(".div"), q(".pp"), q(".wp"), q(".ap.yes")];
          gsap.set([...all(".mo"), q(".dark"), q(".light"), q(".ghost"), q(".foot"), ...B], { opacity: 0 });

          tl.fromTo(q(".eA"), { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0.1);
          // "In three months": June → Sept, a dot a month
          tl.to(strip, { strokeDashoffset: 0, duration: 0.65, ease: "power2.inOut" }, 0.25);
          all(".sd").forEach((d, i) => tl.fromTo(d, { scale: 0 }, { scale: 1, svgOrigin: `${150 + i * 210} 410`, duration: 0.3, ease: "back.out(2.4)" }, 0.3 + i * 0.15));
          tl.fromTo(all(".mo"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out", stagger: 0.15 }, 0.35);
          // "merged changes more than doubled"
          tl.fromTo(q(".dark"), { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 1.0);
          tl.fromTo(q(".b1"), { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 1.1);
          tl.fromTo(q(".b2"), { scaleX: 0 }, { scaleX: 1, duration: 1.0, ease: "power2.inOut" }, 1.4);
          Reel.words(tl, q(".hA"), [1.6, 1.8, 2.0]);
          Reel.badge(tl, q(".x1"), 2.5);
          // "and the rollback rate fell over forty percent"
          tl.fromTo(q(".light"), { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 3.12);
          tl.fromTo([q(".b3"), q(".b4")], { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out", stagger: 0.1 }, 3.2);
          tl.to(q(".b4"), { scaleX: 0.6, duration: 0.6, ease: "power2.inOut" }, 3.93);
          tl.fromTo(q(".ghost"), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "none" }, 4.3);
          Reel.badge(tl, q(".x2"), 4.3);
          tl.fromTo(q(".foot"), { opacity: 0 }, { opacity: 1, duration: 0.3 }, 3.3);
          tl.to([q(".hA"), q(".beatA"), q(".eA")], { opacity: 0, y: "-=20", duration: 0.3, ease: "power2.in" }, 5.75);

          // "The AI never approves."
          tl.fromTo(q(".eB"), { opacity: 0 }, { opacity: 1, duration: 0.2 }, 6.05);
          Reel.words(tl, q(".hB"), [6.55, 6.9]);
          tl.fromTo(q(".av"), { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2)" }, 6.08);
          tl.fromTo(q(".av"), { rotation: 0 }, { rotation: 140, duration: 5.0, ease: "none" }, 6.08);
          tl.fromTo(q(".wa"), { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, 6.2);
          tl.fromTo(q(".ap.no"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 6.82);
          tl.to(stk, { strokeDashoffset: 0, duration: 0.3, ease: "power3.out" }, 7.05);
          tl.fromTo(q(".apn"), { opacity: 0 }, { opacity: 1, duration: 0.25 }, 7.1);
          // approval stays with a person
          tl.fromTo(q(".div"), { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, transformOrigin: "0 50%", duration: 0.5, ease: "power3.out" }, 7.1);
          tl.fromTo(q(".pp"), { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, 7.2);
          tl.fromTo(q(".wp"), { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, 7.25);
          tl.fromTo(q(".ap.yes"), { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2.2)" }, 7.35);
          // "It only posts findings."
          [q(".c1"), q(".c2")].forEach((c, i) => tl.fromTo(c, { opacity: 0, x: -30, scale: 0.9 }, { opacity: 1, x: 0, scale: 1, transformOrigin: "0 50%", duration: 0.4, ease: "back.out(2)" }, 7.7 + i * 0.16));
          tl.to(q(".hB"), { opacity: 0, y: -20, duration: 0.2, ease: "power2.in" }, 8.08);
          Reel.words(tl, q(".hC"), [8.3, 8.45, 8.6]);
          // the music hit: the accent and the real Approve punch, then the frame holds to the hard stop
          tl.to(q(".hC em"), { scale: 1.08, duration: 0.12, yoyo: true, repeat: 1, ease: "power2.out" }, 9.15);
          tl.to(q(".ap.yes"), { scale: 1.08, duration: 0.12, yoyo: true, repeat: 1, ease: "power2.out" }, 9.15);
          tl.to({}, { duration: 11.08 }, 0);
          window.__timelines["s08-payoff"] = tl;
        })();
      </script>
