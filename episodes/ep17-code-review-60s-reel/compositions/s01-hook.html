<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <script type="application/json" class="sfx-cues">[
      {"t":0.0,"sfx":"thud","vol":0.28},
      {"t":0.62,"sfx":"tick","vol":0.16},
      {"t":1.85,"sfx":"pop","vol":0.22},
      {"t":2.0,"sfx":"zoom","vol":0.14},
      {"t":2.64,"sfx":"pop","vol":0.26},
      {"t":2.85,"sfx":"tick","vol":0.12},
      {"t":3.15,"sfx":"tick","vol":0.12},
      {"t":3.5,"sfx":"pop","vol":0.2},
      {"t":3.7,"sfx":"bloom","vol":0.28},
      {"t":3.9,"sfx":"whip","vol":0.34}
    ]</script>
  </head>
  <body>
    <template>
      <!-- s01 · Hook. Frame 0 is the thumbnail: `// claude code` and "How the Claude Code team does code review" are already
           on screen, "code review" the italic accent (it punches on its word). "in under sixty seconds": an Under 60 sec
           badge pops; a small pull request slides in, a lens reads its diff and a Claude comment pops off it. The comment
           blooms yellow and fills the frame (the next beat is yellow), whip-pan out. Avatar BIG at the bottom (narrator),
           so everything stays above y 970.
           Voiceover: 0.15 "Here's how the Claude Code team does code review, in under sixty seconds." -->
      <style>
        #s01-root .bg { background: #fdfcfc; }
        #s01-root .rl-hd { --acc: #2d4bff; }
        #s01-root .rstamp { left: 90px; top: 626px; height: 80px; gap: 14px; padding: 0 32px 0 12px; font-size: 42px; --acc: #e11d48; }
        #s01-root .rstamp i { width: 56px; height: 56px; }
        #s01-root .rstamp svg { width: 34px; height: 34px; }
        #s01-root .pr { top: 736px; height: 224px; }
        #s01-root .pr .k { display: flex; justify-content: space-between; }
        #s01-root .row { position: absolute; left: 32px; height: 26px; display: flex; align-items: center; gap: 14px; }
        #s01-root .row b { width: 18px; font: 400 26px/1 var(--f-mono); color: #8a857d; text-align: center; }
        #s01-root .row i { display: block; height: 14px; border-radius: 7px; background: #e6e3de; transform-origin: 0 50%; }
        #s01-root .row.add i { background: #9be3b4; }
        #s01-root .row.del i { background: #ffb3b3; }
        #s01-root .lens { position: absolute; left: 0; top: 0; width: 110px; height: 110px; }
        #s01-root .lens circle { fill: rgba(255, 255, 255, 0.35); stroke: #0d0d0c; stroke-width: 6; }
        #s01-root .lens path { stroke: #0d0d0c; stroke-width: 9; stroke-linecap: round; }
        #s01-root .cmt { position: absolute; left: 600px; top: 830px; display: flex; align-items: center; gap: 14px; padding: 14px 22px 14px 14px; border-radius: 9999px;
          background: #fff; box-shadow: 0 16px 32px -16px rgba(0, 0, 0, 0.3), 0 0 0 2px rgba(0, 0, 0, 0.05); transform-origin: 0 100%; }
        #s01-root .cmt img { width: 46px; height: 46px; }
        #s01-root .cmt i { display: block; width: 200px; height: 14px; border-radius: 7px; background: #5f5b55; }
        #s01-root .bloom { position: absolute; left: 650px; top: 860px; width: 100px; height: 100px; margin: -50px 0 0 -50px; border-radius: 50%; background: #ffd84d; }
      </style>
      <div id="s01-root" data-composition-id="s01-hook" data-width="1080" data-height="1920">
        <div class="rl">
          <div class="rl-cam">
            <div class="rl-bg bg"></div>
            <div class="rl-eye">// claude code</div>
            <div class="rl-hd">
              <span class="ln"><span class="w">How the Claude</span></span>
              <span class="ln"><span class="w">Code team does</span></span>
              <span class="ln"><em class="w">code review</em></span>
            </div>
            <div class="rstamp" data-layout-allow-overlap=""><i><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13.5" r="7.5" /><path d="M12 13.5l3-3M10 2.5h4" /></svg></i>Under 60 sec</div>
            <div class="wc pr">
              <div class="k"><span>// pull request</span><span>+12 −3</span></div>
              <div class="rows"></div>
            </div>
            <svg class="lens" viewBox="0 0 110 110" aria-hidden="true"><circle cx="44" cy="44" r="31" /><path d="M67 67 L98 98" /></svg>
            <div class="cmt"><img src="assets/claude-logo.svg" alt=""><i></i></div>
            <div class="bloom" data-layout-allow-overflow=""></div>
          </div>
        </div>
      </div>
      <script>
        (() => {
          const root = document.getElementById("s01-root");
          const q = (s) => root.querySelector(s);
          const cam = q(".rl-cam");
          const tl = gsap.timeline({ paused: true });
          const blur = Reel.blurFor(cam, "s01-mb");
          // a small diff: [mark, bar width], two rows of four on a 34 px pitch from y 70 in the card
          const ROWS = [["", 330], ["−", 250], ["+", 420], ["+", 290]];
          q(".rows").innerHTML = ROWS.map(([m, w], i) => `<div class="row${m === "+" ? " add" : m ? " del" : ""}" style="top:${74 + i * 34}px"><b>${m}</b><i style="width:${w}px"></i></div>`).join("");
          const lens = q(".lens"), pr = q(".pr");
          gsap.set([pr, q(".cmt")], { opacity: 0 });

          // frame 0: the title is already there (thumbnail) and settles with a thump
          tl.fromTo(q(".rl-hd"), { scale: 1.04, y: 14 }, { scale: 1, y: 0, duration: 0.35, ease: Egg.EASE.stamp, transformOrigin: "0% 50%" }, 0);
          // "Claude Code team"
          tl.to(root.querySelectorAll(".rl-hd .ln:not(:last-child)"), { y: -10, duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1, stagger: 0.08 }, 0.62);
          // "does code review": the accent punches
          tl.to(q(".rl-hd em"), { scale: 1.12, duration: 0.16, ease: "power2.out", yoyo: true, repeat: 1, transformOrigin: "0% 80%" }, 1.85);
          // a pull request slides in and is read
          tl.fromTo(pr, { opacity: 0, x: -80 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, 2.0);
          tl.fromTo(root.querySelectorAll(".row i"), { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power3.out", stagger: 0.05 }, 2.1);
          tl.fromTo(lens, { x: 150, y: 770, opacity: 0 }, { x: 150, y: 770, opacity: 1, duration: 0.2, ease: "none" }, 2.55);
          tl.to(lens, { keyframes: [{ x: 400, y: 780, duration: 0.4 }, { x: 180, y: 840, duration: 0.35 }, { x: 440, y: 850, duration: 0.35 }], ease: "power1.inOut" }, 2.75);
          // "in under sixty seconds"
          Reel.badge(tl, q(".rstamp"), 2.64);
          // Claude comments on it
          tl.fromTo(q(".cmt"), { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2.2)" }, 3.5);
          // the comment blooms yellow and fills the frame (the next beat is yellow)
          tl.fromTo(q(".bloom"), { scale: 0 }, { scale: 46, duration: 0.26, ease: "power2.in" }, 3.7);
          Reel.whip(tl, cam, blur, 3.94, "out");

          window.__timelines["s01-hook"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
