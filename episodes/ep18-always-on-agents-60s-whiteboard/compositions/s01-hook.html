<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <!-- Sound cues (seconds from scene start). Run node tools/build-sfx.mjs after editing. -->
    <script type="application/json" class="sfx-cues">[
      {"t":0.0,"sfx":"impact-bass-1","vol":0.2},
      {"t":0.02,"sfx":"air","vol":0.18},
      {"t":1.2,"sfx":"marker","vol":0.16},
      {"t":3.45,"sfx":"tick","vol":0.2},
      {"t":4.4,"sfx":"whoosh-short","vol":0.14},
      {"t":4.75,"sfx":"pop","vol":0.16},
      {"t":6.2,"sfx":"click","vol":0.2},
      {"t":6.7,"sfx":"pen","vol":0.12,"dur":0.6},
      {"t":7.5,"sfx":"ping","vol":0.14},
      {"t":7.95,"sfx":"pop","vol":0.16},
      {"t":8.85,"sfx":"tap","vol":0.16},
      {"t":9.8,"sfx":"paper","vol":0.14},
      {"t":10.95,"sfx":"air","vol":0.12}
    ]</script>
  </head>
  <body>
    <template>
      <!-- s01 · Cold open + name it. Frame 0 is the whole title: "What is an always-on agent?" and, big under it, "in under
           60 seconds" (nothing builds in). "always-on" tints, the 60 punches on "sixty". On "It's not actually always on"
           the title clears; an "Always on" switch flips off. The loop draws: Asleep → Event arrives → Run · one job →
           Saves what happened → Asleep, and the living dot (the agent) travels it as each step is said. Everything stays
           above y 1100: the narrator tile sits large and centred below ("hero").
           Voiceover: 0.10 "What is an always-on agent? Here's the answer, in under sixty seconds."
           4.66 "It's not actually always on. It sleeps, wakes for a short run to do one job, saves what happened, and goes
           back to sleep." -->
      <style>
        #root { position: absolute; inset: 0; }
        .s01 .c60 { position: absolute; left: 90px; top: 604px; margin: 0; }
        .s01 .c60 .k { display: flex; align-items: center; gap: 12px; margin: 0; font: 600 44px/1 var(--f-t); letter-spacing: -0.01em; color: var(--mu); }
        .s01 .c60 svg { width: 44px; height: 44px; fill: none; stroke: var(--blue); stroke-width: 3.2; stroke-linecap: round; }
        .s01 .c60 .big { display: flex; align-items: baseline; gap: 36px; margin: 4px 0 0; white-space: nowrap; }
        .s01 .c60 .num { display: inline-block; font: 800 240px/0.86 var(--f-d); letter-spacing: -0.06em; color: var(--blue); }
        .s01 .c60 .u { font: 700 104px/1 var(--f-d); letter-spacing: -0.045em; color: var(--ink); }
        .s01 .hook { top: 236px; }
        .s01 .hook .l { display: block; white-space: nowrap; }
        .s01 .sw { left: 90px; top: 300px; width: 860px; height: 116px; }
        .s01 .sw .t { position: absolute; left: 36px; top: 0; bottom: 0; display: flex; align-items: center; font: 700 44px/1 var(--f-d); letter-spacing: -0.03em; color: var(--ink); }
        .s01 .sw .tg { position: absolute; right: 30px; top: 28px; width: 110px; height: 60px; border-radius: 30px; background: var(--line); }
        .s01 .sw .tg .on { position: absolute; inset: 0; border-radius: 30px; background: var(--green); }
        .s01 .sw .tg .k { position: absolute; left: 6px; top: 6px; width: 48px; height: 48px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2); }
        .s01 .sw .st { position: absolute; right: 168px; top: 0; bottom: 0; display: flex; align-items: center; font: 600 30px/1 var(--f-t); color: var(--mu); }
        .s01 .nd { position: absolute; display: flex; align-items: center; gap: 14px; height: 84px; padding: 0 30px; border-radius: 999px; background: var(--white); box-shadow: var(--shadow); font: 700 36px/1 var(--f-d); letter-spacing: -0.02em; color: var(--ink); white-space: nowrap; }
        .s01 .nd .n { font: 400 24px/1 var(--f-m); color: var(--faint); }
        .s01 .nd.lit { box-shadow: 0 0 0 4px var(--blue), var(--shadow); }
        .s01 .ring { opacity: 0; }
        .s01 .tagrun { position: absolute; left: 540px; top: 1062px; }
        .s01 .zz { position: absolute; left: 600px; top: 470px; margin: 0; font: 700 34px/1 var(--f-d); color: var(--blue); }
      </style>
      <div id="root" data-composition-id="s01-hook" data-width="1080" data-height="1920">
        <div class="a-scene white s01">
          <h1 class="a-h hook"><span class="l">What is an</span><span class="l"><span class="a-tint" data-layout-allow-overlap=""><span data-layout-allow-overlap="">always-on</span><span class="on" data-layout-allow-overlap="">always-on</span></span></span><span class="l">agent?</span></h1>
          <div class="c60" data-layout-allow-overlap=""><p class="k" data-layout-allow-overlap=""><svg viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="19" r="12.5" /><path class="hand" d="M17 19 V11" /><path d="M13 3.5 H21" /></svg>in under</p><p class="big"><span class="num" data-layout-allow-overlap="">60</span><span class="u">seconds</span></p></div>

          <div class="a-card sw"><span class="t">Always on</span><span class="st">mostly asleep</span><div class="tg"><div class="on"></div><div class="k"></div></div></div>

          <svg class="a-svg ring" viewBox="0 0 1080 1920" aria-hidden="true">
            <circle class="a-ink mu loop" cx="540" cy="770" r="236" />
          </svg>
          <div class="a-dot dot" style="left:540px;top:770px"></div>
          <div class="nd n0" style="left:540px;top:534px"><span>Asleep</span></div>
          <div class="nd n1" style="left:776px;top:770px"><span class="n">1</span><span>Event arrives</span></div>
          <div class="nd n2" style="left:540px;top:1006px"><span class="n">2</span><span>Run · one job</span></div>
          <div class="nd n3" style="left:304px;top:770px"><span class="n">3</span><span>Saves what happened</span></div>
          <p class="zz">z z</p>
        </div>
      </div>
      <script>
        (() => {
          const DUR = 12.2;
          const root = document.querySelector('[data-composition-id="s01-hook"] .s01');
          const q = (s) => root.querySelector(s);
          const all = (s) => [...root.querySelectorAll(s)];
          const nds = all(".nd"), dot = q(".dot"), loop = q(".loop");
          loop.setAttribute("pathLength", "1"); loop.style.strokeDasharray = "1 1.1";
          gsap.set(nds, { xPercent: -50, yPercent: -50 });
          gsap.set([q(".sw"), q(".ring"), ...nds, dot, q(".zz"), q(".sw .st")], { opacity: 0 });
          const tl = gsap.timeline({ paused: true });

          // frame 0 is the whole title. "always-on" tints, the 60 punches on "sixty"
          Apple.tint(tl, q(".hook .a-tint"), 1.2, { dur: 0.6 });
          tl.to(q(".c60 .num"), { scale: 1.1, duration: 0.2, ease: "power2.out", yoyo: true, repeat: 1, transformOrigin: "0% 80%" }, 3.45);
          tl.fromTo(q(".c60 .hand"), { rotation: 0 }, { rotation: 360, svgOrigin: "17 19", duration: 1.5, ease: "none" }, 2.9);
          Apple.out(tl, [q(".hook"), q(".c60")], 4.4, { dur: 0.35, y: -30 });

          // "It's not actually always on": the switch flips off
          Apple.rise(tl, q(".sw"), 4.75, { y: 30, dur: 0.6 });
          tl.to(q(".sw .tg .k"), { x: 50, duration: 0.01 }, 4.75);
          tl.to(q(".sw .tg .k"), { x: 0, duration: 0.35, ease: "power3.inOut" }, 6.2);
          tl.to(q(".sw .tg .on"), { opacity: 0, duration: 0.35, ease: "power1.inOut" }, 6.2);
          Apple.fade(tl, q(".sw .st"), 6.45, { dur: 0.4 });

          // the loop draws; the dot sleeps at the top
          const P = { a: -90 };
          const place = () => { const r = (P.a * Math.PI) / 180; dot.style.left = (540 + 236 * Math.cos(r)).toFixed(1) + "px"; dot.style.top = (770 + 236 * Math.sin(r)).toFixed(1) + "px"; };
          place();
          tl.set(q(".ring"), { opacity: 1 }, 6.66);
          tl.fromTo(loop, { strokeDashoffset: 1.02 }, { strokeDashoffset: 0, duration: 0.9, ease: "power2.inOut" }, 6.66);
          Apple.zoom(tl, nds[0], 6.79, { from: 0.85, dur: 0.6 });
          tl.fromTo(dot, { opacity: 0, scale: 0.5 }, { opacity: 0.45, scale: 0.7, duration: 0.4, ease: "power2.out" }, 6.85);
          Apple.fade(tl, q(".zz"), 6.95, { dur: 0.4 });
          // "wakes": event arrives, the dot lights up and moves
          const go = (to, at, dur) => tl.to(P, { a: to, duration: dur, ease: "power2.inOut", onUpdate: place }, at);
          tl.to(dot, { opacity: 1, scale: 1, duration: 0.3 }, 7.47);
          tl.to(q(".zz"), { opacity: 0, duration: 0.2 }, 7.47);
          go(0, 7.47, 0.5);
          Apple.zoom(tl, nds[1], 7.6, { from: 0.85, dur: 0.6 });
          // "a short run to do one job"
          go(90, 7.95, 0.5);
          Apple.zoom(tl, nds[2], 8.1, { from: 0.85, dur: 0.6 });
          tl.to(nds[2], { scale: 1.08, duration: 0.22, ease: "power2.out", yoyo: true, repeat: 1 }, 8.82);
          // "saves what happened"
          go(180, 9.7, 0.5);
          Apple.zoom(tl, nds[3], 9.85, { from: 0.85, dur: 0.6 });
          // "and goes back to sleep"
          go(270, 10.85, 0.7);
          tl.to(dot, { opacity: 0.45, scale: 0.7, duration: 0.4 }, 11.45);
          tl.to(q(".zz"), { opacity: 1, duration: 0.4 }, 11.5);
          tl.to(nds[0], { scale: 1.06, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 1 }, 11.5);

          Apple.out(tl, [q(".sw"), q(".ring"), ...nds, dot, q(".zz")], DUR - 0.3, { dur: 0.3 });
          window.__timelines["s01-hook"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
