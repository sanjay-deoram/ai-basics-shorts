<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <!-- Sound cues (seconds from scene start). Run node tools/build-sfx.mjs after editing. -->
    <script type="application/json" class="sfx-cues">[
      {"t":0.4,"sfx":"click-soft","vol":0.2},
      {"t":0.8,"sfx":"click-soft","vol":0.2},
      {"t":3.4,"sfx":"click-soft","vol":0.2},
      {"t":4.6,"sfx":"click","vol":0.26},
      {"t":4.75,"sfx":"click","vol":0.26},
      {"t":5.15,"sfx":"whoosh-short","vol":0.2},
      {"t":5.75,"sfx":"key-press","vol":0.2},
      {"t":5.95,"sfx":"key-press","vol":0.2},
      {"t":6.15,"sfx":"key-press","vol":0.2},
      {"t":6.6,"sfx":"typing","vol":0.24,"dur":0.9},
      {"t":7.0,"sfx":"pop","vol":0.2},
      {"t":8.0,"sfx":"ping","vol":0.18,"dur":1}
    ]</script>
  </head>
  <body>
    <template>
      <!-- s10 · Where embeddings live: a database table. A table frame is drawn (like Postgres with the pgvector
           extension: id, content, embedding vector(384)). A team handbook is drawn, cut into chunks, and each
           chunk drops into a row; then each row gets its embedding (real first numbers, all-MiniLM-L6-v2, see
           STORYBOARD.md). The handbook is an example. Voiceover: 0.3 "Where do embeddings live? In a
           database." 3.4 "Take a team handbook and split it into chunks." 6.4 "Each row stores a chunk and its
           numbers." Rows: 772, 862, 952 (90 tall); columns: id 90–150, content 150–716, embedding 716–950. -->
      <style>
        #root { position: absolute; inset: 0; }
        .s10 .egg-safe { justify-content: space-between; }
        .s10 .hb { position: absolute; left: 120px; width: 220px; top: 346px; text-align: center; font: 300 34px/1.2 var(--f-display); letter-spacing: -0.02em; color: var(--ink); }
        .s10 .tname { position: absolute; left: 90px; top: 660px; font: 400 30px/1.2 var(--f-mono); color: var(--ink); }
        .s10 .th { position: absolute; top: 730px; font: 400 24px/1 var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--smoke); }
        .s10 .id { position: absolute; left: 90px; width: 60px; text-align: center; font: 400 30px/1 var(--f-mono); color: var(--graphite); }
        .s10 .chunk { position: absolute; left: 160px; font: 400 30px/44px var(--f-body); color: var(--ink); background: var(--eggshell); border: 2px solid var(--ink); border-radius: 10px; padding: 0 8px; white-space: nowrap; transform-origin: 0 50%; }
        .s10 .vec { position: absolute; left: 732px; font: 400 28px/1 var(--f-mono); color: var(--ink); white-space: pre; }
        .s10 .foot { position: absolute; left: 90px; top: 1074px; display: flex; flex-direction: column; gap: 10px; }
        .s10 .ptr { position: absolute; inset: 0; }
      </style>
      <div id="root" data-composition-id="s11-table" data-width="1080" data-height="1920">
        <div class="egg-scene s10">
          <svg class="egg-svg" viewBox="0 0 1080 1920" aria-hidden="true">
            <g class="grid">
              <rect class="ink thin" data-draw="0" data-dur="0.8" x="90" y="712" width="860" height="330" rx="18" />
              <path class="ink thin" data-draw="1" data-dur="0.5" d="M90 772 L950 772" />
              <path class="ink thin" data-draw="2" data-dur="0.35" d="M150 712 L150 1042" />
              <path class="ink thin" data-draw="2" data-dur="0.35" d="M716 712 L716 1042" />
              <path class="sep" d="M90 862 L950 862 M90 952 L950 952" />
            </g>
            <g class="page">
              <rect class="ink thin pg" x="120" y="330" width="220" height="270" rx="16" />
              <path class="ink thin pg ln" d="M150 440 L310 440" />
              <path class="ink thin pg ln" d="M150 500 L290 500" />
              <path class="ink thin pg ln" d="M150 560 L300 560" />
              <path class="ink thin cut" d="M104 470 L356 470" />
              <path class="ink thin cut" d="M104 530 L356 530" />
            </g>
          </svg>
          <span class="hb">Handbook</span>
          <span class="tname">handbook_chunks</span>
          <span class="th" style="left:104px">id</span>
          <span class="th" style="left:166px">content</span>
          <span class="th" style="left:732px">embedding</span>
          <span class="id" style="top:802px">1</span>
          <span class="id" style="top:892px">2</span>
          <span class="id" style="top:982px">3</span>
          <div class="chunks" data-layout-allow-overlap="">
            <span class="chunk" style="top:795px">Staff get 15 vacation days a year.</span>
            <span class="chunk" style="top:885px">Expense claims are due in 30 days.</span>
            <span class="chunk" style="top:975px">Lunch is free on Fridays.</span>
          </div>
          <span class="vec" style="top:803px">[-0.002, …]</span>
          <span class="vec" style="top:893px">[-0.057, …]</span>
          <span class="vec" style="top:983px">[-0.010, …]</span>
          <div class="foot">
            <span class="egg-foot">… 5 more rows</span>
            <span class="egg-foot">Example: Postgres + pgvector, a vector(384) column</span>
          </div>
          <div class="ptr"></div>
          <div class="egg-safe">
            <span class="egg-eyebrow">Storing embeddings</span>
            <p class="egg-label">Each row: a chunk + its numbers.</p>
          </div>
        </div>
      </div>
      <script>
        (() => {
          const LINE_Y = [440, 500, 560], ROW_MID = [817, 907, 997];
          const root = document.querySelector('[data-composition-id="s11-table"] .s10');
          const q = (s) => root.querySelector(s);
          const all = (s) => [...root.querySelectorAll(s)];
          const chunks = all(".chunk"), ids = all(".id"), vecs = all(".vec");
          q(".sep").style.cssText = "fill:none;stroke:#ebe8e4;stroke-width:2";
          const pg = all(".pg"), cuts = all(".cut");
          [...pg, ...cuts].forEach((p) => { p.setAttribute("pathLength", "1"); p.style.strokeDasharray = "1 1.1"; });
          const P = Egg.pointer(q(".ptr"), ["384 numbers per row"], { size: 120, mood: "talk" });
          gsap.set([...pg, ...cuts], { strokeDashoffset: 1.02 });
          gsap.set([q(".sep"), q(".hb"), ...ids, ...vecs], { opacity: 0 });
          // each chunk starts shrunk onto its line of the page
          chunks.forEach((c, i) => gsap.set(c, { x: 150 - 160, y: LINE_Y[i] - ROW_MID[i], scale: 0.3, opacity: 0 }));

          const tl = gsap.timeline({ paused: true });
          Egg.fadeUp(tl, q(".egg-eyebrow"), 0.05);

          // a database table
          Egg.fadeUp(tl, q(".tname"), 0.3, { y: 14 });
          Egg.draw(tl, q(".grid"), 0.4);
          tl.to(q(".sep"), { opacity: 1, duration: 0.3, ease: "none" }, 1.3);
          Egg.fadeUp(tl, all(".th"), 1.2, { y: 12, stagger: 0.1 });

          // a handbook, cut into chunks, one per row
          tl.to(pg[0], { strokeDashoffset: 0, duration: 0.6, ease: Egg.EASE.draw }, 3.4);
          Egg.fadeUp(tl, q(".hb"), 3.6, { y: 12 });
          tl.to(pg.slice(1), { strokeDashoffset: 0, duration: 0.3, ease: Egg.EASE.draw, stagger: 0.15 }, 3.9);
          tl.to(cuts, { strokeDashoffset: 0, duration: 0.3, ease: Egg.EASE.draw, stagger: 0.15 }, 4.6);
          tl.to(chunks, { opacity: 1, duration: 0.15, ease: "none" }, 5.0);
          tl.to(pg.slice(1), { opacity: 0, duration: 0.15, ease: "none" }, 5.0);
          chunks.forEach((c, i) => {
            tl.to(c, { x: 0, y: 0, scale: 1, duration: 0.6, ease: Egg.EASE.move }, 5.15 + i * 0.2);
            Egg.pop(tl, ids[i], 5.7 + i * 0.2, { dur: 0.4 });
          });
          tl.to(chunks, { borderColor: "rgba(0,0,0,0)", duration: 0.3, ease: "none" }, 6.3); // landed: now it's just the cell's text

          // …and its numbers
          vecs.forEach((v, i) => { tl.set(v, { opacity: 1 }, 6.6 + i * 0.3); Egg.typeOn(tl, v, 6.6 + i * 0.3, { cps: 40 }); });
          Egg.pointTo(tl, P, { x: 820, y: 800 }, 0, 7.0);
          Egg.sparkIdle(tl, P.spark, 7.0, 9.8);
          Egg.lipsync(tl, P.spark, Egg.sceneStart("s11-table"), 7.0, 9.9);
          Egg.fadeUp(tl, all(".foot .egg-foot"), 7.6, { y: 12, stagger: 0.15 });
          Egg.fadeUp(tl, q(".egg-label"), 8.0);
          Egg.pointerHide(tl, P, 9.6);

          Egg.fadeOut(tl, [q(".egg-svg"), q(".hb"), q(".tname"), ...all(".th"), ...ids, q(".chunks"), ...vecs, q(".foot"), q(".egg-safe")], 9.85);
          window.__timelines["s11-table"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
