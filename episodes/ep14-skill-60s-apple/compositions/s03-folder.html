<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <!-- Sound cues (seconds from scene start). Run node tools/build-sfx.mjs after editing. -->
    <script type="application/json" class="sfx-cues">[
      {"t":0.25,"sfx":"air","vol":0.14},
      {"t":1.5,"sfx":"pop","vol":0.18},
      {"t":2.55,"sfx":"pop","vol":0.18},
      {"t":3.0,"sfx":"marker","vol":0.14},
      {"t":3.75,"sfx":"typing","vol":0.2,"dur":1.4},
      {"t":5.95,"sfx":"typing","vol":0.2,"dur":1.0},
      {"t":6.6,"sfx":"pop","vol":0.22},
      {"t":6.75,"sfx":"marker","vol":0.16}
    ]</script>
  </head>
  <body>
    <template>
      <!-- s03 · Step 1 · Folder. A dark macOS-style terminal window and, below, a white Finder-like card where the path
           draws as it's said: ~/.claude/ then skills/ (turns blue). The terminal types `mkdir -p ~/.claude/skills/` on
           "make a folder" and `pr-description` on "P R description"; the new blue folder settles into the tree and
           "Folder name = skill name." confirms it. Narrator: small tile bottom right (x > 750, y > 1300 stays empty).
           Voiceover: 0.2 "Step one: in dot claude slash skills, make a folder named after the skill. P R description." -->
      <style>
        #root { position: absolute; inset: 0; }
        .s03 .hd { top: 310px; }
        .s03 .term { left: 90px; top: 480px; width: 860px; height: 196px; }
        .s03 .cmd { position: absolute; left: 34px; top: 100px; margin: 0; font: 400 29px/1.3 var(--f-m); color: #f5f5f7; white-space: pre; }
        .s03 .cmd .pr { color: #8e8e93; }
        .s03 .cmd .nw { color: #64b5ff; }
        .s03 .tree { left: 90px; top: 720px; width: 860px; height: 360px; }
        .s03 .row { position: absolute; display: flex; align-items: center; gap: 22px; font: 400 48px/1 var(--f-m); color: var(--ink); white-space: nowrap; }
        .s03 .row svg { width: 64px; height: 54px; flex: none; fill: #e8e8ed; stroke: #86868b; stroke-width: 3; stroke-linejoin: round; }
        .s03 .ghost { position: absolute; left: 310px; top: 990px; width: 64px; height: 54px; fill: none; stroke: #c7c7cc; stroke-width: 3; stroke-dasharray: 6 6; stroke-linejoin: round; }
        .s03 .row.new svg { fill: rgba(0, 113, 227, 0.16); stroke: var(--blue); }
        .s03 .a-svg path { fill: none; stroke: #c7c7cc; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
        .s03 .lab { position: absolute; left: 90px; top: 1140px; margin: 0; font: 600 46px/1.2 var(--f-d); letter-spacing: -0.025em; color: var(--ink); white-space: nowrap; }
        .s03 .lab span { color: var(--mu); }
      </style>
      <div id="root" data-composition-id="s03-folder" data-width="1080" data-height="1920">
        <div class="a-scene s03">
          <p class="a-eyebrow">Step 1 · Folder</p>
          <h2 class="a-h hd">Make a folder.</h2>
          <div class="a-win dark term">
            <div class="bar"><i></i><i></i><i></i><div class="ttl">Terminal</div></div>
            <p class="cmd"><span class="pr">$ </span><span class="a">mkdir -p ~/.claude/skills/</span><span class="nw b">pr-description</span></p>
          </div>
          <div class="a-card tree"></div>
          <svg class="a-svg" viewBox="0 0 1080 1920" aria-hidden="true">
            <path class="ln1" d="M162 832 V 907 H 208" />
            <path class="ln2" d="M252 942 V 1017 H 298" />
          </svg>
          <div class="row r1" style="left:130px;top:770px"><svg viewBox="0 0 64 54"><path d="M3 8a5 5 0 0 1 5-5h16l6 7h26a5 5 0 0 1 5 5v31a5 5 0 0 1-5 5H8a5 5 0 0 1-5-5z" /></svg><span>~/.claude/</span></div>
          <div class="row r2" style="left:220px;top:880px"><svg viewBox="0 0 64 54"><path d="M3 8a5 5 0 0 1 5-5h16l6 7h26a5 5 0 0 1 5 5v31a5 5 0 0 1-5 5H8a5 5 0 0 1-5-5z" /></svg><span class="a-tint" data-layout-allow-overlap=""><span data-layout-allow-overlap="">skills/</span><span class="on" data-layout-allow-overlap="">skills/</span></span></div>
          <svg class="ghost" viewBox="0 0 64 54" aria-hidden="true"><path d="M3 8a5 5 0 0 1 5-5h16l6 7h26a5 5 0 0 1 5 5v31a5 5 0 0 1-5 5H8a5 5 0 0 1-5-5z" /></svg>
          <div class="row r3 new" style="left:310px;top:990px"><svg viewBox="0 0 64 54"><path d="M3 8a5 5 0 0 1 5-5h16l6 7h26a5 5 0 0 1 5 5v31a5 5 0 0 1-5 5H8a5 5 0 0 1-5-5z" /></svg><span class="a-tint" data-layout-allow-overlap=""><span data-layout-allow-overlap="">pr-description/</span><span class="on" data-layout-allow-overlap="">pr-description/</span></span></div>
          <p class="lab">Folder name <span>=</span> skill name.</p>
        </div>
      </div>
      <script>
        (() => {
          const DUR = 7.45;
          const root = document.querySelector('[data-composition-id="s03-folder"] .s03');
          const q = (s) => root.querySelector(s);
          const all = (s) => [...root.querySelectorAll(s)];
          const lines = all(".a-svg path");
          lines.forEach((p) => { p.setAttribute("pathLength", "1"); p.style.strokeDasharray = "1 1.1"; });
          gsap.set(lines, { strokeDashoffset: 1.02 });

          const tl = gsap.timeline({ paused: true });
          // "Step one"
          Apple.rise(tl, q(".a-eyebrow"), 0.2, { y: 16 });
          Apple.rise(tl, q(".hd"), 0.35, { y: 30 });
          Apple.rise(tl, q(".term"), 0.6, { y: 40 });
          Apple.rise(tl, q(".tree"), 0.8, { y: 40 });
          // "in dot claude slash skills"
          Apple.rise(tl, q(".r1"), 1.5, { y: 16, dur: 0.6 });
          tl.to(q(".ln1"), { strokeDashoffset: 0, duration: 0.4, ease: "power2.inOut" }, 2.2);
          Apple.rise(tl, q(".r2"), 2.55, { y: 16, dur: 0.6 });
          Apple.tint(tl, q(".r2 .a-tint"), 3.0);
          // "make a folder named after the skill": an empty slot waits in the tree while the command types in
          Apple.fade(tl, q(".ghost"), 3.75, { dur: 0.5 });
          Egg.typeOn(tl, q(".cmd .a"), 3.75, { cps: 20 });
          // "P R description": the name, and the new folder settles into the tree
          Egg.typeOn(tl, q(".cmd .b"), 5.95, { cps: 22 });
          tl.to(q(".ln2"), { strokeDashoffset: 0, duration: 0.4, ease: "power2.inOut" }, 6.25);
          tl.to(q(".ghost"), { opacity: 0, duration: 0.2, ease: "none" }, 6.6);
          Apple.zoom(tl, q(".r3"), 6.6, { from: 0.9, dur: 0.6 });
          Apple.tint(tl, q(".r3 .a-tint"), 6.75);
          Apple.rise(tl, q(".lab"), 6.8, { y: 20, dur: 0.5 });

          Apple.out(tl, [q(".a-eyebrow"), q(".hd"), q(".term"), q(".tree"), q(".a-svg"), q(".ghost"), ...all(".row"), q(".lab")], DUR - 0.3, { dur: 0.3 });
          window.__timelines["s03-folder"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
