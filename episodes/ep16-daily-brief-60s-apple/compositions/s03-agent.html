<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <!-- Sound cues (seconds from scene start). Run node tools/build-sfx.mjs after editing. -->
    <script type="application/json" class="sfx-cues">[
      {"t":0.2,"sfx":"air","vol":0.14},
      {"t":0.4,"sfx":"tap","vol":0.16},
      {"t":1.3,"sfx":"marker","vol":0.16},
      {"t":1.6,"sfx":"typing","vol":0.18,"dur":0.8},
      {"t":3.06,"sfx":"typing","vol":0.18,"dur":0.6},
      {"t":3.75,"sfx":"typing","vol":0.18,"dur":0.9},
      {"t":4.6,"sfx":"typing","vol":0.18,"dur":0.8},
      {"t":5.5,"sfx":"typing","vol":0.18,"dur":0.9},
      {"t":6.6,"sfx":"tick","vol":0.2},
      {"t":7.7,"sfx":"pop","vol":0.16},
      {"t":7.95,"sfx":"tap","vol":0.16},
      {"t":8.35,"sfx":"error","vol":0.1},
      {"t":8.8,"sfx":"tap","vol":0.16},
      {"t":9.15,"sfx":"chime","vol":0.18,"dur":1.2},
      {"t":9.3,"sfx":"sparkle","vol":0.12,"dur":0.9}
    ]</script>
  </head>
  <body>
    <template>
      <!-- s03 · Step 1 · Agent. A light editor window, agent.md (trimmed from the quickstart's
           agents/daily-brief/agent.md): the frontmatter types as it's said (name, model, tools: the agent toolset and
           the GitHub MCP toolset), then the run steps in plain English. "The key rule": the run bar settles on step 4,
           "An item earns a line when the reader would act on it today." Then the tip, weak vs better (agent.md's own
           example: "A count ("12 open reviews") is not an item"). Narrator: small tile bottom right (x > 750, y > 1300
           stays empty).
           Voiceover: 0.18 "Step one: agent dot M D. A model, its tools, and the steps, in plain English."
           6.56 "The key rule: only what you'd act on today earns a line." -->
      <style>
        #root { position: absolute; inset: 0; }
        .s03 .card { left: 90px; top: 316px; width: 860px; }
        .s03 .card .body { font-size: 28px; line-height: 46px; padding-top: 22px; padding-bottom: 22px; }
        .s03 .card .ln { height: 46px; }
        .s03 .card .egg-code-bar { top: 22px; height: 46px; }
        .s03 .card .ln > .no { font-size: 22px; }
        .s03 .lab { position: absolute; left: 90px; top: 1046px; margin: 0; font: 700 46px/1.1 var(--f-d); letter-spacing: -0.03em; color: var(--ink); white-space: nowrap; }
        .s03 .ex { position: absolute; top: 1114px; width: 420px; height: 164px; padding: 24px 28px; }
        .s03 .ex .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
        .s03 .ex .top > span:first-child { font: 600 26px/1 var(--f-t); color: var(--mu); }
        .s03 .ex p { margin: 0; font: 500 30px/1.3 var(--f-t); letter-spacing: -0.01em; color: var(--ink); }
        .s03 .ex p.m { font: 400 30px/1.3 var(--f-m); }
        .s03 .ex .fr { position: absolute; inset: 0; border-radius: 32px; border: 3px solid var(--blue); opacity: 0; }
      </style>
      <div id="root" data-composition-id="s03-agent" data-width="1080" data-height="1920">
        <div class="a-scene s03">
          <p class="a-eyebrow">Step 1 · Agent</p>
          <div class="a-win a-code card" data-lh="46" data-layout-allow-overlap="">
            <div class="bar"><i></i><i></i><i></i><div class="ttl"><span class="a-tint" data-layout-allow-overlap=""><span data-layout-allow-overlap="">agent.md</span><span class="on" data-layout-allow-overlap="">agent.md</span></span></div></div>
            <div class="body"><div class="egg-code-bar"></div>
              <div class="ln"><span class="no">1</span><span class="tx"><span class="t-p">---</span></span></div>
              <div class="ln"><span class="no">2</span><span class="tx"><span class="t-k">name</span><span class="t-p">:</span> Daily brief</span></div>
              <div class="ln"><span class="no">3</span><span class="tx"><span class="t-k">model</span><span class="t-p">:</span> claude-sonnet-5-5</span></div>
              <div class="ln"><span class="no">4</span><span class="tx"><span class="t-k">tools</span><span class="t-p">:</span></span></div>
              <div class="ln"><span class="no">5</span><span class="tx">  <span class="t-p">-</span> <span class="t-k">type</span><span class="t-p">:</span> agent_toolset_20260401</span></div>
              <div class="ln"><span class="no">6</span><span class="tx">  <span class="t-p">-</span> <span class="t-k">type</span><span class="t-p">:</span> mcp_toolset  <span class="t-c"># github</span></span></div>
              <div class="ln"><span class="no">7</span><span class="tx"><span class="t-p">---</span></span></div>
              <div class="ln"><span class="no">8</span><span class="tx"><span class="t-kw">1.</span> Read the preferences.</span></div>
              <div class="ln"><span class="no">9</span><span class="tx"><span class="t-kw">2.</span> Read the state.</span></div>
              <div class="ln"><span class="no">10</span><span class="tx"><span class="t-kw">3.</span> Read each source from its bookmark.</span></div>
              <div class="ln"><span class="no">11</span><span class="tx"><span class="t-kw">4.</span> Decide. An item earns a line when</span></div>
              <div class="ln"><span class="no">12</span><span class="tx">   the reader would act on it today.</span></div>
              <div class="ln"><span class="no">13</span><span class="tx"><span class="t-kw">5.</span> Verify. <span class="t-kw">6.</span> Write. <span class="t-kw">7.</span> Post. <span class="t-kw">8.</span> Record.</span></div>
            </div>
          </div>
          <p class="lab">Only what you'd act on today.</p>
          <div class="a-card ex weak" style="left:90px">
            <div class="top"><span>Weak</span><span class="a-tag gray">A count</span></div>
            <p class="m">12 open reviews</p>
          </div>
          <div class="a-card ex good" style="left:530px">
            <div class="top"><span>Better</span><span class="a-tag blue">Act today</span></div>
            <p>PR #482 is blocked on your review · day 2</p>
            <div class="fr"></div>
          </div>
        </div>
      </div>
      <script>
        (() => {
          const DUR = 10.23;
          const root = document.querySelector('[data-composition-id="s03-agent"] .s03');
          const q = (s) => root.querySelector(s);
          const all = (s) => [...root.querySelectorAll(s)];
          const card = q(".card"), lns = all(".card .ln");
          const tl = gsap.timeline({ paused: true });
          const type = (i, at, cps = 40) => {
            tl.fromTo(lns[i].querySelector(".no"), { opacity: 0 }, { opacity: 1, duration: 0.001 }, at);
            return Egg.typeOn(tl, lns[i].querySelector(".tx"), at, { cps });
          };
          gsap.set([q(".lab"), q(".weak"), q(".good"), ...all(".a-tag")], { opacity: 0 });

          // "Step one: agent dot M D"
          Apple.rise(tl, q(".a-eyebrow"), 0.2, { y: 16 });
          Apple.zoom(tl, card, 0.35, { from: 0.96, dur: 0.8 });
          Apple.tint(tl, q(".bar .a-tint"), 1.3, { dur: 0.5 });
          type(0, 1.6, 30); type(6, 1.7, 30); type(1, 2.0, 36);
          // "A model"
          type(2, 3.06, 44);
          Egg.codeRun(tl, card, 2, 3.1);
          // "its tools"
          type(3, 3.75, 40); type(4, 3.9, 64); type(5, 4.3, 70);
          Egg.codeRun(tl, card, [3, 4, 5], 3.8);
          // "and the steps"
          type(7, 4.6, 70); type(8, 4.85, 70); type(9, 5.05, 80);
          Egg.codeRun(tl, card, [7, 8, 9], 4.65);
          // "in plain English"
          type(10, 5.5, 80); type(11, 5.8, 80); type(12, 6.1, 90);
          Egg.codeRun(tl, card, [7, 8, 9, 10, 11, 12], 5.55);

          // "The key rule": step 4
          Egg.codeRun(tl, card, [10, 11], 6.6, { dim: 0.3 });
          // "only what you'd act on today earns a line": weak vs better
          Apple.rise(tl, q(".lab"), 7.7, { y: 20, dur: 0.6 });
          Apple.rise(tl, q(".weak"), 7.95, { y: 30, dur: 0.6 });
          Apple.zoom(tl, q(".weak .a-tag"), 8.35, { from: 0.85, dur: 0.4 });
          Apple.rise(tl, q(".good"), 8.8, { y: 30, dur: 0.6 });
          Apple.zoom(tl, q(".good .a-tag"), 9.15, { from: 0.85, dur: 0.4 });
          tl.to(q(".good .fr"), { opacity: 1, duration: 0.3, ease: "power2.out" }, 9.3);
          tl.to(q(".weak"), { opacity: 0.45, scale: 0.98, duration: 0.5, ease: "power2.inOut" }, 9.4);

          Apple.out(tl, [q(".a-eyebrow"), card, q(".lab"), q(".weak"), q(".good")], DUR - 0.3, { dur: 0.3 });
          window.__timelines["s03-agent"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
