  <body>
    <template>
      <!-- s06 · Ship it, then the payoff. A light terminal types `ant apply deployment.md vault.yaml` and the six
           resources it creates tick in (agent, environment, two memory stores, vault, deployment; the rows are an
           illustration, not the CLI's exact output). "Each morning, a fresh session": a session card for Tue Nov 17,
           7:32 AM. "Reads from every bookmark": the two Slack channels read, GitHub fails (unreadable). "Re-checks each
           item": three still open, one resolved and dropped. "And posts the brief": the post from s01 lands, Posted.
           Payoff: "No server to keep alive." "A source it can't read says unreadable": the post's last line,
           "GitHub: unreadable this run.", takes a ring and a "Says so" tag; "never a quiet day": the weak version, a
           silent "Nothing new today.", is struck through. Hard stop: no exit, the last frame holds ~1.9 s.
           The narrator is out: the scene fills the safe box.
           Voiceover: 0.18 "Then run ant apply. Each morning, a fresh session reads from every bookmark, re-checks each
           item, and posts the brief." 7.45 "No server to keep alive. And a source it can't read says unreadable,
           never a quiet day." -->
      <style>
        #root { position: absolute; inset: 0; }
        .s06 .term { left: 90px; top: 316px; width: 860px; }
        .s06 .term .tb { padding: 20px 30px; }
        .s06 .term .row { height: 44px; font: 400 27px/44px var(--f-m); color: var(--ink); white-space: pre; }
        .s06 .term .row .p { color: var(--faint); }
        .s06 .term .row .ok { color: #28a745; }
        .s06 .term .row .k { color: var(--mu); }
        .s06 .sess { position: absolute; left: 90px; top: 760px; width: 860px; height: 380px; padding: 28px 34px; }
        .s06 .sess .hd { display: flex; align-items: center; justify-content: space-between; height: 48px; }
        .s06 .sess .hd b { font: 700 34px/1 var(--f-d); letter-spacing: -0.02em; color: var(--ink); white-space: nowrap; }
        .s06 .sess .kick { position: absolute; left: 34px; top: 90px; margin: 0; font: 600 26px/1.2 var(--f-t); color: var(--mu); white-space: nowrap; }
        .s06 .sess .grp { position: absolute; left: 34px; right: 34px; top: 140px; }
        .s06 .sr { position: relative; height: 54px; font: 600 28px/54px var(--f-t); letter-spacing: -0.01em; color: var(--ink); white-space: nowrap; }
        .s06 .sr .m { position: absolute; left: 330px; top: 0; font-weight: 500; color: var(--mu); }
        .s06 .sr .s { position: absolute; right: 0; top: 0; font-weight: 600; color: #28a745; }
        .s06 .sr .s.bad { color: #c93400; }
        .s06 .sr .s.gone { color: var(--faint); }
        .s06 .sr .x { position: absolute; left: -6px; top: 27px; width: 0; height: 3px; background: var(--faint); }
        .s06 .post { top: 560px; }
        .s06 .post .ok { margin-left: 4px; }
        .s06 .post .foot { position: relative; }
        .s06 .ring { position: absolute; left: 206px; width: 724px; height: 60px; top: 0; border-radius: 18px; box-shadow: 0 0 0 4px var(--blue), 0 0 0 12px rgba(0, 113, 227, 0.14); opacity: 0; }
        .s06 .says { position: absolute; left: 770px; }
        .s06 .pay { position: absolute; left: 90px; top: 316px; width: 860px; margin: 0; font: 700 92px/1.04 var(--f-d); letter-spacing: -0.045em; color: var(--ink); }
        .s06 .pay .l { display: block; white-space: nowrap; }
        .s06 .weak { position: absolute; left: 90px; top: 1080px; width: 860px; padding: 26px 32px; }
        .s06 .weak .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
        .s06 .weak .top > span:first-child { font: 600 26px/1 var(--f-t); color: var(--mu); }
        .s06 .weak p { position: relative; display: inline-block; margin: 0; font: 500 34px/1.3 var(--f-t); letter-spacing: -0.01em; color: var(--ink); white-space: nowrap; }
        .s06 .weak .st { position: absolute; left: -6px; right: -6px; top: 24px; height: 4px; border-radius: 2px; background: var(--ink); transform-origin: 0 50%; }
      </style>
      <div id="root" data-composition-id="s06-apply" data-width="1080" data-height="1920">
        <div class="a-scene s06">
          <p class="a-eyebrow">Ship it</p>
          <div class="a-win term">
            <div class="bar"><i></i><i></i><i></i><div class="ttl">Terminal · agents/daily-brief</div></div>
            <div class="tb">
              <div class="row r0"><span class="p">$ </span><span class="cmd">ant apply deployment.md vault.yaml</span></div>
              <div class="row r1"><span class="ok">✓</span> agent         <span class="k">Daily brief</span></div>
              <div class="row r1"><span class="ok">✓</span> environment   <span class="k">daily-brief</span></div>
              <div class="row r1"><span class="ok">✓</span> memory store  <span class="k">preferences</span></div>
              <div class="row r1"><span class="ok">✓</span> memory store  <span class="k">state</span></div>
              <div class="row r1"><span class="ok">✓</span> vault         <span class="k">quickstart-daily-brief</span></div>
              <div class="row r1"><span class="ok">✓</span> deployment    <span class="k">Daily brief</span></div>
            </div>
          </div>

          <div class="a-card sess">
            <div class="hd"><b>Tue, Nov 17 · 7:32 AM</b><span class="a-tag blue fresh">Fresh session</span></div>
            <p class="kick k1">Reading from every bookmark</p>
            <p class="kick k2">Re-checking each item, live</p>
            <div class="grp g1">
              <div class="sr"># support<span class="m">from Mon 7:33 AM</span><span class="s">✓ read</span></div>
              <div class="sr"># escalations<span class="m">from Mon 7:33 AM</span><span class="s">✓ read</span></div>
              <div class="sr">GitHub PRs<span class="m">from Mon 7:33 AM</span><span class="s bad">✕ unreadable</span></div>
            </div>
            <div class="grp g2">
              <div class="sr">Acme escalation<span class="s">✓ still open</span></div>
              <div class="sr">Refund #1182<span class="s">✓ still waiting</span></div>
              <div class="sr">Deploy freeze Friday<span class="s">✓ still open</span></div>
              <div class="sr gone">Slow exports thread<span class="s gone">resolved · dropped</span><i class="x"></i></div>
            </div>
          </div>

          <h2 class="pay"><span class="l">No server</span><span class="l">to keep alive.</span></h2>
          <div class="a-msg post">
            <div class="av"><svg viewBox="0 0 46 46" aria-hidden="true"><path d="M7 33 H39" stroke="#fff" stroke-width="3.6" stroke-linecap="round" /><path d="M14 31 A9 9 0 0 1 32 31 Z" fill="#fff" /><path d="M23 8 V14 M10 14.5 L14 18.5 M36 14.5 L32 18.5" stroke="#fff" stroke-width="3.6" stroke-linecap="round" /></svg></div>
            <div class="who">Daily brief <span class="app">APP</span> <span class="tm">7:34 AM</span> <span class="a-tag blue ok">✓ Posted</span></div>
            <div class="ttl">Daily brief, Tue Nov 17</div>
            <div class="it">Acme escalation: <span class="d">login errors since 6:10</span></div>
            <div class="it">Refund #1182 <span class="d">waits on your yes · day 2</span></div>
            <div class="it">Deploy freeze Friday: <span class="d">confirm by noon</span></div>
            <div class="foot"><span class="dot"></span><span class="ft">GitHub: unreadable this run.</span></div>
          </div>
          <div class="ring" data-layout-allow-overlap=""></div>
          <span class="a-tag blue says">Says so</span>

          <div class="a-card weak">
            <div class="top"><span>Weak · a silent failure</span><span class="a-tag gray">Looks like a quiet day</span></div>
            <p>Nothing new today.<i class="st"></i></p>
          </div>
        </div>
      </div>
      <script>
        (() => {
          const root = document.querySelector('[data-composition-id="s06-apply"] .s06');
          const q = (s) => root.querySelector(s);
          const all = (s) => [...root.querySelectorAll(s)];
          const term = q(".term"), sess = q(".sess"), post = q(".post"), foot = q(".post .foot"), ring = q(".ring"), says = q(".says");
          const g1 = all(".g1 .sr"), g2 = all(".g2 .sr");
          // the ring and tag sit on the post's last line (measured once, layout only)
          const fy = post.offsetTop + foot.offsetTop + 2;
          gsap.set(ring, { top: fy });
          gsap.set(says, { top: fy + 8 });
          gsap.set([sess, ...all(".r1"), q(".fresh"), q(".k1"), q(".k2"), ...g1, ...g2, ...all(".g1 .s"), ...all(".g2 .s"),
            q(".pay"), post, q(".post .ok"), foot, ring, says, q(".weak")], { opacity: 0 });
          gsap.set([q(".weak .st")], { scaleX: 0 });

          const tl = gsap.timeline({ paused: true });
          // "Then run ant apply": the six resources
          Apple.rise(tl, q(".a-eyebrow"), 0.2, { y: 16 });
          Apple.rise(tl, term, 0.25, { y: 30, dur: 0.7 });
          Egg.typeOn(tl, q(".cmd"), 0.45, { cps: 34 });
          tl.to(all(".r1"), { opacity: 1, duration: 0.12, ease: "none", stagger: 0.09 }, 1.55);
          // "Each morning, a fresh session"
          Apple.rise(tl, sess, 1.9, { y: 40, dur: 0.7 });
          Apple.zoom(tl, q(".fresh"), 2.75, { from: 0.85, dur: 0.45 });
          // "reads from every bookmark": Slack read, GitHub unreadable
          Apple.fade(tl, q(".k1"), 3.3, { dur: 0.3 });
          Apple.rise(tl, g1, 3.35, { y: 14, dur: 0.4, stagger: 0.1 });
          const s1 = all(".g1 .s");
          [3.6, 3.8, 4.25].forEach((t, i) => Apple.zoom(tl, s1[i], t, { from: 0.85, dur: 0.35 }));
          // "re-checks each item"
          tl.to([q(".k1"), ...g1], { opacity: 0, duration: 0.2, ease: "none" }, 4.9);
          Apple.fade(tl, q(".k2"), 5.0, { dur: 0.3 });
          Apple.rise(tl, g2, 5.0, { y: 14, dur: 0.4, stagger: 0.1 });
          const s2 = all(".g2 .s");
          [5.3, 5.45, 5.6, 5.75].forEach((t, i) => Apple.zoom(tl, s2[i], t, { from: 0.85, dur: 0.35 }));
          tl.to(g2[3].querySelector(".x"), { width: 300, duration: 0.3, ease: "power2.out" }, 5.8);
          tl.to(g2[3], { opacity: 0.5, duration: 0.3, ease: "none" }, 5.95);
          // "and posts the brief"
          Apple.out(tl, [q(".a-eyebrow"), term, sess], 6.1, { y: -20, dur: 0.3 });
          Apple.zoom(tl, post, 6.3, { from: 0.94, dur: 0.8 });
          Apple.zoom(tl, q(".post .ok"), 6.7, { from: 0.8, dur: 0.45 });

          // "No server to keep alive."
          Apple.rise(tl, q(".pay"), 7.5, { y: 30, dur: 0.8 });
          // "And a source it can't read says unreadable"
          Apple.fade(tl, foot, 9.8, { dur: 0.01 });
          Apple.fade(tl, q(".foot .dot"), 9.8, { dur: 0.25 });
          Egg.typeOn(tl, q(".ft"), 9.85, { cps: 40 });
          tl.to(ring, { opacity: 1, duration: 0.45, ease: "power2.out" }, 11.0);
          Apple.zoom(tl, says, 11.1, { from: 0.8, dur: 0.45 });
          // "never a quiet day": the silent version is struck out
          Apple.rise(tl, q(".weak"), 11.95, { y: 30, dur: 0.6 });
          tl.to(q(".weak .st"), { scaleX: 1, duration: 0.35, ease: "power2.out" }, 12.45);
          tl.to(q(".weak"), { opacity: 0.65, duration: 0.5, ease: "none" }, 12.7);

          // hard stop: the last frame holds, no exit
          window.__timelines["s06-apply"] = tl;
        })();
      </script>
    </template>
  </body>
