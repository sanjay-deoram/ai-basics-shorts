<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <!-- Sound cues (seconds from scene start). Run node tools/build-sfx.mjs after editing. -->
    <script type="application/json" class="sfx-cues">[
      {"t":0.24,"sfx":"air","vol":0.14},
      {"t":1.2,"sfx":"pop","vol":0.16},
      {"t":1.35,"sfx":"pop","vol":0.16},
      {"t":1.95,"sfx":"tap","vol":0.14},
      {"t":2.85,"sfx":"marker","vol":0.14},
      {"t":3.9,"sfx":"tick","vol":0.18},
      {"t":4.0,"sfx":"paper","vol":0.14},
      {"t":5.65,"sfx":"click","vol":0.22},
      {"t":5.7,"sfx":"pop","vol":0.16},
      {"t":6.5,"sfx":"tick","vol":0.18},
      {"t":6.6,"sfx":"paper","vol":0.14},
      {"t":8.3,"sfx":"marker","vol":0.16}
    ]</script>
  </head>
  <body>
    <template>
      <!-- s05 · Step 3 · Memory, as two folders of files (the quickstart's two memory stores: Anthropic keeps them
           between runs and each run opens them under /mnt/memory/). "Two folders, kept between runs." "Your
           preferences": the preferences/ folder (you write preferences.md: what to read, how long, who to mention);
           "which it can read but never change": the lock closes, "Agent: read only". "And its own notes": the state/
           folder (bookmarks.json, ledger.md, runs/), "Agent: read + write"; "like a bookmark for each source":
           bookmarks.json lights (it opens in s06). Narrator: small tile bottom right (x > 750, y > 1300 stays empty).
           Voiceover: 0.18 "Step three: memory: two folders kept between runs. Your preferences, which it can read but
           never change. And its own notes, like a bookmark for each source." -->
      <style>
        #root { position: absolute; inset: 0; }
        .s05 .hd { top: 316px; }
        .s05 .hd .l { display: block; white-space: nowrap; }
        .s05 .fd { position: absolute; top: 540px; width: 415px; height: 520px; padding: 28px 30px; }
        .s05 .fd .fr { position: absolute; inset: 0; border-radius: 32px; border: 3px solid var(--blue); opacity: 0; }
        .s05 .fd .ttl { display: flex; align-items: center; gap: 16px; height: 52px; font: 400 34px/1 var(--f-m); color: var(--ink); white-space: nowrap; }
        .s05 .fd .who { margin: 8px 0 20px; font: 600 28px/1.2 var(--f-t); color: var(--mu); white-space: nowrap; }
        .s05 .fold { position: relative; width: 60px; height: 46px; border-radius: 8px; background: var(--blue); }
        .s05 .fold::before { content: ""; position: absolute; left: 0; top: -8px; width: 26px; height: 12px; border-radius: 5px 5px 0 0; background: inherit; }
        .s05 .fold.g { background: #8e8e93; }
        .s05 .file { display: flex; align-items: center; gap: 14px; height: 46px; font: 400 28px/1 var(--f-m); color: var(--ink); white-space: nowrap; }
        .s05 .file i { flex: none; width: 24px; height: 30px; border-radius: 4px; background: #d2d2d7; clip-path: polygon(0 0, 68% 0, 100% 28%, 100% 100%, 0 100%); }
        .s05 .pv { margin: 8px 0 0; padding: 12px 18px; border-radius: 18px; background: var(--gray); }
        .s05 .pv p { margin: 0; font: 500 28px/40px var(--f-t); color: var(--ink); white-space: nowrap; }
        .s05 .rw { margin-bottom: 14px; }
        .s05 .rw .d { margin: 2px 0 0 38px; font: 500 26px/1.2 var(--f-t); color: var(--mu); white-space: nowrap; }
        .s05 .rw.bm { margin-left: -12px; margin-right: -12px; padding: 4px 12px 8px; border-radius: 14px; }
        .s05 .tg { position: absolute; left: 30px; bottom: 26px; height: 44px; font-size: 24px; }
        .s05 .lock { position: relative; width: 26px; height: 30px; margin-right: 2px; }
        .s05 .lock .sh { position: absolute; left: 5px; top: 0; width: 16px; height: 16px; border: 4px solid var(--blue); border-bottom: 0; border-radius: 8px 8px 0 0; }
        .s05 .lock .bd { position: absolute; left: 0; top: 13px; width: 26px; height: 17px; border-radius: 5px; background: var(--blue); }
        .s05 .mnt { position: absolute; left: 90px; top: 1096px; margin: 0; font: 500 30px/1.2 var(--f-t); color: var(--mu); white-space: nowrap; }
        .s05 .mnt b { font: 400 28px/1 var(--f-m); color: var(--ink); }
      </style>
      <div id="root" data-composition-id="s05-memory" data-width="1080" data-height="1920">
        <div class="a-scene s05">
          <p class="a-eyebrow">Step 3 · Memory</p>
          <h2 class="a-h2 hd"><span class="l l1">Two folders,</span><span class="l l2"><span class="a-tint" data-layout-allow-overlap=""><span data-layout-allow-overlap="">kept between runs.</span><span class="on" data-layout-allow-overlap="">kept between runs.</span></span></span></h2>

          <div class="a-card fd pref" style="left:90px">
            <div class="ttl"><div class="fold"></div>preferences/</div>
            <div class="who">Yours: you write it</div>
            <div class="in">
              <div class="file"><i></i>preferences.md</div>
              <div class="pv"><p>Read #support</p><p>8 lines at most</p><p>Mention no one</p></div>
            </div>
            <span class="a-tag blue tg"><span class="lock"><span class="sh"></span><span class="bd"></span></span>Agent: read only</span>
            <div class="fr"></div>
          </div>
          <div class="a-card fd state" style="left:535px">
            <div class="ttl"><div class="fold g"></div>state/</div>
            <div class="who">The agent's own notes</div>
            <div class="rw bm"><div class="file"><i></i><span class="a-tint" data-layout-allow-overlap=""><span data-layout-allow-overlap="">bookmarks.json</span><span class="on" data-layout-allow-overlap="">bookmarks.json</span></span></div><div class="d">where it stopped reading</div></div>
            <div class="rw"><div class="file"><i></i>ledger.md</div><div class="d">what it already told you</div></div>
            <div class="rw"><div class="file"><i></i>runs/</div><div class="d">a log of every run</div></div>
            <span class="a-tag gray tg">Agent: read + write</span>
            <div class="fr"></div>
          </div>
          <p class="mnt">Each run opens both at <b>/mnt/memory/</b></p>
        </div>
      </div>
      <script>
        (() => {
          const DUR = 9.55;
          const root = document.querySelector('[data-composition-id="s05-memory"] .s05');
          const q = (s) => root.querySelector(s);
          const all = (s) => [...root.querySelectorAll(s)];
          const pref = q(".pref"), state = q(".state");
          gsap.set([q(".l1"), q(".l2"), pref, state, q(".pref .in"), ...all(".state .rw"), ...all(".tg"), q(".mnt")], { opacity: 0 });

          const tl = gsap.timeline({ paused: true });
          // "Step three: memory"
          Apple.rise(tl, q(".a-eyebrow"), 0.24, { y: 16 });
          Apple.rise(tl, [pref, state], 1.2, { y: 40, dur: 0.7, stagger: 0.15 });
          // "two folders kept between runs"
          Apple.rise(tl, q(".l1"), 1.95, { y: 24, dur: 0.6 });
          Apple.rise(tl, q(".l2"), 2.8, { y: 24, dur: 0.6 });
          Apple.tint(tl, q(".l2 .a-tint"), 3.1, { dur: 0.5 });
          Apple.rise(tl, q(".mnt"), 3.3, { y: 14, dur: 0.6 });
          // "Your preferences"
          tl.to(q(".pref .fr"), { opacity: 1, duration: 0.3, ease: "power2.out" }, 3.9);
          Apple.rise(tl, q(".pref .in"), 4.0, { y: 20, dur: 0.6 });
          // "which it can read but never change": the lock closes
          Apple.zoom(tl, q(".pref .tg"), 5.1, { from: 0.85, dur: 0.45 });
          tl.fromTo(q(".lock .sh"), { y: -6 }, { y: 0, duration: 0.2, ease: "power3.in" }, 5.65);
          tl.to(q(".pref .tg"), { scale: 1.06, duration: 0.18, yoyo: true, repeat: 1, ease: "sine.inOut" }, 5.7);
          // "And its own notes"
          tl.to(q(".pref .fr"), { opacity: 0, duration: 0.25, ease: "none" }, 6.45);
          tl.to(q(".state .fr"), { opacity: 1, duration: 0.3, ease: "power2.out" }, 6.5);
          Apple.rise(tl, all(".state .rw"), 6.6, { y: 16, dur: 0.5, stagger: 0.2 });
          Apple.zoom(tl, q(".state .tg"), 7.3, { from: 0.85, dur: 0.45 });
          // "like a bookmark for each source"
          tl.to(q(".rw.bm"), { backgroundColor: "rgba(0, 113, 227, 0.1)", duration: 0.3, ease: "none" }, 8.3);
          Apple.tint(tl, q(".bm .a-tint"), 8.3, { dur: 0.4 });

          Apple.out(tl, [q(".a-eyebrow"), q(".hd"), pref, state, q(".mnt")], DUR - 0.3, { dur: 0.3 });
          window.__timelines["s05-memory"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
