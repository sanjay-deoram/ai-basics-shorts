<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <!-- Sound cues (seconds from scene start). Run node tools/build-sfx.mjs after editing. -->
    <script type="application/json" class="sfx-cues">[
      {"t":0.2,"sfx":"air","vol":0.14},
      {"t":0.4,"sfx":"tap","vol":0.16},
      {"t":1.43,"sfx":"marker","vol":0.16},
      {"t":1.6,"sfx":"typing","vol":0.18,"dur":0.7},
      {"t":3.0,"sfx":"typing","vol":0.18,"dur":0.8},
      {"t":3.45,"sfx":"pop","vol":0.14},
      {"t":3.6,"sfx":"tick","vol":0.16},
      {"t":3.74,"sfx":"tick","vol":0.16},
      {"t":3.88,"sfx":"tick","vol":0.16},
      {"t":4.1,"sfx":"marker","vol":0.14},
      {"t":4.2,"sfx":"pop","vol":0.18},
      {"t":4.3,"sfx":"typing","vol":0.16,"dur":0.5},
      {"t":5.0,"sfx":"typing","vol":0.16,"dur":0.6},
      {"t":5.45,"sfx":"tap","vol":0.18},
      {"t":5.9,"sfx":"tick","vol":0.2},
      {"t":6.3,"sfx":"typing","vol":0.14,"dur":0.4}
    ]</script>
  </head>
  <body>
    <template>
      <!-- s04 · Step 2 · Daily. A light editor window, deployment.md (trimmed from the quickstart's
           agents/daily-brief/deployment.md): it points at agent.md, then the schedule types as it's said. "Weekdays":
           the cron line lights and a week strip fills Mon–Fri; "at seven thirty-two": the "32 7" of the cron tints and
           "7:32 AM · America/New_York" lands; "with a five dollar cap per run": the budget line lights and a $5.00 card
           counts up. Last, the body: "Write today's brief." (the first message of every run). Narrator: small tile
           bottom right (x > 750, y > 1300 stays empty).
           Voiceover: 0.18 "Step two: deployment dot M D. Weekdays at seven thirty-two, with a five dollar cap per run." -->
      <style>
        #root { position: absolute; inset: 0; }
        .s04 .card { left: 90px; top: 316px; width: 860px; }
        .s04 .card .body { font-size: 28px; line-height: 46px; padding-top: 22px; padding-bottom: 22px; }
        .s04 .card .ln { height: 46px; }
        .s04 .card .egg-code-bar { top: 22px; height: 46px; }
        .s04 .card .ln > .no { font-size: 22px; }
        .s04 .card .a-tint > .on { background: rgba(0, 113, 227, 0.12); border-radius: 6px; }
        .s04 .wk { position: absolute; top: 926px; width: 92px; height: 92px; border-radius: 50%; background: var(--white); box-shadow: var(--shadow); }
        .s04 .wk b { position: absolute; inset: 0; text-align: center; font: 700 32px/92px var(--f-t); color: var(--faint); }
        .s04 .wk .on { position: absolute; inset: 0; border-radius: 50%; background: linear-gradient(180deg, #2997ff, #0071e3); opacity: 0; }
        .s04 .wk .on b { color: #fff; }
        .s04 .time { position: absolute; left: 90px; top: 1052px; margin: 0; font: 700 92px/1 var(--f-d); letter-spacing: -0.045em; color: var(--ink); white-space: nowrap; }
        .s04 .tz { position: absolute; left: 470px; top: 1086px; margin: 0; font: 500 32px/1.2 var(--f-t); color: var(--mu); white-space: nowrap; }
        .s04 .cap { position: absolute; left: 90px; top: 1168px; width: 640px; height: 130px; padding: 0 32px; display: flex; align-items: center; gap: 24px; }
        .s04 .cap .v { font: 800 64px/1 var(--f-d); letter-spacing: -0.04em; color: var(--blue); }
        .s04 .cap .t { font: 600 34px/1.15 var(--f-t); letter-spacing: -0.015em; color: var(--ink); white-space: nowrap; }
        .s04 .cap .t .m { display: block; font: 500 26px/1.3 var(--f-t); color: var(--mu); }
      </style>
      <div id="root" data-composition-id="s04-daily" data-width="1080" data-height="1920">
        <div class="a-scene s04">
          <p class="a-eyebrow">Step 2 · Daily</p>
          <div class="a-win a-code card" data-lh="46" data-layout-allow-overlap="">
            <div class="bar"><i></i><i></i><i></i><div class="ttl"><span class="a-tint" data-layout-allow-overlap=""><span data-layout-allow-overlap="">deployment.md</span><span class="on" data-layout-allow-overlap="">deployment.md</span></span></div></div>
            <div class="body"><div class="egg-code-bar"></div>
              <div class="ln"><span class="no">1</span><span class="tx"><span class="t-p">---</span></span></div>
              <div class="ln"><span class="no">2</span><span class="tx"><span class="t-k">agent</span><span class="t-p">:</span> ./agent.md</span></div>
              <div class="ln"><span class="no">3</span><span class="tx"><span class="t-k">schedule</span><span class="t-p">:</span></span></div>
              <div class="ln"><span class="no">4</span><span class="tx">  <span class="t-k">expression</span><span class="t-p">:</span> "<span class="a-tint" data-layout-allow-overlap=""><span data-layout-allow-overlap="">32 7</span><span class="on" data-layout-allow-overlap="">32 7</span></span> * * 1-5"</span></div>
              <div class="ln"><span class="no">5</span><span class="tx">  <span class="t-k">timezone</span><span class="t-p">:</span> America/New_York</span></div>
              <div class="ln"><span class="no">6</span><span class="tx"><span class="t-k">budget</span><span class="t-p">:</span></span></div>
              <div class="ln"><span class="no">7</span><span class="tx">  <span class="t-k">max_list_cost</span><span class="t-p">:</span></span></div>
              <div class="ln"><span class="no">8</span><span class="tx">    <span class="t-k">amount</span><span class="t-p">:</span> "500"  <span class="t-c"># cents: $5.00</span></span></div>
              <div class="ln"><span class="no">9</span><span class="tx"><span class="t-p">---</span></span></div>
              <div class="ln"><span class="no">10</span><span class="tx">Write today's brief.</span></div>
            </div>
          </div>
          <div class="wk" style="left:90px"><b>M</b><div class="on" data-layout-allow-overlap=""><b>M</b></div></div>
          <div class="wk" style="left:208px"><b>T</b><div class="on" data-layout-allow-overlap=""><b>T</b></div></div>
          <div class="wk" style="left:326px"><b>W</b><div class="on" data-layout-allow-overlap=""><b>W</b></div></div>
          <div class="wk" style="left:444px"><b>T</b><div class="on" data-layout-allow-overlap=""><b>T</b></div></div>
          <div class="wk" style="left:562px"><b>F</b><div class="on" data-layout-allow-overlap=""><b>F</b></div></div>
          <div class="wk" style="left:680px"><b>S</b></div>
          <div class="wk" style="left:798px"><b>S</b></div>
          <p class="time">7:32 AM</p>
          <p class="tz">America/New_York</p>
          <div class="a-card cap"><span class="v">$0.00</span><span class="t">cap per run<span class="m">a run that hits it pauses</span></span></div>
        </div>
      </div>
      <script>
        (() => {
          const DUR = 7.28;
          const root = document.querySelector('[data-composition-id="s04-daily"] .s04');
          const q = (s) => root.querySelector(s);
          const all = (s) => [...root.querySelectorAll(s)];
          const card = q(".card"), lns = all(".card .ln");
          const tl = gsap.timeline({ paused: true });
          const type = (i, at, cps = 40) => {
            tl.fromTo(lns[i].querySelector(".no"), { opacity: 0 }, { opacity: 1, duration: 0.001 }, at);
            return Egg.typeOn(tl, lns[i].querySelector(".tx"), at, { cps });
          };
          gsap.set([...all(".wk"), q(".time"), q(".tz"), q(".cap")], { opacity: 0 });

          // "Step two: deployment dot M D"
          Apple.rise(tl, q(".a-eyebrow"), 0.2, { y: 16 });
          Apple.zoom(tl, card, 0.35, { from: 0.96, dur: 0.8 });
          Apple.tint(tl, q(".bar .a-tint"), 1.43, { dur: 0.5 });
          type(0, 1.6, 30); type(8, 1.7, 30); type(1, 1.85, 44);
          Egg.codeRun(tl, card, 1, 1.95);
          // "Weekdays": the cron line, and the week fills Mon–Fri
          type(2, 3.0, 50); type(3, 3.25, 80);
          Egg.codeRun(tl, card, 3, 3.42);
          Apple.rise(tl, all(".wk"), 3.45, { y: 20, dur: 0.5, stagger: 0.05 });
          tl.to(all(".wk .on"), { opacity: 1, duration: 0.25, ease: "power1.out", stagger: 0.07 }, 3.6);
          // "at seven thirty-two"
          Apple.tint(tl, q(".ln .a-tint"), 4.1, { dur: 0.4 });
          Apple.rise(tl, q(".time"), 4.2, { y: 24, dur: 0.6 });
          type(4, 4.3, 70);
          Egg.codeRun(tl, card, [3, 4], 4.35);
          Apple.rise(tl, q(".tz"), 4.45, { y: 14, dur: 0.6 });
          // "with a five dollar cap per run"
          type(5, 5.0, 60); type(6, 5.12, 70); type(7, 5.3, 70);
          Egg.codeRun(tl, card, 7, 5.45);
          Apple.rise(tl, q(".cap"), 5.45, { y: 24, dur: 0.6 });
          Egg.count(tl, q(".cap .v"), 0, 5, 5.5, { dur: 0.5, fmt: (v) => "$" + v.toFixed(2) });
          // the body: the first message of every run
          type(9, 6.3, 60);
          Egg.codeRun(tl, card, -1, 6.4);

          Apple.out(tl, [q(".a-eyebrow"), card, ...all(".wk"), q(".time"), q(".tz"), q(".cap")], DUR - 0.3, { dur: 0.3 });
          window.__timelines["s04-daily"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
