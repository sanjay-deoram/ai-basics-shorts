<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <!-- Sound cues (seconds from scene start). Run node tools/build-sfx.mjs after editing. -->
    <script type="application/json" class="sfx-cues">[
      {"t":0.3,"sfx":"click-soft","vol":0.2},
      {"t":0.8,"sfx":"click-soft","vol":0.2},
      {"t":1.7,"sfx":"click-soft","vol":0.2},
      {"t":3.6,"sfx":"pop","vol":0.22},
      {"t":5.1,"sfx":"whoosh-short","vol":0.2},
      {"t":5.8,"sfx":"pop","vol":0.26}
    ]</script>
  </head>
  <body>
    <template>
      <!-- s03 · Why it needs context. Left: a bookshelf, what Claude learned in training (general knowledge). Right: its
           desk, what it knows about you: nothing. A dashed sheet "You & your task" appears and flies onto the desk; the
           label turns to "Only what you tell it". Books come from a seeded generator (deterministic).
           Source: Claude docs, Context windows: the context window "is different from the large corpus of data the
           language model was trained on, and instead represents a 'working memory' for the model." -->
      <style>
        #root { position: absolute; inset: 0; }
        .s03 .egg-eyebrow { position: absolute; left: 90px; top: 232px; }
        .s03 .col { position: absolute; top: 760px; width: 400px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; }
        .s03 .col .egg-eyebrow { position: static; font-size: 24px; color: var(--graphite); }
        .s03 .col p { margin: 0; font: 300 46px/1.12 var(--f-display); letter-spacing: -0.02em; color: var(--ink); text-wrap: balance; }
        .s03 .col .swap { position: relative; width: 100%; height: 110px; }
        .s03 .col .swap p { position: absolute; left: 0; right: 0; top: 0; }
        .s03 .cl { left: 110px; }
        .s03 .cr { left: 560px; }
        .s03 .you { position: absolute; left: 390px; top: 870px; width: 300px; height: 150px; border: 3px dashed var(--smoke); border-radius: 22px; background: var(--eggshell); display: grid; place-items: center; }
        .s03 .you span { font: 300 42px/1.1 var(--f-display); letter-spacing: -0.02em; color: var(--ink); }
      </style>
      <div id="root" data-composition-id="s03-why" data-width="1080" data-height="1920">
        <div class="egg-scene s03">
          <span class="egg-eyebrow">Why it needs context</span>
          <svg class="egg-svg lib" viewBox="0 0 1080 1920" aria-hidden="true">
            <rect class="ink" data-draw="0" data-dur="0.7" x="120" y="380" width="380" height="340" rx="8" />
            <path class="ink" data-draw="1" data-dur="0.4" d="M120 493 H500 M120 606 H500" />
          </svg>
          <svg class="egg-svg desk" viewBox="0 0 1080 1920" aria-hidden="true">
            <path class="ink" data-draw="0" data-dur="0.5" d="M630 560 L890 560 L930 620 L590 620 Z" />
            <path class="ink" data-draw="1" data-dur="0.4" d="M590 620 V640 H930 V620 M610 640 V720 M910 640 V720" />
          </svg>
          <svg class="egg-svg landed" viewBox="0 0 1080 1920" aria-hidden="true">
            <path class="ink thin" d="M722 574 L798 574 L806 604 L714 604 Z" />
          </svg>
          <div class="col cl"><span class="egg-eyebrow">What it learned</span><div class="swap"><p>Tons of general knowledge</p></div></div>
          <div class="col cr"><span class="egg-eyebrow">What it knows about you</span><div class="swap"><p class="a">Nothing</p><p class="b">Only what you tell it</p></div></div>
          <div class="you"><span>You &amp; your task</span></div>
        </div>
      </div>
      <script>
        (() => {
          const DUR = 8.0;
          const root = document.querySelector('[data-composition-id="s03-why"] .s03');
          const q = (s) => root.querySelector(s);

          // books: one path per shelf row (seeded, so every render is identical)
          let seed = 11;
          const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
          [493, 606, 720].forEach((base, r) => {
            let x = 134, d = "";
            while (x < 470) {
              const w = Math.round(14 + rnd() * 11), h = Math.round(62 + rnd() * 34);
              if (x + w > 486) break;
              d += `M${x} ${base} V${base - h} H${x + w} V${base} `;
              x += w + Math.round(rnd() * 4);
            }
            const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
            p.setAttribute("class", "ink thin");
            p.setAttribute("d", d.trim());
            p.dataset.draw = String(2 + r);
            p.dataset.dur = "0.8";
            q(".lib").appendChild(p);
          });
          const landed = q(".landed path");
          landed.setAttribute("pathLength", "1");
          landed.style.strokeDasharray = "1 1.1";

          const tl = gsap.timeline({ paused: true });
          Egg.fadeUp(tl, root.querySelector(":scope > .egg-eyebrow"), 0.05);
          // what it learned
          Egg.draw(tl, q(".lib"), 0.3, { gap: 0.25 });
          Egg.fadeUp(tl, q(".cl").children, 1.2, { stagger: 0.1 });
          // what it knows about you: nothing
          Egg.draw(tl, q(".desk"), 1.7, { gap: 0.25 });
          tl.set(q(".cr .b"), { opacity: 0 }, 0);
          Egg.fadeUp(tl, [q(".cr .egg-eyebrow"), q(".cr .a")], 2.0, { stagger: 0.1 });

          // you and your task go onto the desk
          Egg.fadeUp(tl, q(".you"), 3.6);
          tl.to(q(".you"), { x: 760 - 540, y: 589 - 945, scale: 0.3, opacity: 0, duration: 0.7, ease: "power2.in" }, 5.1);
          tl.fromTo(landed, { strokeDashoffset: 1.02 }, { strokeDashoffset: 0, duration: 0.35, ease: Egg.EASE.draw }, 5.75);
          tl.to(q(".cr .a"), { opacity: 0, y: -16, duration: 0.25, ease: Egg.EASE.exit }, 5.8);
          tl.fromTo(q(".cr .b"), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, ease: Egg.EASE.enter }, 6.0);
          tl.fromTo(q(".cr"), { scale: 1 }, { scale: 1.06, transformOrigin: "50% 0%", duration: 0.5, ease: Egg.EASE.move, yoyo: true, repeat: 1, repeatDelay: 0.4 }, 6.0);

          Egg.fadeOut(tl, [q(".lib"), q(".desk"), q(".landed"), q(".cl"), q(".cr"), root.querySelector(":scope > .egg-eyebrow")], DUR - 0.35);
          window.__timelines["s03-why"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
