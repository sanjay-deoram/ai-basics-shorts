<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <script type="application/json" class="sfx-cues">[
      {"t":0.15,"sfx":"air","vol":0.14},
      {"t":1.0,"sfx":"pop","vol":0.14},
      {"t":1.45,"sfx":"click","vol":0.18},
      {"t":1.6,"sfx":"whoosh-short","vol":0.1},
      {"t":2.2,"sfx":"tick","vol":0.18},
      {"t":4.1,"sfx":"air","vol":0.12},
      {"t":5.1,"sfx":"stream","vol":0.1,"dur":0.8},
      {"t":6.6,"sfx":"stream","vol":0.1,"dur":0.8},
      {"t":7.4,"sfx":"pop","vol":0.16},
      {"t":8.6,"sfx":"marker","vol":0.14}
    ]</script>
  </head>
  <body>
    <template>
      <!-- s04 · Habit 3 · effort. Click the model name next to send: the Effort menu opens, Medium (default) is ticked.
           Then the eval bars: Opus 5.5 · Medium as tall as Opus 5 · High ("matched or beat"); the rule "Move to High only
           when Medium stalls".
           Voiceover: 0.17 "Habit three: leave effort on Medium, the default. In testing, Medium matched or beat Opus five at
           High, so move up only when Medium stalls." -->
      <style>
        #root { position: absolute; inset: 0; }
        .s04 .hd { top: 316px; }
        .s04 .hd .l { display: block; white-space: nowrap; }
        .s04 .cp { left: 90px; top: 548px; width: 860px; height: 130px; }
        .s04 .cp .ph { position: absolute; left: 34px; top: 46px; font: 500 32px/1 var(--f-t); color: var(--faint); }
        .s04 .cp .md { position: absolute; right: 120px; top: 33px; }
        .s04 .cp .snd { position: absolute; right: 30px; top: 33px; width: 64px; height: 64px; border-radius: 50%; background: var(--blue); }
        .s04 .cp .snd::after { content: ""; position: absolute; left: 22px; top: 18px; width: 16px; height: 16px; border: solid #fff; border-width: 5px 5px 0 0; transform: rotate(-45deg) translate(-2px, 6px); }
        .s04 .mn { left: 430px; top: 700px; width: 520px; height: 330px; }
        .s04 .mn .h { position: absolute; left: 30px; top: 26px; font: 600 28px/1 var(--f-t); color: var(--mu); }
        .s04 .mn .o { position: absolute; left: 14px; right: 14px; height: 78px; display: flex; align-items: center; padding: 0 20px; border-radius: 18px; font: 600 34px/1 var(--f-t); color: var(--ink); white-space: nowrap; }
        .s04 .mn .o .d { margin-left: 12px; font-weight: 500; color: var(--mu); }
        .s04 .mn .o .a-check { position: absolute; right: 20px; top: 17px; }
        .s04 .mn .o.sel { background: var(--gray); }
        .s04 .cur { position: absolute; left: 640px; top: 640px; width: 34px; height: 46px; }
        .s04 .ch { left: 90px; top: 720px; width: 860px; height: 420px; }
        .s04 .ch .bx { position: absolute; bottom: 92px; width: 220px; border-radius: 20px 20px 6px 6px; transform-origin: 50% 100%; }
        .s04 .ch .bx.a { left: 150px; height: 240px; background: var(--blue); }
        .s04 .ch .bx.b { left: 490px; height: 232px; background: var(--line); }
        .s04 .ch .n { position: absolute; bottom: 34px; width: 300px; margin: 0; text-align: center; font: 600 30px/1 var(--f-t); color: var(--ink); white-space: nowrap; }
        .s04 .ch .tt { position: absolute; left: 34px; top: 26px; font: 600 28px/1 var(--f-t); color: var(--mu); }
        .s04 .ch .st { position: absolute; left: 380px; top: 60px; }
        .s04 .rule { left: 90px; top: 1180px; color: var(--ink); }
      </style>
      <div id="root" data-composition-id="s04-effort" data-width="1080" data-height="1920">
        <div class="a-scene s04">
          <p class="a-eyebrow">Habit 3</p>
          <h2 class="a-h2 hd"><span class="l">Leave effort on</span><span class="l"><span class="a-tint" data-layout-allow-overlap=""><span data-layout-allow-overlap="">Medium</span><span class="on" data-layout-allow-overlap="">Medium</span></span></span></h2>
          <div class="a-card cp"><span class="ph">Reply to Claude…</span><span class="a-mod md"><span class="cc-spark"></span>Opus 5.5 ▾</span><span class="snd"></span></div>
          <div class="a-card mn">
            <span class="h">Effort</span>
            <div class="o" style="top:70px">Low</div>
            <div class="o sel" style="top:152px">Medium<span class="d">default</span><i class="a-check"></i></div>
            <div class="o" style="top:234px">High</div>
          </div>
          <svg class="cur" viewBox="0 0 34 46" aria-hidden="true"><path d="M3 3 L3 37 L12 29 L18 43 L24 40 L18 27 L30 27 Z" fill="#1d1d1f" stroke="#fff" stroke-width="3" stroke-linejoin="round" /></svg>
          <div class="a-card ch">
            <span class="tt">On evals (score)</span>
            <div class="bx a"></div><div class="bx b"></div>
            <p class="n" style="left:110px">Opus 5.5 · Medium</p>
            <p class="n" style="left:450px">Opus 5 · High</p>
            <span class="a-tag blue st">matched or beat</span>
          </div>
          <p class="a-sub rule">Move to High only when Medium stalls.</p>
        </div>
      </div>
      <script>
        (() => {
          const DUR = 10.64;
          const root = document.querySelector('[data-composition-id="s04-effort"] .s04');
          const q = (s) => root.querySelector(s);
          const all = (s) => [...root.querySelectorAll(s)];
          gsap.set([q(".cp"), q(".mn"), q(".cur"), q(".ch"), q(".st"), q(".rule"), q(".mn .a-check"), ...all(".ch .n")], { opacity: 0 });
          const tl = gsap.timeline({ paused: true });
          Apple.rise(tl, q(".a-eyebrow"), 0.12, { y: 16 });
          Apple.rise(tl, q(".hd"), 0.2, { y: 24, dur: 0.8 });
          Apple.rise(tl, q(".cp"), 0.9, { y: 30, dur: 0.6 });
          // "Leave effort": the cursor clicks the model name, the menu opens
          tl.fromTo(q(".cur"), { opacity: 0, x: 120, y: 90 }, { opacity: 1, x: 0, y: 0, duration: 0.5, ease: "power2.out" }, 0.95);
          tl.to(q(".cp .md"), { scale: 0.95, duration: 0.1, yoyo: true, repeat: 1 }, 1.45);
          Apple.zoom(tl, q(".mn"), 1.6, { from: 0.92, dur: 0.5 });
          // "on Medium, the default"
          tl.to(q(".cur"), { x: -60, y: 210, duration: 0.45, ease: "power2.inOut" }, 1.75);
          Apple.zoom(tl, q(".mn .a-check"), 2.2, { from: 0.5, dur: 0.4 });
          Apple.tint(tl, q(".hd .a-tint"), 2.2, { dur: 0.4 });
          tl.to(q(".mn .sel"), { scale: 1.03, duration: 0.2, yoyo: true, repeat: 1 }, 3.1);
          // "In testing": the menu closes, the chart opens
          tl.to([q(".mn"), q(".cur")], { opacity: 0, duration: 0.3 }, 4.0);
          Apple.rise(tl, q(".ch"), 4.15, { y: 30, dur: 0.6 });
          // "Medium" bar, then "Opus five at High"
          tl.fromTo(q(".bx.a"), { scaleY: 0 }, { scaleY: 1, duration: 0.8, ease: "power3.out" }, 5.1);
          Apple.fade(tl, all(".ch .n")[0], 5.1, { dur: 0.4 });
          tl.fromTo(q(".bx.b"), { scaleY: 0 }, { scaleY: 1, duration: 0.8, ease: "power3.out" }, 6.6);
          Apple.fade(tl, all(".ch .n")[1], 6.6, { dur: 0.4 });
          Apple.zoom(tl, q(".st"), 7.4, { from: 0.8, dur: 0.4 });
          // "so move up only when Medium stalls"
          Apple.rise(tl, q(".rule"), 8.4, { y: 16, dur: 0.6 });
          Apple.out(tl, root.querySelectorAll(".a-eyebrow, .hd, .cp, .ch, .rule"), DUR - 0.3, { dur: 0.3 });
          window.__timelines["s04-effort"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
