<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <script type="application/json" class="sfx-cues">[
      {"t":0.15,"sfx":"air","vol":0.14},
      {"t":0.5,"sfx":"pop","vol":0.14},
      {"t":1.3,"sfx":"pop","vol":0.16},
      {"t":3.1,"sfx":"pop","vol":0.16},
      {"t":4.45,"sfx":"pop","vol":0.16},
      {"t":6.6,"sfx":"typing","vol":0.12,"dur":1.4},
      {"t":8.1,"sfx":"send","vol":0.14}
    ]</script>
  </head>
  <body>
    <template>
      <!-- s02 · The example: tidepool, a small Node API that predicts tides (the article's own experiment). The repo
           tree, then the three job cards as each is said (flaky test: a race in TtlCache.get; docs/API.md out of date;
           src/logger.js should print JSON lines); then the terminal: claude --cloud "fix flaky TtlCache.get test".
           Voiceover: 0.17 "Say your app has a test that fails at random, out-of-date docs, and a logger that should print
           JSON. You hand each job to Claude in the cloud." -->
      <style>
        #root { position: absolute; inset: 0; }
        .s02 .hd { top: 316px; white-space: nowrap; }
        .s02 .rp { left: 90px; top: 450px; width: 860px; }
        .s02 .jb { left: 90px; width: 860px; height: 84px; display: flex; align-items: center; gap: 20px; padding: 0 26px; border-radius: 22px; font: 600 30px/1 var(--f-t); color: var(--ink); white-space: nowrap; }
        .s02 .jb b { display: inline-flex; align-items: center; justify-content: center; width: 46px; height: 46px; border-radius: 50%; background: var(--blue); color: #fff; font: 700 26px/1 var(--f-d); }
        .s02 .jb s { text-decoration: none; font: 400 28px/1 var(--f-m); color: var(--mu); }
        .s02 .tm { left: 90px; top: 1084px; width: 860px; }
      </style>
      <div id="root" data-composition-id="s02-jobs" data-width="1080" data-height="1920">
        <div class="a-scene s02">
          <p class="a-eyebrow">The example</p>
          <h2 class="a-h2 hd">Three <span class="a-tint" data-layout-allow-overlap=""><span data-layout-allow-overlap="">jobs</span><span class="on" data-layout-allow-overlap="">jobs</span></span></h2>
          <div class="a-win rp"><div class="bar"><i></i><i></i><i></i><span class="ttl mono l">tidepool/ · Node API that predicts tides</span></div>
            <div class="a-txt"><span class="ln">src/server.js</span><span class="ln">src/ttl-cache.js</span><span class="ln">src/logger.js</span><span class="ln">docs/API.md</span></div>
          </div>
          <div class="a-card jb" style="top:770px"><b>1</b>Fix the flaky test<s>race in TtlCache.get</s></div>
          <div class="a-card jb" style="top:868px"><b>2</b>Rewrite docs/API.md<s>match src/server.js</s></div>
          <div class="a-card jb" style="top:966px"><b>3</b>src/logger.js<s>emit JSON lines</s></div>
          <div class="a-win tm"><div class="bar"><i></i><i></i><i></i><span class="ttl mono">terminal</span></div>
            <div class="a-txt"><span class="ln"><span class="ty"><span class="cm">$</span> claude --cloud <span class="k">"fix flaky TtlCache.get test"</span></span></span></div>
          </div>
        </div>
      </div>
      <script>
        (() => {
          const DUR = 8.78;
          const root = document.querySelector('[data-composition-id="s02-jobs"] .s02');
          const q = (s) => root.querySelector(s);
          const jbs = [...root.querySelectorAll(".jb")];
          gsap.set([q(".rp"), ...jbs, q(".tm")], { opacity: 0 });
          const tl = gsap.timeline({ paused: true });
          Apple.rise(tl, q(".a-eyebrow"), 0.12, { y: 16 });
          Apple.rise(tl, q(".hd"), 0.2, { y: 24, dur: 0.7 });
          Apple.rise(tl, q(".rp"), 0.5, { y: 30, dur: 0.6 });
          // each job as it is said
          [1.3, 3.1, 4.45].forEach((at, i) => Apple.rise(tl, jbs[i], at, { y: 30, dur: 0.5 }));
          Apple.tint(tl, q(".hd .a-tint"), 5.4, { dur: 0.4 });
          // "You hand each job to Claude in the cloud"
          Apple.rise(tl, q(".tm"), 6.4, { y: 30, dur: 0.5 });
          Egg.typeOn(tl, q(".ty"), 6.6, { cps: 32 });
          Apple.out(tl, root.querySelectorAll(".a-eyebrow, .hd, .rp, .jb, .tm"), DUR - 0.28, { dur: 0.28 });
          window.__timelines["s02-jobs"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
