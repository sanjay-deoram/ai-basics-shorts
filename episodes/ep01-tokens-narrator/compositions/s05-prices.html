          const root = document.querySelector('[data-composition-id="s05-prices"] .s05');
          const q = (s) => root.querySelector(s);
          const cam = q(".cam");
          const tl = gsap.timeline({ paused: true });
          Egg.fadeUp(tl, root.querySelectorAll(".head > *"), 0.05);
          Egg.fadeUp(tl, root.querySelectorAll(".row .top"), 0.6, { stagger: 0.15 });
          Egg.bars(tl, root.querySelectorAll(".rows .bar-in"), 1.5, { stagger: 0.1 });
          Egg.bars(tl, root.querySelectorAll(".rows .bar-out"), 2.3, { stagger: 0.15, dur: 0.9 });

          tl.to(cam, { scale: 1.08, transformOrigin: "90px 900px", duration: 0.7, ease: Egg.EASE.move }, 3.8);
          root.querySelectorAll(".price .o").forEach((o, i) => Egg.highlight(tl, o, 4.0 + i * 0.12));
          Egg.pop(tl, q(".call .egg-counter"), 4.2);
          tl.to(cam, { scale: 1, duration: 0.7, ease: Egg.EASE.move }, 5.6);
          Egg.fadeUp(tl, q(".egg-label"), 6.0);
          Egg.fadeOut(tl, [cam, q(".key"), q(".call"), q(".egg-safe")], 7.65);
