<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <script type="application/json" class="sfx-cues">[
      {"t":1.25,"sfx":"tick","vol":0.16},
      {"t":1.6,"sfx":"pop","vol":0.22},
      {"t":2.38,"sfx":"pop","vol":0.2},
      {"t":2.5,"sfx":"flurry","vol":0.14},
      {"t":2.75,"sfx":"thud","vol":0.18},
      {"t":4.3,"sfx":"pop","vol":0.2},
      {"t":4.67,"sfx":"thud","vol":0.18},
      {"t":6.23,"sfx":"pop","vol":0.2},
      {"t":6.6,"sfx":"thud","vol":0.18},
      {"t":7.2,"sfx":"pop","vol":0.2},
      {"t":7.57,"sfx":"thud","vol":0.2},
      {"t":8.16,"sfx":"whip","vol":0.32}
    ]</script>
  </head>
  <body>
    <template>
      <!-- s03 · The example: your app's four jobs, the through-line of the reel. Peach: "Four jobs." word by word; each
           job card slides in as it is said (the ticket count runs to 10,000) and is stamped MODEL? — which one should
           do it? The next beats hand them out. Whip out. Badge bottom-left (narrator).
           Voiceover: 0.48 "Say your app has four jobs: tagging ten thousand tickets, a chat reply a customer waits on,
           a tricky bug, and a big migration." -->
      <style>
        #s03-root .bg { background-color: #ffe1cc; }
        #s03-root .rl-hd { --acc: #c2410c; }
        #s03-root .wc .rstamp { color: #5f5b55; }
      </style>
      <div id="s03-root" data-composition-id="s03-jobs" data-width="1080" data-height="1920">
        <div class="rl">
          <div class="rl-cam">
            <div class="rl-bg grid bg"></div>
            <div class="rl-eye">// say your app has</div>
            <div class="rl-hd"><span class="ln"><span class="w">Four </span><em class="w">jobs.</em></span></div>
            <div class="wc" style="top:470px"><div class="k">// job 1 · tickets</div><div class="v">Tag <span class="cnt">10,000</span> tickets</div><div class="rstamp" data-layout-allow-overlap="">Model?</div></div>
            <div class="wc" style="top:640px"><div class="k">// job 2 · a customer waits</div><div class="v">Reply in chat</div><div class="rstamp" data-layout-allow-overlap="">Model?</div></div>
            <div class="wc" style="top:810px"><div class="k">// job 3 · somewhere in the code</div><div class="v">Fix a tricky bug</div><div class="rstamp" data-layout-allow-overlap="">Model?</div></div>
            <div class="wc" style="top:980px"><div class="k">// job 4 · many steps</div><div class="v">Migrate the database</div><div class="rstamp" data-layout-allow-overlap="">Model?</div></div>
          </div>
        </div>
      </div>
      <script>
        (() => {
          const root = document.getElementById("s03-root");
          const cam = root.querySelector(".rl-cam");
          const q = (s) => root.querySelector(s);
          const cards = [...root.querySelectorAll(".wc")];
          const tl = gsap.timeline({ paused: true });
          const blur = Reel.blurFor(cam, "s03-mb");
          Reel.whip(tl, cam, blur, 0, "in");
          gsap.set(cards, { opacity: 0 });

          tl.fromTo(q(".rl-eye"), { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0.5);
          // "four jobs"
          Reel.words(tl, q(".rl-hd"), [1.25, 1.6]);
          // each job as it is said, stamped MODEL?
          [2.38, 4.3, 6.23, 7.2].forEach((t, i) => {
            tl.fromTo(cards[i], { opacity: 0, x: -80 }, { opacity: 1, x: 0, duration: 0.28, ease: "power3.out" }, t);
            Egg.stamp(tl, cards[i].querySelector(".rstamp"), t + 0.37);
          });
          Egg.count(tl, q(".cnt"), 0, 10000, 2.45, { dur: 0.9, fmt: (v) => (Math.round(v / 50) * 50).toLocaleString("en-US") });
          Reel.whip(tl, cam, blur, 8.2, "out");

          window.__timelines["s03-jobs"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
