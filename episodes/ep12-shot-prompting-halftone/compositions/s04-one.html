<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <script type="application/json" class="sfx-cues">[
      {"t":0.0,"sfx":"whoosh","vol":0.1},
      {"t":0.85,"sfx":"draw","vol":0.18},
      {"t":1.65,"sfx":"blip","vol":0.14},
      {"t":2.85,"sfx":"zoom-in","vol":0.2},
      {"t":3.25,"sfx":"typing","vol":0.13,"dur":1.6},
      {"t":5.75,"sfx":"blip","vol":0.14},
      {"t":6.8,"sfx":"pop","vol":0.14},
      {"t":7.25,"sfx":"draw","vol":0.2},
      {"t":8.0,"sfx":"zoom-out","vol":0.18},
      {"t":8.75,"sfx":"tick","vol":0.18},
      {"t":9.05,"sfx":"tick","vol":0.18},
      {"t":9.35,"sfx":"draw","vol":0.18},
      {"t":11.05,"sfx":"blip","vol":0.16},
      {"t":11.35,"sfx":"draw","vol":0.18},
      {"t":11.9,"sfx":"swish","vol":0.12},
      {"t":12.85,"sfx":"pop","vol":0.14},
      {"t":13.55,"sfx":"zoom-in","vol":0.18},
      {"t":14.0,"sfx":"tick","vol":0.16},
      {"t":14.3,"sfx":"tick","vol":0.16},
      {"t":14.65,"sfx":"tick","vol":0.16},
      {"t":15.2,"sfx":"zoom-out","vol":0.16}
    ]</script>
  </head>
  <body>
    <template>
      <!-- s04 · one-shot (29.75–45.35). The blue panel from s03 lifts off.
           "One-shot, one example first." The // messages card: system (grey), a dashed "example" slot, and the real
           ticket (orange user turn). The camera pushes in while the slot fills: user turn (orange) "My password reset
           email never arrived.", assistant turn (blue) "Low"; ring "one shot", "+1 example" on the corner.
           The // replies cell: High, High, ringed "same format", then {"label": "High"} ringed "set shape".
           The card turns into // scale: 1 / 3 labels seen, only LOW filled and ringed "seen"; the camera pushes in on
           the track while a "?" hops between Medium and High. -->
      <style>
        #root { position: absolute; inset: 0; pointer-events: none; }
        .s04-blue { background: var(--blue); }
        .s04-hd { top: 320px; }
        .s04-ms { left: 90px; top: 600px; width: 860px; height: 440px; }
        .s04-ms .msg { left: 24px; width: 812px; }
        .s04-ms .msg .t { font-size: 30px; line-height: 40px; }
        .s04-ms .legend { right: 30px; top: 24px; }
        .s04-sys { top: 62px; }
        .s04-slot { position: absolute; left: 14px; right: 14px; top: 146px; height: 184px; border: 3px dashed #b9c8ff; border-radius: 20px; }
        .s04-slot .sk { position: absolute; left: 16px; top: -17px; padding: 0 10px; background: #fff; font: 400 22px/30px var(--f-mono); color: var(--blue); }
        .s04-u1 { top: 160px; } .s04-a1 { top: 244px; }
        .s04-u2 { top: 348px; }
        .s04-u2 .real { margin-left: auto; font: 400 22px/30px var(--f-mono); color: var(--user-ink); }
        .s04-shot { left: 26px; top: 152px; width: 808px; height: 172px; }
        .s04-shot .cl { right: 20px; top: -26px; }
        .s04-plus { position: absolute; left: 470px; top: 576px; height: 50px; padding: 0 18px; border-radius: 25px; background: var(--blue); color: #fff; font: 600 25px/50px var(--f-body); }
        .s04-rp { left: 90px; top: 1080px; width: 480px; height: 400px; }
        .s04-c { position: absolute; left: 30px; right: 30px; display: flex; align-items: center; gap: 16px; }
        .s04-c .bub { flex: 1; height: 62px; border-radius: 12px; background: var(--asst-tint); border-left: 8px solid var(--asst); padding: 0 16px; font: 650 40px/62px var(--f-display); letter-spacing: -0.03em; color: var(--asst-ink); }
        .s04-c1 { top: 66px; } .s04-c2 { top: 146px; }
        .s04-same { left: 22px; top: 58px; width: 436px; height: 160px; }
        .s04-same .cl { right: 0; top: 168px; }
        .s04-json { position: absolute; left: 30px; right: 30px; top: 300px; height: 70px; border-radius: 12px; background: #0b0b0b; color: #fff; font: 400 27px/70px var(--f-mono); padding-left: 20px; }
        .s04-json b { font-weight: 400; color: #8fb0ff; }
        .s04-set { left: 22px; top: 292px; width: 436px; height: 86px; }
        .s04-set .cl { right: 0; top: -54px; }
        .s04-sc { left: 90px; top: 600px; width: 860px; height: 440px; }
        .s04-big { position: absolute; left: 30px; top: 70px; font: 600 150px/160px var(--f-display); letter-spacing: -0.05em; color: var(--ink); }
        .s04-big small { font: 500 40px/50px var(--f-body); letter-spacing: -0.01em; color: var(--grey); margin-left: 14px; }
        .s04-track { position: absolute; left: 90px; right: 90px; top: 330px; height: 4px; background: var(--ink); }
        .s04-dot { position: absolute; top: -16px; width: 36px; height: 36px; margin-left: -18px; border-radius: 50%; border: 4px solid var(--ink); background: #fff; }
        .s04-dot.on { background: var(--blue); border-color: var(--blue); }
        .s04-dl { position: absolute; top: 34px; width: 200px; margin-left: -100px; text-align: center; font: 400 23px/30px var(--f-mono); color: var(--ink); }
        .s04-q { position: absolute; left: 0; top: -92px; width: 60px; height: 60px; margin-left: -30px; border-radius: 50%; background: var(--blue); color: #fff; text-align: center; font: 700 34px/60px var(--f-body); }
        .s04-seen { left: 50px; top: 290px; width: 80px; height: 120px; }
        .s04-seen .cl { left: 96px; top: -70px; }
      </style>
      <div id="root" data-composition-id="s04-one" data-width="1080" data-height="1920">
        <div class="cam">
          <div class="hd s04-hd">
            <span class="ln"><span>One-shot,</span></span>
            <span class="ln"><span><em>one example first.</em></span></span>
          </div>
          <div class="cd s04-ms">
            <div class="lb">// messages</div>
            <div class="legend"><span><i style="background:var(--user)"></i>user</span><span><i style="background:var(--asst)"></i>assistant</span></div>
            <div class="msg sys s04-sys"><span class="who">system</span><span class="t">Label the ticket High, Medium, or Low.</span></div>
            <div class="s04-slot"><span class="sk">example</span></div>
            <div class="msg u s04-u1"><span class="who">user</span><span class="t"></span></div>
            <div class="msg a s04-a1"><span class="who"><img src="assets/claude-logo.svg" alt="">assistant</span><span class="t">Low</span></div>
            <div class="msg u s04-u2"><span class="who">user</span><span class="t">I'm locked out of my account.</span><span class="real">← real ticket</span></div>
            <div class="co s04-shot" data-layout-allow-overlap=""><svg><rect x="0" y="0" width="100%" height="100%" rx="18" pathLength="1"/></svg><span class="cl">one shot</span></div>
          </div>
          <div class="s04-plus">+1 example</div>
          <div class="cd s04-rp">
            <div class="lb">// replies</div>
            <div class="s04-c s04-c1"><span class="mk">call 1</span><span class="bub">High</span></div>
            <div class="s04-c s04-c2"><span class="mk">call 2</span><span class="bub">High</span></div>
            <div class="co s04-same" data-layout-allow-overlap=""><svg><rect x="0" y="0" width="100%" height="100%" rx="16" pathLength="1"/></svg><span class="cl">same format</span></div>
            <div class="s04-json">{"label": <b>"High"</b>}</div>
            <div class="co s04-set" data-layout-allow-overlap=""><svg><rect x="0" y="0" width="100%" height="100%" rx="16" pathLength="1"/></svg><span class="cl">a set shape</span></div>
          </div>
          <div class="cd s04-sc">
            <div class="lb">// scale · labels it has seen</div>
            <div class="s04-big">1<small>/ 3</small></div>
            <div class="s04-track">
              <div class="s04-dot on" style="left:0%"></div><div class="s04-dl" style="left:0%">LOW</div>
              <div class="s04-dot" style="left:50%"></div><div class="s04-dl" style="left:50%">MEDIUM</div>
              <div class="s04-dot" style="left:100%"></div><div class="s04-dl" style="left:100%">HIGH</div>
              <div class="s04-q">?</div>
            </div>
            <div class="co s04-seen" data-layout-allow-overlap=""><svg><rect x="0" y="0" width="100%" height="100%" rx="16" pathLength="1"/></svg><span class="cl">only one seen</span></div>
          </div>
        </div>
        <div class="panel s04-blue"></div>
      </div>
      <script>
        (() => {
          const r = document.querySelector('[data-composition-id="s04-one"]');
          const q = (s) => r.querySelector(s), E = (t) => +(t - 29.75).toFixed(3);
          const cam = q(".cam");
          const tl = gsap.timeline({ paused: true });
          const hd = r.querySelectorAll(".ln > span");
          tl.set(cam, { x: 0, y: 0, scale: 1 }, 0);
          tl.fromTo(q(".s04-blue"), { yPercent: 0 }, { yPercent: -100, duration: 0.45, ease: "expo.inOut" }, 0.02);

          FX.rise(tl, hd, [E(29.9), E(30.45)]);
          tl.fromTo(q(".s04-ms"), { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.55, ease: "expo.out" }, E(30.1));
          tl.fromTo(q(".s04-slot"), { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, E(30.6));
          tl.fromTo(q(".s04-u2"), { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out" }, E(31.4));

          // push in on the example while it fills
          FX.zoom(tl, cam, { x: 90, y: 740, w: 860, h: 200 }, E(32.55), { W: 1010, dur: 0.7 });
          tl.fromTo(q(".s04-u1"), { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, E(32.9));
          FX.type(tl, q(".s04-u1 .t"), "My password reset email never arrived.", E(33.0), 1.8);
          tl.fromTo(q(".s04-a1"), { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, E(35.45));
          FX.pop(tl, q(".s04-a1 .t"), E(36.5), { from: 0.3 });
          tl.to(q(".s04-slot"), { opacity: 0, duration: 0.25, ease: "none" }, E(36.9));
          FX.callout(tl, q(".s04-shot"), E(36.95));
          FX.pop(tl, q(".s04-plus"), E(37.2), { from: 0.3 });
          FX.unzoom(tl, cam, E(37.75), { dur: 0.6 });

          // replies: same format, a set shape
          tl.fromTo(q(".s04-rp"), { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out" }, E(38.2));
          tl.fromTo(q(".s04-c1"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, E(38.5));
          tl.fromTo(q(".s04-c2"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, E(38.8));
          FX.callout(tl, q(".s04-same"), E(39.1), E(40.7));
          tl.fromTo(q(".s04-json"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, E(40.8));
          FX.callout(tl, q(".s04-set"), E(41.1));

          // only one label seen
          tl.to([q(".s04-ms"), q(".s04-plus")], { opacity: 0, y: -30, duration: 0.3, ease: "power2.in" }, E(41.6));
          tl.fromTo(q(".s04-sc"), { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.55, ease: "expo.out" }, E(41.7));
          tl.fromTo(q(".s04-big"), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: "expo.out" }, E(42.1));
          FX.pop(tl, q(".s04-dot.on"), E(42.6), { from: 0.2 });
          FX.callout(tl, q(".s04-seen"), E(42.8));
          FX.zoom(tl, cam, { x: 150, y: 830, w: 780, h: 220 }, E(43.3), { W: 1000, dur: 0.6 });
          const Q = q(".s04-q");
          tl.fromTo(Q, { x: 510, opacity: 0, scale: 0.4 }, { x: 510, opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, E(43.7));
          tl.to(Q, { x: 612, duration: 0.3, ease: "sine.inOut" }, E(44.05));
          tl.to(Q, { x: 394, duration: 0.32, ease: "sine.inOut" }, E(44.4));
          tl.to(Q, { x: 517, duration: 0.28, ease: "sine.inOut" }, E(44.75));
          FX.unzoom(tl, cam, E(44.95), { dur: 0.4 });
          window.__timelines["s04-one"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
