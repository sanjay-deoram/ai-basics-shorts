<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <script type="application/json" class="sfx-cues">[
      {"t":0.15,"sfx":"whoosh-short","vol":0.08},
      {"t":5.1,"sfx":"blip","vol":0.1},
      {"t":61.6,"sfx":"swish","vol":0.12}
    ]</script>
  </head>
  <body>
    <template>
      <!-- Narrator · Sanjay's stippled avatar, two stagings that never cross content:
           big (0–3.5, box x 330–1032 y 700–1518) beside the hook headline; then an "// on air" card in the grid's
           bottom-right cell (x 600–950, y 1080–1480) for s02–s05; then big again at the bottom right (x 470–1010,
           y 980–1609) on the blue cost panel and through the recap. He slides out and back in between stagings.
           Both stagings talk from assets/lipsync.js (Egg.avatarTalk); the bottom of the big one fades into the paper.
           Smiles on the recap. -->
      <style>
        #root { position: absolute; inset: 0; pointer-events: none; }
        .nb-big { position: absolute; left: 0; top: 0; width: 540px; height: 629px; transform-origin: 0 0; -webkit-mask-image: linear-gradient(#000 78%, transparent 97%); mask-image: linear-gradient(#000 78%, transparent 97%); }
        .nb-air { position: absolute; left: 600px; top: 1080px; width: 350px; height: 400px; background: #fff; border: 2px solid #e7e7e7; border-radius: 22px; overflow: hidden; }
        .nb-air .lb { position: absolute; left: 30px; top: 24px; font: 400 23px/30px "Geist Mono", monospace; color: #6f6f6f; }
        .nb-air .dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: #1f5bff; margin-right: 10px; vertical-align: 1px; }
        .nb-air .who { position: absolute; left: 13px; top: 46px; width: 540px; height: 629px; transform: scale(0.6); transform-origin: 0 0; }
      </style>
      <div id="root" data-composition-id="narrator" data-width="1080" data-height="1920">
        <div class="nb-big" data-layout-allow-overflow=""></div>
        <div class="nb-air">
          <div class="who" data-layout-allow-overflow=""></div>
          <div class="lb"><span class="dot"></span>// on air</div>
        </div>
      </div>
      <script>
        (() => {
          const LEN = 69.6;
          const EXPR = [["smile", 61.5, 999]];
          const r = document.querySelector('[data-composition-id="narrator"]');
          const big = r.querySelector(".nb-big"), air = r.querySelector(".nb-air"), dot = r.querySelector(".nb-air .dot");
          const avBig = Egg.mountAvatar(big), avAir = Egg.mountAvatar(r.querySelector(".nb-air .who"));
          const tl = gsap.timeline({ paused: true });

          // big, beside the hook
          tl.fromTo(big, { x: 330, y: 920, scale: 1.3, opacity: 0 }, { x: 330, y: 840, scale: 1.3, opacity: 1, duration: 0.6, ease: "expo.out" }, 0.1);
          tl.to(big, { x: 1100, duration: 0.35, ease: "power3.in" }, 4.55);
          // the on-air card; it slides out of the way while a scene zooms (ZOOMS, episode seconds)
          tl.fromTo(air, { opacity: 0, y: 80 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out" }, 5.1);
          const ZOOMS = [[26.3, 29.45], [32.6, 37.9], [43.3, 45.1], [48.6, 52.3]];
          ZOOMS.forEach(([a, b]) => {
            tl.to(air, { x: 540, duration: 0.3, ease: "power3.in" }, a - 0.1);
            tl.to(air, { x: 0, duration: 0.45, ease: "expo.out" }, b);
          });
          tl.to(air, { x: 540, duration: 0.3, ease: "power3.in" }, 58.75);
          // big again, bottom right, for the rule of thumb
          tl.set(big, { x: 1100, y: 980, scale: 1.0 }, 61.0);
          tl.to(big, { x: 470, duration: 0.6, ease: "expo.out" }, 61.6);

          Egg.avatarTalk(tl, avBig, 0, 0, LEN, { expr: EXPR });
          Egg.avatarTalk(tl, avAir, 0, 0, LEN, { expr: EXPR });

          // the on-air dot follows the voice level (computed from the playhead)
          const L = window.EggLipsync;
          const lvl = (t) => { if (!L) return 0; const i = Math.floor(t * L.fps); return i >= 0 && i < L.data.length ? (L.data.charCodeAt(i) - 48) / 9 : 0; };
          const box = { t: 0 };
          const apply = () => { dot.style.opacity = (0.3 + 0.7 * Math.max(lvl(box.t), lvl(box.t - 1 / 30) * 0.7)).toFixed(2); };
          apply();
          tl.fromTo(box, { t: 0 }, { t: LEN, duration: LEN, ease: "none", onUpdate: apply }, 0);
          window.__timelines["narrator"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
