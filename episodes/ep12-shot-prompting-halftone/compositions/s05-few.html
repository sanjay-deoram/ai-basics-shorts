<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <script type="application/json" class="sfx-cues">[
      {"t":0.0,"sfx":"whoosh","vol":0.12},
      {"t":0.65,"sfx":"blip","vol":0.14},
      {"t":1.15,"sfx":"swish","vol":0.12},
      {"t":3.25,"sfx":"zoom-in","vol":0.2},
      {"t":3.45,"sfx":"swish","vol":0.12},
      {"t":4.55,"sfx":"draw","vol":0.2},
      {"t":5.05,"sfx":"zoom-in","vol":0.14},
      {"t":5.25,"sfx":"swish","vol":0.12},
      {"t":6.6,"sfx":"draw","vol":0.2},
      {"t":6.85,"sfx":"zoom-out","vol":0.18},
      {"t":7.7,"sfx":"tick","vol":0.2},
      {"t":8.45,"sfx":"tick","vol":0.2},
      {"t":9.3,"sfx":"blip","vol":0.14}
    ]</script>
  </head>
  <body>
    <template>
      <!-- s05 · few-shot (45.35–56.2). The blue panel wipes in from the left (it stays up through s06).
           "Few-shot, the whole scale." + a "3–5 examples" chip. Three example cards, each a user turn (orange) over an
           assistant turn (blue): Low, then High (a payment outage), then Medium (an invoice question). The camera
           pushes in on High and pans to Medium, ringing each label. Then the // good fit cell: classifiers, data
           extraction, "where your own categories matter". -->
      <style>
        #root { position: absolute; inset: 0; pointer-events: none; }
        .s05-bg { background: var(--blue); }
        .s05-hd { top: 320px; color: #fff; }
        .s05-hd em { color: #fff; }
        .s05-n { position: absolute; left: 640px; top: 346px; height: 64px; padding: 0 26px; border-radius: 32px; background: #fff; color: var(--blue); font: 600 30px/64px var(--f-body); }
        .s05-ex { position: absolute; top: 600px; width: 270px; height: 440px; background: #fff; border-radius: 22px; overflow: hidden; }
        .s05-ex .lb { position: absolute; left: 22px; top: 18px; font: 400 21px/28px var(--f-mono); color: #4a4a4a; }
        .s05-u { position: absolute; left: 12px; right: 12px; top: 58px; height: 236px; border-radius: 14px; background: var(--user-tint); padding: 14px 16px; }
        .s05-a { position: absolute; left: 12px; right: 12px; top: 304px; height: 124px; border-radius: 14px; background: var(--asst-tint); padding: 14px 16px; }
        .s05-chip { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: 10px; color: #fff; font: 600 20px/36px var(--f-body); }
        .s05-chip img { width: 22px; height: 22px; border-radius: 50%; background: #fff; padding: 2px; }
        .s05-u .s05-chip { background: var(--user); } .s05-a .s05-chip { background: var(--asst); }
        .s05-u .t { font: 500 27px/35px var(--f-body); color: var(--ink); margin-top: 12px; }
        .s05-a .w { font: 650 46px/56px var(--f-display); letter-spacing: -0.035em; color: var(--asst-ink); margin-top: 4px; }
        .s05-e1 { left: 90px; } .s05-e2 { left: 385px; } .s05-e3 { left: 680px; }
        .s05-r2 { left: 397px; top: 900px; width: 246px; height: 128px; } .s05-r3 { left: 692px; top: 900px; width: 246px; height: 128px; }
        .s05-r2 rect, .s05-r3 rect { stroke: var(--ink); }
        .s05-r2 .cl, .s05-r3 .cl { left: 20px; top: -54px; background: var(--ink); }
        .s05-gf { left: 90px; top: 1080px; width: 480px; height: 400px; border-color: #fff; }
        .s05-gf h4 { position: absolute; left: 30px; top: 66px; font: 600 30px/38px var(--f-body); color: var(--ink); }
        .s05-gr { position: absolute; left: 30px; display: flex; align-items: center; gap: 16px; font: 500 36px/44px var(--f-body); color: var(--ink); }
        .s05-gr svg { width: 38px; height: 38px; flex: none; }
        .s05-g1 { top: 136px; } .s05-g2 { top: 206px; }
        .s05-own { position: absolute; left: 30px; right: 24px; top: 280px; font: italic 400 46px/50px var(--f-serif); color: var(--blue); }
      </style>
      <div id="root" data-composition-id="s05-few" data-width="1080" data-height="1920">
        <div class="panel s05-bg"></div>
        <div class="cam">
          <div class="hd s05-hd">
            <span class="ln"><span>Few-shot,</span></span>
            <span class="ln"><span><em>the whole scale.</em></span></span>
          </div>
          <div class="s05-n">3–5 examples</div>
          <div class="s05-ex s05-e1"><div class="lb">// example 1</div>
            <div class="s05-u"><span class="s05-chip">user</span><div class="t">My password reset email never arrived.</div></div>
            <div class="s05-a"><span class="s05-chip"><img src="assets/claude-logo.svg" alt="">assistant</span><div class="w">Low</div></div></div>
          <div class="s05-ex s05-e2"><div class="lb">// example 2</div>
            <div class="s05-u"><span class="s05-chip">user</span><div class="t">Payments are down for every customer.</div></div>
            <div class="s05-a"><span class="s05-chip"><img src="assets/claude-logo.svg" alt="">assistant</span><div class="w">High</div></div></div>
          <div class="s05-ex s05-e3"><div class="lb">// example 3</div>
            <div class="s05-u"><span class="s05-chip">user</span><div class="t">Can I get a copy of last month's invoice?</div></div>
            <div class="s05-a"><span class="s05-chip"><img src="assets/claude-logo.svg" alt="">assistant</span><div class="w">Medium</div></div></div>
          <div class="co s05-r2" data-layout-allow-overlap=""><svg><rect x="0" y="0" width="100%" height="100%" rx="16" pathLength="1"/></svg><span class="cl">marked high</span></div>
          <div class="co s05-r3" data-layout-allow-overlap=""><svg><rect x="0" y="0" width="100%" height="100%" rx="16" pathLength="1"/></svg><span class="cl">marked medium</span></div>
          <div class="cd s05-gf">
            <div class="lb">// good fit</div>
            <h4>use it for</h4>
            <div class="s05-gr s05-g1"><svg viewBox="0 0 24 24" fill="none" stroke="#1f5bff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span>classifiers</span></div>
            <div class="s05-gr s05-g2"><svg viewBox="0 0 24 24" fill="none" stroke="#1f5bff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span>data extraction</span></div>
            <div class="s05-own">where your own categories matter</div>
          </div>
        </div>
      </div>
      <script>
        (() => {
          const r = document.querySelector('[data-composition-id="s05-few"]');
          const q = (s) => r.querySelector(s), E = (t) => +(t - 45.35).toFixed(3);
          const cam = q(".cam");
          const tl = gsap.timeline({ paused: true });
          tl.set(cam, { x: 0, y: 0, scale: 1 }, 0);
          tl.fromTo(q(".s05-bg"), { xPercent: -100 }, { xPercent: 0, duration: 0.45, ease: "expo.inOut" }, 0);
          FX.rise(tl, r.querySelectorAll(".ln > span"), [E(45.5), E(47.3)]);
          FX.pop(tl, q(".s05-n"), E(46.0), { from: 0.4 });
          [[".s05-e1", 46.45], [".s05-e2", 48.75], [".s05-e3", 50.55]].forEach(([s, t]) => {
            tl.fromTo(q(s), { opacity: 0, y: 140, rotation: 5 }, { opacity: 1, y: 0, rotation: 0, duration: 0.6, ease: "expo.out" }, E(t));
            tl.fromTo(q(s + " .s05-a"), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, E(t) + 0.5);
          });
          // the camera visits High, then Medium
          FX.zoom(tl, cam, { x: 385, y: 600, w: 270, h: 440 }, E(48.6), { dur: 0.6 });
          FX.callout(tl, q(".s05-r2"), E(49.9));
          FX.zoom(tl, cam, { x: 680, y: 600, w: 270, h: 440 }, E(50.4), { dur: 0.6, ease: "power3.inOut" });
          FX.callout(tl, q(".s05-r3"), E(51.95));
          FX.unzoom(tl, cam, E(52.2), { dur: 0.6 });
          tl.to([q(".s05-r2"), q(".s05-r3")], { opacity: 0, duration: 0.25, ease: "none" }, E(52.4));

          // where it's used
          tl.fromTo(q(".s05-gf"), { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out" }, E(52.6));
          tl.fromTo(q(".s05-g1"), { opacity: 0, x: 24 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, E(53.0));
          tl.fromTo(q(".s05-g2"), { opacity: 0, x: 24 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, E(53.75));
          FX.words(tl, q(".s05-own"), E(54.6), { y: 16 });
          // clear the cards for the cost; the blue stays
          FX.sink(tl, r.querySelectorAll(".ln > span"), E(55.95), { dur: 0.22 });
          tl.to([q(".s05-n"), q(".s05-e1"), q(".s05-e2"), q(".s05-e3"), q(".s05-gf")], { opacity: 0, y: -40, duration: 0.25, ease: "power2.in", stagger: 0.02 }, E(55.9));
          window.__timelines["s05-few"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
