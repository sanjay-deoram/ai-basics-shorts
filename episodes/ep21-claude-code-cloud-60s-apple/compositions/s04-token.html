      <script>
        (() => {
          const DUR = 8.31;
          const root = document.querySelector('[data-composition-id="s04-token"] .s04');
          const q = (s) => root.querySelector(s);
          const ln = (n) => q(".l" + n);
          gsap.set([q(".tk"), q(".px"), q(".xx"), q(".vm"), q(".ar"), q(".ah"), q(".key"), ln(1), ln(2), ln(3), ln(4), ln(5)], { opacity: 0 });
          const tl = gsap.timeline({ paused: true });
          Apple.rise(tl, q(".a-eyebrow"), 0.12, { y: 16 });
          Apple.rise(tl, q(".hd"), 0.2, { y: 24, dur: 0.8 });
          // "Your GitHub token never enters that machine"
          Apple.rise(tl, q(".tk"), 0.45, { y: 30, dur: 0.5 });
          Apple.rise(tl, q(".vm"), 0.9, { y: 30, dur: 0.5 });
          Apple.zoom(tl, q(".xx"), 1.3, { from: 1.6, dur: 0.35 });
          Apple.tint(tl, q(".hd .a-tint"), 1.6, { dur: 0.4 });
          // "A proxy holds it"
          Apple.rise(tl, q(".px"), 2.85, { y: 30, dur: 0.5 });
          tl.to(q(".tk"), { x: 440, scale: 0.6, opacity: 0, duration: 0.5, ease: "power2.in" }, 3.3);
          tl.to(q(".xx"), { opacity: 0, duration: 0.3 }, 3.3);
          tl.to(q(".px"), { scale: 1.04, duration: 0.15, yoyo: true, repeat: 1 }, 3.8);
          // "and gives the session a short-lived credential"
          tl.set([q(".ar"), q(".ah")], { opacity: 1 }, 4.1);
          tl.fromTo(q(".key"), { opacity: 0, x: 600, y: -480, scale: 0.7 }, { opacity: 1, x: 0, y: 0, scale: 1, duration: 0.7, ease: "power2.inOut" }, 4.1);

          // "that can push only to its own branch"
          Apple.fade(tl, ln(2), 6.3, { dur: 0.25 });
          Apple.fade(tl, ln(3), 6.7, { dur: 0.25 });
          Apple.fade(tl, ln(4), 7.0, { dur: 0.25 });
          Apple.fade(tl, ln(5), 7.4, { dur: 0.25 });
          Apple.out(tl, root.querySelectorAll(".a-eyebrow, .hd, .px, .a-svg, .vm, .key"), DUR - 0.28, { dur: 0.28 });
          window.__timelines["s04-token"] = tl;
