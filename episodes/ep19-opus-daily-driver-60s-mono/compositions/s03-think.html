<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <script type="application/json" class="sfx-cues">[
      {"t":0.15,"sfx":"air","vol":0.14},
      {"t":1.0,"sfx":"pop","vol":0.14},
      {"t":2.4,"sfx":"marker","vol":0.16},
      {"t":2.95,"sfx":"ping","vol":0.12},
      {"t":4.35,"sfx":"stream","vol":0.1,"dur":1.6},
      {"t":5.95,"sfx":"tick","vol":0.16},
      {"t":7.4,"sfx":"pop","vol":0.14},
      {"t":7.55,"sfx":"pop","vol":0.14}
    ]</script>
  </head>
  <body>
    <template>
      <!-- s03 · Habit 2 · drop "think hard". The message's last line, "Think hard about this.", is struck through; a chip
           "Thinking: always on" pulses. Two replies race (schematic): without the phrase the reply starts sooner; both end
           with the same quality tick.
           Voiceover: 0.17 "Habit two: drop "think hard." Thinking is always on, and removing the phrase made replies
           start sooner, with no clear drop in quality." -->
      <style>
        #root { position: absolute; inset: 0; }
        .s03 .hd { top: 316px; white-space: nowrap; }
        .s03 .cp { left: 90px; top: 470px; width: 860px; height: 230px; }
        .s03 .cp p { position: absolute; left: 34px; right: 34px; margin: 0; font: 500 33px/1.3 var(--f-t); color: var(--mu); white-space: nowrap; }
        .s03 .cp .th { color: var(--ink); font-weight: 600; }
        .s03 .alw { position: absolute; left: 90px; top: 736px; display: flex; align-items: center; gap: 14px; }
        .s03 .alw .pd { position: relative; width: 22px; height: 22px; border-radius: 50%; background: var(--green); }
        .s03 .rc { left: 90px; top: 836px; width: 860px; height: 400px; }
        .s03 .rw { position: absolute; left: 34px; right: 34px; }
        .s03 .rw .n { font: 600 30px/1 var(--f-t); color: var(--ink); white-space: nowrap; }
        .s03 .rw .tr { position: absolute; left: 0; right: 80px; top: 50px; height: 40px; border-radius: 20px; background: var(--gray); }
        .s03 .rw .wt { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 20px; background: var(--line); transform-origin: 0 50%; }
        .s03 .rw .fl { position: absolute; top: 0; bottom: 0; right: 0; border-radius: 20px; background: var(--blue); transform-origin: 0 50%; }
        .s03 .rw .ok { position: absolute; right: 0; top: 48px; }
      </style>
      <div id="root" data-composition-id="s03-think" data-width="1080" data-height="1920">
        <div class="a-scene s03">
          <p class="a-eyebrow">Habit 2</p>
          <h2 class="a-h2 hd">Drop <span class="a-tint" data-layout-allow-overlap=""><span data-layout-allow-overlap="">"think hard"</span><span class="on" data-layout-allow-overlap="">"think hard"</span></span></h2>
          <div class="a-win cp"><div class="bar"><i></i><i></i><i></i><span class="ttl">Your first message</span></div>
            <p style="top:90px">…tell me which ones hold up.</p>
            <p class="th" style="top:146px"><span class="a-strike">Think hard about this.<i></i></span></p>
          </div>
          <span class="a-chip alw"><span class="pd"></span>Thinking: always on</span>
          <div class="a-card rc">
            <div class="rw r1" style="top:36px"><span class="n">With "think hard"</span><div class="tr"><div class="wt" style="width:40%"></div><div class="fl" style="left:40%"></div></div><i class="a-check ok"></i></div>
            <div class="rw r2" style="top:156px"><span class="n">Without it</span><div class="tr"><div class="wt" style="width:12%"></div><div class="fl" style="left:12%"></div></div><i class="a-check ok"></i></div>
            <p class="a-lab" style="left:34px;top:280px">Reply starts sooner.</p>
            <p class="a-lab" style="left:350px;top:280px;color:var(--ink)">Same quality.</p>
            <p class="a-lab" style="left:34px;top:330px;font-size:28px;color:var(--faint)">schematic, not to scale</p>
          </div>
        </div>
      </div>
      <script>
        (() => {
          const DUR = 9.1;
          const root = document.querySelector('[data-composition-id="s03-think"] .s03');
          const q = (s) => root.querySelector(s);
          const all = (s) => [...root.querySelectorAll(s)];
          const labs = all(".rc .a-lab");
          gsap.set([q(".cp"), q(".alw"), q(".rc"), ...all(".ok"), ...labs], { opacity: 0 });
          const tl = gsap.timeline({ paused: true });
          Apple.rise(tl, q(".a-eyebrow"), 0.12, { y: 16 });
          Apple.rise(tl, q(".hd"), 0.2, { y: 24, dur: 0.8 });
          Apple.rise(tl, q(".cp"), 1.0, { y: 30, dur: 0.6 });
          // "drop think hard": the line is struck
          Apple.tint(tl, q(".hd .a-tint"), 1.9, { dur: 0.4 });
          tl.fromTo(q(".cp .a-strike i"), { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power2.out" }, 2.4);
          tl.to(q(".cp .th"), { opacity: 0.45, duration: 0.3 }, 2.8);
          // "Thinking is always on"
          Apple.rise(tl, q(".alw"), 2.95, { y: 16, dur: 0.5 });
          tl.fromTo(q(".alw .pd"), { scale: 1 }, { scale: 1.35, duration: 0.45, ease: "sine.inOut", yoyo: true, repeat: 9 }, 3.4);
          // "removing the phrase made replies start sooner"
          Apple.rise(tl, q(".rc"), 4.2, { y: 30, dur: 0.5 });
          const wts = all(".wt"), fls = all(".fl");
          tl.fromTo(wts, { scaleX: 0 }, { scaleX: 1, duration: (i) => [1.3, 0.4][i], ease: "none" }, 4.5);
          tl.fromTo(fls[1], { scaleX: 0 }, { scaleX: 1, duration: 2.4, ease: "power1.inOut" }, 4.9);
          tl.fromTo(fls[0], { scaleX: 0 }, { scaleX: 1, duration: 1.5, ease: "power1.inOut" }, 5.8);
          Apple.fade(tl, labs[0], 5.95, { dur: 0.4 });
          // "with no clear drop in quality"
          Apple.zoom(tl, all(".ok")[1], 7.35, { from: 0.6, dur: 0.4 });
          Apple.zoom(tl, all(".ok")[0], 7.5, { from: 0.6, dur: 0.4 });
          Apple.fade(tl, labs[1], 7.6, { dur: 0.4 });
          Apple.fade(tl, labs[2], 7.9, { dur: 0.4 });
          Apple.out(tl, root.querySelectorAll(".a-eyebrow, .hd, .cp, .alw, .rc"), DUR - 0.3, { dur: 0.3 });
          window.__timelines["s03-think"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
