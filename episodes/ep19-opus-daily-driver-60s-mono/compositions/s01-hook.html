<html>
  <head>
    <meta charset="UTF-8">

      {"t":0.02,"sfx":"air","vol":0.18},

  <body>
    <template>
      <!-- s01 · Cold open + the example. Frame 0 is the whole title, "How to use Opus 5.5 as your daily driver", and big
           under it "in under 60 seconds" (nothing builds in); "Opus 5.5" tints, the 60 punches on "sixty". On "Say growth
           slowed" the title clears and the manager's note drops in: "Why did growth slow?" with four theories (each on
           "four theories") and the folder: sales-by-store.xlsx, leadership-offsite.pdf. All above y 1100 (hero avatar).
           Voiceover: 0.10 "Here's how to use Opus five point five as your daily driver, in under sixty seconds."
           5.69 "Say growth slowed at your retail company, and your manager has four theories to test." -->
      <style>
        #root { position: absolute; inset: 0; }
        .s01 .hook { top: 236px; font-size: 98px; }
        .s01 .hook .l { display: block; white-space: nowrap; }
        .s01 .c60 { position: absolute; left: 90px; top: 566px; margin: 0; }
        .s01 .c60 .k { display: flex; align-items: center; gap: 12px; margin: 0; font: 600 44px/1 var(--f-t); letter-spacing: -0.01em; color: var(--mu); }
        .s01 .c60 svg { width: 44px; height: 44px; fill: none; stroke: var(--blue); stroke-width: 3.2; stroke-linecap: round; }
        .s01 .c60 .big { display: flex; align-items: baseline; gap: 36px; margin: 4px 0 0; white-space: nowrap; }
        .s01 .c60 .num { display: inline-block; font: 800 240px/0.86 var(--f-d); letter-spacing: -0.06em; color: var(--blue); }
        .s01 .c60 .u { font: 700 104px/1 var(--f-d); letter-spacing: -0.045em; color: var(--ink); }
        .s01 .note { left: 90px; top: 300px; width: 860px; height: 600px; }
        .s01 .note .fr { position: absolute; left: 40px; top: 36px; font: 600 28px/1 var(--f-t); color: var(--mu); }
        .s01 .note .q { position: absolute; left: 40px; top: 84px; font: 700 54px/1.1 var(--f-d); letter-spacing: -0.03em; color: var(--ink); white-space: nowrap; }
        .s01 .note .th { position: absolute; left: 40px; right: 40px; height: 84px; display: flex; align-items: center; gap: 22px; border-top: 1px solid var(--line); font: 500 36px/1 var(--f-t); color: var(--ink); white-space: nowrap; }
        .s01 .note .th b { display: inline-flex; align-items: center; justify-content: center; width: 48px; height: 48px; border-radius: 50%; background: var(--gray); font: 700 28px/1 var(--f-d); color: var(--mu); }
        .s01 .files { position: absolute; left: 90px; top: 936px; display: flex; gap: 16px; }
      </style>
      <div id="root" data-composition-id="s01-hook" data-width="1080" data-height="1920">
        <div class="a-scene white s01">
          <h1 class="a-h hook"><span class="l">How to use</span><span class="l"><span class="a-tint" data-layout-allow-overlap=""><span data-layout-allow-overlap="">Opus 5.5</span><span class="on" data-layout-allow-overlap="">Opus 5.5</span></span> as</span><span class="l">your daily driver</span></h1>
          <div class="c60" data-layout-allow-overlap=""><p class="k" data-layout-allow-overlap=""><svg viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="19" r="12.5" /><path class="hand" d="M17 19 V11" /><path d="M13 3.5 H21" /></svg>in under</p><p class="big"><span class="num" data-layout-allow-overlap="">60</span><span class="u">seconds</span></p></div>

          <div class="a-card note">
            <span class="fr">From your manager</span>
            <span class="q">Why did growth slow?</span>
            <div class="th" style="top:196px"><b>1</b>We raised prices too much</div>
            <div class="th" style="top:290px"><b>2</b>Online rivals took our shoppers</div>
            <div class="th" style="top:384px"><b>3</b>We ran fewer promotions</div>
            <div class="th" style="top:478px"><b>4</b>Our best staff left</div>
          </div>
          <div class="files"><span class="a-chip">sales-by-store.xlsx</span><span class="a-chip">leadership-offsite.pdf</span></div>
        </div>
      </div>
      <script>
        (() => {
          const DUR = 10.54;
          const root = document.querySelector('[data-composition-id="s01-hook"] .s01');
          const q = (s) => root.querySelector(s);
          const all = (s) => [...root.querySelectorAll(s)];
          const ths = all(".th"), files = all(".files .a-chip");
          gsap.set([q(".note"), ...ths, ...files], { opacity: 0 });
          const tl = gsap.timeline({ paused: true });
          // frame 0 is the whole title
          Apple.tint(tl, q(".hook .a-tint"), 1.5, { dur: 0.6 });
          tl.to(q(".c60 .num"), { scale: 1.1, duration: 0.2, ease: "power2.out", yoyo: true, repeat: 1, transformOrigin: "0% 80%" }, 4.55);
          tl.fromTo(q(".c60 .hand"), { rotation: 0 }, { rotation: 360, svgOrigin: "17 19", duration: 1.5, ease: "none" }, 3.9);
          Apple.out(tl, [q(".hook"), q(".c60")], 5.6, { dur: 0.35, y: -30 });
          // "Say growth slowed at your retail company"
          Apple.rise(tl, q(".note"), 6.0, { y: 50, dur: 0.8 });
          // "and your manager has four theories to test"
          Apple.rise(tl, ths, 9.25, { y: 20, dur: 0.5, stagger: 0.15 });
          Apple.zoom(tl, files, 9.95, { from: 0.85, dur: 0.45, stagger: 0.1 });
          Apple.out(tl, [q(".note"), ...files], DUR - 0.3, { dur: 0.3 });
          window.__timelines["s01-hook"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
