<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <!-- Sound cues (seconds from scene start). Run node tools/build-sfx.mjs after editing. -->
    <script type="application/json" class="sfx-cues">[
      {"t":0.08,"sfx":"tap","vol":0.16},
      {"t":0.2,"sfx":"paper","vol":0.12},
      {"t":1.26,"sfx":"pop","vol":0.16},
      {"t":1.91,"sfx":"pen","vol":0.14,"dur":0.6},
      {"t":2.3,"sfx":"click-soft","vol":0.16},
      {"t":2.42,"sfx":"click-soft","vol":0.16},
      {"t":2.54,"sfx":"click-soft","vol":0.16},
      {"t":3.22,"sfx":"whoosh-short","vol":0.14},
      {"t":3.72,"sfx":"drop","vol":0.18},
      {"t":4.7,"sfx":"whoosh-short","vol":0.14},
      {"t":5.2,"sfx":"drop","vol":0.18},
      {"t":5.6,"sfx":"pop","vol":0.2},
      {"t":5.95,"sfx":"whoosh-short","vol":0.14},
      {"t":6.3,"sfx":"drop","vol":0.18},
      {"t":6.55,"sfx":"pop","vol":0.2},
      {"t":6.67,"sfx":"pop","vol":0.2}
    ]</script>
  </head>
  <body>
    <template>
      <!-- s07 · Layer 4 · People, by risk. Three changes wait in a queue on the left (a docs typo, our fix, a change to
           the riskiest code); a risk classifier (a funnel) sits on the right, three bins below it: LOW · MEDIUM · HIGH,
           each with its approver slots (dashed people) and a risk arrow under them. Each change drops through the
           classifier as it is named: the docs typo into LOW (no approver), our fix into MEDIUM (one person turns
           solid), the riskiest change into HIGH (two people). Avatar: corner (the funnel ends at x 828 above y 485).
           Voiceover: 0.18 "Layer four: people, scaled by risk. Docs need no approver, normal changes one, the riskiest
           two." -->
      <style>
        #root { position: absolute; inset: 0; }
        .s07 .egg-eyebrow { position: absolute; left: 90px; top: 232px; }
        .s07 .fn { fill: none; stroke: var(--ink); stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
        .s07 .fk { position: absolute; left: 610px; width: 240px; top: 524px; text-align: center; }
        .s07 .bin { position: absolute; top: 600px; width: 266px; height: 550px; padding: 0; border-radius: 34px; }
        .s07 .bin .sev { position: absolute; left: 22px; top: 24px; }
        .s07 .bin .ex { position: absolute; left: 22px; top: 88px; width: 222px; font: 400 34px/1.25 var(--f-body); color: var(--graphite); }
        .s07 .bin .zone { position: absolute; left: 18px; top: 200px; width: 230px; height: 110px; border: 2px dashed var(--ash); border-radius: 20px; }
        .s07 .bin .ppl { position: absolute; left: 0; width: 266px; top: 352px; display: flex; justify-content: center; gap: 14px; }
        .s07 .slot { position: relative; width: 84px; height: 84px; }
        .s07 .slot svg { position: absolute; inset: 0; width: 84px; height: 84px; }
        .s07 .slot .ghost { stroke: var(--ash); stroke-dasharray: 6 8; }
        .s07 .zero { position: absolute; inset: 0; display: grid; place-items: center; font: 300 64px/1 var(--f-display); color: var(--ink); }
        .s07 .bin .lab { position: absolute; left: 0; width: 266px; top: 466px; text-align: center; font: 300 42px/1 var(--f-display); letter-spacing: -0.02em; color: var(--ink); }
        .s07 .risk { fill: none; stroke: var(--ink); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
        .s07 .rk { position: absolute; top: 1214px; }
        .s07 .foot { position: absolute; left: 90px; top: 1290px; width: 860px; }
        .s07 .fix.dc svg, .s07 .fix.rs svg { fill: none; stroke: var(--ink); stroke-width: 3.2; stroke-linejoin: round; stroke-linecap: round; }
      </style>
      <div id="root" data-composition-id="s07-people" data-width="1080" data-height="1920">
        <div class="egg-scene s07">
          <span class="egg-eyebrow">Layer 4 · People, by risk</span>
          <span class="trk"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></span>
          <svg class="egg-svg" viewBox="0 0 1080 1920" aria-hidden="true">
            <path class="fn f0" d="M632 300 H828" />
            <path class="fn f1" d="M640 304 L715 440 V500" />
            <path class="fn f2" d="M820 304 L745 440 V500" />
            <path class="risk ra" d="M100 1190 H940 M918 1176 L940 1190 L918 1204" />
          </svg>
          <span class="egg-card-kicker fk">Risk classifier</span>
          <span class="egg-card-kicker rk" style="left:90px">Lower risk</span>
          <span class="egg-card-kicker rk" style="left:690px;width:260px;text-align:right">Higher risk</span>
          <div class="bins"></div>
          <span class="egg-foot foot">The classifier rates the change, not who wrote it</span>
          <div class="fix dc"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M10 5 H24 L31 12 V35 H10 Z M24 5 V12 H31 M15 19 H26 M15 25 H26 M15 31 H22" /></svg>Docs: fix a typo</div>
          <div class="fix fx"><svg viewBox="0 0 40 40" aria-hidden="true"><g class="bugi"><ellipse cx="20" cy="23" rx="8" ry="10" /><path d="M20 14 V33 M15 9 L17.5 13.5 M25 9 L22.5 13.5 M12 19 H5 M12 26 H5 M28 19 H35 M28 26 H35 M13.5 31 L8 35.5 M26.5 31 L32 35.5" /></g></svg>Fix: empty config crash</div>
          <div class="fix rs"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 5 L36 33 H4 Z M20 15 V24 M20 29 V29.5" /></svg>Riskiest code path</div>
        </div>
      </div>
      <script>
        (() => {
          const DUR = 7.2;
          const root = document.querySelector('[data-composition-id="s07-people"] .s07');
          const q = (s) => root.querySelector(s);
          const all = (s) => [...root.querySelectorAll(s)];
          const PERSON = (cls) => `<svg class="person ${cls}" viewBox="0 0 84 84" aria-hidden="true"><circle cx="42" cy="27" r="15" /><path d="M13 78 C13 56 26 47 42 47 C58 47 71 56 71 78" /></svg>`;
          // [x, tag, examples, approvers, label]
          const BIN = [
            [90, ["nit", "Low"], "Docs, copy", 0, "No approver"],
            [387, ["", "Medium"], "Normal changes", 1, "1 approver"],
            [684, ["imp", "High"], "Riskiest code", 2, "2 approvers"],
          ];
          q(".bins").innerHTML = BIN.map(([x, [c, t], ex, n, lab]) => `<div class="egg-card taupe bin" style="left:${x}px"><span class="sev ${c}">${t}</span><p class="ex">${ex}</p><i class="zone"></i>` +
            `<div class="ppl">${n === 0 ? `<span class="slot">${PERSON("ghost")}<span class="zero">0</span></span>` : Array.from({ length: n }, () => `<span class="slot">${PERSON("ghost")}${PERSON("solid")}</span>`).join("")}</div>` +
            `<span class="lab">${lab}</span></div>`).join("");
          const bins = all(".bin");
          // queue: [chip, y, width (110 + 19.2 px a character), bin]
          const CH = [[q(".dc"), 300, 417, 0], [q(".fx"), 392, 552, 1], [q(".rs"), 484, 456, 2]];
          CH.forEach(([el, y]) => gsap.set(el, { x: 90, y }));
          const S = 0.42;
          ["f0", "f1", "f2"].forEach((c) => { const p = q("." + c); p.setAttribute("pathLength", "1"); p.style.strokeDasharray = "1 1.1"; gsap.set(p, { strokeDashoffset: 1.02 }); });
          const ra = q(".ra"); ra.setAttribute("pathLength", "1"); ra.style.strokeDasharray = "1 1.1"; gsap.set(ra, { strokeDashoffset: 1.02 });

          const tl = gsap.timeline({ paused: true });
          Egg.fadeUp(tl, [q(".egg-eyebrow"), q(".trk")], 0.05);
          CH.forEach(([el, y], i) => tl.fromTo(el, { opacity: 0, y: y + 20 }, { opacity: 1, y, duration: 0.5, ease: Egg.EASE.enter }, 0.2 + i * 0.1));
          // "people": the bins and their approver slots
          Egg.fadeUp(tl, bins, 1.26, { y: 30, stagger: 0.1 });
          tl.set(all(".solid"), { opacity: 0 }, 0);
          // "scaled by risk": the classifier draws, the bins get their risk
          tl.to([q(".f0"), q(".f1"), q(".f2")], { strokeDashoffset: 0, duration: 0.5, ease: Egg.EASE.draw, stagger: 0.08 }, 1.91);
          Egg.fadeUp(tl, q(".fk"), 2.2, { y: 10 });
          tl.to(ra, { strokeDashoffset: 0, duration: 0.7, ease: Egg.EASE.draw }, 2.1);
          Egg.fadeUp(tl, all(".rk"), 2.4, { y: 10, stagger: 0.1 });
          Egg.pop(tl, all(".bin .sev"), 2.3, { stagger: 0.12, dur: 0.4 });
          // each change drops through the classifier into its bin as it's named
          const drop = ([el, , w, b], T, k = 1) => {
            const zx = BIN[b][0] + 133 - (w * S) / 2;
            tl.to(el, { x: 730 - (w * S) / 2, y: 281, scale: S, duration: 0.35 * k, ease: "power2.in" }, T);
            tl.to(el, { opacity: 0, duration: 0.06, ease: "none" }, T + 0.35 * k);
            tl.set(el, { x: 730 - (w * S) / 2, y: 470 }, T + 0.42 * k);
            tl.to(el, { opacity: 1, duration: 0.08, ease: "none" }, T + 0.42 * k);
            tl.to(el, { x: zx, y: 816, duration: 0.4 * k, ease: "power2.out" }, T + 0.48 * k);
            return T + 0.88 * k;
          };
          // "Docs need no approver"
          const t0 = drop(CH[0], 3.22);
          tl.to(bins[0].querySelector(".ghost"), { opacity: 0.35, duration: 0.25, ease: "none" }, t0);
          Egg.pop(tl, bins[0].querySelector(".zero"), t0, { dur: 0.4 });
          // "normal changes one"
          const t1 = drop(CH[1], 4.7);
          Egg.pop(tl, bins[1].querySelector(".solid"), t1 - 0.05, { dur: 0.45 });
          // "the riskiest two"
          const t2 = drop(CH[2], 5.95, 0.75);
          Egg.pop(tl, bins[2].querySelectorAll(".solid"), t2 - 0.05, { dur: 0.4, stagger: 0.12 });
          [t0, t1, t2].forEach((t, i) => tl.fromTo(bins[i].querySelector(".lab"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35, ease: Egg.EASE.enter }, t + 0.05));
          Egg.fadeUp(tl, q(".foot"), 2.6, { y: 10 });

          Egg.fadeOut(tl, [q(".egg-eyebrow"), q(".trk"), q(".s07 .egg-svg"), q(".fk"), ...all(".rk"), ...bins, q(".foot")], DUR - 0.24, { dur: 0.24 });
          Egg.fadeOut(tl, CH.map((c) => c[0]), DUR - 0.24, { dur: 0.24, y: "-=20" });
          window.__timelines["s07-people"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
