<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <!-- Sound cues (seconds from scene start). Run node tools/build-sfx.mjs after editing. -->
    <script type="application/json" class="sfx-cues">[
      {"t":0.08,"sfx":"tap","vol":0.16},
      {"t":0.3,"sfx":"paper","vol":0.14},
      {"t":1.3,"sfx":"marker","vol":0.12},
      {"t":1.9,"sfx":"tick","vol":0.2},
      {"t":2.2,"sfx":"tick","vol":0.18},
      {"t":2.33,"sfx":"tick","vol":0.18},
      {"t":2.46,"sfx":"tick","vol":0.18},
      {"t":2.59,"sfx":"tick","vol":0.18},
      {"t":2.72,"sfx":"tick","vol":0.18},
      {"t":2.9,"sfx":"pop","vol":0.16},
      {"t":3.5,"sfx":"pop","vol":0.2},
      {"t":4.47,"sfx":"click","vol":0.22},
      {"t":4.55,"sfx":"drop","vol":0.2}
    ]</script>
  </head>
  <body>
    <template>
      <!-- s06 · Layer 3 · Blocking checks. The fix chip on top; under it, the pull request's checks panel: security review,
           lint, type checks, tests on every platform, build, "and dozens more", and Claude's review. Each starts as a
           spinning ring; security review passes on its name, the rest tick through on "and checks". Claude's review
           shows "1 open finding" (the Important one from s05). On "blocks the merge" the Merge button's lock snaps
           shut, it greys out and shakes: blocked until the finding is fixed or answered. Avatar: corner (the panel
           starts at y 500). Voiceover: 0.18 "Layer three: security review and checks. Any open finding blocks the
           merge." -->
      <style>
        #root { position: absolute; inset: 0; }
        .s06 .egg-eyebrow { position: absolute; left: 90px; top: 232px; }
        .s06 .pnl { position: absolute; left: 90px; top: 500px; width: 860px; height: 640px; padding: 0; }
        .s06 .pk { position: absolute; left: 130px; top: 532px; }
        .s06 .ck { position: absolute; left: 110px; width: 820px; height: 66px; border-radius: 16px; }
        .s06 .ck .hl { position: absolute; inset: 0; border-radius: 16px; background: var(--taupe); opacity: 0; }
        .s06 .ck .nm { position: absolute; left: 20px; top: 13px; display: flex; align-items: center; gap: 14px; font: 400 36px/40px var(--f-body); color: var(--ink); white-space: nowrap; }
        .s06 .ck .nm.mute { color: var(--smoke); }
        .s06 .ck .nm svg, .s06 .ck .nm img { width: 36px; height: 36px; }
        .s06 .ck .nm svg { fill: none; stroke: var(--ink); stroke-width: 3; stroke-linejoin: round; }
        .s06 .ck .sts { position: absolute; left: 752px; top: 10px; width: 46px; height: 46px; }
        .s06 .ck .sts > * { position: absolute; inset: 0; width: 46px; height: 46px; }
        .s06 .ring circle { fill: none; stroke: var(--graphite); stroke-width: 4; stroke-dasharray: 8 8; }
        .s06 .pass { border-radius: 50%; background: var(--ink); display: grid; place-items: center; }
        .s06 .pass svg { width: 24px; height: 24px; fill: none; stroke: var(--eggshell); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
        .s06 .open { border-radius: 50%; border: 4px solid var(--ink); background: var(--eggshell); display: grid; place-items: center; font: 400 28px/1 var(--f-mono); }
        .s06 .ck .of { position: absolute; right: 90px; top: 21px; font: 400 26px/1 var(--f-mono); letter-spacing: 0.04em; color: var(--ink); white-space: nowrap; }
        .s06 .ln { position: absolute; left: 130px; width: 780px; height: 2px; background: var(--stone); }
        .s06 .mg { position: absolute; left: 90px; top: 1196px; display: flex; align-items: center; gap: 16px; padding: 22px 34px; border-radius: 9999px;
          background: var(--ink); color: var(--eggshell); border: 3px solid var(--ink); font: 400 34px/1 var(--f-mono); letter-spacing: 0.04em; }
        .s06 .mg svg { width: 34px; height: 34px; fill: none; stroke: currentColor; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; overflow: visible; }
        .s06 .why { position: absolute; left: 400px; top: 1196px; width: 550px; font: 400 34px/1.3 var(--f-body); color: var(--graphite); text-wrap: balance; }
      </style>
      <div id="root" data-composition-id="s06-gates" data-width="1080" data-height="1920">
        <div class="egg-scene s06">
          <span class="egg-eyebrow">Layer 3 · Blocking checks</span>
          <span class="trk"><i class="on"></i><i class="on"></i><i class="on"></i><i></i></span>
          <div class="egg-card pnl"></div>
          <span class="egg-card-kicker pk">Checks on this pull request</span>
          <div class="cks"></div>
          <div class="mg"><svg viewBox="0 0 34 34" aria-hidden="true"><rect x="6" y="15" width="22" height="16" rx="3" /><path class="shk" d="M11 15 V10 A6 6 0 0 1 23 10 V15" /></svg>Merge</div>
          <p class="why">Blocked until it's <span class="egg-hl">fixed or answered</span></p>
          <div class="fix"><svg viewBox="0 0 40 40" aria-hidden="true"><g class="bugi"><ellipse cx="20" cy="23" rx="8" ry="10" /><path d="M20 14 V33 M15 9 L17.5 13.5 M25 9 L22.5 13.5 M12 19 H5 M12 26 H5 M28 19 H35 M28 26 H35 M13.5 31 L8 35.5 M26.5 31 L32 35.5" /></g></svg>Fix: empty config crash</div>
        </div>
      </div>
      <script>
        (() => {
          const DUR = 5.48;
          const root = document.querySelector('[data-composition-id="s06-gates"] .s06');
          const q = (s) => root.querySelector(s);
          const all = (s) => [...root.querySelectorAll(s)];
          const SHIELD = '<svg viewBox="0 0 36 36"><path d="M18 3 L31 8 V18 C31 26 25 31 18 34 C11 31 5 26 5 18 V8 Z" /></svg>';
          // [name, icon, when it resolves (s), result]
          const CK = [
            ["Security review", SHIELD, 1.9, "pass"],
            ["Lint", "", 2.2, "pass"],
            ["Type checks", "", 2.33, "pass"],
            ["Tests, every platform", "", 2.46, "pass"],
            ["Build", "", 2.59, "pass"],
            ["…and dozens more", "", 2.72, "pass"],
            ["Claude review", '<img src="assets/claude-logo.svg" alt="">', 3.5, "open"],
          ];
          const TOP = (i) => 580 + i * 76;
          const TICK = '<svg viewBox="0 0 24 24"><path d="M5 12.5 L10 17.5 L19 7" /></svg>';
          q(".cks").innerHTML = CK.map(([n, ic, , r], i) => `<div class="ck" style="top:${TOP(i)}px"><i class="hl"></i><span class="nm${i === 5 ? " mute" : ""}">${ic}${n}</span>` +
            (r === "open" ? `<span class="of"><span class="egg-hl">1 open finding</span></span>` : "") +
            `<span class="sts"><svg class="ring" viewBox="0 0 46 46"><circle cx="23" cy="23" r="19" /></svg>${r === "pass" ? `<span class="pass">${TICK}</span>` : `<span class="open">!</span>`}</span></div>` +
            (i < CK.length - 1 ? `<i class="ln" style="top:${TOP(i) + 71}px"></i>` : "")).join("");
          const cks = all(".ck");
          gsap.set(q(".fix"), { x: 90, y: 330 });

          const tl = gsap.timeline({ paused: true });
          Egg.fadeUp(tl, [q(".egg-eyebrow"), q(".trk")], 0.05);
          tl.fromTo(q(".fix"), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "none" }, 0.05);
          // the checks panel, every check pending
          Egg.fadeUp(tl, [q(".pnl"), q(".pk")], 0.3, { y: 30 });
          Egg.fadeUp(tl, [...cks, ...all(".ln")], 0.4, { y: 14, stagger: 0.04 });
          all(".ring").forEach((r) => tl.fromTo(r, { rotation: 0 }, { rotation: 360, transformOrigin: "50% 50%", duration: 4.0, ease: "none" }, 0.4));
          // "security review and checks": each resolves in turn
          tl.to(cks[0].querySelector(".hl"), { opacity: 1, duration: 0.25, ease: "none" }, 1.3);
          tl.to(cks[0].querySelector(".hl"), { opacity: 0, duration: 0.3, ease: "none" }, 2.2);
          CK.forEach(([, , t, r], i) => {
            const ring = cks[i].querySelector(".ring");
            tl.to(ring, { opacity: 0, duration: 0.12, ease: "none" }, t);
            Egg.pop(tl, cks[i].querySelector(r === "pass" ? ".pass" : ".open"), t, { dur: 0.35 });
          });
          // "Any open finding": Claude's review is still open
          tl.to(cks[6].querySelector(".hl"), { opacity: 1, duration: 0.25, ease: "none" }, 3.36);
          Egg.fadeUp(tl, cks[6].querySelector(".of"), 3.6, { y: 8, dur: 0.35 });
          Egg.highlight(tl, cks[6].querySelector(".of .egg-hl"), 3.85);
          Egg.fadeUp(tl, q(".mg"), 2.9, { y: 16 });
          gsap.set(q(".shk"), { y: -5 });
          // "blocks the merge": the lock snaps shut, the button greys out
          tl.to(q(".shk"), { y: 0, duration: 0.18, ease: "power3.in" }, 4.47);
          tl.to(q(".mg"), { backgroundColor: "#ebe8e4", borderColor: "#ebe8e4", color: "#777169", duration: 0.2, ease: "none" }, 4.55);
          Egg.shake(tl, q(".mg"), 4.55);
          Egg.fadeUp(tl, q(".why"), 4.7, { y: 12 });
          Egg.highlight(tl, q(".why .egg-hl"), 4.95, { dur: 0.35 });

          Egg.fadeOut(tl, q(".fix"), DUR - 0.35, { y: "-=20" });
          Egg.fadeOut(tl, [q(".egg-eyebrow"), q(".trk"), q(".pnl"), q(".pk"), q(".cks"), q(".mg"), q(".why")], DUR - 0.35);
          window.__timelines["s06-gates"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
