  <body>
    <template>
      <!-- s02 · The flood, then the name of the idea. Three Claude marks (agents writing code) throw changes into a block
           chart of changes landing per day in Anthropic's monorepo: May 2,500 (5 blocks) and Sept 30,000+ (60 blocks),
           1 block = 500 changes, so the columns are to scale. "Nobody can read all that": the Sept pile slides left and
           jams against one gate with one reviewer. "So they stack layers": four sieve layers draw on the right and
           changes fall through them, a few caught at each. "Not one gate": the gate dims and its label is struck.
           Avatar: corner (top right stays empty above y 485). Voiceover: 0.18 "With agents writing code, Anthropic's
           daily changes jumped from twenty-five hundred to over thirty thousand." 6.49 "Nobody can read all that, so
           they stack layers, not one gate." -->
      <style>
        #root { position: absolute; inset: 0; }
        .s02 .egg-eyebrow { position: absolute; left: 90px; top: 232px; }
        .s02 .ag { top: 310px; width: 92px; height: 92px; }
        .s02 .agk { position: absolute; left: 500px; top: 345px; }
        .s02 .col { position: absolute; inset: 0; }
        .s02 .blk { position: absolute; width: 44px; height: 44px; border-radius: 10px; background: var(--ink); }
        .s02 .num { position: absolute; text-align: center; font: 300 72px/1 var(--f-display); letter-spacing: -0.02em; color: var(--ink); font-variant-numeric: tabular-nums; }
        .s02 .mon { position: absolute; width: 260px; top: 1256px; text-align: center; font: 400 36px/1 var(--f-body); color: var(--graphite); }
        .s02 .foot { position: absolute; left: 90px; top: 1330px; width: 860px; }
        .s02 .lab { position: absolute; top: 1290px; font: 300 60px/1 var(--f-display); letter-spacing: -0.02em; color: var(--ink); white-space: nowrap; }
        .s02 .who { position: absolute; left: 440px; top: 862px; width: 76px; height: 76px; }
        .s02 .sieve { fill: none; stroke: var(--ink); stroke-width: 7; stroke-linecap: round; stroke-dasharray: 34 16; }
        .s02 .ln { font: 400 30px var(--f-mono); fill: var(--smoke); }
        .s02 .fb { position: absolute; width: 34px; height: 34px; border-radius: 8px; background: var(--ink); border: 4px solid var(--ink); }
      </style>
      <div id="root" data-composition-id="s02-flood" data-width="1080" data-height="1920">
        <div class="egg-scene s02">
          <span class="egg-eyebrow">Changes landing per day · Anthropic</span>
          <img class="cl ag" style="left:110px" src="assets/claude-logo.svg" alt="">
          <img class="cl ag" style="left:240px" src="assets/claude-logo.svg" alt="">
          <img class="cl ag" style="left:370px" src="assets/claude-logo.svg" alt="">
          <span class="egg-card-kicker agk">Agents writing code</span>
          <svg class="egg-svg" viewBox="0 0 1080 1920" aria-hidden="true">
            <path class="ink thin base" d="M130 1236 H830" />
            <path class="ink wall" d="M420 560 V836 M420 964 V1240" />
            <path class="ink thin strike" d="M100 1322 H346" />
            <g class="layers">
              <path class="sieve" d="M590 640 H900" /><text class="ln" x="914" y="651">1</text>
              <path class="sieve" d="M590 790 H900" /><text class="ln" x="914" y="801">2</text>
              <path class="sieve" d="M590 940 H900" /><text class="ln" x="914" y="951">3</text>
              <path class="sieve" d="M590 1090 H900" /><text class="ln" x="914" y="1101">4</text>
            </g>
          </svg>
          <div class="col may"></div>
          <div class="col jam"><div class="col sep"></div></div>
          <span class="num n1" style="left:170px;width:260px;top:1086px">0</span>
          <span class="num n2" style="left:450px;width:400px;top:512px">0</span>
          <span class="mon m1" style="left:170px">May</span>
          <span class="mon m2" style="left:520px">Sept</span>
          <span class="egg-foot foot">1 block = 500 changes a day · Anthropic, 2026</span>
          <svg class="person who" viewBox="0 0 76 76" aria-hidden="true"><circle cx="38" cy="24" r="13" /><path d="M12 70 C12 50 24 42 38 42 C52 42 64 50 64 70" /></svg>
          <span class="lab l1" style="left:110px">One gate</span>
          <span class="lab l2" style="left:600px"><span class="egg-hl">Layers</span></span>
          <div class="falls"></div>
        </div>
      </div>
      <script>
        (() => {
          const DUR = 10.3;
          const root = document.querySelector('[data-composition-id="s02-flood"] .s02');
          const q = (s) => root.querySelector(s);
          const all = (s) => [...root.querySelectorAll(s)];
          // block chart: 44 px blocks on a 52 px pitch, 5 per row, bottom row top at y 1182
          const slot = (x0, i) => [x0 + (i % 5) * 52, 1182 - Math.floor(i / 5) * 52];
          const AG = [[156, 356], [286, 356], [416, 356]];   // agent centres the changes fly out of
          const mk = (box, x0, n) => {
            box.innerHTML = Array.from({ length: n }, (_, i) => { const [x, y] = slot(x0, i); return `<i class="blk" style="left:${x}px;top:${y}px"></i>`; }).join("");
            return [...box.children];
          };
          const may = mk(q(".may"), 170, 5), sep = mk(q(".sep"), 520, 60);
          // falling changes for the layers: [x, layer that catches it (4 = gets through)]
          const FALL = [[606, 0], [650, 1], [694, 2], [738, 0], [782, 3], [826, 1], [862, 0], [628, 2], [760, 4], [716, 4]];
          const SLAB = [640, 790, 940, 1090];
          q(".falls").innerHTML = FALL.map(([x]) => `<i class="fb" style="left:${x}px;top:0px"></i>`).join("");
          const falls = all(".fb");
          ["wall", "strike"].forEach((c) => { const p = q("." + c); p.setAttribute("pathLength", "1"); p.style.strokeDasharray = "1 1.1"; gsap.set(p, { strokeDashoffset: 1.02 }); });
          q(".base").setAttribute("pathLength", "1"); q(".base").style.strokeDasharray = "1 1.1"; gsap.set(q(".base"), { strokeDashoffset: 1.02 });

          const tl = gsap.timeline({ paused: true });
          // "With agents writing code,"
          Egg.fadeUp(tl, q(".egg-eyebrow"), 0.05);
          Egg.pop(tl, all(".ag"), 0.44, { stagger: 0.12 });
          all(".ag").forEach((a, i) => tl.fromTo(a, { rotation: 0 }, { rotation: 90 + i * 20, duration: 6.4, ease: "none" }, 0.44));
          Egg.fadeUp(tl, q(".agk"), 1.0, { y: 12 });
          // "Anthropic's daily changes jumped"
          tl.to(q(".base"), { strokeDashoffset: 0, duration: 0.5, ease: Egg.EASE.draw }, 2.0);
          Egg.fadeUp(tl, [q(".m1"), q(".m2")], 2.3, { y: 14 });
          // "from twenty-five hundred": each change flies out of an agent into its slot
          const fly = (els, x0, at, stagger, dur) => els.forEach((b, i) => {
            const [x, y] = slot(x0, i), [ax, ay] = AG[i % 3];
            tl.fromTo(b, { x: ax - x - 22, y: ay - y - 22, scale: 0.3, opacity: 0 }, { x: 0, y: 0, scale: 1, opacity: 1, duration: dur, ease: "power3.out" }, at + i * stagger);
          });
          fly(may, 170, 3.4, 0.1, 0.5);
          Egg.count(tl, q(".n1"), 0, 2500, 3.4, { dur: 0.9 });
          Egg.fadeUp(tl, q(".n1"), 3.4, { y: 12, dur: 0.3 });
          // "to over thirty thousand": twelve times the pile
          fly(sep, 520, 5.0, 0.016, 0.45);
          Egg.fadeUp(tl, q(".n2"), 5.0, { y: 12, dur: 0.3 });
          Egg.count(tl, q(".n2"), 0, 30000, 5.0, { dur: 1.3, fmt: (v) => Math.round(v).toLocaleString("en-US") + (v > 29999 ? "+" : "") });
          tl.fromTo(q(".n2"), { scale: 1 }, { scale: 1.08, duration: 0.15, ease: "power2.out", yoyo: true, repeat: 1 }, 6.3);
          Egg.fadeUp(tl, q(".foot"), 3.5, { y: 10 });

          // "Nobody can read all that": the pile slides against one gate with one reviewer, and jams
          Egg.fadeOut(tl, [q(".egg-eyebrow"), ...all(".ag"), q(".agk"), q(".base"), q(".n1"), q(".n2"), q(".m1"), q(".m2"), q(".foot"), q(".may")], 6.45);
          tl.to(q(".sep"), { x: -410, duration: 0.6, ease: Egg.EASE.move }, 6.55);
          tl.to(q(".wall"), { strokeDashoffset: 0, duration: 0.5, ease: Egg.EASE.draw }, 6.75);
          Egg.pop(tl, q(".who"), 7.0, { dur: 0.45 });
          Egg.fadeUp(tl, q(".l1"), 7.1, { y: 14 });
          Egg.shake(tl, q(".jam"), 7.35);
          tl.to(q(".who"), { keyframes: { rotation: [0, -8, 7, -5, 0] }, transformOrigin: "50% 92%", duration: 0.4, ease: "none" }, 7.35);
          // "so they stack layers": four sieves, and changes fall through them, a few caught at each
          all(".layers > *").forEach((el, i) => tl.fromTo(el, { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.4, ease: Egg.EASE.enter }, 7.98 + Math.floor(i / 2) * 0.12));
          Egg.fadeUp(tl, q(".l2"), 8.4, { y: 14 });
          falls.forEach((b, i) => {
            const [, k] = FALL[i];
            const stop = (k < 4 ? SLAB[k] : 1236) - 38;
            const t0 = 8.3 + (i % 5) * 0.07;
            tl.fromTo(b, { y: 470, opacity: 0 }, { y: 470, opacity: 1, duration: 0.12, ease: "none" }, t0);
            tl.to(b, { y: stop, duration: 0.3 + k * 0.12, ease: "power2.in" }, t0 + 0.1);
            if (k < 4) tl.to(b, { backgroundColor: "rgba(0,0,0,0)", duration: 0.15, ease: "none" }, t0 + 0.4 + k * 0.12);
          });
          // "not one gate"
          Egg.highlight(tl, q(".l2 .egg-hl"), 9.36);
          tl.to([q(".sep"), q(".wall"), q(".who"), q(".l1")], { opacity: 0.3, duration: 0.3, ease: "none" }, 9.36);
          tl.to(q(".strike"), { strokeDashoffset: 0, duration: 0.35, ease: Egg.EASE.draw }, 9.45);

          Egg.fadeOut(tl, [q(".sep"), q(".wall"), q(".who"), q(".l1"), q(".strike"), q(".layers"), q(".l2"), q(".falls")], DUR - 0.35);
          window.__timelines["s02-flood"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
