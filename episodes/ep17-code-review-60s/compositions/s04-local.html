<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <!-- Sound cues (seconds from scene start). Run node tools/build-sfx.mjs after editing. -->
    <script type="application/json" class="sfx-cues">[
      {"t":0.08,"sfx":"tap","vol":0.16},
      {"t":1.12,"sfx":"pen","vol":0.14,"dur":0.7},
      {"t":1.5,"sfx":"pop","vol":0.18},
      {"t":2.39,"sfx":"typing","vol":0.16,"dur":0.35},
      {"t":3.06,"sfx":"tick","vol":0.16},
      {"t":3.25,"sfx":"tick","vol":0.16},
      {"t":3.42,"sfx":"tick","vol":0.16},
      {"t":3.6,"sfx":"marker","vol":0.14},
      {"t":3.76,"sfx":"paper","vol":0.14},
      {"t":3.9,"sfx":"tap","vol":0.12},
      {"t":4.1,"sfx":"pop","vol":0.2},
      {"t":4.95,"sfx":"pop","vol":0.18},
      {"t":5.3,"sfx":"marker","vol":0.16},
      {"t":6.0,"sfx":"air","vol":0.12},
      {"t":6.85,"sfx":"chime","vol":0.14,"dur":1.0}
    ]</script>
  </head>
  <body>
    <template>
      <!-- s04 · Layer 1 · On your machine. The fix chip (carried from s03) sits on top. A laptop draws on "on your
           machine"; on "Claude runs the tests" its terminal runs tests, build and lint, each ticked, and a callout says
           it shows the output, not just "done". "Then a second Claude, with fresh eyes": two context panels. The
           writer's context is full of how it got there (token chips: the ask, the plan, tries, errors); the reviewer's
           holds only the change. On "rereads the change" a scan bar sweeps it. The chip stays: s05 opens on it.
           Avatar: corner (everything above y 485 stays left of x 830). Voiceover: 0.18 "Layer one, on your machine:
           Claude runs the tests, then a second Claude, with fresh eyes, rereads the change." -->
      <style>
        #root { position: absolute; inset: 0; }
        .s04 .egg-eyebrow { position: absolute; left: 90px; top: 232px; }
        .s04 .term { position: absolute; left: 128px; top: 488px; width: 434px; height: 294px; border-radius: 12px; background: var(--ink);
          padding: 26px 28px; font: 400 30px/52px var(--f-mono); color: #ebe8e4; white-space: pre; }
        .s04 .term .p { color: #a59f97; }
        .s04 .term .ok { color: #a996ff; }
        .s04 .wl { width: 112px; height: 112px; left: 728px; top: 500px; }
        .s04 .wk { position: absolute; left: 620px; width: 330px; top: 636px; text-align: center; }
        .s04 .call { position: absolute; left: 620px; width: 330px; top: 690px; font: 400 34px/1.35 var(--f-body); color: var(--graphite); text-align: center; text-wrap: balance; }
        .s04 .pan { position: absolute; top: 920px; width: 410px; height: 500px; padding: 30px; gap: 16px; }
        .s04 .pan .hd { display: flex; align-items: center; gap: 16px; font: 300 48px/1 var(--f-display); letter-spacing: -0.02em; }
        .s04 .pan .hd img { width: 60px; height: 60px; }
        .s04 .ctx { position: relative; height: 236px; border: 2px dashed var(--ash); border-radius: 20px; padding: 14px; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 10px; overflow: hidden; }
        .s04 .tok { display: block; font: 400 28px/1 var(--f-mono); padding: 11px 13px; border-radius: 12px; color: var(--ink); white-space: nowrap; }
        .s04 .tok:nth-child(3n + 1) { background: var(--tok-1); }
        .s04 .tok:nth-child(3n + 2) { background: var(--tok-2); }
        .s04 .tok:nth-child(3n + 3) { background: var(--tok-3); }
        .s04 .diff { display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; border-radius: 14px; background: var(--tok-1); width: 100%; }
        .s04 .diff b { font: 400 28px/1 var(--f-mono); }
        .s04 .diff code { font: 400 17px/1.25 var(--f-mono); color: var(--ink); white-space: pre; }
        .s04 .diff code.del { color: var(--smoke); text-decoration: line-through; }
        .s04 .scan { position: absolute; left: 0; top: 0; width: 8px; height: 236px; border-radius: 4px; background: var(--ink); }
        .s04 .ft { font: 400 34px/1.3 var(--f-body); color: var(--graphite); }
      </style>
      <div id="root" data-composition-id="s04-local" data-width="1080" data-height="1920">
        <div class="egg-scene s04">
          <span class="egg-eyebrow">Layer 1 · On your machine</span>
          <span class="trk"><i class="on"></i><i></i><i></i><i></i></span>
          <svg class="egg-svg" viewBox="0 0 1080 1920" aria-hidden="true">
            <rect class="ink scr" x="110" y="470" width="470" height="330" rx="22" data-draw="0" data-dur="0.6" />
            <path class="ink" d="M72 816 H618 L590 852 H100 Z" data-draw="1" data-dur="0.5" />
          </svg>
          <div class="term"><div class="t1"><span class="p">$</span> run tests</div><div class="t2"><span class="ok">✓</span> all tests passed</div><div class="t3"><span class="p">$</span> build  <span class="ok">✓</span></div><div class="t4"><span class="p">$</span> lint   <span class="ok">✓</span></div></div>
          <img class="cl wl" src="assets/claude-logo.svg" alt="Claude">
          <span class="egg-card-kicker wk">Claude, who wrote it</span>
          <p class="call">Shows <span class="egg-hl">the output</span>, not just “done”.</p>
          <div class="egg-card taupe pan wr" style="left:90px">
            <div class="hd"><img src="assets/claude-logo.svg" alt="">Writer</div>
            <span class="egg-card-kicker">Its context</span>
            <div class="ctx"><span class="tok">your ask</span><span class="tok">plan</span><span class="tok">try 1</span><span class="tok">error log</span><span class="tok">try 2</span><span class="tok">notes</span><span class="tok">…</span></div>
            <p class="ft">Full of how it got there</p>
          </div>
          <div class="egg-card pan rv" style="left:540px">
            <div class="hd"><img class="rvl" src="assets/claude-logo.svg" alt="">Reviewer</div>
            <span class="egg-card-kicker">Its context</span>
            <div class="ctx"><div class="diff"><b>the change</b><code class="del">− theme.name</code><code class="add">+ theme?.name ?? "light"</code></div><span class="scan"></span></div>
            <p class="ft"><span class="egg-hl">Fresh eyes</span>: only the change</p>
          </div>
          <div class="fix"><svg viewBox="0 0 40 40" aria-hidden="true"><g class="bugi"><ellipse cx="20" cy="23" rx="8" ry="10" /><path d="M20 14 V33 M15 9 L17.5 13.5 M25 9 L22.5 13.5 M12 19 H5 M12 26 H5 M28 19 H35 M28 26 H35 M13.5 31 L8 35.5 M26.5 31 L32 35.5" /></g></svg>Fix: empty config crash</div>
        </div>
      </div>
      <script>
        (() => {
          const DUR = 7.26;
          const root = document.querySelector('[data-composition-id="s04-local"] .s04');
          const q = (s) => root.querySelector(s);
          const all = (s) => [...root.querySelectorAll(s)];
          const wr = q(".wr"), rv = q(".rv");
          gsap.set(q(".fix"), { x: 90, y: 330 });   // carried from s03, same frame

          const tl = gsap.timeline({ paused: true });
          // "Layer one, on your machine:"
          Egg.fadeUp(tl, [q(".egg-eyebrow"), q(".trk")], 0.05);
          Egg.draw(tl, q(".s04 .egg-svg"), 1.12, { gap: 0.45 });
          tl.fromTo(q(".term"), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "none" }, 1.5);
          Egg.pop(tl, q(".wl"), 1.5);
          tl.fromTo(q(".wl"), { rotation: 0 }, { rotation: 90, duration: 5.4, ease: "none" }, 1.5);
          Egg.fadeUp(tl, q(".wk"), 1.75, { y: 10 });
          // "Claude runs the tests": the terminal runs, each step ticked
          Egg.typeOn(tl, q(".t1"), 2.39, { cps: 40 });
          [q(".t2"), q(".t3"), q(".t4")].forEach((el, i) => tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "none" }, 3.06 + i * 0.18));
          Egg.fadeUp(tl, q(".call"), 3.3, { y: 14 });
          Egg.highlight(tl, q(".call .egg-hl"), 3.6);
          // "then a second Claude": the writer's context is full; the reviewer's holds only the change
          Egg.fadeUp(tl, wr, 3.76, { y: 30 });
          tl.fromTo(all(".wr .tok"), { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: Egg.EASE.pop, stagger: 0.06 }, 3.9);
          Egg.fadeUp(tl, rv, 4.0, { y: 30 });
          Egg.pop(tl, q(".rvl"), 4.1, { dur: 0.45 });
          // "with fresh eyes"
          Egg.pop(tl, q(".diff"), 4.95, { dur: 0.45 });
          Egg.fadeUp(tl, all(".pan .ft"), 5.0, { y: 10, stagger: 0.12 });
          Egg.highlight(tl, q(".rv .egg-hl"), 5.3);
          // "rereads the change": a scan bar sweeps it, twice
          tl.fromTo(q(".scan"), { x: 6, opacity: 0 }, { x: 6, opacity: 1, duration: 0.1, ease: "none" }, 6.0);
          tl.to(q(".scan"), { keyframes: [{ x: 330, duration: 0.42 }, { x: 6, duration: 0.42 }], ease: "power1.inOut" }, 6.05);
          tl.to(q(".scan"), { opacity: 0, duration: 0.15, ease: "none" }, 6.85);

          // the chip stays: s05 opens on it
          Egg.fadeOut(tl, [q(".egg-eyebrow"), q(".trk"), q(".s04 .egg-svg"), q(".term"), q(".wl"), q(".wk"), q(".call"), wr, rv], DUR - 0.35);
          window.__timelines["s04-local"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
