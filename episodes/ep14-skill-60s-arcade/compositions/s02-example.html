<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <!-- Sound cues (seconds from scene start). Run node tools/build-sfx.mjs after editing. -->
    <script type="application/json" class="sfx-cues">[
      {"t":0.2,"sfx":"blip","vol":0.12},
      {"t":1.2,"sfx":"land","vol":0.16},
      {"t":1.45,"sfx":"land","vol":0.14},
      {"t":1.7,"sfx":"land","vol":0.14},
      {"t":2.1,"sfx":"error","vol":0.08},
      {"t":3.25,"sfx":"whoosh","vol":0.12},
      {"t":3.7,"sfx":"coin","vol":0.12},
      {"t":3.85,"sfx":"coin","vol":0.12},
      {"t":4.0,"sfx":"coin","vol":0.12}
    ]</script>
  </head>
  <body>
    <template>
      <!-- s02 · The example, as three score cards. Three pull request descriptions drop into a crooked pile, each
           written a different way ("fixed stuff", a wall of text, loose bullets) and each stamped RANK D. On "the
           same way every time" they snap into a column, take the same shape (WHAT · WHY · CHANGES as pixel bars) and
           flip to RANK S. Avatar: small top right ("corner"); content above y 485 stays left of x 830.
           Voiceover: 0.2 "Say you want Claude to write your pull request descriptions, the same way every time." -->
      <style>
        #root { position: absolute; inset: 0; }
        .s02 .pr { position: absolute; left: 96px; width: 848px; height: 280px; }
        .s02 .pr .top { position: absolute; left: 28px; right: 28px; top: 20px; height: 56px; display: flex; align-items: center; gap: 18px; white-space: nowrap; }
        .s02 .pr .no { font: 400 44px/1 var(--a-mono); color: var(--a-grey); }
        .s02 .pr .nm { font: 500 38px/1 var(--a-body); }
        .s02 .pr .rk { position: absolute; right: 0; top: 4px; padding: 10px 12px 8px; font: 400 28px/1 var(--a-head); color: var(--a-black); }
        .s02 .pr .rk.d { background: var(--a-red); }
        .s02 .pr .rk.s { background: var(--a-green); }
        .s02 .lay { position: absolute; left: 28px; right: 28px; top: 94px; bottom: 16px; }
        .s02 .messy p { font: 400 34px/1.25 var(--a-body); color: var(--a-grey); }
        .s02 .neat { display: grid; grid-template-columns: 230px 1fr; row-gap: 0; align-items: center; }
        .s02 .neat .k { font: 400 28px/1 var(--a-head); color: var(--a-cyan); }
        .s02 .neat i { display: block; height: 20px; background: repeating-linear-gradient(to right, var(--a-violet) 0 16px, rgba(0, 0, 0, 0) 16px 20px); }
      </style>
      <div id="root" data-composition-id="s02-example" data-width="1080" data-height="1920">
        <div class="arc-scene s02">
          <div class="lv"><span class="px-tag lv-tag">THE QUEST</span><h2 class="lv-ttl">PR DESCRIPTIONS</h2></div>
          <div class="px-panel pr p1" style="top:526px" data-layout-allow-overlap="">
            <div class="top"><span class="no">#412</span><span class="nm">Password reset expiry</span><span class="rk d">RANK D</span><span class="rk s">RANK S</span></div>
            <div class="lay messy"><p>fixed stuff</p></div>
            <div class="lay neat"><span class="k">WHAT</span><i style="width:80%"></i><span class="k">WHY</span><i style="width:60%"></i><span class="k">CHANGES</span><i style="width:70%"></i></div>
          </div>
          <div class="px-panel pr p2" style="top:846px" data-layout-allow-overlap="">
            <div class="top"><span class="no">#413</span><span class="nm">New invoice page</span><span class="rk d">RANK D</span><span class="rk s">RANK S</span></div>
            <div class="lay messy"><p>So this PR is about the invoice page which I changed because the old one was confusing and also I moved some…</p></div>
            <div class="lay neat"><span class="k">WHAT</span><i style="width:70%"></i><span class="k">WHY</span><i style="width:85%"></i><span class="k">CHANGES</span><i style="width:55%"></i></div>
          </div>
          <div class="px-panel pr p3" style="top:1166px" data-layout-allow-overlap="">
            <div class="top"><span class="no">#414</span><span class="nm">Faster search</span><span class="rk d">RANK D</span><span class="rk s">RANK S</span></div>
            <div class="lay messy"><p>- search</p><p>- misc</p></div>
            <div class="lay neat"><span class="k">WHAT</span><i style="width:65%"></i><span class="k">WHY</span><i style="width:75%"></i><span class="k">CHANGES</span><i style="width:80%"></i></div>
          </div>
        </div>
      </div>
      <script>
        (() => {
          const DUR = 4.6;
          const root = document.querySelector('[data-composition-id="s02-example"] .s02');
          const q = (s) => root.querySelector(s);
          const all = (s) => [...root.querySelectorAll(s)];
          const cards = all(".pr");
          gsap.set([...all(".neat"), ...all(".rk")], { opacity: 0 });

          const tl = gsap.timeline({ paused: true });
          Arc.show(tl, q(".lv-tag"), 0.2);
          // "to write your pull request descriptions": three, each written a different way, drop into a pile
          Arc.show(tl, q(".lv-ttl"), 1.0);
          const pile = [{ x: 24, y: 196, r: -5 }, { x: -20, y: -60, r: 4 }, { x: 36, y: -324, r: -2 }];
          cards.forEach((c, i) => {
            gsap.set(c, { opacity: 0, x: pile[i].x, rotation: pile[i].r });
            tl.set(c, { opacity: 1 }, 1.2 + i * 0.25);
            tl.fromTo(c, { y: pile[i].y - 200 }, { y: pile[i].y, duration: 0.2, ease: "steps(4)", immediateRender: false }, 1.2 + i * 0.25);
          });
          Arc.show(tl, all(".rk.d"), 2.1, { stagger: 0.12 });
          // "the same way every time": they snap into a column and take the same shape
          tl.to(cards, { x: 0, y: 0, rotation: 0, duration: 0.3, ease: "steps(4)", stagger: 0.06 }, 3.25);
          tl.set([...all(".messy"), ...all(".rk.d")], { opacity: 0 }, 3.5);
          all(".neat").forEach((n, i) => {
            tl.set(n, { opacity: 1 }, 3.7 + i * 0.15);
            Arc.show(tl, cards[i].querySelector(".rk.s"), 3.7 + i * 0.15);
            Arc.flash(tl, cards[i], 3.7 + i * 0.15, "borderColor", "#5df58a", "#f4f1ff", 2, "#5df58a");
          });

          Arc.hide(tl, [q(".lv"), ...cards], DUR - 0.15);
          window.__timelines["s02-example"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
