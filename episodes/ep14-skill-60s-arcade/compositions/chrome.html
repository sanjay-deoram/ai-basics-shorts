<!DOCTYPE html>
<html data-composition-variables="[{&quot;id&quot;:&quot;duration&quot;,&quot;type&quot;:&quot;number&quot;,&quot;label&quot;:&quot;Episode length (s)&quot;,&quot;default&quot;:34,&quot;min&quot;:5,&quot;max&quot;:60,&quot;step&quot;:0.1,&quot;unit&quot;:&quot;s&quot;}]">
  <head>
    <meta charset="UTF-8">
    <!-- The chiptune bed for the whole episode, kept low under the voice (it fades out by itself at 53 s). -->
    <script type="application/json" class="sfx-cues">[
      {"t":0.0,"sfx":"bed","vol":0.05,"dur":57.15}
    ]</script>
  </head>
  <body>
    <template>
      <!-- Persistent overlay for the whole episode: the HUD at the top of the safe area (TIME, the seconds left out
           of 60, and a bar that drains one notch a second; it turns yellow, then red) and faint scanlines over
           everything. The HUD stays left of x 830: the avatar's corner. -->
      <style>
        #root { position: absolute; inset: 0; pointer-events: none; }
        .hud { position: absolute; left: 90px; top: 222px; height: 36px; display: flex; align-items: center; gap: 18px; font: 400 28px/1 "Press Start 2P", monospace; color: #f4f1ff; }
        .hud .n { color: #ffd23f; width: 60px; }
        .hud .bar { position: relative; width: 500px; height: 32px; border: 4px solid #f4f1ff; background: #07071a; }
        .hud .bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; background: #5df58a; }
        .hud .bar b { position: absolute; inset: 0; background: repeating-linear-gradient(to right, rgba(7, 7, 26, 0) 0 12px, #07071a 12px 16px); }
        .scan { position: absolute; inset: 0; background: repeating-linear-gradient(to bottom, rgba(7, 7, 26, 0) 0 4px, rgba(7, 7, 26, 0.16) 4px 6px); }
      </style>
      <div id="root" data-composition-id="chrome" data-width="1080" data-height="1920">
        <div class="hud"><span>TIME</span><span class="n">60</span><div class="bar"><i></i><b></b></div></div>
        <div class="scan"></div>
      </div>
      <script>
        (() => {
          const root = document.querySelector('[data-composition-id="chrome"]');
          const { duration } = window.__hyperframes.getVariables();
          const n = root.querySelector(".hud .n"), fill = root.querySelector(".hud .bar i");
          const tl = gsap.timeline({ paused: true });
          const secs = Math.floor(duration);
          const o = { t: 0 };
          tl.to(o, { t: duration, duration, ease: "none", onUpdate: () => { n.textContent = String(60 - Math.floor(o.t + 1e-6)).padStart(2, "0"); } }, 0);
          tl.fromTo(fill, { width: "100%" }, { width: (100 * (60 - secs)) / 60 + "%", duration: secs, ease: `steps(${secs})` }, 0);
          tl.set(fill, { backgroundColor: "#ffd23f" }, 30).set(fill, { backgroundColor: "#ff4d6d" }, 48);
          // the big 60 from the cold open lands in the counter
          [3.6, 3.74].forEach((t) => tl.set(n, { color: "#f4f1ff" }, t).set(n, { color: "#ffd23f" }, t + 0.07));
          window.__timelines["chrome"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
