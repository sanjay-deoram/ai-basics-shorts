          <div class="pc white mini m3" style="left:680px" data-r="-1"><div class="pin yel"></div><p class="hd">#414</p><span class="sec a">What</span><i style="width:200px"></i><span class="sec b">Why</span><i style="width:160px"></i><span class="sec c">Changes</span><i style="width:170px"></i></div>

      <script>
        (() => {
          const F = Cut.F;
          const root = document.querySelector('[data-composition-id="s05-ask"] .s05');
          const q = (s) => root.querySelector(s);
          const all = (s) => [...root.querySelectorAll(s)];
          Cut.dress(root, 505);
          // a five-point paper star
          q(".star").style.clipPath = "polygon(" + Array.from({ length: 10 }, (_, i) => {
            const a = -Math.PI / 2 + (i / 10) * Math.PI * 2, k = i % 2 ? 0.45 : 1;
            return `${(50 + Math.cos(a) * 50 * k).toFixed(1)}% ${(50 + Math.sin(a) * 50 * k).toFixed(1)}%`;
          }).join(",") + ")";
          const tx = q(".tx"), s1 = q(".s1"), s2 = q(".s2"), s3 = q(".s3"), body = q(".s2 .body"), str = q(".str");
          const VISIBLE = 10, LH = 42;   // rows that fit the transcript area; banner = rows 0–2, blank = row 3
          const rows = (n) => q(".r" + n);
          const marks = all(".sk .mark");
          gsap.set([...Array.from({ length: 12 }, (_, i) => rows(i + 4)), q(".k1"), q(".k2"), s1, s2, s3, q(".pay"), q(".weak"), q(".good"), q(".star")], { opacity: 0 });
          gsap.set(marks, { scaleX: 0 });

          const tl = gsap.timeline({ paused: true });
          // a transcript row is stuck on; the transcript jumps up once it's full
          const show = (n, at) => {
            tl.set(rows(n), { opacity: 1 }, at);
            if (n + 1 > VISIBLE) tl.to(tx, { y: -(n + 1 - VISIBLE) * LH, duration: 2 * F, ease: Cut.ease(2 * F) }, at);
          };

          // "Step three: just ask."
          Cut.drop(tl, q(".tag"), 0.2, { from: "left", dur: 0.25 });
          Cut.drop(tl, q(".win"), 0.3, { from: "top", dist: 500, dur: 0.33, spin: 4 });
          Egg.typeOn(tl, q(".input .it"), 0.9, { cps: 28 });
          // "Claude reads only each skill's name and description up front": three index cards, pinned
          Cut.drop(tl, q(".k1"), 2.4, { from: "left", dist: 300, dur: 0.25 });
          Cut.drop(tl, [s1, s2, s3], 2.5, { from: "bottom", dist: 700, dur: 0.33, stagger: 0.12 });
          Cut.pop(tl, all(".sk > .pin"), 2.62, { stagger: 0.12 });
          // "name" then "description": a strip of tape under each
          [0, 2, 4].forEach((i, k) => Cut.mark(tl, marks[i], 4.0 + k * 0.08, 0.25));
          [1, 3, 5].forEach((i, k) => Cut.mark(tl, marks[i], 4.5 + k * 0.08, 0.33));
          // "When your request matches": the note is sent, a string runs to pr-description, the others are knocked aside
          tl.set(q(".input .it"), { opacity: 0 }, 6.1);
          show(4, 6.2);
          tl.set(str, { opacity: 1 }, 6.3);
          Cut.string(tl, str, 6.3, 0.42);
          tl.set(s2, { scale: 1.04 }, 6.8);
          tl.set(s2, { scale: 1 }, 6.8 + 2 * F);
          Cut.jit(tl, s2, 6.8, 2, 4);
          Cut.move(tl, s1, 6.8, { x: -40, rotation: -5 }, 3 * F, "power2.out");
          Cut.move(tl, s3, 6.8, { x: 40, rotation: 5 }, 3 * F, "power2.out");
          // "it loads the full file": the others leave, the card moves up and unfolds its instructions
          tl.set(str, { opacity: 0 }, 7.5);
          Cut.out(tl, s1, 7.5, { to: "left", dist: 1100, dur: 0.25 });
          Cut.out(tl, s3, 7.5, { to: "right", dist: 1100, dur: 0.25 });
          Cut.out(tl, q(".k1"), 7.5, { to: "left", dist: 1000, dur: 0.25 });
          Cut.drop(tl, q(".k2"), 7.7, { from: "left", dist: 300, dur: 0.25 });
          Cut.move(tl, s2, 7.6, { y: -130 }, 0.25, "power2.out");
          Cut.unfold(tl, body, 7.85, { dur: 0.25 });
          show(5, 7.7);
          show(6, 8.0);
          // "and follows it": git diff, then the three sections
          show(7, 8.9);
          show(8, 9.2);
          [9, 10, 11, 12, 13, 14, 15].forEach((n, i) => show(n, 9.6 + i * 0.2));

          // "Same format, every time."
          Cut.out(tl, [s2, q(".k2")], 9.85, { to: "bottom", dist: 900, dur: 0.25 });
          Cut.drop(tl, q(".pay"), 10.1, { dist: 120, dur: 0.25, spin: 0 });
          // three PR descriptions, all the same shape, pinned up in a row
          Cut.drop(tl, all(".mini"), 10.35, { dist: 400, dur: 0.25, stagger: 0.17 });
          Cut.pop(tl, all(".mini .pin"), 10.6, { stagger: 0.17 });
          Cut.out(tl, all(".mini"), 11.8, { to: "bottom", dist: 1000, dur: 0.25, stagger: 0.05 });
          // "Just keep the description specific": a weak card stamped VAGUE, a better one stamped SPECIFIC
          Cut.drop(tl, q(".weak"), 12.1, { from: "left", dist: 900, dur: 0.33 });
          Cut.stamp(tl, q(".s-a"), q(".weak .ink"), 12.45);
          Cut.drop(tl, q(".good"), 13.0, { from: "right", dist: 900, dur: 0.25 });
          Cut.stamp(tl, q(".s-b"), q(".good .ink"), 13.15);
          Cut.mark(tl, q(".good .mark"), 13.45, 0.42);
          // "or Claude won't know when to use it"
          Cut.jit(tl, q(".weak"), 14.1, 3, 5);
          tl.set(q(".weak"), { opacity: 0.55 }, 14.6);
          // the flourish: a paper star is stuck on the good card
          tl.set(q(".star"), { opacity: 1, scale: 1.6, rotation: -30 }, 15.4);
          tl.set(q(".star"), { scale: 0.9, rotation: 8 }, 15.4 + 2 * F);
          tl.set(q(".star"), { scale: 1, rotation: 12 }, 15.4 + 3 * F);
          Cut.jit(tl, q(".good"), 15.4 + 3 * F, 1.5, 3);

          // hard stop: the last frame holds, no exit
          Cut.boil(tl, root, 0, 15.9, 5);
          window.__timelines["s05-ask"] = tl;
        })();
      </script>
    </template>
