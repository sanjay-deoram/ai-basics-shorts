      <script>
        (() => {
          const DUR = 5.95;
          const root = document.querySelector('[data-composition-id="s04-gateway"] .s04');
          const q = (s) => root.querySelector(s);
          const all = (s) => [...root.querySelectorAll(s)];
          const ars = all(".ar");
          ars.forEach((p) => { p.setAttribute("pathLength", "1"); p.style.strokeDasharray = "1 1.1"; });
          gsap.set([...all(".rq"), q(".gw"), q(".md"), q(".pm"), q(".pl"), q(".dt")], { opacity: 0 });
          const tl = gsap.timeline({ paused: true });
          Apple.rise(tl, q(".a-eyebrow"), 0.12, { y: 16 });
          Apple.rise(tl, q(".hd"), 0.2, { y: 24, dur: 0.7 });
          // "every request"
          Apple.zoom(tl, all(".rq"), 0.9, { from: 0.85, dur: 0.4, stagger: 0.15 });
          Apple.rise(tl, [q(".gw"), q(".md")], 1.2, { y: 20, dur: 0.5, stagger: 0.15 });
          // "passes through a gateway"
          tl.fromTo(ars.slice(0, 3), { strokeDashoffset: 1.02 }, { strokeDashoffset: 0, duration: 0.5, ease: "power2.out", stagger: 0.1 }, 1.75);
          tl.fromTo(q(".dt"), { opacity: 1, x: 728, y: 650 }, { x: 560, y: 790, duration: 0.6, ease: "power2.inOut" }, 2.1);
          Apple.tint(tl, q(".hd .a-tint"), 2.65, { dur: 0.4 });
          tl.to(q(".gw"), { scale: 1.04, duration: 0.18, yoyo: true, repeat: 1 }, 2.7);
          tl.fromTo(ars[3], { strokeDashoffset: 1.02 }, { strokeDashoffset: 0, duration: 0.3 }, 2.8);
          tl.to(q(".dt"), { x: 520, y: 980, duration: 0.4, ease: "power2.inOut" }, 2.8);
          tl.to(q(".dt"), { opacity: 0, duration: 0.2 }, 3.2);
          // "a perimeter that controls how AI gets used"
          tl.fromTo(q(".pm"), { opacity: 0, scale: 1.05 }, { opacity: 1, scale: 1, duration: 0.6, ease: "expo.out" }, 3.4);
          Apple.fade(tl, q(".pl"), 4.0, { dur: 0.4 });
          Apple.out(tl, root.querySelectorAll(".a-eyebrow, .hd, .rq, .a-svg, .gw, .md, .pm, .pl"), DUR - 0.28, { dur: 0.28 });
          window.__timelines["s04-gateway"] = tl;
