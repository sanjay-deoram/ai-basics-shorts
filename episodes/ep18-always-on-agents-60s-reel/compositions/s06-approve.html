      <div id="root" data-composition-id="s06-approve" data-width="1080" data-height="1920">
        <div class="a-scene s06">
          <p class="a-eyebrow">4 · Approval</p>
          <h2 class="a-h2 hd"><span class="l">Risky steps</span><span class="l">wait for <span class="a-tint" data-layout-allow-overlap=""><span data-layout-allow-overlap="">you</span><span class="on" data-layout-allow-overlap="">you</span></span></span></h2>

      <script>
        (() => {
          const root = document.querySelector('[data-composition-id="s06-approve"] .s06');
          const q = (s) => root.querySelector(s);
          gsap.set([q(".call"), q(".ap"), q(".tap"), q(".ob"), q(".ls"), q(".fin")], { opacity: 0 });
          const tl = gsap.timeline({ paused: true });
          Apple.rise(tl, q(".a-eyebrow"), 0.12, { y: 16 });
          Apple.rise(tl, q(".hd"), 0.2, { y: 24, dur: 0.8 });
          // "a risky step like sending the follow-up"
          Apple.rise(tl, q(".call"), 1.5, { y: 20, dur: 0.6 });
          // "waits for your approval"
          Apple.tint(tl, q(".hd .a-tint"), 3.2, { dur: 0.4 });
          Apple.rise(tl, q(".ap"), 3.05, { y: 40, dur: 0.7 });
          // you tap Approve
          tl.fromTo(q(".tap"), { opacity: 0.9, scale: 0.4 }, { opacity: 0, scale: 1.4, duration: 0.6, ease: "power2.out" }, 4.05);
          tl.to(q(".ap .a-btn.blue"), { scale: 0.94, duration: 0.1, yoyo: true, repeat: 1 }, 4.05);
          // "You get the outcome"
          Apple.rise(tl, q(".ob"), 4.55, { y: 40, dur: 0.7 });
          tl.to(q(".ap"), { opacity: 0.45, duration: 0.4 }, 4.55);
          // "not a live stream"
          Apple.zoom(tl, q(".ls"), 5.85, { from: 0.85, dur: 0.4 });
          tl.fromTo(q(".ls .a-strike i"), { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power2.out" }, 6.25);
          // "so a good one starts quiet and earns more of your attention"
          Apple.rise(tl, q(".fin"), 7.6, { y: 20, dur: 0.8 });
          Apple.tint(tl, q(".fin .a-tint"), 9.0, { dur: 0.5 });
          window.__timelines["s06-approve"] = tl;
        })();
