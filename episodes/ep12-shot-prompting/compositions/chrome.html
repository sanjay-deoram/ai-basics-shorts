<!DOCTYPE html>
<html data-composition-variables="[{&quot;id&quot;:&quot;duration&quot;,&quot;type&quot;:&quot;number&quot;,&quot;label&quot;:&quot;Episode length (s)&quot;,&quot;default&quot;:65.6,&quot;min&quot;:5,&quot;max&quot;:90,&quot;step&quot;:0.1,&quot;unit&quot;:&quot;s&quot;}]">
  <head><meta charset="UTF-8"></head>
  <body>
    <template>
      <!-- Backdrop for the whole episode, under everything: near-black with a faint grid and two soft colour glows
           (decoration, may bleed past the safe box), plus a thin progress bar at y 196 that fills across the episode. -->
      <style>
        #root { position: absolute; inset: 0; pointer-events: none; }
        .bk { position: absolute; inset: 0; background-color: #0b0d14;
          background-image: linear-gradient(rgba(255,255,255,0.028) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.028) 1px, transparent 1px);
          background-size: 54px 54px; background-position: 0 14px; }
        .glow { position: absolute; border-radius: 50%; filter: blur(80px); }
        .track { position: absolute; left: 90px; top: 194px; width: 900px; height: 5px; border-radius: 3px; background: #1f2335; overflow: hidden; }
        .fill { position: absolute; inset: 0; border-radius: 3px; background: linear-gradient(90deg, #7aa2f7, #bb9af7); transform-origin: 0 50%; }
      </style>
      <div id="root" data-composition-id="chrome" data-width="1080" data-height="1920">
        <div class="bk" data-layout-allow-overflow="">
          <div class="glow" style="left:-200px;top:180px;width:700px;height:520px;background:rgba(122,162,247,0.13)" data-layout-allow-overflow=""></div>
          <div class="glow" style="left:560px;top:1180px;width:720px;height:560px;background:rgba(187,154,247,0.11)" data-layout-allow-overflow=""></div>
          <div class="track"><div class="fill"></div></div>
        </div>
      </div>
      <script>
        (() => {
          const root = document.querySelector('[data-composition-id="chrome"] .bk');
          const { duration } = window.__hyperframes.getVariables();
          const tl = gsap.timeline({ paused: true });
          tl.fromTo(root.querySelector(".fill"), { scaleX: 0 }, { scaleX: 1, duration: Math.max(0.01, duration), ease: "none" }, 0);
          window.__timelines["chrome"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
