        #root { position: absolute; inset: 0; pointer-events: none; }
      </style>
      <div id="root" data-composition-id="s02-shot" data-width="1080" data-height="1920">
        <div class="cap s02-cap">
          <div class="k">definition</div>
          <div class="t">A shot = one example</div>
          <div class="d">an input paired with the output you want back</div>
        </div>
      </div>
      <script>
        (() => {
          const cap = document.querySelector('[data-composition-id="s02-shot"] .cap');
          const tl = gsap.timeline({ paused: true });
          tl.fromTo(cap.children[0], { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.2);
          tl.fromTo(cap.children[1], { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.28);
          tl.fromTo(cap.children[2], { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 1.9);
          tl.to(cap.children, { opacity: 0, y: -14, duration: 0.25, ease: "power2.in", stagger: 0.03 }, 3.70);
          window.__timelines["s02-shot"] = tl;
        })();
      </script>
