<!DOCTYPE html>
<html data-composition-variables="[{&quot;id&quot;:&quot;duration&quot;,&quot;type&quot;:&quot;number&quot;,&quot;label&quot;:&quot;Episode length (s)&quot;,&quot;default&quot;:34,&quot;min&quot;:5,&quot;max&quot;:60,&quot;step&quot;:0.1,&quot;unit&quot;:&quot;s&quot;}]">
  <head><meta charset="UTF-8"></head>
  <body>
    <template>
      <!-- Persistent overlay for the whole episode: paper grain over everything and an inked progress strip at the top of the safe area. -->
      <style>
        #root { position: absolute; inset: 0; pointer-events: none; }
      </style>
      <div data-hf-id="hf-t4u5" id="root" data-composition-id="chrome" data-width="1080" data-height="1920">
        <div class="cm-grain"></div>
        <div class="cm-progress"><i></i></div>
      </div>
      <script>
        (() => {
          const root = document.querySelector('[data-composition-id="chrome"] .cm-progress').parentElement;
          const { duration } = window.__hyperframes.getVariables();
          const tl = gsap.timeline({ paused: true });
          Egg.progress(tl, root.querySelector(".cm-progress i"), 0, duration);
          window.__timelines["chrome"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
