      <script>
        (() => {
          const root = document.querySelector('[data-composition-id="s05-ask"] .s05');

          Cm.mount(root);
          const cam = q(".cam"), c1 = q(".c1"), c2 = q(".c2"), c3 = q(".c3"), full = q(".full"), weak = q(".weak"), good = q(".good");

          gsap.set([q(".k1"), ...all(".card .shade"), full, q(".loaded"), q(".req"), q(".bolt"), q(".match"), q(".run"), q(".r1"), q(".r2"), q(".reply"), q(".who"),

          gsap.set(q(".pay"), { opacity: 0 });

          const tl = gsap.timeline({ paused: true });
          // "Step three: just ask."
          Cm.sticker(tl, q(".step"), 0.15, { rot: -8 });
          Cm.ink(tl, q(".ttl"), 0.3, 0.35);
          Cm.slam(tl, q(".win"), 0.3, { tilt: -5 });
          Egg.typeOn(tl, q(".win .it"), 0.9, { cps: 28 });
          // "Claude reads only each skill's name and description up front": three cards, files closed
          Cm.sticker(tl, q(".k1"), 2.35, { rot: -2, dur: 0.3 });
          [c1, c2, c3].forEach((c, i) => Cm.slam(tl, c, 2.5 + i * 0.18 - 0.24, { rot: [-3, 0, 3][i], tilt: i % 2 ? 9 : -9, dur: 0.24 }));
          all(".card .nm .cm-mark").forEach((m, i) => Cm.mark(tl, m, 4.0 + i * 0.08, 0.35));
          all(".card .ds .cm-mark").forEach((m, i) => Cm.mark(tl, m, 4.5 + i * 0.1, 0.5));
          // "When your request matches": the request pops out, the bolt hits pr-description: MATCH!
          tl.to(q(".win .it"), { opacity: 0.35, duration: 0.12, ease: "none" }, 6.1);
          Cm.sticker(tl, q(".req"), 6.1, { rot: -2 });
          Cm.mark(tl, q(".req .cm-mark"), 6.4, 0.3);
          tl.fromTo(q(".bolt"), { opacity: 0, scale: 0.2, y: 50 }, { opacity: 1, scale: 1, y: 0, duration: 0.2, ease: "back.out(3)" }, 6.5);
          Cm.sticker(tl, q(".match"), 6.8, { rot: -8 });
          tl.to(c2, { scale: 1.07, y: -14, duration: 0.25, ease: "back.out(3)" }, 6.8);
          tl.to(all(".card .shade"), { opacity: 0.8, duration: 0.25, ease: "none" }, 6.8);
          // "it loads the full file": the others drop away, the card becomes the whole file
          tl.to([c1, c3], { y: 500, rotation: (i) => (i ? 24 : -24), opacity: 0, duration: 0.35, ease: "power2.in" }, 7.45);
          tl.to([q(".k1"), q(".match"), q(".bolt")], { opacity: 0, scale: 0.5, duration: 0.2, ease: "power2.in" }, 7.45);
          tl.to(c2, { scale: 1.5, opacity: 0, duration: 0.25, ease: "power2.in" }, 7.55);
          Cm.slam(tl, full, 7.6, { tilt: 4, from: 0.5, y: 0 });
          Cm.sticker(tl, q(".loaded"), 8.0, { rot: 7 });
          // "and follows it": pan down; git diff runs, then the reply is lettered
          tl.to(cam, { y: -540, duration: 0.5, ease: "power3.inOut" }, 8.5);
          tl.to([q(".step"), q(".ttl"), q(".win"), q(".req"), q(".loaded")], { opacity: 0, duration: 0.25, ease: "none" }, 8.5);
          tl.fromTo(q(".run"), { opacity: 0, x: -80 }, { opacity: 1, x: 0, duration: 0.25, ease: "power3.out" }, 8.65);
          tl.to(q(".r1"), { opacity: 1, duration: 0.01 }, 8.75);
          tl.to(q(".r2"), { opacity: 1, duration: 0.01 }, 8.95);
          Cm.sticker(tl, q(".reply"), 8.85, { rot: 0, dur: 0.3 });
          Cm.sticker(tl, q(".who"), 8.85, { rot: 0, dur: 0.3 });
          replyRows.forEach((r, i) => Cm.ink(tl, r, 9.0 + i * 0.1, 0.2));
          tl.to(replyRows, { opacity: 1, duration: 0.01 }, 8.95);

          // "Same format, every time.": page turn to the showdown
          tl.to([full, q(".run"), q(".reply"), q(".who")], { x: -1200, skewX: 8, duration: 0.26, ease: "power3.in", stagger: 0.02 }, 10.3);
          tl.fromTo(q(".pay"), { opacity: 0, scale: 1.3, rotation: -4 }, { opacity: 1, scale: 1, rotation: -2, duration: 0.22, ease: "power4.in" }, 10.45);
          [".m1", ".m2", ".m3"].forEach((s, i) => Cm.slam(tl, q(s), 10.75 + i * 0.25, { rot: [-2, 1, -1][i], dur: 0.2, from: 1.3 }));
          // "Just keep the description specific": the vague one, then the specific one
          Cm.slam(tl, weak, 11.86, { tilt: -5, dur: 0.24 });
          tl.fromTo(q(".weak .stamp"), { opacity: 0, scale: 2.6, rotation: -30 }, { opacity: 1, scale: 1, rotation: -9, duration: 0.2, ease: "power3.in" }, 12.42);
          Cm.shake(tl, weak, 12.62, 8);
          Cm.slam(tl, good, 12.76, { tilt: 5, dur: 0.24 });
          Cm.sticker(tl, q(".vs"), 13.0, { rot: -8, dur: 0.3 });
          Cm.sticker(tl, q(".spec"), 13.3, { rot: 5 });
          tl.fromTo(q(".good .rays i"), { rotation: 0 }, { rotation: 30, duration: 4.4, ease: "none" }, 13.0);
          Cm.mark(tl, q(".good .cm-mark"), 13.45, 0.6);
          Cm.punch(tl, good, 13.3, 1.03);
          // "or Claude won't know when to use it": the weak panel cracks and greys out
          all(".crack path").forEach((p, i) => Cm.draw(tl, p, 14.1 + i * 0.12, 0.22));
          Cm.shake(tl, weak, 14.1, 12);
          tl.to(q(".weak .shade"), { opacity: 1, duration: 0.4, ease: "none" }, 14.3);
          Cm.sticker(tl, q(".huh"), 14.3, { rot: -10 });
          tl.to(weak, { rotation: -2.5, y: 8, duration: 0.5, ease: "bounce.out" }, 14.6);

          // hard stop: the last frame holds, no exit
          window.__timelines["s05-ask"] = tl;
        })();
