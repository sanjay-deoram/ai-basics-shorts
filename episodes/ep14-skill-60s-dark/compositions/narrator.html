<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <script type="application/json" class="sfx-cues">[
      {"t":10.55,"sfx":"riser","vol":0.07},
      {"t":39.5,"sfx":"click","vol":0.08}
    ]</script>
  </head>
  <body>
    <template>
      <!-- BLOCK · Narrator. The stippled Sanjay avatar for the whole episode, on its own overlay track
           (Egg.mountAvatar / Egg.avatarTalk in assets/eggshell.js: one mouth beat per syllable from
           assets/lipsync.js, smile expressions). Dark variant: he sits in a round tile (light backing disc, thin
           ring, faint accent glow) like a presenter picture-in-picture, always facing the content on his left.
           PLACES give the disc's centre and diameter: title (large, lower right of the hook; s01 keeps x > 560 free
           between y 1030 and 1450), corner (small, top right; content above y 485 stays left of x 830).
           He is out for s05, where the workspace fills the frame. Edit PLACES / PATH / EXPR to restage. -->
      <style>
        #root { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
        .nar .peek { position: absolute; left: 0; top: 0; width: 480px; height: 480px; }
        .nar .halo { position: absolute; inset: -90px; border-radius: 50%; background: radial-gradient(circle, rgba(124, 140, 255, 0.34) 42%, rgba(124, 140, 255, 0) 70%); }
        .nar .disc { position: absolute; inset: 0; border-radius: 50%; overflow: hidden; background: radial-gradient(circle at 50% 38%, #ffffff 0%, #eceef4 60%, #d3d7e3 100%); }
        .nar .bob { position: absolute; left: -30px; top: -70px; width: 540px; height: 629px; }
        .nar .who { position: absolute; inset: 0; }
        .nar .ring { position: absolute; inset: 0; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.5); box-shadow: 0 0 0 8px rgba(124, 140, 255, 0.14), inset 0 -30px 50px rgba(8, 9, 10, 0.16); }
      </style>
      <div id="root" data-composition-id="narrator" data-width="1080" data-height="1920">
        <div class="nar" data-layout-allow-overflow="">
          <div class="peek" data-layout-allow-overflow="">
            <div class="halo" data-layout-allow-overflow=""></div>
            <div class="disc"><div class="bob"><div class="who"></div></div></div>
            <div class="ring"></div>
          </div>
        </div>
      </div>
      <script>
        (() => {
          const LEN = 57.15, D = 480;   // = the episode length (narrator host data-duration); the tile's own size
          // centre of the disc and its diameter
          const PLACES = {
            title: { cx: 760, cy: 1240, d: 384 },
            corner: { cx: 925, cy: 330, d: 180 },
          };
          // [episode time, place, how]  how: in (fade + settle) | glide (move there) | out (fade away)
          const PATH = [
            [0.0, "title", "in"],       // s01: lower right of the hook
            [10.55, "corner", "glide"], // s02–s04: top right
            [39.5, "corner", "out"],    // s05: the workspace fills the frame
          ];
          // [expression, from, to] in episode seconds
          const EXPR = [
            ["smile", 0.1, 1.6],         // "Here's how to create a Claude skill"
            ["smile", 7.25, 8.25],       // "when your request needs it"
          ];

          const root = document.querySelector('[data-composition-id="narrator"] .nar');
          const peek = root.querySelector(".peek"), bob = root.querySelector(".bob");
          const av = Egg.mountAvatar(root.querySelector(".who"));
          const tl = gsap.timeline({ paused: true });

          const at = (p) => ({ x: p.cx - p.d / 2, y: p.cy - p.d / 2, scale: p.d / D });
          gsap.set(peek, { ...at(PLACES.title), transformOrigin: "0 0", opacity: 0 });
          PATH.forEach(([t, place, how]) => {
            const p = at(PLACES[place]);
            if (how === "in") {
              tl.fromTo(peek, { ...p, opacity: 0, y: p.y + 40 }, { opacity: 1, y: p.y, duration: 0.6, ease: "expo.out" }, t);
            } else if (how === "out") {
              tl.to(peek, { opacity: 0, scale: p.scale * 0.85, duration: 0.3, ease: "power2.in" }, t);
            } else {
              tl.to(peek, { ...p, duration: 0.9, ease: "expo.inOut" }, t);
            }
          });
          tl.fromTo(bob, { y: 0 }, { y: -5, duration: 1.4, ease: "sine.inOut", yoyo: true, repeat: Math.max(0, Math.floor(LEN / 1.4) - 1) }, 0);
          Egg.avatarTalk(tl, av, 0, 0, LEN, { expr: EXPR });

          window.__timelines["narrator"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
