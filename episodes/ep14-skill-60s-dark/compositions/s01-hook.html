<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <!-- Sound cues (seconds from scene start). Run node tools/build-sfx.mjs after editing. -->
    <script type="application/json" class="sfx-cues">[
      {"t":0.0,"sfx":"sub","vol":0.34},
      {"t":2.55,"sfx":"sub","vol":0.16},
      {"t":2.9,"sfx":"riser","vol":0.1},
      {"t":3.7,"sfx":"sub","vol":0.24},
      {"t":4.25,"sfx":"keys","vol":0.14,"dur":1.75},
      {"t":5.45,"sfx":"click","vol":0.16},
      {"t":7.1,"sfx":"click","vol":0.18},
      {"t":7.5,"sfx":"scan","vol":0.12},
      {"t":7.95,"sfx":"confirm","vol":0.2},
      {"t":8.85,"sfx":"tick","vol":0.22},
      {"t":9.2,"sfx":"tick","vol":0.22},
      {"t":9.55,"sfx":"tick","vol":0.22}
    ]</script>
  </head>
  <body>
    <template>
      <!-- s01 · Cold open (nothing waits): frame 0 already reads "Create a Claude skill" over a huge glowing "60"
           (in under … seconds). On "sixty" the 60 pulses, then pulls back into the "Under 60 seconds" chip.
           "A skill is a set of instructions": an editor panel for SKILL.md slides in on a tilted plane and its
           template types in with a block caret; the Claude logo lands in its title bar on "Claude". "When your
           request needs it": a request arrives below, a thin beam runs from it up to the panel, the panel takes the
           accent ring and a "Matched" chip. "Step by step": three numbered rows.
           The avatar tile sits lower right (narrator.html "title"): x > 560 stays free between y 1030 and 1450.
           Voiceover: 0.05 "Here's how to create a Claude skill, in under sixty seconds." 3.55 "A skill is a set of
           instructions Claude picks up on its own, when your request needs it." 8.7 "Let's build one, step by step." -->
      <style>
        #root { position: absolute; inset: 0; }
        .s01 .hook { top: 232px; font-size: 124px; line-height: 1; }
        .s01 .g1 { left: -170px; top: 240px; }
        .s01 .big { position: absolute; left: 90px; top: 500px; width: 860px; height: 560px; transform-origin: 0 20%; }
        .s01 .big .u { position: absolute; left: 4px; top: 16px; font: 400 30px/1 var(--mono); letter-spacing: 0.14em; color: var(--mut); }
        .s01 .big .n { position: absolute; left: -22px; top: 26px; font: 600 470px/1 var(--sans); letter-spacing: -0.06em; background-image: linear-gradient(180deg, #ffffff 20%, #b9c1ff 62%, #7c8cff 88%); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; transform-origin: 30% 55%; padding-right: 30px; }
        .s01 .big .sec { position: absolute; left: 0; top: 452px; font: 500 96px/1 var(--sans); letter-spacing: -0.03em; }
        .s01 .c60 { position: absolute; left: 90px; top: 500px; }
        .s01 .c60 i { width: 8px; height: 8px; border-radius: 50%; background: var(--ac2); }
        .s01 .ed { top: 584px; height: 388px; }
        .s01 .ed .dk-claude { margin-left: 12px; }
        .s01 .ed .st { margin-left: auto; height: 42px; }
        .s01 .ed .md { padding: 26px 30px; }
        .s01 .ed .ln { display: flex; height: 54px; align-items: center; font: 400 30px/1 var(--mono); }
        .s01 .ed .no { width: 52px; color: var(--dim); }
        .s01 .ed .k { color: var(--ac2); }
        .s01 .ed .p { color: var(--dim); }
        .s01 .req { position: absolute; left: 90px; top: 1166px; width: 440px; height: 148px; padding: 22px 26px; border-radius: 22px; background: linear-gradient(180deg, #15161a, #101114); border: 1px solid var(--line); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.09), 0 30px 60px rgba(0, 0, 0, 0.6); }
        .s01 .req .cap { font: 400 28px/1 var(--mono); letter-spacing: 0.12em; color: var(--mut); }
        .s01 .req .q { margin-top: 22px; font: 500 34px/1.2 var(--body); color: var(--tx); white-space: nowrap; }
        .s01 .beam { position: absolute; left: 189px; top: 972px; width: 2px; height: 194px; background: linear-gradient(180deg, #b9c1ff, rgba(124, 140, 255, 0.35)); box-shadow: 0 0 14px rgba(124, 140, 255, 0.8); transform-origin: 50% 100%; }
        .s01 .spark { position: absolute; left: 183px; top: 1158px; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 0 18px 6px rgba(124, 140, 255, 0.9); }
        .s01 .step { position: absolute; left: 90px; width: 860px; height: 112px; display: flex; align-items: center; gap: 34px; padding: 0 34px; border-radius: 22px; background: linear-gradient(180deg, #15161a, #101114); border: 1px solid var(--line); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.09), 0 24px 50px rgba(0, 0, 0, 0.5); }
        .s01 .step .no { font: 400 30px/1 var(--mono); color: var(--ac); }
        .s01 .step .nm { font: 600 54px/1 var(--sans); letter-spacing: -0.025em; }
        .s01 .step .ds { margin-left: auto; font: 400 28px/1 var(--mono); color: var(--mut); }
      </style>
      <div id="root" data-composition-id="s01-hook" data-width="1080" data-height="1920">
        <div class="dk s01">
          <div class="stage">
            <div class="dk-glow g1" data-layout-allow-overflow=""></div>
            <h1 class="dk-h hook"><span class="l">Create a</span><span class="l">Claude <span class="dk-sheen">skill</span></span></h1>
            <div class="big" data-layout-allow-overflow=""><span class="u">IN UNDER</span><span class="n">60</span><span class="sec dk-sheen">seconds</span></div>
            <span class="dk-chip c60"><i></i>Under 60 seconds</span>

            <div class="dk-panel ed">
              <div class="dk-bar"><i></i><i></i><i></i><div class="dk-claude"></div><span class="nm">SKILL.md</span><span class="dk-chip st">✓ Matched</span></div>
              <div class="md">
                <div class="ln"><span class="no">1</span><span class="dk-type"><span class="p">---</span></span></div>
                <div class="ln"><span class="no">2</span><span class="dk-type"><span class="k">name</span><span class="p">:</span> pr-description</span></div>
                <div class="ln"><span class="no">3</span><span class="dk-type"><span class="k">description</span><span class="p">:</span> Use when…</span></div>
                <div class="ln"><span class="no">4</span><span class="dk-type"><span class="p">---</span></span></div>
                <div class="ln"><span class="no">5</span><span class="dk-type">1. Run git diff…</span></div>
              </div>
              <div class="dk-ring"></div>
            </div>
            <div class="beam"></div>
            <div class="spark"></div>
            <div class="req"><p class="cap">YOUR REQUEST</p><p class="q">Write a PR description</p></div>

            <div class="step" style="top:584px"><span class="no">01</span><span class="nm">Folder</span><span class="ds">name it</span></div>
            <div class="step" style="top:722px"><span class="no">02</span><span class="nm">SKILL.md</span><span class="ds">write it</span></div>
            <div class="step" style="top:860px"><span class="no">03</span><span class="nm">Ask</span><span class="ds">use it</span></div>
          </div>
        </div>
      </div>
      <script>
        (() => {
          const DUR = 10.9;
          const root = document.querySelector('[data-composition-id="s01-hook"] .s01');
          const q = (s) => root.querySelector(s);
          const all = (s) => [...root.querySelectorAll(s)];
          const ed = q(".ed"), logo = q(".ed .dk-claude"), big = q(".big"), g1 = q(".g1");
          gsap.set([q(".c60"), ed, q(".dk-ring"), q(".st"), q(".beam"), q(".spark"), q(".req"), logo, ...all(".step"), ...all(".ed .no")], { opacity: 0 });

          const tl = gsap.timeline({ paused: true });
          Dk.camera(tl, q(".stage"), DUR, { in: false });
          // frame 0: the title is already there; the 60 settles in with a soft hit
          tl.fromTo(big, { scale: 1.07 }, { scale: 1, duration: 1.1, ease: Dk.OUT }, 0);
          tl.fromTo(g1, { scale: 0.8, opacity: 0.5 }, { scale: 1, opacity: 1, duration: 1.4, ease: Dk.OUT }, 0);
          // "create a Claude skill"
          Dk.sheen(tl, q(".hook .dk-sheen"), 1.2);
          // "in under sixty seconds": the 60 pulses, then pulls back into the chip
          tl.to(q(".big .n"), { scale: 1.045, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 1 }, 2.5);
          tl.to(g1, { scale: 1.25, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 1 }, 2.5);
          Dk.sheen(tl, q(".big .sec"), 2.75, 0.6);
          tl.to(big, { scale: 0.3, opacity: 0, duration: 0.45, ease: "power3.in" }, 3.25);
          tl.to(g1, { x: 120, y: 60, scale: 0.9, opacity: 0.75, duration: 1.2, ease: "power2.inOut" }, 3.3);
          Dk.rise(tl, q(".c60"), 3.6, { y: 12, dur: 0.5 });
          // "A skill is a set of instructions": the editor slides in and its template types itself
          Dk.panelIn(tl, ed, 3.65);
          all(".ed .ln").reduce((t, ln) => {
            tl.set(ln.querySelector(".no"), { opacity: 1 }, t);
            return Dk.type(tl, ln.querySelector(".dk-type"), t, { cps: 48, hold: 0.06 }) + 0.06;
          }, 4.25);
          // "Claude": the logo lands in the title bar
          tl.fromTo(logo, { opacity: 0, scale: 0.4, rotation: -120 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.8, ease: Dk.OUT }, 5.45);
          // "when your request needs it": a request arrives, a beam runs up to the panel, the panel answers
          Dk.rise(tl, q(".req"), 7.05, { y: 30 });
          tl.fromTo(q(".beam"), { scaleY: 0, opacity: 1 }, { scaleY: 1, duration: 0.4, ease: "power2.inOut" }, 7.55);
          tl.set(q(".spark"), { opacity: 1 }, 7.55);
          tl.fromTo(q(".spark"), { y: 0 }, { y: -190, duration: 0.4, ease: "power2.inOut" }, 7.55);
          tl.to(q(".spark"), { opacity: 0, scale: 2.4, duration: 0.3, ease: "power2.out" }, 7.95);
          tl.to(q(".dk-ring"), { opacity: 1, duration: 0.45, ease: "power2.out" }, 7.95);
          Dk.rise(tl, q(".st"), 7.95, { y: 6, dur: 0.4 });
          tl.to(logo, { rotation: 180, duration: 0.9, ease: "power2.inOut" }, 7.95);
          // "Let's build one, step by step": the three steps
          tl.to([ed, q(".req"), q(".beam")], { opacity: 0, y: -18, duration: 0.3, ease: "power2.in" }, 8.5);
          all(".step").forEach((s, i) => tl.fromTo(s, { opacity: 0, x: -36 }, { opacity: 1, x: 0, duration: 0.7, ease: Dk.OUT }, 8.85 + i * 0.35));

          window.__timelines["s01-hook"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
