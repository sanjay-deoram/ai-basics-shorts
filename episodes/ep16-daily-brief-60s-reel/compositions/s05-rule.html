<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <script type="application/json" class="sfx-cues">[
      {"t":0.3,"sfx":"pop","vol":0.2},
      {"t":1.42,"sfx":"tick","vol":0.16},
      {"t":1.5,"sfx":"thud","vol":0.2},
      {"t":1.85,"sfx":"thud","vol":0.18},
      {"t":2.2,"sfx":"thud","vol":0.18},
      {"t":2.55,"sfx":"thud","vol":0.2},
      {"t":3.87,"sfx":"success","vol":0.2},
      {"t":4.28,"sfx":"whip","vol":0.32}
    ]</script>
  </head>
  <body>
    <template>
      <!-- s05 · The key rule, in plain English. Pink: step 4 of agent.md as a dark quote, then "Only if it needs you
           today." word by word while four of Tuesday's items are sorted as they land: an outage and a waiting review are
           stamped IN, a lunch note and a count of open PRs (agent.md's own example: a count is not an item) are stamped
           SKIP. On "today" the two IN items light up and the skips fade. Whip out. Badge bottom-left (narrator). -->
      <style>
        #s05-root .bg { background-color: #ffdbe4; }
        #s05-root .rl-hd { --acc: #e11d48; }
        #s05-root .quote { position: absolute; left: 90px; top: 528px; width: 860px; padding: 18px 28px; border-radius: 22px; background: var(--term); font: 400 26px/38px var(--f-mono); color: var(--term-text); white-space: pre; }
        #s05-root .quote b { font-weight: 400; color: #8fb8ff; }
        #s05-root .ch { position: absolute; left: 90px; width: 860px; height: 84px; padding: 0 30px; border-radius: 22px; background: #fff; border: 3px solid #fff; display: flex; align-items: center;
          font: 500 36px/1 var(--f-display); letter-spacing: -0.02em; color: #0d0d0c; white-space: nowrap; box-shadow: 0 16px 30px -18px rgba(0, 0, 0, 0.3); }
        #s05-root .ch .n { margin-left: 16px; font: 400 24px/1 var(--f-mono); color: #5f5b55; }
        #s05-root .ch .rstamp { right: 22px; top: 14px; font-size: 28px; padding: 4px 16px; border-width: 5px; background: #fff; }
        #s05-root .ch.in .rstamp { color: #12a150; }
        #s05-root .ch.out .rstamp { color: #e11d48; }
      </style>
      <div id="s05-root" data-composition-id="s05-rule" data-width="1080" data-height="1920">
        <div class="rl">
          <div class="rl-cam">
            <div class="rl-bg grid bg"></div>
            <div class="rl-eye">// the key rule</div>
            <div class="rl-hd">
              <span class="ln"><span class="w">Only </span><span class="w">if </span><span class="w">it </span><span class="w">needs</span></span>
              <span class="ln"><span class="w">you </span><em class="w">today.</em></span>
            </div>
            <div class="quote"><b>4.</b> Decide. An item earns a line when
   the reader would act on it today.</div>
            <div class="ch in" style="top:690px">Acme can't log in<div class="rstamp" data-layout-allow-overlap="">In</div></div>
            <div class="ch out" style="top:788px">Lunch order is in<div class="rstamp" data-layout-allow-overlap="">Skip</div></div>
            <div class="ch out" style="top:886px">12 pull requests open<span class="n">// just a count</span><div class="rstamp" data-layout-allow-overlap="">Skip</div></div>
            <div class="ch in" style="top:984px">PR #482 needs your review<div class="rstamp" data-layout-allow-overlap="">In</div></div>
          </div>
        </div>
      </div>
      <script>
        (() => {
          const root = document.getElementById("s05-root");
          const cam = root.querySelector(".rl-cam");
          const q = (s) => root.querySelector(s);
          const all = (s) => [...root.querySelectorAll(s)];
          const tl = gsap.timeline({ paused: true });
          const blur = Reel.blurFor(cam, "s05-mb");
          Reel.whip(tl, cam, blur, 0, "in");

          // "The key rule"
          tl.fromTo(q(".rl-eye"), { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0.2);
          tl.fromTo(q(".quote"), { opacity: 0, y: 30, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.35, ease: "power3.out" }, 0.3);
          // "only put something in the brief": Tuesday's items, each stamped as it lands
          all(".ch").forEach((c, i) => {
            const t = 1.45 + i * 0.35;
            tl.fromTo(c, { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.25, ease: "power3.out" }, t);
            Egg.stamp(tl, c.querySelector(".rstamp"), t + 0.08);
          });
          // "if you need to act on it today"
          Reel.words(tl, q(".rl-hd"), [1.42, 2.95, 3.05, 3.15, 3.3, 3.87]);
          tl.to(all(".ch.in"), { borderColor: "#12a150", scale: 1.03, duration: 0.2, ease: "power2.out" }, 3.87);
          tl.to(all(".ch.out"), { opacity: 0.4, duration: 0.3, ease: "none" }, 3.95);
          Reel.whip(tl, cam, blur, 4.3, "out");

          window.__timelines["s05-rule"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
