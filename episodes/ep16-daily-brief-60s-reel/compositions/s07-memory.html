<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <script type="application/json" class="sfx-cues">[
      {"t":0.41,"sfx":"tick","vol":0.16},
      {"t":0.75,"sfx":"tick","vol":0.16},
      {"t":1.22,"sfx":"pop","vol":0.24},
      {"t":2.12,"sfx":"pop","vol":0.22},
      {"t":2.27,"sfx":"pop","vol":0.2},
      {"t":3.0,"sfx":"pop","vol":0.2},
      {"t":4.06,"sfx":"tick","vol":0.18},
      {"t":4.2,"sfx":"typing","vol":0.16,"dur":0.4},
      {"t":5.75,"sfx":"click","vol":0.32},
      {"t":5.9,"sfx":"thud","vol":0.34},
      {"t":6.67,"sfx":"tick","vol":0.18},
      {"t":6.8,"sfx":"typing","vol":0.16,"dur":0.5},
      {"t":8.47,"sfx":"pop","vol":0.22},
      {"t":9.53,"sfx":"whip","vol":0.32}
    ]</script>
  </head>
  <body>
    <template>
      <!-- s07 · Step 3 · Memory, as two folders of files (the quickstart's two memory stores, kept between runs and
           opened at /mnt/memory/ by every run). Mint: "Step three: memory." On "two folders" the preferences/ and
           state/ folders pop; "kept between runs" chip. "Your preferences": preferences.md (what to read, how long, who
           to mention), "which it can read but never change": the lock closes, READ-ONLY stamp. "And its own notes":
           bookmarks.json, ledger.md, runs/; "like a bookmark for each source": bookmarks.json lights. Whip out.
           Badge bottom-left (narrator). -->
      <style>
        #s07-root .bg { background-color: #d7f5e3; }
        #s07-root .rl-hd { --acc: #12a150; }
        #s07-root .kp { left: 90px; top: 512px; background: #ffd84d; border-color: #ffd84d; }
        #s07-root .fc { position: absolute; top: 608px; width: 415px; height: 520px; padding: 26px 28px; border-radius: 28px; background: #fff; box-shadow: 0 20px 40px -18px rgba(0, 0, 0, 0.25); }
        #s07-root .fc .h { display: flex; align-items: center; gap: 16px; height: 52px; font: 400 34px/1 var(--f-mono); color: #0d0d0c; white-space: nowrap; }
        #s07-root .fc .sub { margin: 8px 0 18px; font: 400 24px/30px var(--f-mono); color: #5f5b55; white-space: nowrap; }
        #s07-root .fold { position: relative; width: 58px; height: 44px; border-radius: 8px; background: #12a150; }
        #s07-root .fold::before { content: ""; position: absolute; left: 0; top: -8px; width: 24px; height: 12px; border-radius: 5px 5px 0 0; background: inherit; }
        #s07-root .fold.d { background: #0d0d0c; }
        #s07-root .file { display: flex; align-items: center; gap: 14px; height: 44px; padding: 0 10px; margin: 0 -10px; border-radius: 10px; font: 400 28px/1 var(--f-mono); color: #0d0d0c; white-space: nowrap; }
        #s07-root .file i { flex: none; width: 24px; height: 30px; border-radius: 4px; background: #c9c5be; clip-path: polygon(0 0, 68% 0, 100% 28%, 100% 100%, 0 100%); }
        #s07-root .pv { margin-top: 10px; padding: 12px 18px; border-radius: 16px; background: var(--term); font: 400 26px/38px var(--f-mono); color: var(--term-text); white-space: pre; }
        #s07-root .pv b { font-weight: 400; color: #f08a63; }
        #s07-root .d { margin: 0 0 14px 38px; font: 400 24px/30px var(--f-mono); color: #5f5b55; white-space: nowrap; }
        #s07-root .lock { position: relative; width: 30px; height: 36px; }
        #s07-root .lock .sh { position: absolute; left: 5px; top: 0; width: 20px; height: 20px; border: 5px solid #0d0d0c; border-bottom: 0; border-radius: 10px 10px 0 0; }
        #s07-root .lock .bd { position: absolute; left: 0; top: 16px; width: 30px; height: 20px; border-radius: 5px; background: #0d0d0c; }
        #s07-root .fc .rstamp { left: 28px; bottom: 26px; font-size: 28px; padding: 4px 16px; border-width: 5px; background: #fff; color: #e11d48; }
        #s07-root .mnt { position: absolute; left: 90px; top: 1160px; font: 400 26px/32px var(--f-mono); color: #2f6b47; white-space: nowrap; }
      </style>
      <div id="s07-root" data-composition-id="s07-memory" data-width="1080" data-height="1920">
        <div class="rl">
          <div class="rl-cam">
            <div class="rl-bg grid bg"></div>
            <div class="rl-eye">// step three</div>
            <div class="rl-hd">
              <span class="ln"><span class="w">Step </span><span class="w">three:</span></span>
              <span class="ln"><em class="w">memory.</em></span>
            </div>
            <div class="chip kp">two folders · kept between runs</div>
            <div class="fc pref" style="left:90px">
              <div class="h"><div class="fold"></div>preferences/</div>
              <div class="sub">// you write it</div>
              <div class="in">
                <div class="file"><i></i>preferences.md</div>
                <div class="pv"><b>read:</b> #support
<b>length:</b> 8 lines
<b>mention:</b> no one</div>
              </div>
              <div class="rstamp" data-layout-allow-overlap=""><span class="lock" style="display:inline-block;vertical-align:-4px;margin-right:10px"><span class="sh"></span><span class="bd"></span></span>Read-only</div>
            </div>
            <div class="fc state" style="left:535px">
              <div class="h"><div class="fold d"></div>state/</div>
              <div class="sub">// the agent's notes</div>
              <div class="rw"><div class="file bm"><i></i>bookmarks.json</div><div class="d">where it stopped</div></div>
              <div class="rw"><div class="file"><i></i>ledger.md</div><div class="d">what it told you</div></div>
              <div class="rw"><div class="file"><i></i>runs/</div><div class="d">a log per run</div></div>
            </div>
            <div class="mnt">// every run opens both at /mnt/memory/</div>
          </div>
        </div>
      </div>
      <script>
        (() => {
          const root = document.getElementById("s07-root");
          const cam = root.querySelector(".rl-cam");
          const q = (s) => root.querySelector(s);
          const all = (s) => [...root.querySelectorAll(s)];
          const tl = gsap.timeline({ paused: true });
          const blur = Reel.blurFor(cam, "s07-mb");
          Reel.whip(tl, cam, blur, 0, "in");
          const pop = (el, at) => tl.fromTo(el, { opacity: 0, scale: 0.7, y: 30 }, { opacity: 1, scale: 1, y: 0, duration: 0.4, ease: "back.out(1.8)" }, at);

          tl.fromTo(q(".rl-eye"), { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0.2);
          // "Step three: memory"
          Reel.words(tl, q(".rl-hd"), [0.41, 0.75, 1.22]);
          // "two folders kept between runs"
          pop(q(".pref"), 2.12); pop(q(".state"), 2.27);
          pop(q(".kp"), 3.0);
          tl.fromTo(q(".mnt"), { opacity: 0 }, { opacity: 1, duration: 0.3 }, 3.4);
          // "Your preferences"
          tl.to(q(".pref"), { scale: 1.04, duration: 0.15, yoyo: true, repeat: 1, ease: "power2.out" }, 4.06);
          tl.fromTo(q(".pref .in"), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 4.15);
          // "which it can read but never change": the lock closes, READ-ONLY
          Egg.stamp(tl, q(".pref .rstamp"), 5.9, q(".pref"));
          tl.fromTo(q(".pref .rstamp .sh"), { y: -7 }, { y: 0, duration: 0.15, ease: "power3.in" }, 5.75);
          // "And its own notes"
          tl.to(q(".state"), { scale: 1.04, duration: 0.15, yoyo: true, repeat: 1, ease: "power2.out" }, 6.67);
          Reel.rows(tl, all(".state .rw"), [6.8, 7.05, 7.3]);
          // "like a bookmark for each source"
          tl.to(q(".file.bm"), { backgroundColor: "#12a150", color: "#ffffff", duration: 0.2 }, 8.47);
          tl.to(q(".file.bm"), { scale: 1.06, duration: 0.15, yoyo: true, repeat: 1, ease: "power2.out", transformOrigin: "0% 50%" }, 8.47);
          Reel.whip(tl, cam, blur, 9.55, "out");

          window.__timelines["s07-memory"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
