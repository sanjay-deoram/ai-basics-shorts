<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <script type="application/json" class="sfx-cues">[
      {"t":0.35,"sfx":"tick","vol":0.16},
      {"t":0.7,"sfx":"tick","vol":0.16},
      {"t":1.45,"sfx":"pop","vol":0.24},
      {"t":1.57,"sfx":"pop","vol":0.2},
      {"t":2.6,"sfx":"tick","vol":0.16},
      {"t":3.9,"sfx":"click","vol":0.34},
      {"t":4.0,"sfx":"thud","vol":0.34},
      {"t":4.7,"sfx":"tick","vol":0.16},
      {"t":5.05,"sfx":"pop","vol":0.2},
      {"t":5.15,"sfx":"typing","vol":0.18,"dur":0.4},
      {"t":5.7,"sfx":"pen","vol":0.22},
      {"t":6.0,"sfx":"pop","vol":0.2},
      {"t":6.45,"sfx":"zoom","vol":0.2},
      {"t":6.95,"sfx":"thud","vol":0.36},
      {"t":7.0,"sfx":"success","vol":0.18},
      {"t":7.38,"sfx":"whip","vol":0.32}
    ]</script>
  </head>
  <body>
    <template>
      <!-- s07 · Step 3 · Memory. Mint: "Step three: memory." Two store cards (the quickstart's two memory stores):
           "preferences" (yours) and "state" (the agent's). "Which it can't edit": the lock closes, READ-ONLY stamp.
           "And bookmarks": bookmarks.json opens, one timestamp per source. "So a late run misses nothing": a timeline
           from Monday's bookmark to a late Tuesday run, the read span starts at the bookmark, NOTHING MISSED stamp.
           Whip out. Badge bottom-left (narrator); the timeline stays above y 1310. -->
      <style>
        #s07-root .bg { background-color: #d7f5e3; }
        #s07-root .rl-hd { --acc: #12a150; }
        #s07-root .fc { position: absolute; top: 530px; width: 415px; height: 232px; padding: 22px 26px; border-radius: 26px; background: #fff; box-shadow: 0 20px 40px -18px rgba(0, 0, 0, 0.25); }
        #s07-root .fc .h { display: flex; align-items: center; gap: 14px; height: 48px; font: 600 38px/1 var(--f-display); letter-spacing: -0.03em; color: #0d0d0c; }
        #s07-root .fc .sub { margin: 4px 0 10px; font: 400 22px/28px var(--f-mono); color: #5f5b55; }
        #s07-root .fc .r { height: 40px; padding: 0 8px; margin: 0 -8px; border-radius: 8px; font: 400 26px/40px var(--f-mono); color: #0d0d0c; white-space: nowrap; }
        #s07-root .lock { position: relative; width: 34px; height: 40px; }
        #s07-root .lock .sh { position: absolute; left: 6px; top: 0; width: 22px; height: 22px; border: 5px solid #0d0d0c; border-bottom: 0; border-radius: 11px 11px 0 0; }
        #s07-root .lock .bd { position: absolute; left: 0; top: 17px; width: 34px; height: 23px; border-radius: 6px; background: #0d0d0c; }
        #s07-root .fold { width: 40px; height: 32px; border-radius: 6px; background: #12a150; }
        #s07-root .fc .rstamp { right: 18px; top: -24px; font-size: 28px; padding: 6px 16px; border-width: 5px; background: #fff; color: #e11d48; }
        #s07-root .term { top: 792px; height: 282px; }
        #s07-root .t-k { color: #f08a63; }
        #s07-root .t-s { color: #9be3b4; }
        #s07-root .t-p { color: var(--term-dim); }
        #s07-root .axis { fill: none; stroke: #0d0d0c; stroke-width: 5; stroke-linecap: round; }
        #s07-root .span { position: absolute; left: 150px; top: 1232px; width: 710px; height: 16px; border-radius: 8px; background: #12a150; transform-origin: 0 50%; }
        #s07-root .flag { position: absolute; left: 148px; top: 1150px; width: 5px; height: 90px; background: #0d0d0c; }
        #s07-root .flag::after { content: ""; position: absolute; left: 5px; top: 0; width: 38px; height: 26px; background: #12a150; clip-path: polygon(0 0, 100% 50%, 0 100%); }
        #s07-root .dot { position: absolute; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%; background: #fff; border: 6px solid #0d0d0c; }
        #s07-root .tl { position: absolute; top: 1150px; font: 400 24px/30px var(--f-mono); color: #0d0d0c; white-space: nowrap; }
        #s07-root .tl span { color: #5f5b55; }
        #s07-root .ok { left: 380px; top: 1262px; color: #12a150; background: #d7f5e3; font-size: 30px; padding: 4px 16px; }
      </style>
      <div id="s07-root" data-composition-id="s07-memory" data-width="1080" data-height="1920">
        <div class="rl">
          <div class="rl-cam">
            <div class="rl-bg grid bg"></div>
            <div class="rl-eye">// two memory stores</div>
            <div class="rl-hd">
              <span class="ln"><span class="w">Step </span><span class="w">three:</span></span>
              <span class="ln"><em class="w">memory.</em></span>
            </div>
            <div class="fc pref" style="left:90px">
              <div class="h"><div class="lock"><div class="sh"></div><div class="bd"></div></div>preferences</div>
              <div class="sub">// yours</div>
              <div class="r">read: #support</div>
              <div class="r">length: 8 lines</div>
              <div class="rstamp" data-layout-allow-overlap="">Read-only</div>
            </div>
            <div class="fc state" style="left:535px">
              <div class="h"><div class="fold"></div>state</div>
              <div class="sub">// the agent's</div>
              <div class="r bm">bookmarks.json</div>
              <div class="r">ledger.md · runs/</div>
            </div>
            <div class="term">
              <div class="tbar"><i></i><i></i><i></i><span>bookmarks.json</span></div>
              <div class="tb">
                <div class="r c1"><span class="t-p">{</span></div>
                <div class="r c2">  <span class="t-k">"slack"</span><span class="t-p">:</span>  <span class="t-s">"2026-11-16T12:33:40Z"</span>,</div>
                <div class="r c3">  <span class="t-k">"github"</span><span class="t-p">:</span> <span class="t-s">"2026-11-16T12:33:41Z"</span></div>
                <div class="r c4"><span class="t-p">}</span></div>
              </div>
            </div>
            <svg width="1080" height="1920" viewBox="0 0 1080 1920" style="position:absolute;left:0;top:0" aria-hidden="true"><path class="axis" d="M110 1240 H 930" /></svg>
            <div class="span"></div>
            <div class="flag"></div>
            <div class="dot d1" style="left:150px;top:1240px"></div>
            <div class="dot d2" style="left:860px;top:1240px"></div>
            <div class="tl t1" style="left:206px">bookmark <span>Mon 7:33</span></div>
            <div class="tl t2" style="left:600px">late run <span>Tue 9:10</span></div>
            <div class="rstamp ok" data-layout-allow-overlap="">Nothing missed</div>
          </div>
        </div>
      </div>
      <script>
        (() => {
          const root = document.getElementById("s07-root");
          const cam = root.querySelector(".rl-cam");
          const q = (s) => root.querySelector(s);
          const all = (s) => [...root.querySelectorAll(s)];
          const tl = gsap.timeline({ paused: true });
          const blur = Reel.blurFor(cam, "s07-mb");
          Reel.whip(tl, cam, blur, 0, "in");
          const axis = q(".axis");
          axis.setAttribute("pathLength", "1"); axis.style.strokeDasharray = "1 1.1";
          const pop = (el, at) => tl.fromTo(el, { opacity: 0, scale: 0.7, y: 30 }, { opacity: 1, scale: 1, y: 0, duration: 0.4, ease: "back.out(1.8)" }, at);

          tl.fromTo(q(".rl-eye"), { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0.2);
          // "Step three: memory"
          Reel.words(tl, q(".rl-hd"), [0.35, 0.7, 1.45]);
          pop(q(".pref"), 1.45); pop(q(".state"), 1.57);
          // "Your preferences"
          Reel.rows(tl, all(".pref .r"), [2.6, 2.8]);
          tl.to(q(".pref"), { scale: 1.04, duration: 0.15, yoyo: true, repeat: 1, ease: "power2.out" }, 2.47);
          // "which it can't edit": the lock closes, READ-ONLY
          tl.fromTo(q(".lock .sh"), { y: -9 }, { y: 0, duration: 0.15, ease: "power3.in" }, 3.75);
          Egg.stamp(tl, q(".pref .rstamp"), 4.0, q(".pref"));
          // "and bookmarks"
          Reel.rows(tl, all(".state .r"), [4.7, 4.85]);
          tl.to(q(".bm"), { backgroundColor: "#12a150", color: "#ffffff", duration: 0.2 }, 5.0);
          tl.fromTo(q(".term"), { opacity: 0, scale: 0.88, y: 30 }, { opacity: 1, scale: 1, y: 0, duration: 0.35, ease: "power3.out" }, 5.05);
          Reel.rows(tl, all(".term .r"), [5.15, 5.25, 5.38, 5.5]);
          // "so a late run misses nothing"
          tl.fromTo(axis, { strokeDashoffset: 1.02 }, { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, 5.7);
          tl.fromTo([q(".flag"), q(".d1"), q(".t1")], { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(2)" }, 5.8);
          pop(q(".d2"), 6.0);
          tl.fromTo(q(".t2"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(2)" }, 6.0);
          tl.fromTo(q(".span"), { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.inOut" }, 6.45);
          Egg.stamp(tl, q(".ok"), 6.95);
          Reel.whip(tl, cam, blur, 7.4, "out");

          window.__timelines["s07-memory"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
