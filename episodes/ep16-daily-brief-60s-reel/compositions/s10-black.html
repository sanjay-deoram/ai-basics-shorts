<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <script type="application/json" class="sfx-cues">[
      {"t":0.0,"sfx":"thud","vol":0.3},
      {"t":0.45,"sfx":"pop","vol":0.2},
      {"t":0.9,"sfx":"error","vol":0.2},
      {"t":1.3,"sfx":"pop","vol":0.2},
      {"t":1.76,"sfx":"typing","vol":0.2,"dur":0.6},
      {"t":2.25,"sfx":"thud","vol":0.34},
      {"t":3.0,"sfx":"pop","vol":0.18},
      {"t":4.05,"sfx":"thud","vol":0.3},
      {"t":4.1,"sfx":"error","vol":0.18},
      {"t":4.4,"sfx":"error","vol":0.12},
      {"t":4.82,"sfx":"thud","vol":0.5}
    ]</script>
  </head>
  <body>
    <template>
      <!-- s10 · Payoff, grouped with the run it comes from. Hard cut to black: this run's sources, slack read, github
           couldn't be read. "Can't read a source? It says so." The post types its last line, "github: couldn't be
           read.", stamped HONEST on "says so". "Instead of looking like a quiet day": the version without that
           line, "Nothing new today.", stamped QUIET DAY?, shakes and fades. On the music hit (4.82) the post punches;
           the frame holds to the hard stop. Avatar BIG under the cards. -->
      <style>
        #s10-root .bg { background: #0b0b0b; }
        #s10-root .rl-eye { color: #9b968e; }
        #s10-root .rl-hd { --acc: #f08a63; color: #fdfcfc; font-size: 84px; line-height: 90px; }
        #s10-root .src { top: 492px; height: 56px; font-size: 26px; }
        #s10-root .src .g { color: #12a150; }
        #s10-root .src .r { color: #e11d48; }
        #s10-root .post { top: 580px; }
        #s10-root .post .rstamp { right: 26px; bottom: 18px; font-size: 28px; padding: 4px 16px; border-width: 5px; color: #12a150; background: #fff; }
        #s10-root .weak { position: absolute; left: 90px; top: 1000px; width: 860px; padding: 20px 30px; border-radius: 26px; background: #1c1b19; border: 2px solid #3a3733; }
        #s10-root .weak .k { font: 400 26px/32px var(--f-mono); color: #a39e95; }
        #s10-root .weak .v { margin-top: 8px; font: 500 38px/46px var(--f-display); letter-spacing: -0.02em; color: #fdfcfc; }
        #s10-root .weak .rstamp { right: 26px; top: -26px; font-size: 30px; padding: 6px 18px; border-width: 5px; color: #ff5d5d; background: #1c1b19; }
      </style>
      <div id="s10-root" data-composition-id="s10-black" data-width="1080" data-height="1920">
        <div class="rl">
          <div class="rl-bg bg"></div>
          <div class="rl-eye">// when a source fails</div>
          <div class="rl-hd">
            <span class="ln"><span class="w">Can't </span><span class="w">read </span><span class="w">a </span><span class="w">source?</span></span>
            <span class="ln"><span class="w">It </span><em class="w">says so.</em></span>
          </div>
          <div class="chip src s1" style="left:90px">slack <span class="g">✓ read</span></div>
          <div class="chip src s2" style="left:330px">github <span class="r">✕ couldn't be read</span></div>
          <div class="rl-msg post">
            <div class="av"><svg viewBox="0 0 46 46" aria-hidden="true"><path d="M7 33 H39" stroke="#fff" stroke-width="3.6" stroke-linecap="round" /><path d="M14 31 A9 9 0 0 1 32 31 Z" fill="#fff" /><path d="M23 8 V14 M10 14.5 L14 18.5 M36 14.5 L32 18.5" stroke="#fff" stroke-width="3.6" stroke-linecap="round" /></svg></div>
            <div class="who">Daily brief <span class="app">APP</span> <span class="tm">7:34 AM</span></div>
            <div class="ttl">Daily brief, Tue Nov 17</div>
            <div class="it">Acme escalation: <span class="d">login errors since 6:10</span></div>
            <div class="it">Refund #1182 <span class="d">waits on your yes · day 2</span></div>
            <div class="it">Deploy freeze Friday: <span class="d">confirm by noon</span></div>
            <div class="foot"><b class="ft">github: couldn't be read.</b></div>
            <div class="rstamp" data-layout-allow-overlap="">Honest</div>
          </div>
          <div class="weak"><div class="k">// without that line</div><div class="v">Nothing new today.</div><div class="rstamp" data-layout-allow-overlap="">Quiet day?</div></div>
        </div>
      </div>
      <script>
        (() => {
          const root = document.getElementById("s10-root");
          const q = (s) => root.querySelector(s);
          const tl = gsap.timeline({ paused: true });
          const post = q(".post"), weak = q(".weak");
          gsap.set(q(".foot"), { opacity: 0 });

          tl.fromTo(q(".rl-eye"), { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0.1);
          tl.fromTo(post, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 0.1);
          // "If a source can't be read"
          tl.fromTo(q(".s1"), { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, 0.45);
          tl.fromTo(q(".s2"), { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, 0.9);
          Egg.shake(tl, q(".s2"), 1.2);
          Reel.words(tl, q(".rl-hd"), [0.45, 0.8, 1.0, 1.2, 1.76, 2.25]);
          // "the brief says so"
          tl.to(q(".foot"), { opacity: 1, duration: 0.05 }, 1.74);
          Egg.typeOn(tl, q(".ft"), 1.76, { cps: 60 });
          Egg.stamp(tl, q(".post .rstamp"), 2.3, post);
          // "instead of looking like a quiet day"
          tl.fromTo(weak, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 3.0);
          Egg.stamp(tl, q(".weak .rstamp"), 4.05);
          Egg.shake(tl, weak, 4.4);
          tl.to(weak, { opacity: 0.4, duration: 0.4, ease: "none" }, 4.6);
          // the music hit: the post punches, then the frame holds to the hard stop
          tl.to(post, { scale: 1.04, duration: 0.12, ease: "power2.out" }, 4.82);
          tl.to(post, { scale: 1, duration: 0.3, ease: "power2.out" }, 4.94);
          tl.to(q(".rl-hd em"), { scale: 1.08, duration: 0.12, yoyo: true, repeat: 1, ease: "power2.out" }, 4.82);
          tl.to({}, { duration: 6.22 }, 0);
          window.__timelines["s10-black"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
