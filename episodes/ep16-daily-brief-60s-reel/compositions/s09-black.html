<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <script type="application/json" class="sfx-cues">[
      {"t":0.0,"sfx":"thud","vol":0.3},
      {"t":0.29,"sfx":"tick","vol":0.16},
      {"t":0.85,"sfx":"tick","vol":0.16},
      {"t":1.2,"sfx":"pop","vol":0.24},
      {"t":1.6,"sfx":"pop","vol":0.2},
      {"t":2.6,"sfx":"typing","vol":0.2,"dur":0.6},
      {"t":3.81,"sfx":"thud","vol":0.34},
      {"t":4.6,"sfx":"pop","vol":0.18},
      {"t":4.85,"sfx":"thud","vol":0.3},
      {"t":4.9,"sfx":"error","vol":0.2},
      {"t":5.25,"sfx":"error","vol":0.14},
      {"t":6.05,"sfx":"thud","vol":0.5}
    ]</script>
  </head>
  <body>
    <template>
      <!-- s09 · Payoff. Hard cut to black: "No server to keep alive." word by word, and the post sits under it.
           "A source it can't read": its last line types "github: unreadable this run."; "says unreadable": an HONEST
           stamp. "Never a quiet day": the weak version, a silent "Nothing new today.", stamped QUIET DAY?, shakes and
           fades. On the music hit (6.05) the post punches; the frame holds to the hard stop. Avatar BIG under the cards. -->
      <style>
        #s09-root .bg { background: #0b0b0b; }
        #s09-root .rl-eye { color: #9b968e; }
        #s09-root .rl-hd { --acc: #f08a63; color: #fdfcfc; }
        #s09-root .post { top: 530px; }
        #s09-root .post .rstamp { right: 26px; bottom: 18px; font-size: 28px; padding: 4px 16px; border-width: 5px; color: #12a150; background: #fff; }
        #s09-root .weak { position: absolute; left: 90px; top: 960px; width: 860px; padding: 20px 30px; border-radius: 26px; background: #1c1b19; border: 2px solid #3a3733; }
        #s09-root .weak .k { font: 400 26px/32px var(--f-mono); color: #a39e95; }
        #s09-root .weak .v { margin-top: 8px; font: 500 38px/46px var(--f-display); letter-spacing: -0.02em; color: #fdfcfc; }
        #s09-root .weak .rstamp { right: 26px; top: -26px; font-size: 30px; padding: 6px 18px; border-width: 5px; color: #ff5d5d; background: #1c1b19; }
      </style>
      <div id="s09-root" data-composition-id="s09-black" data-width="1080" data-height="1920">
        <div class="rl">
          <div class="rl-bg bg"></div>
          <div class="rl-eye">// and when a source fails</div>
          <div class="rl-hd">
            <span class="ln"><span class="w">No </span><span class="w">server </span><span class="w">to</span></span>
            <span class="ln"><span class="w">keep </span><em class="w">alive.</em></span>
          </div>
          <div class="rl-msg post">
            <div class="av"><svg viewBox="0 0 46 46" aria-hidden="true"><path d="M7 33 H39" stroke="#fff" stroke-width="3.6" stroke-linecap="round" /><path d="M14 31 A9 9 0 0 1 32 31 Z" fill="#fff" /><path d="M23 8 V14 M10 14.5 L14 18.5 M36 14.5 L32 18.5" stroke="#fff" stroke-width="3.6" stroke-linecap="round" /></svg></div>
            <div class="who">Daily brief <span class="app">APP</span> <span class="tm">7:34 AM</span></div>
            <div class="ttl">Daily brief, Tue Nov 17</div>
            <div class="it">Acme escalation: <span class="d">login errors since 6:10</span></div>
            <div class="it">Refund #1182 <span class="d">waits on your yes · day 2</span></div>
            <div class="it">Deploy freeze Friday: <span class="d">confirm by noon</span></div>
            <div class="foot"><b class="ft">github: unreadable this run.</b></div>
            <div class="rstamp" data-layout-allow-overlap="">Honest</div>
          </div>
          <div class="weak"><div class="k">// weak: a silent failure</div><div class="v">Nothing new today.</div><div class="rstamp" data-layout-allow-overlap="">Quiet day?</div></div>
        </div>
      </div>
      <script>
        (() => {
          const root = document.getElementById("s09-root");
          const q = (s) => root.querySelector(s);
          const tl = gsap.timeline({ paused: true });
          const post = q(".post"), weak = q(".weak");
          gsap.set(q(".foot"), { opacity: 0 });

          // "No server to keep alive."
          Reel.words(tl, q(".rl-hd"), [0.29, 0.5, 0.85, 1.0, 1.2]);
          tl.fromTo(post, { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 1.6);
          // "And a source it can't read says unreadable"
          tl.fromTo(q(".rl-eye"), { opacity: 0 }, { opacity: 1, duration: 0.2 }, 1.9);
          tl.to(q(".foot"), { opacity: 1, duration: 0.05 }, 2.58);
          Egg.typeOn(tl, q(".ft"), 2.6, { cps: 48 });
          Egg.stamp(tl, q(".post .rstamp"), 3.81, post);
          // "never a quiet day"
          tl.fromTo(weak, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 4.6);
          Egg.stamp(tl, q(".weak .rstamp"), 4.85);
          Egg.shake(tl, weak, 5.25);
          tl.to(weak, { opacity: 0.4, duration: 0.4, ease: "none" }, 5.6);
          // the music hit: the post punches, then the frame holds to the hard stop
          tl.to(post, { scale: 1.04, duration: 0.12, ease: "power2.out" }, 6.05);
          tl.to(post, { scale: 1, duration: 0.3, ease: "power2.out" }, 6.17);
          tl.to(q(".rl-hd em"), { scale: 1.08, duration: 0.12, yoyo: true, repeat: 1, ease: "power2.out" }, 6.05);
          tl.to({}, { duration: 7.75 }, 0);
          window.__timelines["s09-black"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
