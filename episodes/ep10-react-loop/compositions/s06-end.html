<!DOCTYPE html>
<html>

  <body>
    <template>
      <!-- s06 · End card. "That's ReAct" (highlighted as it's said), then four ticks on the voice: Claude thinks · Acts
           with a tool · Observes the result · Repeats until it's done; the follow pill pops on "Follow". The narrator
           avatar stands centred above (narrator.html "end") and smiles. No sources on screen. No fade-out: the last frame
           holds so the video loops cleanly. Voice: "So that's ReAct! Claude thinks, acts with a tool, observes the result,
           and repeats until it's done. Follow for more AI basics!" -->
      <style>
        #root { position: absolute; inset: 0; }
        .s06 .egg-safe { gap: 44px; justify-content: flex-start; padding-top: 460px; }
        .s06 .egg-chip.egg-pill-dark { margin-top: 10px; font-size: 30px; padding: 24px 36px; align-self: center; text-transform: none; letter-spacing: 0.01em; font-family: var(--f-body); font-weight: 500; }
      </style>
      <div data-hf-id="hf-g7bq" id="root" data-composition-id="s06-end" data-width="1080" data-height="1920">
        <div data-hf-id="hf-anh9" class="egg-scene s06">
          <div data-hf-id="hf-7owf" class="egg-safe">
            <h2 data-hf-id="hf-qme0" class="egg-title">That's <span data-hf-id="hf-j6ok" class="egg-hl">ReAct</span></h2>
            <ul data-hf-id="hf-w8on" class="egg-checks">
              <li data-hf-id="hf-ohcd"><span data-hf-id="hf-coyi" class="tick"><svg data-hf-id="hf-ulu9" viewBox="0 0 24 24"><path data-hf-id="hf-sqa9" d="M5 12.5 L10 17.5 L19 7" /></svg></span>Claude thinks</li>
              <li data-hf-id="hf-5j3k"><span data-hf-id="hf-ptha" class="tick"><svg data-hf-id="hf-1tol" viewBox="0 0 24 24"><path data-hf-id="hf-6h6t" d="M5 12.5 L10 17.5 L19 7" /></svg></span>Acts with a tool</li>
              <li data-hf-id="hf-ii6h"><span data-hf-id="hf-q7sb" class="tick"><svg data-hf-id="hf-30lo" viewBox="0 0 24 24"><path data-hf-id="hf-7o3w" d="M5 12.5 L10 17.5 L19 7" /></svg></span>Observes the result</li>
              <li data-hf-id="hf-2l8r"><span data-hf-id="hf-qm3c" class="tick"><svg data-hf-id="hf-2man" viewBox="0 0 24 24"><path data-hf-id="hf-79sv" d="M5 12.5 L10 17.5 L19 7" /></svg></span>Repeats until it's done</li>
            </ul>
            <span data-hf-id="hf-ulst" class="egg-chip egg-pill-dark">Follow for more AI basics</span>
          </div>
        </div>
      </div>
      <script>
        (() => {
          const root = document.querySelector('[data-composition-id="s06-end"] .s06');
          const q = (s) => root.querySelector(s);
          const tl = gsap.timeline({ paused: true });
          Egg.fadeUp(tl, q(".egg-title"), 0.05, { y: 24 });
          // "Claude thinks, acts with a tool, observes the result, and repeats until it's done."
          [1.18, 2.12, 3.15, 4.3].forEach((t, i) => {
            const li = root.querySelectorAll(".egg-checks li")[i];
            tl.fromTo(li, { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.4, ease: Egg.EASE.enter }, t);
            tl.fromTo(li.querySelector(".tick"), { scale: 0 }, { scale: 1, duration: 0.4, ease: Egg.EASE.pop }, t + 0.1);
          });
          // "That's tool use" (highlight) · "Follow" (pill)
          Egg.highlight(tl, q(".egg-title .egg-hl"), 0.5);
          Egg.pop(tl, q(".egg-pill-dark"), 6.15);
          window.__timelines["s06-end"] = tl;
        })();
      </script>
    </template>
  </body>
