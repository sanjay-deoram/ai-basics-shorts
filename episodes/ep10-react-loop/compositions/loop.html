  <body>
    <template>
      <!-- Loop overlay, s04 → s05: the ReAct loop as a small whiteboard drawing that the dot works through. Think (a
           cloud), Act (an f( ) box) and Observe (an eye) sit in a triangle; Answer is the way out; a "Your tools" tray
           holds the tools the app sent (tools.py in s03). s04: the dot draws each arrow on its first lap; when Claude
           thinks, the tool it picks lights in the tray; on Act that chip flies into the box (it presses); the result
           rides the arrow to the eye (it blinks); the counter reads Loop 1 / 2 / 3; then the dot takes the way out and
           the Answer box opens into Claude's answer. Between s04 and s05 the drawing slides down under agent.py, and the
           dot follows the run bar: create → Think (the tray lights on "with the tools"), run(b) → Act, results →
           Observe, back to create, return → Answer; the counter reads "while True", then "max 10 loops". Times are
           scene-local (T(scene, t)), so retiming index.html keeps them in sync. -->
      <style>
        #root { position: absolute; inset: 0; pointer-events: none; }
        .lp .rig { position: absolute; left: 90px; top: 0; width: 860px; height: 420px; }
        .lp .rig svg { position: absolute; left: 0; top: 0; width: 860px; height: 420px; overflow: visible; }
        .lp .ico { fill: var(--eggshell); }
        .lp .lab { position: absolute; font: 300 40px/1 var(--f-display); letter-spacing: -0.02em; color: var(--ink); white-space: nowrap; }
        .lp .fx { position: absolute; left: 392px; top: 272px; width: 96px; height: 96px; display: grid; place-items: center; font: 400 26px/1 var(--f-mono); color: var(--ink); }
        .lp .ansb { position: absolute; left: 560px; top: 0; width: 300px; height: 96px; border: 2px solid var(--stone); border-radius: 26px; background: var(--eggshell); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
        .lp .ansb b { font: 300 40px/1 var(--f-display); letter-spacing: -0.02em; color: var(--ink); }
        .lp .tray { position: absolute; left: 560px; top: 128px; width: 300px; height: 292px; border: 2px dashed var(--stone); border-radius: 28px; }
        .lp .tray .k1 { position: absolute; left: 22px; top: 22px; color: var(--graphite); }
        .lp .tray .k2 { position: absolute; left: 22px; bottom: 22px; }
        .lp .chip { position: absolute; left: 22px; height: 52px; padding: 0 18px; border: 2px solid var(--btn-border); border-radius: 9999px; background: var(--eggshell); display: flex; align-items: center; font: 400 26px/1 var(--f-mono); color: var(--ink); white-space: nowrap; }
        .lp .fly { left: 584px; }
        .lp .ctr { position: absolute; left: 168px; top: 214px; width: 200px; height: 30px; }
        .lp .ctr span { position: absolute; left: 0; right: 0; top: 0; text-align: center; font-size: 24px; color: var(--graphite); opacity: 0; }
        .lp .mv { position: absolute; left: 0; top: 0; width: 0; height: 0; }
        .lp .dot { position: absolute; left: -16px; top: -16px; width: 32px; height: 32px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ffffff 0, #f1e8ff 18%, #9d86ff 55%, #ff7ac0 82%, #ff4704 100%); }
        .lp .res { position: absolute; left: 0; top: -92px; height: 48px; padding: 0 16px; border: 2px solid var(--ink); border-radius: 9999px; background: var(--eggshell); display: flex; align-items: center; font: 400 26px/1 var(--f-mono); color: var(--ink); white-space: nowrap; }
        .lp .ans { position: absolute; left: 560px; top: 0; width: 300px; height: 420px; padding: 26px 26px; gap: 14px; justify-content: flex-start; }
        .lp .ans .who { display: flex; align-items: center; gap: 12px; }
        .lp .ans img { width: 44px; height: 44px; }
        .lp .ans p { margin: 0; font: 400 32px/1.28 var(--f-body); color: var(--ink); }
      </style>
      <div data-hf-id="hf-5d39" id="root" data-composition-id="loop" data-width="1080" data-height="1920">
        <div data-hf-id="hf-m1x8" class="egg-layer lp" data-layout-allow-overflow="">
          <div data-hf-id="hf-uk43" class="rig" data-layout-allow-overflow="" data-layout-allow-overlap="">
            <svg data-hf-id="hf-dx7g" viewBox="0 0 860 420" aria-hidden="true">
              <path data-hf-id="hf-759m" class="ink thin e0" /><path data-hf-id="hf-tdb5" class="ink thin h0" />
              <path data-hf-id="hf-b3dn" class="ink thin e1" /><path data-hf-id="hf-qe1k" class="ink thin h1" />
              <path data-hf-id="hf-2fhs" class="ink thin e2" /><path data-hf-id="hf-19j7" class="ink thin h2" />
              <path data-hf-id="hf-375l" class="ink thin e3" /><path data-hf-id="hf-xbf6" class="ink thin h3" />
              <g data-hf-id="hf-teim" class="think"><path data-hf-id="hf-vymk" class="ink ico" d="M205 115 H305 Q335 115 335 87 Q335 60 307 58 Q301 30 272 30 Q244 30 236 54 Q208 51 202 77 Q182 80 182 97 Q182 115 205 115 Z" /></g>
              <circle data-hf-id="hf-h33f" class="ink thin b1" cx="178" cy="124" r="7" />
              <circle data-hf-id="hf-zj4w" class="ink thin b2" cx="164" cy="140" r="4" />
              <g data-hf-id="hf-ymry" class="act"><rect data-hf-id="hf-s7mm" class="ink ico" x="392" y="272" width="96" height="96" rx="24" /></g>
              <g data-hf-id="hf-2vdh" class="eye">
                <path data-hf-id="hf-09br" class="ink ico" d="M30 320 Q100 270 170 320 Q100 370 30 320 Z" />
                <circle data-hf-id="hf-wwr2" class="ink" cx="100" cy="320" r="16" />
              </g>
            </svg>
            <span data-hf-id="hf-g8ig" class="lab l0" style="left:222px;top:128px">Think</span>
            <span data-hf-id="hf-3nwi" class="fx">f( )</span>
            <span data-hf-id="hf-58h0" class="lab l1" style="left:412px;top:380px">Act</span>
            <span data-hf-id="hf-jql4" class="lab l2" style="left:28px;top:380px">Observe</span>
            <div data-hf-id="hf-z5fa" class="ansb"><b data-hf-id="hf-35r3">Answer</b><span data-hf-id="hf-ct1j" class="egg-card-kicker">Done</span></div>
            <div data-hf-id="hf-xugg" class="tray">
              <span data-hf-id="hf-w0rx" class="egg-card-kicker k1">Your tools</span>
              <span data-hf-id="hf-uyns" class="chip c0" style="top:70px">next_meeting()</span>
              <span data-hf-id="hf-4vpp" class="chip c1" style="top:140px">get_weather()</span>
              <span data-hf-id="hf-0mg6" class="egg-card-kicker k2">from tools.py</span>
            </div>
            <span data-hf-id="hf-8n4z" class="chip fly f0" style="top:200px">next_meeting()</span>
            <span data-hf-id="hf-prjl" class="chip fly f1" style="top:270px">get_weather()</span>
            <div data-hf-id="hf-ru3p" class="ctr"><span data-hf-id="hf-bane" class="egg-card-kicker n0">Loop 1</span><span data-hf-id="hf-ih2y" class="egg-card-kicker n1">Loop 2</span><span data-hf-id="hf-6pj2" class="egg-card-kicker n2">Loop 3</span><span data-hf-id="hf-8m2v" class="egg-card-kicker n3">while True</span><span data-hf-id="hf-vrlr" class="egg-card-kicker n4">max 10 loops</span></div>
            <div data-hf-id="hf-wdwt" class="mv rv0"><span data-hf-id="hf-sdcw" class="res">"3 pm, Toronto"</span></div>
            <div data-hf-id="hf-ten8" class="mv rv1"><span data-hf-id="hf-wo4h" class="res">"Rain, 12°C"</span></div>
            <div data-hf-id="hf-7qm9" class="mv dv"><div data-hf-id="hf-lu65" class="dot"></div></div>
            <div data-hf-id="hf-e8qy" class="egg-card ans" data-layout-allow-occlusion="">
              <span data-hf-id="hf-af47" class="who"><img data-hf-id="hf-op34" src="assets/claude-logo.svg" alt="Claude"><span data-hf-id="hf-ep0t" class="egg-card-kicker">Answer</span></span>
              <p data-hf-id="hf-0ncs" class="typed">Yes, bring one! Your 3 pm is in Toronto, and it's raining.</p>
            </div>
          </div>
        </div>
      </div>
      <script>
        (() => {
          const root = document.querySelector('[data-composition-id="loop"] .lp');
          const q = (s) => root.querySelector(s);
          const T0 = Egg.sceneStart("loop");
          // a scene-local time → this overlay's time (falls back to the episode's slots when previewed alone)
          const FALLBACK = { "s04-trace": 18.5, "s05-code": 34.8 };
          const T = (id, t) => (T0 ? Egg.sceneStart(id) - T0 : FALLBACK[id] - 18.5) + t;
          const tl = gsap.timeline({ paused: true });

          // stations (rig coordinates) and the arrows between them
          const TH = [258, 72], AC = [440, 320], OB = [100, 320], AN = [710, 48];
          const legs = [
            Egg.curve(TH, [450, 80], AC, { from: 0.28, to: 0.8 }),
            Egg.curve(AC, [270, 410], OB, { from: 0.2, to: 0.8 }),
            Egg.curve(OB, [80, 90], TH, { from: 0.2, to: 0.76 }),
            Egg.curve(TH, [420, 10], AN, { from: 0.3, to: 0.68 }),
          ];
          legs.forEach((c, i) => { q(".e" + i).setAttribute("d", c.d); q(".h" + i).setAttribute("d", c.head); });
          const rig = q(".rig"), dv = q(".dv"), dot = q(".dot");
          const chips = [q(".c0"), q(".c1")], fly = [q(".f0"), q(".f1")], res = [q(".rv0"), q(".rv1")];
          const ctr = [".n0", ".n1", ".n2", ".n3", ".n4"].map(q);
          gsap.set(rig, { y: 520 });
          gsap.set(dv, { x: TH[0], y: TH[1] });
          gsap.set(dot, { scale: 0, opacity: 0 });
          res.forEach((r) => gsap.set(r, { x: AC[0], y: AC[1] }));
          res.forEach((r) => gsap.set(r.querySelector(".res"), { xPercent: -50, opacity: 0 }));
          fly.forEach((f) => gsap.set(f, { opacity: 0 }));
          gsap.set(q(".ans"), { opacity: 0 });

          // moves: the dot draws an arrow on its first lap (drawn), and just rides it after that
          const leg = (i, at, dur, drawn) => Egg.travel(tl, dv, legs[i], at, dur, drawn ? { draw: q(".e" + i), head: q(".h" + i) } : {});
          const showDot = (at) => tl.fromTo(dot, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.25, ease: Egg.EASE.pop, immediateRender: false }, at);
          const hideDot = (at) => tl.to(dot, { scale: 0, opacity: 0, duration: 0.2, ease: Egg.EASE.exit }, at);
          // station reactions: the cloud puffs, the box presses, the eye blinks
          const puff = (at) => tl.fromTo(q(".think"), { scale: 1 }, { scale: 1.08, svgOrigin: "258 72", duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, at);
          const press = (at) => {
            tl.fromTo(q(".act"), { scale: 1 }, { scale: 0.88, svgOrigin: "440 320", duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, at);
            tl.fromTo(q(".fx"), { scale: 1 }, { scale: 0.88, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, at);
          };
          const blink = (at) => tl.fromTo(q(".eye"), { scaleY: 1 }, { scaleY: 0.12, svgOrigin: "100 320", duration: 0.1, ease: "power2.in", yoyo: true, repeat: 1, immediateRender: false }, at);
          // the tool Claude picks lights in the tray; on Act a copy flies into the box
          const pick = (i, at) => tl.to(chips[i], { borderColor: "#000000", scale: 1.05, duration: 0.2, ease: "power2.out" }, at);
          const unpick = (i, at) => tl.to(chips[i], { borderColor: "#e5e5e5", scale: 1, duration: 0.25, ease: "none" }, at);
          const send = (i, at) => {
            tl.fromTo(fly[i], { x: 0, y: 0, scale: 1, opacity: 1 }, { x: AC[0] - 711, y: AC[1] - (i ? 296 : 226), scale: 0.3, duration: 0.45, ease: Egg.EASE.move, immediateRender: false }, at);
            tl.to(fly[i], { opacity: 0, duration: 0.1, ease: "none" }, at + 0.4);
          };
          // a result rides the arrow from Act to Observe with the dot, then goes into the eye
          const result = (i, at, dur) => {
            const pill = res[i].querySelector(".res");
            tl.fromTo(pill, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.25, ease: Egg.EASE.pop, immediateRender: false }, at - 0.1);
            Egg.travel(tl, res[i], legs[1], at, dur);
            tl.to(pill, { opacity: 0, scale: 0.5, duration: 0.2, ease: Egg.EASE.exit }, at + dur + 0.05);
          };
          const light = (el, on, at) => tl.to(el, { borderColor: on ? "#000000" : "#ebe8e4", duration: 0.2, ease: "none" }, at);
          let shown = -1;
          const count = (i, at) => {
            if (shown >= 0) tl.to(ctr[shown], { opacity: 0, y: -8, duration: 0.2, ease: Egg.EASE.exit }, at);
            tl.fromTo(ctr[i], { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.25, ease: Egg.EASE.enter }, at + 0.1);
            shown = i;
          };
          const S4 = (t) => T("s04-trace", t), S5 = (t) => T("s05-code", t);

          // s04 · the drawing comes in: stations, labels, the Answer box and the tray of tools from s03
          [".think .ink", ".act .ink", ".eye path", ".eye circle"].forEach((s, i) => {
            const el = q(s);
            el.setAttribute("pathLength", "1");
            el.style.strokeDasharray = "1 1.1";
            tl.fromTo(el, { strokeDashoffset: 1.02, opacity: 0 }, { strokeDashoffset: 0, opacity: 1, duration: 0.4, ease: Egg.EASE.draw }, S4(0.2 + i * 0.12));
          });
          Egg.pop(tl, [q(".b1"), q(".b2")], S4(0.6), { dur: 0.3 });
          Egg.fadeUp(tl, [q(".l0"), q(".fx"), q(".l1"), q(".l2")], S4(0.55), { y: 12, stagger: 0.06 });
          Egg.fadeUp(tl, q(".ansb"), S4(0.8), { y: 14 });
          Egg.fadeUp(tl, q(".tray"), S4(0.9), { y: 14 });
          Egg.pop(tl, chips, S4(1.1), { dur: 0.4, stagger: 0.12 });
          // loop 1 · "Claude thinks: where is it? It calls next meeting: three p.m., Toronto."
          showDot(S4(3.27)); puff(S4(3.35)); count(0, S4(3.3));
          pick(0, S4(3.9));
          leg(0, S4(5.1), 0.6, true); send(0, S4(5.1)); press(S4(5.7)); unpick(0, S4(5.9));
          result(0, S4(6.6), 0.65); leg(1, S4(6.6), 0.65, true); blink(S4(7.3));
          // "Back around!" loop 2 · "What's the weather in Toronto? It calls get weather: rain."
          leg(2, S4(8.35), 0.6, true); puff(S4(8.95)); count(1, S4(8.6));
          pick(1, S4(10.0));
          leg(0, S4(10.85), 0.55); send(1, S4(10.85)); press(S4(11.4)); unpick(1, S4(11.6));
          result(1, S4(12.1), 0.55); leg(1, S4(12.1), 0.55); blink(S4(12.7));
          // loop 3 · "Now it has enough: yes, bring one!" out to Answer, which opens into the answer
          leg(2, S4(12.85), 0.5); puff(S4(13.35)); count(2, S4(13.0));
          leg(3, S4(13.5), 0.4, true); light(q(".ansb"), true, S4(13.9)); hideDot(S4(14.0));
          tl.to(q(".tray"), { opacity: 0, duration: 0.2, ease: "none" }, S4(13.95));
          tl.fromTo(q(".ans"), { opacity: 0, scale: 0.4, transformOrigin: "50% 0%" }, { opacity: 1, scale: 1, duration: 0.4, ease: Egg.EASE.rise, immediateRender: false }, S4(13.95));
          tl.fromTo(q(".ans img"), { rotation: -40 }, { rotation: 80, duration: 1.6, ease: "power1.inOut", immediateRender: false }, S4(13.95));
          Egg.typeOn(tl, q(".typed"), S4(14.05), { cps: 55 });
          tl.to(q(".ans"), { opacity: 0, duration: 0.3, ease: Egg.EASE.exit }, S4(15.95));
          light(q(".ansb"), false, S4(16.0));

          // between scenes: the drawing slides down under agent.py; the tray comes back
          tl.to(rig, { y: 1010, duration: 0.5, ease: Egg.EASE.move }, S5(-0.05));
          tl.to(q(".tray"), { opacity: 1, duration: 0.3, ease: "none" }, S5(0.4));
          // s05 · the dot follows the run bar
          count(3, S5(0.6));
          tl.set(dv, { x: TH[0], y: TH[1] }, S5(0.85));
          showDot(S5(0.9)); puff(S5(1.0));                                                    // "Call Claude"
          pick(0, S5(1.58)); pick(1, S5(1.58)); unpick(0, S5(2.6)); unpick(1, S5(2.6));      // "with the tools."
          leg(0, S5(3.93), 0.45); press(S5(4.38));                                            // "run it,"
          leg(1, S5(4.56), 0.45); blink(S5(5.01));                                            // "add the result,"
          leg(2, S5(5.4), 0.5); puff(S5(5.9));                                                // "and go again."
          leg(3, S5(7.8), 0.4); light(q(".ansb"), true, S5(8.2)); hideDot(S5(8.4));          // "that's the answer."
          count(4, S5(9.3)); light(q(".ansb"), false, S5(9.5));                              // "And cap the steps,"
          // out with s05 (opacity only: the rig's y is its place)
          tl.to(rig, { opacity: 0, duration: 0.3, ease: Egg.EASE.exit }, S5(11.35));
          window.__timelines["loop"] = tl;
        })();
      </script>
    </template>
