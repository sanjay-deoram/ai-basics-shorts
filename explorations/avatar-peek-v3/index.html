<!DOCTYPE html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <link rel="stylesheet" href="assets/eggshell.css">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="assets/eggshell.js"></script>
    <script src="assets/lipsync.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #fdfcfc; }
      #root { position: relative; width: 100%; height: 100%; background: #fdfcfc; }
    </style>
  </head>
  <body>
    <!-- Avatar test v3 · 5 s, the talking flipbook plus the smile and doubtful-brows panels. Peeks in from the right edge, talks (mouth frames
         from the voice), looks doubtful at a question chip, smiles and leaves. Frames: assets/avatar (tools/cut-avatar.py). -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1080" data-height="1920">
      <div id="s01" class="clip" data-composition-id="s01-meet" data-composition-src="compositions/s01-meet.html" data-start="0" data-duration="5" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="avatar" class="clip" data-composition-id="avatar" data-composition-src="compositions/avatar.html" data-start="0" data-duration="5" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="chrome" class="clip" data-composition-id="chrome" data-composition-src="compositions/chrome.html" data-variable-values="{&quot;duration&quot;:5}" data-start="0" data-duration="5" data-track-index="0" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <!-- sfx:start (generated by tools/build-sfx.mjs; edit the cues in each scene, then rerun) -->
      <audio id="sfx-avatar-1" src="assets/sfx/whoosh-short.mp3" data-start="0.3" data-duration="0.57" data-track-index="10" data-volume="0.3"></audio>
      <audio id="sfx-s01-meet-1" src="assets/sfx/pop.mp3" data-start="2" data-duration="0.72" data-track-index="10" data-volume="0.25"></audio>
      <audio id="sfx-avatar-2" src="assets/sfx/whoosh-short.mp3" data-start="4.45" data-duration="0.55" data-track-index="10" data-volume="0.2"></audio>
      <!-- sfx:end -->
      <!-- vo:start (generated by tools/voiceover.mjs from voiceover.json) -->
      <audio id="vo-s01-1" src="assets/vo/s01-29839056.mp3" data-start="0.55" data-duration="1.28" data-track-index="20" data-volume="1"></audio>
      <audio id="vo-s01-2" src="assets/vo/s01-bd9db74c.mp3" data-start="2.75" data-duration="1.463" data-track-index="20" data-volume="1"></audio>
      <!-- vo:end -->
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
