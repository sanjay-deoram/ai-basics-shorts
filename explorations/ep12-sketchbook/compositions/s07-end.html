      <script>
        (() => {
          const root = document.querySelector('[data-composition-id="s07-end"] .s07');
          const ink = root.querySelector(".sk-ink");
          const $ = (s) => root.querySelector(s);
          const tl = gsap.timeline({ paused: true });
          const C = Sk.C;

          const rings = [
            Sk.ring($(".n0"), { color: C.blue, seed: 501, padX: 30, padY: 2 }),
            Sk.ring($(".n1"), { color: C.purple, seed: 502, padX: 34, padY: 2 }),
            Sk.ring($(".n2"), { color: C.teal, seed: 503, padX: 16, padY: 2 }),
          ];
          const empty = Sk.shape(ink, "path", [Sk.roundRect(730, 696, 92, 86, 8)], { stroke: C.pencil, strokeWidth: 3, strokeLineDash: [9, 9], seed: 504 });
          const ticks = [744, 934, 1124].map((y, i) => Sk.shape(ink, "linearPath", [[[880, y], [904, y + 22], [950, y - 32]]], { stroke: C.green, strokeWidth: 7, seed: 510 + i }));
          const rules = [850, 1040].map((y, i) => Sk.shape(ink, "line", [110, y, 950, y], { stroke: "#dcd5c8", strokeWidth: 2.5, seed: 520 + i }));
          const pill = Sk.shape(ink, "path", [Sk.roundRect(290, 1352, 500, 108, 54)], { fill: C.ink, fillStyle: "solid", stroke: C.ink, strokeWidth: 3, seed: 530 });

          // row 1 · "So zero-shot means no examples"
          Sk.pop(tl, $(".n0"), 0.25); Sk.draw(tl, rings[0], 0.3, 0.3);

          Sk.write(tl, $(".r1"), 2.75, { dur: 0.45 });
          Sk.write(tl, $(".m1"), 3.5, { dur: 0.5 });
          Sk.slap(tl, $(".p1"), 3.55, { rot: -5, dy: 200 });
          Sk.draw(tl, ticks[1], 3.85, 0.2);
          Sk.draw(tl, rules[1], 4.2, 0.3);
          // row 3 · "and few-shot means a handful"
          Sk.pop(tl, $(".n2"), 4.8); Sk.draw(tl, rings[2], 4.85, 0.3);

          // "Follow for more AI basics!"

          Sk.pop(tl, $(".pill"), 6.8, { from: 0.7 });
          Sk.write(tl, $(".sub"), 7.1, { dur: 0.5 });

          window.__timelines["s07-end"] = tl;
