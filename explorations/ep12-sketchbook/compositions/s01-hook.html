<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <script type="application/json" class="sfx-cues">[
      {"t":0.2,"sfx":"pencil","vol":0.2},
      {"t":1.35,"sfx":"pencil-short","vol":0.22},
      {"t":1.8,"sfx":"pencil-short","vol":0.16},
      {"t":2.2,"sfx":"pencil-short","vol":0.22},
      {"t":2.6,"sfx":"pop","vol":0.14},
      {"t":3.3,"sfx":"pencil-short","vol":0.22},
      {"t":3.65,"sfx":"pop","vol":0.14},

  </head>
  <body>
    <template>
      <!-- s01 · Hook (0–4.45). "What's the difference between zero-shot, one-shot, and few-shot prompting?"
           "Prompting:" is lettered with a highlighter swipe, then the three names are written in their colours as they
           are said, each with its examples beside it as sticky notes: an empty dashed spot (0), one note (1), a little
           stack (3+). The camera starts on the heading and settles on the whole page. The sheet tears off at the end.
           Avatar: title peek, bottom right (x ≥ 620, y ≥ 800). -->
      <style>
        #root { position: absolute; inset: 0; }
        .s01 .mini { position: absolute; width: 96px; height: 88px; box-shadow: 0 6px 12px rgba(42, 39, 36, 0.14); display: flex; align-items: center; justify-content: center; font: 700 44px/1 var(--f-note); color: var(--ink); }
      </style>
      <div id="root" data-composition-id="s01-hook" data-width="1080" data-height="1920">
        <div class="sk-scene s01">
          <div class="sk-cam">
            <div class="s01-page" style="position:absolute;inset:0">
              <svg class="sk-ink" viewBox="0 0 1080 1920" aria-hidden="true"></svg>
              <span class="sk-abs sk-kicker" style="left:96px;top:250px">a quick sketch of</span>
              <span class="sk-abs sk-h2 c-ink sk-w" style="left:90px;top:300px">Prompting:</span>
              <span class="sk-abs sk-h1 c-blue sk-w w0" style="left:90px;top:440px">Zero-shot</span>
              <span class="sk-abs sk-h1 c-purple sk-w w1" style="left:90px;top:600px">One-shot</span>
              <span class="sk-abs sk-h1 c-teal sk-w w2" style="left:90px;top:760px">Few-shot</span>
              <span class="sk-abs sk-note c-soft z0" style="left:742px;top:484px;width:96px;text-align:center">0</span>
              <div class="mini n1" style="left:742px;top:630px;background:#fff1a1">1</div>
              <div class="mini n2a" style="left:706px;top:790px;background:#d9ecff"></div>
              <div class="mini n2b" style="left:742px;top:784px;background:#ffd9e1"></div>
              <div class="mini n2c" style="left:778px;top:794px;background:#fff1a1">3+</div>
              <span class="sk-abs sk-note c-soft q" style="left:96px;top:930px">…what's the difference?</span>
            </div>
          </div>
        </div>
      </div>
      <script>
        (() => {
          const root = document.querySelector('[data-composition-id="s01-hook"] .s01');
          const cam = root.querySelector(".sk-cam"), page = root.querySelector(".s01-page"), ink = root.querySelector(".sk-ink");
          const $ = (s) => root.querySelector(s);
          const tl = gsap.timeline({ paused: true });

          const hl = Sk.highlight(ink, 84, 470, 352, { width: 54, seed: 4 });
          const empty = Sk.shape(ink, "path", [Sk.roundRect(742, 470, 96, 88, 8)], { stroke: Sk.C.pencil, strokeWidth: 3, strokeLineDash: [9, 9], seed: 11 });
          const under = Sk.shape(ink, "line", [98, 998, 600, 994], { stroke: Sk.C.ink, strokeWidth: 3, seed: 14 });

          // camera: on the heading, then out to the whole page as the names arrive
          Sk.frame(tl, cam, [84, 250, 520, 400], 0, 0);
          Sk.frame(tl, cam, [84, 250, 900, 720], 1.2, 0.9);
          Sk.home(tl, cam, 2.9, 0.9);

          Sk.write(tl, $(".sk-kicker"), 0.1, { dur: 0.4 });
          Sk.draw(tl, hl, 0.2, 0.35);
          Sk.write(tl, $(".sk-h2"), 0.3, { dur: 0.6 });
          Sk.write(tl, $(".w0"), 1.3, { dur: 0.55 });
          Sk.draw(tl, empty, 1.75, 0.35); Sk.pop(tl, $(".z0"), 1.85);
          Sk.write(tl, $(".w1"), 2.15, { dur: 0.5 });
          Sk.slap(tl, $(".n1"), 2.55, { rot: -4, dy: 120, dur: 0.4 });
          Sk.write(tl, $(".w2"), 3.25, { dur: 0.45 });
          Sk.slap(tl, $(".n2a"), 3.55, { rot: -8, dy: 120, dur: 0.38 });
          Sk.slap(tl, $(".n2b"), 3.63, { rot: 3, dy: 120, dur: 0.38 });
          Sk.slap(tl, $(".n2c"), 3.71, { rot: 7, dy: 120, dur: 0.38 });
          Sk.write(tl, $(".q"), 3.75, { dur: 0.35 });
          Sk.draw(tl, under, 3.85, 0.2);

          Sk.pageOut(tl, page, 4.05, 0.4);
          window.__timelines["s01-hook"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
