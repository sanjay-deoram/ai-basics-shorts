<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <!-- Sound cues (seconds from scene start). Run node tools/build-sfx.mjs after editing. -->
    <script type="application/json" class="sfx-cues">[
      {"t":0.45,"sfx":"click","vol":0.3},
      {"t":0.79,"sfx":"click","vol":0.3},
      {"t":1.13,"sfx":"click","vol":0.3},
      {"t":1.9,"sfx":"chime","vol":0.3,"dur":2.4}
    ]</script>
  </head>
  <body>
    <template>
      <!-- BLOCK · End card. 4–5s. Up to 4 takeaways tick in, then the follow pill and a happy Spark.
           Edit: the eyebrow, the <li> takeaways (≤ 32 chars each), the pill text. No fade-out: the
           last frame holds so the video loops cleanly on Shorts, Reels and TikTok. -->
      <style>
        #root { position: absolute; inset: 0; }
        .s05 .egg-safe { gap: 56px; justify-content: center; padding-bottom: 80px; }
        .s05 .foot { display: flex; align-items: center; gap: 36px; margin-top: 30px; }
        .s05 .spark { --s: 190px; }
        .s05 .egg-chip.egg-pill-dark { font-size: 30px; padding: 24px 36px; align-self: center; text-transform: none; letter-spacing: 0.01em; font-family: var(--f-body); font-weight: 500; }
      </style>
      <div data-hf-id="hf-gag3" id="root" data-composition-id="s05-end" data-width="1080" data-height="1920">
        <div data-hf-id="hf-ella" class="egg-scene s05">
          <div data-hf-id="hf-7owf" class="egg-safe">
            <span data-hf-id="hf-8c1x" class="egg-eyebrow">Remember</span>
            <ul data-hf-id="hf-w8on" class="egg-checks">
              <li data-hf-id="hf-vxqf"><span data-hf-id="hf-coyi" class="tick"><svg data-hf-id="hf-ulu9" viewBox="0 0 24 24"><path data-hf-id="hf-sqa9" d="M5 12.5 L10 17.5 L19 7" /></svg></span>AI learned from lots of text</li>
              <li data-hf-id="hf-r82v"><span data-hf-id="hf-ptha" class="tick"><svg data-hf-id="hf-1tol" viewBox="0 0 24 24"><path data-hf-id="hf-6h6t" d="M5 12.5 L10 17.5 L19 7" /></svg></span>It writes one token at a time</li>
              <li data-hf-id="hf-u1ey"><span data-hf-id="hf-q7sb" class="tick"><svg data-hf-id="hf-30lo" viewBox="0 0 24 24"><path data-hf-id="hf-7o3w" d="M5 12.5 L10 17.5 L19 7" /></svg></span>Clear prompts, clear answers</li>
            </ul>
            <div data-hf-id="hf-mlgk" class="foot">
              <div data-hf-id="hf-wrb2" class="spark" data-mood="happy"></div>
              <span data-hf-id="hf-ulst" class="egg-chip egg-pill-dark">Follow for more AI basics</span>
            </div>
          </div>
        </div>
      </div>
      <script>
        (() => {
          const root = document.querySelector('[data-composition-id="s05-end"] .s05');
          Egg.mountSparks(root);
          const spark = root.querySelector(".spark");
          const tl = gsap.timeline({ paused: true });
          Egg.fadeUp(tl, root.querySelector(".egg-eyebrow"), 0.05);
          Egg.checks(tl, root.querySelector(".egg-checks"), 0.3, { gap: 0.34 });
          Egg.pop(tl, spark, 1.7);
          Egg.sparkIdle(tl, spark, 1.7, 4.3);
          Egg.sparkMood(tl, spark, "happy", 2.0);
          Egg.pop(tl, root.querySelector(".egg-pill-dark"), 1.9);
          window.__timelines["s05-end"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
