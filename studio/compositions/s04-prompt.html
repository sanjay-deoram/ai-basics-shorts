<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <!-- Sound cues (seconds from scene start). Run node tools/build-sfx.mjs after editing. -->
    <script type="application/json" class="sfx-cues">[
      {"t":0.2,"sfx":"pop","vol":0.3},
      {"t":0.9,"sfx":"typing","vol":0.3,"dur":0.55},
      {"t":2.4,"sfx":"error","vol":0.22,"dur":1},
      {"t":3.3,"sfx":"whoosh-short","vol":0.25},
      {"t":3.7,"sfx":"typing","vol":0.3,"dur":1.5},
      {"t":5.7,"sfx":"sparkle","vol":0.25,"dur":1.4},
      {"t":7,"sfx":"chime","vol":0.3,"dur":1.5}
    ]</script>
  </head>
  <body>
    <template>
      <!-- BLOCK · Prompt before/after with Spark. 8–9s.
           A vague prompt types on, gets a weak answer and a VAGUE stamp while Spark looks confused.
           The better prompt types on, its key phrase is highlighted, Spark drops to the better answer
           and lights up, CLEAR stamp. Spark hands off between the two answer rows (two instances). Edit: chip text, both prompts (.egg-hl marks the key phrase),
           both answers. Keep the bad prompt under 40 characters and the good one under 110. -->
      <style>
        #root { position: absolute; inset: 0; }
        .s04 .zoomwrap { position: absolute; inset: 0; }
        .s04 .egg-safe { gap: 30px; justify-content: center; padding-bottom: 40px; }
        .s04 .egg-safe > .egg-chip { margin-bottom: 10px; }
        .s04 .egg-mono { font-size: 38px; }
        .s04 .row { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 30px; align-items: center; }
        .s04 .slot { width: 190px; height: 190px; position: relative; }
        .s04 .result { padding: 30px 36px; border-radius: 36px; }
        .s04 .result p, .s04 .result li { font: 400 34px/1.38 var(--f-body); color: var(--smoke); margin: 0; }
        .s04 .result.rich { background: var(--eggshell); }
        .s04 .result.rich ol { margin: 0; padding-left: 40px; display: flex; flex-direction: column; gap: 10px; }
        .s04 .result.rich li { color: var(--ink); }
        .s04 .spark { --s: 190px; }
        .s04 .egg-stamp svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
        .s04 .gap-lg { margin-top: 18px; }
      </style>
      <div data-hf-id="hf-5b29" id="root" data-composition-id="s04-prompt" data-width="1080" data-height="1920">
        <div data-hf-id="hf-ijpb" class="egg-scene s04">
          <div data-hf-id="hf-dlj8" class="zoomwrap" data-layout-allow-overflow="">
            <div data-hf-id="hf-7owf" class="egg-safe">
              <span data-hf-id="hf-cvo3" class="egg-chip"><b data-hf-id="hf-vdze">Tip</b> · Be specific</span>
              <div data-hf-id="hf-oe6g" class="egg-card is-bad card-bad">
                <div data-hf-id="hf-1ytk" class="egg-card-top">
                  <span data-hf-id="hf-dec9" class="egg-card-kicker">Prompt</span>
                  <span data-hf-id="hf-1poo" class="egg-stamp bad stamp-bad"><svg data-hf-id="hf-ulu9" viewBox="0 0 24 24"><path data-hf-id="hf-1gbk" d="M6 6 L18 18 M18 6 L6 18" /></svg>Vague</span>
                </div>
                <p data-hf-id="hf-u4fp" class="egg-mono t-bad">Write about dogs.</p>
              </div>
              <div data-hf-id="hf-tar7" class="row r1">
                <div data-hf-id="hf-fv78" class="slot"><div data-hf-id="hf-tgeu" class="spark spark-1" data-mood="confused"></div></div>
                <div data-hf-id="hf-v8dg" class="egg-card taupe result res-bad"><p data-hf-id="hf-wvbu">Dogs are popular pets. They come in many shapes and sizes.</p></div>
              </div>
              <div data-hf-id="hf-hgfu" class="egg-card is-good card-good gap-lg">
                <div data-hf-id="hf-lc74" class="egg-card-top">
                  <span data-hf-id="hf-39vx" class="egg-card-kicker">Better prompt</span>
                  <span data-hf-id="hf-xdnr" class="egg-stamp good stamp-good"><svg data-hf-id="hf-1tol" viewBox="0 0 24 24"><path data-hf-id="hf-sqa9" d="M5 12.5 L10 17.5 L19 7" /></svg>Clear</span>
                </div>
                <p data-hf-id="hf-1jew" class="egg-mono t-good">Write 3 fun facts about dogs <span data-hf-id="hf-1ry4" class="egg-hl">for a 7-year-old</span>. One short sentence each.</p>
              </div>
              <div data-hf-id="hf-if9k" class="row r2">
                <div data-hf-id="hf-exn0" class="slot"><div data-hf-id="hf-sw5t" class="spark spark-2"></div></div>
                <div data-hf-id="hf-e9qn" class="egg-card result rich res-good">
                  <ol data-hf-id="hf-eaxy">
                    <li data-hf-id="hf-ygh6">A dog's nose print is unique.</li>
                    <li data-hf-id="hf-ogdp">Dogs hear 4x farther than you.</li>
                    <li data-hf-id="hf-jrrj">Puppies are born with eyes shut.</li>
                  </ol>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <script>
        (() => {
          const root = document.querySelector('[data-composition-id="s04-prompt"] .s04');
          Egg.mountSparks(root);
          const q = (s) => root.querySelector(s);
          const spark1 = q(".spark-1");
          const spark2 = q(".spark-2");

          const tl = gsap.timeline({ paused: true });
          Egg.pop(tl, q(".egg-chip"), 0.2);
          Egg.fadeUp(tl, q(".card-bad"), 0.5);
          tl.set([q(".stamp-bad"), q(".stamp-good")], { opacity: 0 }, 0);
          Egg.typeOn(tl, q(".t-bad"), 0.9);
          Egg.fadeUp(tl, q(".res-bad"), 1.6);
          Egg.pop(tl, spark1, 1.8);
          Egg.sparkIdle(tl, spark1, 1.8, 6.0);
          Egg.sparkMood(tl, spark1, "confused", 1.9);
          Egg.stamp(tl, q(".stamp-bad"), 2.4, q(".card-bad"));
          Egg.fadeUp(tl, q(".card-good"), 3.3);
          const typed = Egg.typeOn(tl, q(".t-good"), 3.7, { cps: 42 });
          Egg.highlight(tl, q(".t-good .egg-hl"), typed + 0.15);
          tl.to(q(".zoomwrap"), { scale: 1.03, transformOrigin: "50% 45%", duration: 0.6, ease: Egg.EASE.move }, typed + 0.1);
          // hand-off: Spark leaves the weak answer and pops up beside the better one
          tl.to(spark1, { scale: 0.4, opacity: 0, y: 60, duration: 0.35, ease: Egg.EASE.exit }, 5.85);
          Egg.pop(tl, spark2, 6.05);
          Egg.sparkIdle(tl, spark2, 6.05, 8.5);
          Egg.fadeUp(tl, q(".res-good"), 6.1);
          Egg.fadeUp(tl, q(".res-good").querySelectorAll("li"), 6.3, { y: 16, stagger: 0.12 });
          Egg.sparkMood(tl, spark2, "happy", 6.7);
          Egg.stamp(tl, q(".stamp-good"), 7.0, q(".card-good"));
          tl.to(q(".zoomwrap"), { scale: 1, duration: 0.6, ease: Egg.EASE.move }, 7.3);
          Egg.fadeOut(tl, q(".zoomwrap"), 8.15);
          window.__timelines["s04-prompt"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
